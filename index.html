o expand and grow all come under the umbrella of this suit. Wands also govern the central guiding force of one’s life such as Putting career over family first, choosing to tend to family over personal pursuits, ambition, gestating a creative path, following the fire of the heart and doing that which enthuses. Wands correspond to the astrological element of Fire so may have links or relate to qualities of people under the Zodiac influence of Aries, Leo and Sagittarius. An emphasis on Wands in a spread indicates that the querist is bold and expansive in his mind and is capable of leadership and risks. The element of risk may sometimes be excess in proportion to what is sensible."},{"t":"h","x":"Cups"},{"t":"p","x":"This suit rules the realm of emotions and love, in all their versatile glory. It governs relationships between friends, colleagues and relatives as well as lovers. Cups are also associated with all forms of creativity and fertility, whether it is birth of a child, the development of a talent or the abundance of nature."},{"t":"p","x":"They also rule the Unconscious and our deeper, unexpressed emotional self. Cups correspond to the astrological element of Water, so tend to have links or relate to qualities of people under the Zodiac influence of Cancer, Scorpio and Pisces. An emphasis on Cups in a spread indicates that the querist, or the person having the reading, is very emotionally involved in the situation and may therefore lack objectivity. Swords Much akin to its physical prototype, the Sword is double edged. This suit rules words and thoughts, which can be constructive or destructive. They can be positive or negative."},{"t":"p","x":"They govern the world of the intellect and the analytics. They rule brilliant ideas as well as worries and tensions. They rule healing words as well as sarcasm and insults. They are connected with all forms of mental and intellectual activity, and all types of communication such as letters, correspondence, emails, phone conversations, internet related, mass media, mobile texting and messaging, social media, print publications, e-publications, verbal and non\u0002verbal communications. Swords are immensely rational and logical and tend to have links or relate to qualities of people under the Zodiac influence of Cancer, Scorpio and Pisces. An emphasis on Swords in a spread indicates recurring mental issues, problems, over analysis, inclination to conflict rather than collaborate. Pentacles Pentacles are connected with all material matters, such as money, property, career and status, business, plantations and factories, bank balance, savings and investments. Pentacles bring under their ambit anything that has value to the querist."},{"t":"p","x":"They are deeply rooted in the physical reality and govern things we can see, feel, hold and touch rather than anything we can only feel or imagine. They therefore rule the five senses. The symbol of Pentacle is very powerful. It represents grounding of vision in reality. Manifestation of spiritual will in physical form."},{"t":"p","x":"This suit also controls practical commitments and daily routine work. It controls our efforts and the dedication one puts towards initiating and sustaining a value-based idea/ project. Pentacles correspond to the astrological element of the Earth, so tend to have links or relate to qualities of people under the Zodiac influence of Taurus, Virgo and Capricorn."},{"t":"p","x":"An emphasis on Pentacles in a spread indicates that the situation calls for a systematic and logical approach. Emotions should take a backseat and the querist should observe what is actually happening rather than living in a world of what they want or think should happen."},{"t":"p","x":"RIDER WAITE DECK :"},{"t":"p","x":"This deck structure is most universally accepted."},{"t":"p","x":"The designs were by Mr Arthur Waite, a member of the occult society Order of the Golden Dawn, in collaboration with the artist Pamela Coleman Smith. It was first published by the Rider Company in 1909."},{"t":"p","x":"One may occasionally be intimidated by the prospect of learning the meanings and symbols of all the cards of the deck, and additionally to ascribe a coherent meaning out of the reading by understanding a verbalizing the interplay of these complex symbols by putting them together in a spread. However with continued concentration while dealing with the cards and practising with them, one can understand the inherent dynamics."},{"t":"p","x":"What is of significance is to get a feel for the cards and spend time with them."},{"t":"p","x":"Tarot Reading is not merely an academic and logical exercise. It awakens our Intuition and our Deeper understanding of human experience."},{"t":"p","x":"When such a profound process is taking place within us as Tarot Reader/Tarot counsellor, one must learn to relax and trust our Inner voice and connect it with the specifics of the cards pulled out in the spread and then in a sensitive manner apply it to the question that is under the purview. An instinctive understanding of each of these cards and how same card can be applied differently to address different situations has to be developed with dedication and a genuine interest in this deep metaphysical world."},{"t":"h","x":"Tarot-Window to the Soul"},{"t":"p","x":"Preparing Your Mind to Enter This World The art and science of Tarot Reading is powerful and intriguing. You use the Tarot cards as a way to focus your CLAIRVOYANCE. Think of your conscious mind as a backseat driver. You are driving down an unfamiliar road and if you use the road signs, the celestial navigators of Sun, Moon, stars and your own intuition, you could reach your destination with a minimum of trouble. But the conscious mind is busy chipping in, with advice and instructions that throw you off. You have to give this conscious mind something to process on, as its advice is inevitable and would need to be included, The tarot cards are that powerful coded material that gives your conscious mind the processing material while your subconscious delves deep into your human experience history and connects it with the conscious mind. Of all road maps to self-awareness and spiritual development, the Tarot is the most detailed, yet the most concise, available."},{"t":"p","x":"It opens your eyes, mentally and spiritually to the mysteries of the Universe and how the Universe works in tandem with Human Will for the highest good of the individual, if we allow it to speak to us."},{"t":"p","x":"When you have chosen your deck, you can begin your personal interplay with it and learn to delight in it. It will respond most effectively as it begins to respond to your personal energy."}]},{"id":"v1-c5","vol":"I","title":"Chapter 5 · Preparing Your Deck for a Tarot Reading","body":[{"t":"h","x":"Deck Selection"},{"t":"p","x":"A previous section in this book describes how there is a plethora of tarot cards available in the market today, with immense contribution from the online source of Deck availability. Some pointers to keep in mind while selecting a deck:"},{"t":"p","x":" If you are a beginner to Tarot its best to go with a traditional deck so you can embed the classic meanings of the cards in your mind, without being distracted by specialized themes or too obscure illustrations."},{"t":"p","x":" Later on, once you have mastered the art of connecting the traditional cards to each other in a spread, you could graduate to a deck that holds a special significance for you."},{"t":"p","x":" The Universal Rider-Waite is an excellent classic deck to begin your Tarot journey with. For some famous tarot readers this remains their primary or favourite deck even in advanced stages of their career. Its the most succinct deck in the market, they are of the opinion."},{"t":"p","x":" Do not feel the pressure to go for a deck that your friend or a tarot reader you are familiar with uses. Go for a deck that you are most comfortable with. Its your personal journey with your deck."},{"t":"p","x":" Size of the cards is a significant factor that some may overlook when selecting a deck as one is taken in with Preparing Your Deck for a Tarot Reading Chapter-5 the vivid imagery and the richness of the card meanings. Its a very important factor as cards should not be too large. They should fit your hands as shuffling the cards is convenient. Large cards also take up a lot of space when you are laying them out for a spread."},{"t":"p","x":" There are circular cards available which are attractive but are difficult to shuffle and also difficult to form them into a neat stack."},{"t":"p","x":" You can buy a deck from the Internet e-vendor if a physical book store accessible to you is not stocking. However read their reviews and user experiences before going for distance-purchase."},{"t":"h","x":"Storing the Cards"},{"t":"p","x":" Once the deck has been brought, you have to store and maintain it with due sanctity and affection/respect(as your relationship with the cards may be)."},{"t":"p","x":" The manner in which you store your cards is very significant. The cards are huge absorbers and store houses of the surrounding energy so must be preserved well."},{"t":"p","x":" You might like to protect them against negative energy by wrapping them in a soft cloth. Take care to keep the material natural such as silk, cotton or jute."},{"t":"p","x":" There are certain Colors which enhance the throbbing energy of the stored cards. Colors to avoid are Black, Blue, Green."},{"t":"p","x":" The cards should be stored in a square or a rectangular shaped box, preferably wooden or of papier mache."},{"t":"p","x":"Synthetic materials like plastic and even metal are best avoided."},{"t":"p","x":" Some readers like to store them in the original packaging the cards had been purchased/received in. This is not a good idea as firstly, the carton might get dog-eared or worn out and more importantly it prevents the process of personalising the cards for you."},{"t":"p","x":" Make the effort, as a Tarot reader to find a natural material, beautiful home for your deck. Treat them with a sense of ritual, as a gift from the Divine and you will see how miraculously the cards return your affection with accurate readings."},{"t":"p","x":" You may amplify the energy of the stored cards by placing a Crystal Guidance ball or tumble along with the cards in the box. Recommended Crystal Guidance for this purpose would be Tourmaline, Clear Quartz, Amethyst and Rose Quartz."},{"t":"h","x":"Cleansing & Energising of the Deck"},{"t":"p","x":"The cards carry residual energies by the previous owners or the surrounding environment in case its a new pack. This energy might have been anxious or angry or pessimistic. Its always advisable to freshen up your cards by clearing the residual clingers and customising your deck as per your personal energy emissions."},{"t":"p","x":"There are several methods to cleanse your cards."},{"t":"h","x":"1. White Light Therapy"},{"t":"p","x":"This technique involves holding the cards between your palms and imagining that they are being bathed in a pure, white light that has originated in a higher realm. You may like to call it divine energy, or God, or simply visualize it as as source of supreme, spiritual power."},{"t":"h","x":"2. Meditation"},{"t":"p","x":"Hold the tarot deck in your mental space and focus its positioning on the Chakra you habitually conduct your meditation on. In case you are not into chakra balancing meditation yet, then focus on the 3rd eye chakra(between your brows). Visualise Violet color emitting its light to the cards, all the while keeping them cushioned in the chakra area. Keep your eyes closed during the entire process. Once the chakra point starts getting warm or tingly, thank the angels /almighty for the cleansing and gradually make the image disappear and gently open your eyes."},{"t":"h","x":"3. Crystal Grid"},{"t":"p","x":"Crystal Grids are a powerful method of decluttering and removing residual negativity. Crystal Grid will absorb all the negativity that the cards have taken in during the course of the readings which generally deal with people suffering with problems and challenges and their auric fields are skewed. 4. Smudging The cards may be passed through the detoxifying and naturally purifying smoke of the sage plant/herb. As a substitute the smoke of incense and dhoop batti may be used."},{"t":"h","x":"5. Sunlight and Moonlight"},{"t":"p","x":"Sunlight and Moonlight are Nature’s blessings to recharge and rebuild our energies. The cards similarly can be subjected to the nectar rays of Full Moon to purify them. 5-6 hours are sufficient for this mystical procedure to take place. The cards will feel lighter after this celestial cleansing and may surprise and enchant you with their renewed clarity. Sunlight too is a good de-toxifier. Cards can be kept out cautiously in indirect sunlight under roof cover for maximum 2 hours. Take care that the cards do not fade in their Color vibrancy. You may cover the cards with a cloth mesh while keeping out."},{"t":"p","x":"Cards should be cleansed periodically for regular maintenance of their efficiency. They are a Divine Tool and must be cleansed and recharged at regular intervals. You may choose to cleanse them at your will if the readings are consistently negative or confusing."},{"t":"p","x":"If your cards were stored away for a while, cleansing or clearing them is a great way to reconnect. The same goes for an older deck that you want to revisit."}]},{"id":"v1-c6","vol":"I","title":"Chapter 6 · Performing & Giving the Reading","body":[{"t":"h","x":"Giving the Reading"},{"t":"p","x":"Given below is a guided framework for conducting a reading. In the beginning it may seem like a lot of steps, but remember that Tarot is a technique of your instinct so the more you practise along these lines, the more it will become second nature to you."},{"t":"p","x":"Setting up the Ambience of the Reading  There should be a quiet and sacred place for the Tarot reading session."},{"t":"p","x":" Noisy and crowded place must be avoided."},{"t":"p","x":" The table should be separate and should be used and laid out specifically for tarot reading.Table size need not be big. In constraint of space, a part of a larger table may be dedicated solely for the reading."},{"t":"p","x":" There should be no eatables preferably around the reading area."},{"t":"p","x":" Spread cloth must be used on the table upon which the shuffled cards would be laid out for the spread. Use natural materials and spiritual Color Guidance for the same."},{"t":"p","x":" For making the environment conducive its a good idea to use the power of Crystals. They are easily available, not Performing the Reading Chapter-6 too expensive and add charisma to the reading. They also enhance harmonious readings and intuition ability. You may choose to keep a multi-Crystal Guidance or a 7 Crystal Guidance Tree on the Tarot table."},{"t":"p","x":" Gomti chakra tree carries powerful energy to bring clarity and accuracy in readings. Best kept on top right corner of your table. Try to have access to this energy multiplier.  Aromas stimulate the chakras and purify the reading environment.You may also use incense or aroma diffusers in this regard. Essential oil candles are also popular.  Crystals that will make you feel empowered as Tarot readers are Citrine,Pyrite, Sunstone, Carnelian, Onyx among others."},{"t":"h","x":"Make the querist feel comfortable"},{"t":"p","x":" The querist comes to you generally in an agitated state of mind. Its your karmic role to first put the querist in a relaxed state of mind."},{"t":"p","x":" Start off the reading in a conversational style. A conversation is a two way interaction, sincere and free flowing between individuals. Do not overreact in your facial expressions and body language. Stay in composure and with an interested and neutral look on your face."},{"t":"p","x":" Listen. Listen, Listen. Listening carefully will give you many insights and provide clues to where the problem lies. You can thus take out better spreads and give more helpful answers to your querist."},{"t":"p","x":" Make sure you are undisturbed during the reading. Do your best to ensure you will not be intruded upon by phone calls and doorbells."},{"t":"p","x":" Almost inevitably, private and confidential matters are discussed in tarot reading. Ensure the querist that what is being discussed will remain confidential. Your lips should remain sealed, the querist is at liberty to discuss their matter with family or friends."},{"t":"p","x":" You can choose to have a table setup. Make sure you both are at same height while sitting. Do not, under any circumstance, loom over the querist. This makes him defensive and feel at a disadvantage right from the onset."},{"t":"p","x":" If the sitting layout is on lower level like cushions on floor, then make sure the client is physically and psychologically comfortable to sit like this for over a stretch of time as some sessions can take long."},{"t":"p","x":" Make sure the lighting is good but not too glaring. Soft lighting is best as it helps the client who may be emotionally agitated or low, to open up comfortably. The lighting should encourage a calming atmosphere yet one in which cards are clearly visible."},{"t":"p","x":" You can also put the querist at ease by explaining the depth of answers and clarity they can gain out of tarot by being transparent and trusting towards you."},{"t":"h","x":"Tuning In and Grounding Yourself"},{"t":"p","x":"This is perhaps the most important aspect of Tarot reading that many teachers and tarot books overlook in advising the tarot readers."},{"t":"p","x":"This process helps to give more focused, intuitive readings. Before you give a reading, you must ground yourself, and then attune yourself to higher energies."},{"t":"p","x":"Grounding is a simple process whereby you stand on terra\u0002firma and imagine roots growing out of the soles of your feet into the floor. See the roots going deep down into the earth and connecting you to its energies. This is called ROOTING or EARTHING and should be practised regularly for proper energy circulation in your etheric body."},{"t":"p","x":"For connecting to higher energies, the same technique of White Light bathing is to be applied as explained earlier for your tarot deck."},{"t":"p","x":"VISUALIZE a beam of light coming down to you and entering the crown of your head from the highest point you can conceive. Silently ask for spiritual guidance from the Higher Self during this time."},{"t":"p","x":"Finally, you must protect yourself from negative energies by imagining that you are surrounded by a golden or white bubble of light. This step is called SHIELDING."},{"t":"p","x":"Do this 3 pronged procedure prior to a Reading. If the client is already before you and you cannot perform it in isolation, simply tell your client to meditate for a moment while you yourself close your eyes and mentally perform the 3 steps of Grounding, Tuning In and Shielding."},{"t":"h","x":"Asking the Right Question"},{"t":"p","x":"The Tarot is not a medium for guessing and playing mind games. Its a serious and sacred means of divining the truth. When a client or an interested person simply asks you to guess what’s playing on his mind based on the cards, politely refuse to become a medium of entertainment and amusement. Treat your cards with respect and your Cards will always speak the Truth to YOU."},{"t":"p","x":"Tarot reading is primarily a Prashna Kundali (Question Chart) if we relate it with the dynamics of the ancient and validated science of Astrology. The clearer the question asked of the Tarot, the clearer will be the reply and the clearer the guidance."},{"t":"p","x":"Take the requisite time to establish a rapport with your querist/ client such that a clear question emerges from the web of confusions and feelings the querist may be embroiled in. Some people may be forthcoming in discussing their issue while others may be reticent. Its the role of the Tarot reader to understand the situation and help the querist to form an insightful question."},{"t":"h","x":"Choosing an Appropriate Spread"},{"t":"p","x":"Choosing the correct spread is integral to getting the accurate and helpful results."},{"t":"p","x":"Choice of spread depends on the nature of the question. If the querist wants an overview or a bird’s eye view of a situation then THE CELTIC CROSS using 10 cards may be used. There are customized spreads pertaining to various aspects of life in which guidance is being sought. Few of these are:  Relationship Spread  Mutual Compatibility Spread  Single card Guidance of the Day  Choice Spread which may be 2 cards or in complex/ multiple choice cases may extend upto 5 cards  Prosperity Spread  Character Profiling spread  Astrological/Horoscope spread  Horse shoes Spread  Time Line spread of Past-Present-Future  Future Outcome spread  What-If? Spread  Health spread  Business Arrow Spread  Pentacle or 5 star Professional Spread  Tarot Advice Spread  Annual Forecast Spread  Marital Life spread  Matchmaking spreads (esp interesting when done with the 16 court cards)"},{"t":"h","x":" Qaballah Life Purpose spread"},{"t":"p","x":"And there can be numerous other spreads that are called CUSTOMISED SPREADS and depending on maturity level of the Tarot Reader really get to the heart of the matter that the querist is seeking divine light on."},{"t":"p","x":"There are also FREE FLOW spreads that do not follow any pre-defined positioning but rather are more intuitive and are created in the mind of the Tarot reader spontaneously as the reading is being carried out."},{"t":"h","x":"Creating Your Own Spread"},{"t":"p","x":"If you cannot find a suitable spread that will answer your querist’s question, you can create your own. This is much simpler than it sounds but does require some preliminary thought and planning."},{"t":"p","x":" The first step is to understand the situation in detail and what are the points wherein the querist is facing the knot/dilemma."},{"t":"p","x":" Then break up the query into POSITIONAL QUESTIONS such that formulate a list of the questions that the spread will carry against each card."},{"t":"p","x":" Then shuffle and follow the Tarot pre-ritual and draw out cards against each of the questions you have created for answering/analyzing the situation."},{"t":"p","x":" Interpret the cards by studying the interplay amongst them in the context of the larger issue being analyzed.  Provide your predictions and guidance to the querist using your experience and the deep insight you have gained by studying the cards which are perfectly in consonance with the analytical situation. The cards will be wonderfully insightful as the spread has been created keeping in mind the unique situation of the querist.  The customized Spread is a more evolved way of Tarot Reading and is used judiciously and prolifically by expert Tarot Readers."},{"t":"p","x":"Shuffling the Cards and Drawing the Cards  Once the spread you will be using appropriately as per the question has been decided,an you know what the question is or if the question is being kept undisclosed and you are aware of the general framework of the question, its time to SHUFFLE."},{"t":"p","x":" While you are shuffling the cards, make sure your concentration is solely on the querist, the question and also seeking help from the Universe to send the right answers to you and through you to the querist."},{"t":"p","x":" Some tarot readers like the querist to shuffle the cards. My personal opinion is not to allow the querist to do so since they are very much a part of the problem or issue they want clarity on and as such would carry subjective or biased mental energies."},{"t":"p","x":" One of the primary aims to approach a Tarot reader is to get a non judgemental and objective insight and guidance into the problem area. It would be wise to let the tarot reader shuffle the cards and put in their pure and non-biased intentions into the cards for a Crystal clear spread."},{"t":"h","x":"What is a POP OUT CARD"},{"t":"p","x":" If any cards fall out of the deck at this stage, make a mental note of them and put them back in the deck. They may have a specific relevance that will become apparent during the reading.This is known as a POP- OUT CARD and may be maximized to two. Beyond that, do not count them as part of reading. Simply pick and mix back into the deck being shuffled."},{"t":"p","x":" After cutting the deck into 1 or 2 piles, you may like to spread the cards out in a reverse U formation, with the dip facing the tarot reader. The reader then is instinctively pulled to draw certain cards and lay them out in a SPREAD."},{"t":"p","x":" A SPREAD is a positional layout where each cards stands for a certain position, spelling a certain variable in the overall spread. Example in a timeline spread -  Card 1 is the PAST/ROOTS OF THE ISSUE  CARD 2 is the PRESENT SITUTAION  CARD 3 is the FUTURE OUTCOME  The cards are laid out left to right in the spread or from top to bottom as the case may be."},{"t":"p","x":" You may lay out the cards face down and open them one by one. This is sometimes done for dramatic effect but in reality this is quite useful as the agitated querist prefers to listen to you carefully as you interpret each card. Opening all cards at once distracts the querist by the visual extravaganza and he ceases to listen to the content being discussed and subconsciously begins to self interpret. Avoid this situation to develop."},{"t":"p","x":" As you turn over each card, you may turn over the surrounding cards too in order to connect the pictures and weave the story as it is unfolding."},{"t":"h","x":"Reversed Cards"},{"t":"p","x":"At times, when the cards are dealt out, one or a few of the cards are upside down. These are known as Reversed cards. One school of thought does not consider the Reversed cards to have any special meaning and turning them around, continue to interpret them as Upright cards."},{"t":"p","x":"However in my personal experience, when in an ostensibly upright deck (where the tarot reader to the best of his knowledge has arranged the cards upright) a card pops up as reversed, its a definite divine signal that the message being conveyed by the card deserves special attention."},{"t":"p","x":"Reversed cards have been dealt in more detail at the advanced level of the course."},{"t":"p","x":"As a general guideline, a reversed card, as per certain schools of Tarot thought, indicates that the card meaning has been reversed or altered in some way. Darker cards lose some of their severity when reversed while the positive cards may indicate delay or a lessening in their positive/empowering quality."},{"t":"p","x":"However always remember, each of the Tarot cards carries both positive and negative or rather a bright aspect and a dark aspect much like the Moon, which is considered the Significator planet for this divination science of Tarot. The exact meaning of a card, upright or Reversed can only come to full brilliance against :"},{"t":"h","x":" The context of the question"},{"t":"h","x":" The surrounding cards"},{"t":"p","x":" The position of the card in the spread  The interpretation richness of the tarot reader  Clarity with which question has been framed  Level of Soul Ascension of the tarot reader which determines how the Reader is able to co-relate the paradigms of the Reading with his understanding and experiential status of the Universal Consciousness."},{"t":"h","x":"During the Reading : Important Tips"},{"t":"p","x":" While you are doing the reading, be alert and carefully observe the body language and the facial expressions of the querist and the person listening to your Reading. Be mindful of your language and the content you are imparting."},{"t":"p","x":" Calibrate your tone and message as per the changing expressions of the querist. If the querist is feeling uneasy or uncomfortable, you may pause and reaffirm if the reading is going in the right direction."},{"t":"p","x":" The topic being discussed is generally sensitive and you need to be gentle if the querist is uncomfortable. Your reading must be authentic and truthful but the language in which the reading is conveyed needs to be customized to receptivity level of the querist. So make changes in the language if needed."},{"t":"p","x":" If you are not a trained counsellor or psychotherapist, you may have unwittingly touched upon a subject which the querist finds upsetting or a breach of privacy. So always be tactful, and tread very carefully."},{"t":"p","x":" At the end of the reading ask the querist if he has any more queries, They may want you to amplify something that you have touched upon earlier and it resonates with the querist."},{"t":"p","x":" The querist will also repose greater trust in you as the reading progresses and you may find yourself privy to many secrets and confidences of your querist which will flow naturally from his end. Be non-judgemental about these, keep your professional authenticity and guide him as best as ou can."},{"t":"p","x":" The Tarot reading session can be cathartic for the person who has come for a reading in a non-judgemental and sensitive environment being moderated by you, the Tarot reader. Traumas and emotional peaks and nadirs may emerge during the session. Be receptive. Be composed. Be empathetic. Learn to separate your own emotions from the emotional webs being discussed and offer your guidance on the basis of the cards."},{"t":"p","x":" Try to gain knowledge of Vedic remedies and other remedies like Gem stones, Yantras, Rudraksha, aromatherapy, Crystal Guidance therapy, chromotherapy, numerology, Astrological Sciences and others and provide comprehensive remedies to your client / querist for long term benefits."},{"t":"p","x":"Post Reading - When the reading is over, you must again cleanse and ground yourself much like you did when you began the reading. The interaction with the querist changes your energy field and you must restore its purity to your own frequency."},{"t":"p","x":"Meditation Tip : If you are attuned into the seven chakras, run the white light beam through them starting from the crown(Sahasrar) chakra down to the root(Muladhar) chakra. Ground it into Mother Earth so that excess energy is absorbed into the Earth element."},{"t":"p","x":"If the reading has been excessively emotionally charged or you faced a truculent querist, you can cleanse the Tarot reading room or area by fresh air circulation or by smudging it with sage smoke or incense smoke."},{"t":"p","x":"Protect yourself again by imagining the white light bubble around you. In case you are attuned to the angelic realm, pay your gratitude to the Archangels. In all cases, pay gratitude to your masters, the Divine Almighty and the Gurus and teachers of your esoteric knowledge. With their blessings, the flow of messages will be downloaded more smoothly into your auric body."}]},{"id":"v1-c7","vol":"I","title":"Chapter 7 · Popular Tarot Spreads","body":[{"t":"h","x":"Single Card Spread"},{"t":"h","x":"Single Card Spread"},{"t":"p","x":"1. Guidance of the Day (G.O.D.) Card  This is a single card that is drawn from the entire deck.  It is personal to the daily events/moods of the person who draws it or in whose name it is drawn."},{"t":"p","x":" Based on the guidance of this card, the person can attend to the day accordingly. He may pay attention to enhance the promise inherent in the Card or alternatively may choose to minimize the dark aspect of the card.  The person can also calibrate the feelings, desires and reactions that could arise based on the guidance of the card."},{"t":"h","x":"Popular Tarot"},{"t":"h","x":"Spreads"},{"t":"h","x":"Chapter-7"},{"t":"p","x":"Examples of Guidance of the Day Card 1. Strength A day where tolerance will be the key word."},{"t":"p","x":"The events will work out in your favour but at a slower pace than desired by you. You will need to combine emotional strength with compassion to create successful relationships and dealings. You will be held accountable for any actions you take and be perceived as emotionally mature."},{"t":"h","x":"2. Eight (8) of Wands"},{"t":"p","x":"A day of rapid communication and a delayed event/meeting finally on the anvil. Emotions will run amok and you may feel psychologically disoriented and out of control. Excellent day for confronting past issues and reaching a mutually win-win outcome."},{"t":"h","x":"3. Five (5) of Cups"},{"t":"p","x":"A day of losses, perceived or apparent but a sense of desolation does kick in. Effort should be not to wallow in the downsides but be aware of what requires your active attention and take the help of mirthful persons around to restore your balance and keep going."},{"t":"h","x":"2. Yes or No Spread"},{"t":"p","x":" The Single Card Spread is also very powerful when one wants definitive answer to a definitive question."},{"t":"p","x":" Its a succinct and direct answer method."},{"t":"p","x":" The Yes or No answer will depend on the nature of the query. The query needs to be Crystal Guidance clear, short and properly phrased in an interrogative fashion. Examples:"},{"t":"p","x":" Will I be successful in my Interview today?"},{"t":"h","x":" Card for YES/NO QUERY"},{"t":"h","x":" Knight of Pentacles : YES"},{"t":"h","x":" Strength : NO"},{"t":"h","x":" Chariot : YES"},{"t":"h","x":" KING OF WANDS : YES"},{"t":"h","x":" 7 of Cups : NO"},{"t":"p","x":"In certain cases, the answer may not be immediately clear with the Single Card drawn."},{"t":"p","x":"In such a case, a SUPPLEMENTARY or SUPPORTING CARD to the main card should be drawn up. This is called the 1+1 method and should be used only when 1 card reading is ambiguous. Example Question : Is this boy suitable for me regarding marriage purpose?"},{"t":"h","x":"Card : The Magician"},{"t":"p","x":"Generally the Magician Card being a Major Arcana and signifying strong and creative male energy is a YES CARD. However in this case, another Card may be drawn which can signify whether this creative energy is aligned with the future of the girl or is the Magician Energy too self centric. Marriage query is about combining the male and female energies for domestic energies. Thus a Card, even if a positive one, may be qualified further by a supplementary card if the interpretation through single card is coming through as focusing on Individuality."},{"t":"h","x":"Card 2 : Case 1: Chariot"},{"t":"p","x":"The Chariot Card, now interpreted against the background of the Magician indicates that the tremendous energy carried within this character in question will be channelised for moving forward in life with concentration and target in mind. He is capable of balancing two energies and moving forward, using the best of the duality."},{"t":"h","x":"Now the answer would be STRONG YES"},{"t":"h","x":"Card 2 : Case 2: 5 of Swords"},{"t":"p","x":"When this card is pulled up as Supplementary Card against the Primary card of the MAGICIAN, the meaning of the reading will undergo a tremendous change. Infact the Reading will change completely. 5 of swords indicates the energy of petty ego hassles and an over bloated self image. This will create disharmony in marriage as the boy will feel vengeful rather than conciliatory in trivial matters. Thus the result of the reading would be negative or Not Recommended."},{"t":"p","x":"Now the answer would be : NO/NOT RECOMMENDED 3.\"Meditation of Day” Card  The Personalized Card can also be used to Meditate on the Primary thought or Inspirational Thought of the Day.  It will direct you to the surrounding energy of the Day.  Use the message embedded in the card to be deeply aware of your surroundings. Be in the Here and Now and be mindful of the laws of Synchronicity that will Three Cards Spread 1. Mood of Your Day Spread This is a 3 card spread that specifically orients your emotional state of being to bring about the best outcome possible for you during the day."},{"t":"p","x":"The 3 positionings are :"},{"t":"h","x":"1. Your Mood for the Day"},{"t":"h","x":"2. Interferences or Obstacles"},{"t":"h","x":"3. Positive Results"},{"t":"h","x":"Example Reading"},{"t":"h","x":"i. Four of Cups"},{"t":"p","x":"Your mood is withdrawn and reclusive. You may be day dreaming and come across as unapproachable today. Do you resist or welcome these feelings?"},{"t":"h","x":"ii. King of Swords"},{"t":"p","x":"Since you do not wish to be disturbed, take care that your attitude does not turn out to be too analytical and even rude. Can you let go of negative feelings and deal with more compassion and understanding?"},{"t":"h","x":"iii. Page of Wands"},{"t":"p","x":"Your day can bring fresh opportunities for growth and success. The Mind will receive stimulation and satisfaction. Are you willing to be pro-active and grab the opportunity to move and expand?"},{"t":"p","x":"2. TIME (Past-Present-Future) Spread Three Card Spread  In Tarot the concept of TIME IS very interesting and complex. It can range from recent past, present and future to distant past, present and distant future. It depends on the texture of the Question as to how long in past the roots of the Present should be traced and how much predictive factor is being integrated into the Future.  This layout uses the Past, Present, Future to give you a sense of threads of life which are all interwoven in time.  We have an intrinsic thirst to know the Future because it gives us a sense of control over our lives."},{"t":"p","x":" But the Future mostly has its roots in the Past because in Time, cyclical patterns patterns repeat themselves and our Future will be shaped by the past experiences and behaviors."},{"t":"p","x":" We think about the Past all the time, directly or directly sub referencing it for the Future and to determine our responses in our Present."},{"t":"p","x":" The Past is the only slice of time that we are totally in comprehension of so the Past card in the P-P-F Spread (PAST-PRESENT-FUTURE SPREAD) is of most pivotal significance."},{"t":"p","x":" When we unravel the threads or webs of the past, you can know how to shape the future and have a control over it."},{"t":"p","x":"Positioning of Cards in Past-Present-Future Spread 1. Past Roots of the Query 2. Present Situation 3. Future Outcome  While interpreting this Spread look first at the Middle Card which represents the Present situation and its complexity. Thereafter compare and contrast it with the energies of the Past and based on the interplay of the Past and Present. It will warn us about any upcoming obstacles or dangers as also positively prepare us for a favourable future."},{"t":"p","x":" Study the mix of the energy/attribute carried by the suits. If 2 or more Major Arcana cards are drawn, they indicate a major event or life experience. Similarly 2 or more cards of the same elemental suit will also impact the reading and the events as per the element they represent."},{"t":"h","x":"Celtic Cross Spread"},{"t":"h","x":"Celtic Cross Spread"},{"t":"p","x":" This is a classic Tarot spread and very popular all across the globe. In USA and Europe, its the most widely known and practised and clients may specifically ask for a Celtic Cross Reading which is a layout in the traditional Cross format (with Christianity roots)."},{"t":"p","x":" It is especially useful for gaining an overview of a situation because it explores it in such detail."},{"t":"p","x":" It allows you to examine both the Past and the Present.  You will find variations in the ways the cards are laid out but the essential pattern of the spread always remains the same."},{"t":"p","x":" The Celtic Cross Spread is very comprehensive. At most times, it may answer all your questions concerning a situation and there is no need to ask any more."},{"t":"p","x":" It beautifully analyses the nuances of a complicated situation the querist may be facing. It throws up insights into the underlying currents and feelings and also analyses the situation from the perspectives of other persons./parties who are a dynamic part of the situation. Positioning of Cards In Celtic Cross 1. Current Situation/Heart of the Matter This card signifies the current events and moods in the querist’s life, both favourable and unfavourable. Also shows the mental state the querist currently is operating in.What impact the current situation is having on the querist is signified by this card."},{"t":"h","x":"2. Obstacle or Opposing Influence"},{"t":"p","x":"This is the blocking or obstacle card and is a very significant indicator of what challenge is being faced at the moment. This is the challenge that a solution must be sought for. Even if this card feels positive or energizing, it does show an energy imbalance in the situation and must be analyzed carefully. 3. Unknown/Root Influence This indicates the events or situations in past that have created the current situation. Many a times, in Tarot world, the roots of the Present must necessarily be studied by dissecting the past.This influence is generally not evident at the moment. 4. Known Influence/Top of the Head Influence This is an emotion or event that is evident in the situation and which you know to be already true. Its playing heavily on the querist’s mind and may represent their beliefs or aspirations at the time."},{"t":"h","x":"5. Past Influences"},{"t":"p","x":"The past events that have created the situations of the present and will also influence the future if left undiscussed and unmodified. The Root of the matter."},{"t":"h","x":"6. New Circumstances/Recent Future"},{"t":"p","x":"This shows what is going to enter the querist’s life soon and change the current situation. It may be a person, an opportunity, an experience, a new realization or a challenge. 7. Your Self- Hopes And Fears This is a pivotal card in the Celtic Cross spread and denotes the Querist. What are the aspirations of the querist? What are the internal fears or apprehensions? A complete psychoanalysis card that needs to be studied individually as well as in relation with other cards of the spread."},{"t":"h","x":"8. Surrounding Environment"},{"t":"p","x":"This card denotes how others in the environment are perceiving the situation. It also indicates the environment\u0002material and psychological that the querist is surrounded by. Also indicates the resources available at the disposal of the querist."},{"t":"h","x":"9. Guidance/Tarot Advice"},{"t":"p","x":"This card is the Tarot guidance card and will show you the route to traverse the present situation. It could be an emotion or attitude you could inculcate or let go of, a person who could help you, or even an advice from your Higher Self. This is the key to the challenge being faced and must be understood and then adhered to."},{"t":"h","x":"10. Outcome"},{"t":"p","x":"A significant harbinger to the future unfolding. Describes resolution of the problem or whether the situation could be more lingering and complicated in future. This card will also be influenced by the thinking and the actions of the querist by his Free Will. If this card is not favourable, the Querist should assume self-responsibility and make required changes to make the outcome more conducive to his well-being. Relationship Spread Relationship Spread Relationship spread is a 8 card layout. It is very useful for analyzing the potential and the future of a relationship. This can be used in various ways."},{"t":"h","x":" Marital relationship"},{"t":"h","x":" Love and Romance Relationship"},{"t":"h","x":" Partners in a business enterprise"},{"t":"h","x":" Friends"},{"t":"h","x":" Business Collaborators"},{"t":"h","x":" Teacher-Student/Mentor-Employee"},{"t":"p","x":" Relationships within a family situation viz in-laws, cousins, uncles, aunts, parents, children etc  Any other association or relationship wherein two or more persons are in dynamic interaction with each other. Positioning of Cards in Relationship Spread 1. Relationship Situation This card reflects what is currently happening in a relationship. Its a mirror of the present. Could show evident picture as well as the unseen. Approach this card with pragmatism. It mostly reflects the present truth as it is."},{"t":"p","x":"2. Your Facilitating Contribution to the Relationship This card will show the energy, physical-mental and spiritual that are positive and constructive for the relationship and being brought into the alliance by the querist."},{"t":"p","x":"3. Their Facilitating Contribution to the Relationship This card will show the energy, physical-mental and spiritual that are positive and constructive for the relationship and being brought into the alliance by the other party. 4. Your Obstructing Contribution to the Relationship What factors are you bringing into the relationship in terms of attitude or behaviour or perception that is acting or going to act as a challenge for the relationship. This card analyses the blockage or area that can be improved upon."},{"t":"p","x":"5. Their Obstructing Contribution to the Relationship What factors are you bringing into the relationship in terms of attitude or behaviour or perception that is acting or going to act as a challenge for the relationship. This card analyses the blockage or area that can be improved upon."},{"t":"p","x":"6. Tarot Message for the Relationship/Advice Message This gives useful advice on the potential of the relationship and how it can mutually benefit the parties concerned. What you should do to balance this association is advised by this card."},{"t":"h","x":"7. Future Shape of the Relationship"},{"t":"p","x":"This is a strong prophetic card of the future of this relationship. A powerful card, this gives you the freedom to mould your thoughts and actions in a way that the desirable outcome form this association can be yours."},{"t":"p","x":"The 8th card is the SINIFICATOR CARD and is either taken out at the beginning or extreme end of the Reading. It signifies the QUERIST. The focus of the Tarot reader is to connect the persona and inherent character of the querist with the insight that has been received from the interpretation of the 7 card Positional Spread."},{"t":"p","x":"5 Card Pointed Arrow Spread for Problem Resolution Arrow Problem Resolution This is a very useful spread and is used for a deep and immediately responsive stance on a situation."},{"t":"p","x":"Positioning of cards in this layout."},{"t":"h","x":"1. Situation at Present"},{"t":"p","x":"2. Facilitating Factor(S)"},{"t":"p","x":"3. Challenging Factor(S)"},{"t":"h","x":"4. Action Required"},{"t":"h","x":"5. Result of the Action"},{"t":"h","x":"True Love / New Love Spread"},{"t":"h","x":"True Love/New Love Spread"},{"t":"p","x":"Each human is in search of true love and happiness. They want to know what lies ahead in their love life, what sort of partner is destined for them and whether a particular romantic relationship will give them satisfaction or not. Card 1 : What do you feel about your partner and the relationship?"},{"t":"p","x":"Card 2: What does the partner feel about you and the relationship?"},{"t":"p","x":"Card 3: What is the combined energy of you and partner and what similarities do you and the partner share?"},{"t":"p","x":"Card 4: What are the strengths of this relationship / what factors can be developed to make the relationship stronger? Card 5 : What is the major weakness of the relationship / what factor can be improved to make the foundation of the relationship stronger?"},{"t":"p","x":"Card 6 : Outcome Card and the potential of the relationship to sustain and develop in the long term."},{"t":"h","x":"Career Path Spread"},{"t":"h","x":"Career Path Spread"},{"t":"p","x":"The Career Spread is very useful when you feel stagnation or frustration in your professional life. If your job is not rewarding you commensurate to your efforts or your inputs are not getting recognized, this spread will provide clarity on what is best course of action to undertake to improve your professional life and move forward."},{"t":"p","x":"This spread also works well when there is a choice about growing in your career and making a significant change in field or location to change the trajectory of your work life. If you are geared towards business or self employment and need divine guidance, then too this spread can be used effectively. Alternative career options are also depicted by using this spread."},{"t":"h","x":"Positioning of Cards"},{"t":"p","x":"Card 1: Is my current employment/job suitable for me? Card 2: How can I make improvements in my current professional situation?"},{"t":"p","x":"Card 3: What potential or latent talent do you have that can bring growth in your career?"},{"t":"p","x":"Card 4: How much effort are you currently putting into your professional life?"},{"t":"p","x":"Card 5: Root cause/ past analysis to analyse the present performance."},{"t":"p","x":"Card 6 : What steps/action can you take to bring improvement in your performance?"},{"t":"p","x":"Card 7: What will be the outcome if you are following the suggestions/advice for your career growth?"},{"t":"h","x":"Mandala Spread"},{"t":"p","x":"When is person is seeking guidance on how to grow emotionally and spiritually, the Mandala spread may be laid out. The Mandala is a secred geometrical representation and brings intence focus and divine messages of future path into the native's mind."},{"t":"h","x":"3"},{"t":"h","x":"9"},{"t":"h","x":"5"},{"t":"h","x":"1"},{"t":"h","x":"7"},{"t":"h","x":"2"},{"t":"h","x":"8"},{"t":"h","x":"4"},{"t":"h","x":"6"},{"t":"p","x":"1. How does the person see him self - General perception? 2. What are the life goals of the person ?"},{"t":"p","x":"3. What is the persons primary dream in life ?"},{"t":"p","x":"4. What has the person accomplished so far in life as on date? 5. What is the primary element the person is dependent upon ? (May be regarded as a weakness)"},{"t":"p","x":"6. What is the primary element the person would like to adopt as a strength to depend upon ?"},{"t":"p","x":"7. Divine guidance from the Tarot for emotional growth. 8. Divine guidance from the Tarot for spiritual growth. 9. How far will the person's desire for growth be fulfilled ?(out come card)"}]},{"id":"v1-c8","vol":"I","title":"Chapter 8 · Major Arcana – The Fool’s Journey & Ready Reckoner","body":[{"t":"h","x":"Major Arcana"},{"t":"h","x":"Cards"},{"t":"h","x":"Chapter-8"},{"t":"p","x":"There are 22 Major Arcana Cards which entail the human journey from birth till enlightenment. These 22 cards are the heart of the Deck. Each of these cards symbolizes some universal aspect of human experience. They represent the archetypes- consistent and universally acknowledged prototypes of influence that are an inherent part of human nature."},{"t":"p","x":" Each card in the Major Arcana has a name and a number."},{"t":"p","x":" Some names convey the card’s meaning directly like Strength, Justice, Temperance."},{"t":"p","x":" Other cards are individuals who personify a particular approach to life, such as the Magician or the Hermit.  There are also cards with astronomical names, such as the Star, Sun and Moon. They represent the mystical, elusive forces associated with these heavenly bodies.  The Major Arcana cards are very important. They draw out deep and complex reactions. The images on the Universal Rider-Waite deck are evocative because they combine esoteric symbolism with recognizable situations and complexities of life."},{"t":"p","x":" A major arcana card is always given extra weightage in a reading."},{"t":"p","x":" When one of the Major Arcana cards appears, you must know that the issue being analyzed is not of mundane or temporary nature. The issue is pertinent to your life and will bear a long lasting impact on it. Majors represent major milestones and major emotions in life."},{"t":"p","x":"Many interpretations view the Major Arcana as showing the different stages of an individual’s journey of inner growth. This is popularly referred to as\" FOOL’S JOURNEY”."},{"t":"p","x":"In this journey, each card is a Learning Stop or a Milestone of Life. It incorporates a life experience that must be understood and absorbed before we can realise our wholeness and fulfillment."},{"t":"p","x":"We all travel this road to self-actualisation as we are spiritual beings having an earthly experience."},{"t":"p","x":"Our specific paths are unique, based on our own accounts of karmic balance sheet (of our soul journey till date) but our milestones are universal."},{"t":"p","x":"The 22 Major Arcanas are Milestone Markers/Flags on this individualized road to self realization as it originates with the Fool Card No 0 (earliest awareness) to World Card No 21(Completion)."},{"t":"h","x":"The Fool’s Journey - Observations"},{"t":"p","x":"While the Fool’s Journey seems generic and presents a sequential order of experiences, in reality in reality it is brilliantly unique for each individual."},{"t":"p","x":"Each stop entails a major lesson to be learned, a significant piece of the puzzle must be absorbed so that by stage 21, the culmination of the puzzle pieces of our soul learning can be completed."},{"t":"p","x":"Each person learns from his life experiences in a different capacity. We may make mistakes, skip lessons and fail to realize our potential."},{"t":"p","x":"Sometimes we lack the courage or the insight to to discover our deepest strengths and fears. Some never feel the momentum of the Chariot while some never feel the spiritual call of the Hermit while others will be reluctant to face the sacrificial tests of the Hanged Man."},{"t":"p","x":"It must be remembered however, that life gives us the challenges to learn a lesson we need to. In case we are reluctant to do so or obstinate enough not to accept the lesson, then the similar experience pattern will recur in our life till the lesson is learned."},{"t":"p","x":"Ego defenses have to break down, the lesson inherent in each milestone humbly accepted and incorporated and then only the human soul can traverse smoothly on to the next rung of the ladder."},{"t":"p","x":"Do the steps in this soul journey always occur sequentially? Not necessarily."},{"t":"p","x":"We may experience lessons out of order. A person may need to absorb the qualities of the Strength in early childhood, but later harness it into the mastery of the Chariot in his professional life."},{"t":"p","x":"Another may have an unfortunate childhood and face the Tower moment with loss of parents but later be compensated with an enriching married life befitting the Lovers Card. The Major Arcana shows us that as humans, the feeling of fulfillment and wholeness is written in our Destiny. If we follow the signals of the divine guidance and be open to learning the lessons of the Milestones, in which ever sequence they occur in our life, we will eventually align with our True Nature and gain access to the World."},{"t":"p","x":"Flowchart of the Major Arcana Cards on the Human Soul Journey Card No."},{"t":"p","x":"Card Name Stage Of Life / Life Lesson Influencers O Fool Radical Potential I Magician II High Priestess Primordial Masculine/Feminine III Empress Conditioning Child Environment IV Emperor V Hierophant VI Lovers Skill, Education, Training VII Chariot VIII Strength IX Hermit X Wheel Of Fortune Transpersonal Perspective XI Justice Karmic Pattern Realised XII Hanged Man XIII Death XIV Temperance XV Devil Testing Blocks XVI Tower XVII Star Deep Inner Work XVIII Moon XIX Sun XX Judgement XXI World Transformation And Integration Stages in the Journey of Tarot - THE FOOL'S JOURNEY  The Fool represents our inherent individual soul status and our innate ability to form networks and our potential for development  The Magician and The High Priestess represent the Masculine and Feminine parts of our nature. As per Chinese belief they represent the Yin and the Yang and as per the Hindu tradition represent the Shiva and the Shakti."},{"t":"p","x":" The Empress, The Emperor, and The Hierophant stand for pillar presences of our Mother, Our Father and our Teacher (Guru). This Teacher is an abstract Authority figure and could denote a religious / spiritual head or a Guide in our life."},{"t":"p","x":" The Lovers, The Chariot and The Strength represent the skills that we acquire in the practical business of living. Also the ecclesiastical and the technical education we acquire while studying or working."},{"t":"p","x":" The Hermit represents our inner voice and wisdom which hones itself as our life experience deepens. It becomes the voice of our Conscience."},{"t":"p","x":" The Wheel carries us forward on our karmic path and makes us interface the situational and societal factors\u0002the world we cannot control and we have adjust accordingly."},{"t":"p","x":" Justice, The Hanged Man, Death and Temperance are our significators for growth and change. The more we are able to face our karmic debts and reinvent ourselves, the more can progress ahead in this lifetime."},{"t":"p","x":" The Devil and the Tower are the tests and challenges of our life, These can be personal crashes, disappointments and setbacks that call for us to muster our spiritual strength and to start afresh."},{"t":"p","x":" The Star, The Moon, The Sun, and Judgement all represent the transformative possibilities that life has presented before us and which if we accept graciously lead us to soul growth in this birth. And thus our soul evolves in the continuum of time and space."},{"t":"p","x":" Finally, The World card represents a state of integration and acceptance of who we are as a person. Its our connection with the Divine and understanding our life purpose. A feeling of completion. A stage of fulfillment. While the Major Arcana describes the major transit points in the journey of life, the Minor Arcana cards describe the bylanes and the meanderings of daily interaction."},{"t":"p","x":"Ready Reckoner:"},{"t":"p","x":"Key Words For Each of the Major Arcana Cards The Fool : Beginnings, Originality, Spirituality, Eccentricity, Unconventional, Folly The Magician: Initiative, Skill, Activity,Cleverness, Contructive Power The High Priestess : Secrecy, Intuition, Delays, Spiritual Knowledge, Deep Issues, Things Hidden The Empress: Fertility, Abundance, Sensuality, Nurturing, Happiness, Fruitfulness The Emperor: Stability, Power, Authority, Discipline, Boundaries The Hierophant: Organised Religion, Test Of Life, Knowledge, Dogmatism, Revelation, Spirituality The Lovers: Love, Personal Relationships, Choice Between Heart & Mind, Selfless Union, Marriage, Inspiration The Chariot : Travel, Movement, Ambition, Balance, Self-Assertion Strength: Self Control, Fortitude, Spiritual Strength, Patience, Self Mastery The Hermit: Isolation, Deep Study, Introspection, Wisdom, Inner Counsel, Celibacy Wheel of Fortune: Unexpected Turn, Expansion, New Horizons, Dame Fortune, A Change, Cycles Of Life Justice : Legal Affairs, Karmic Balance, Cause And Effect Laws, Decision, Judgement The Hanged Man: Act of Sacrifice, Unconventional Behaviour, Surrender, Flexible Thinking Death: Transformation, Ending, a New Beginning, Life-Lesson, Hope Temperance: Equilibrium, Adjustment, Balance, Partnership, Good Prospects The Devil: Material Desires, Obsession, Lust, Avarice, Bondage The Tower: Crash of Expectations, Necessary Change, Unfulfilled Expectations, Shocking News The Star: Solace, Sustained Hard Work, a Gift, Universal Blessing, Insight, Optimism The Moon: Insight, Organic Change, Hidden Currents, Ambiguity, Distrust The Sun: Enlightenment,Transparency, Confidence, Success, Joy, Prosperity Judgement: Decision, Change of Direction, Final Settlement, Amendments, Regrets The World: Completion of a Cycle, Fulfillment, Achievement, Success, Satisfaction"}]},{"id":"v1-c9","vol":"I","title":"Chapter 9 · Minor Arcana – Suits & Elements","body":[{"t":"p","x":"While the Major Arcana signifies Universal themes, the Minor Arcana will miniaturize them into incidents and experiences of everyday life."},{"t":"p","x":"The Minor Arcana cards represent the concerns, activities, squabbles and pleasures of everyday living. Its the tapestry of Dramas of Daily Life."},{"t":"p","x":"The Wands are the suit of Passion,, action and movement. It depicts the Fire element in each of us, the idea and inspiration that makes us excited about life and want to grow and spread our wings."},{"t":"p","x":"Wands are associated with qualities such as  Ambition  Risk taking and adventurous spirit  Confidence  Forward thinking and foresight  Leadership and Boldness  Passionate Involvement  Desires and Drives  Yang element - Masculine element of the Chinese Philosophy of Energy Minor Arcana Cards Chapter-9 The CUPS are the suit of Creativity, Emotional Experiences and Spirituality. It depicts the Water element in each of us, the depths of emotions and the feelings, the desire to self express and want to flow with the tide of life. Cups are associated with qualities such as :"},{"t":"h","x":" Feelings and emotional responses"},{"t":"h","x":" State of mind"},{"t":"h","x":" Moods and mood fluctuations"},{"t":"h","x":" Love and romance"},{"t":"p","x":" Tender feelings of attachment and affection  Memories, Dreams and Nostalgia  Despair and depression  Creative self expression  Imagination and Fantasy  Yin element - Feminine, element of the Chinese Philosophy of Energy The Swords are the suit for intellect, thought and reason. They are concerned with Justice, Truth and ethical principles. It depicts the Air element in each of us, the heights of logic and analysis and intelligence our consciousness possesses. Swords are associated with qualities such as :"},{"t":"h","x":" Clarity and focus"},{"t":"h","x":" Intellectual reasoning"},{"t":"p","x":" Foregoing emotion and looking for logical choices  Learning and knowledge  Razor sharp mental dissections  Disharmony, unhappiness and anxiety  Betrayals and deceptions  Communication of all kinds- Verbal, written, Body Language  Discussions and debates The Pentacles represents Security, Finances and material concerns. It depicts the Earth element in each of us, and gives us the ability to plan and execute with our security in mind. It deals with the concrete and the manifest aspects of material life. In Pentacles, we also celebrate the abundance and gifts of nature, our interactions with plants and animals and the sensory experiences of our physical body. Pentacles are associated with qualities such as :"},{"t":"h","x":" Prosperity"},{"t":"h","x":" Wealth and assets"},{"t":"h","x":" Money and bank balances"},{"t":"h","x":" Transactions and business"},{"t":"h","x":" Property"},{"t":"h","x":" Physical body, health"},{"t":"p","x":" Fitness and well being of the body  Affluence and Abundance  Power and control issues  Fertility  Networking and collaborations The Minor Arcana are the material manifestation of the Tarot card deck. While The Major Arcana represents the Soul, the Minors are the Body and its machinations."},{"t":"p","x":"When we study the Minor Arcana, we must always keep in purview two attributes of each Minor Arcana card:"},{"t":"h","x":" Number associated with the Card"},{"t":"h","x":" Element associated with the Card"},{"t":"p","x":"We should approach the Minor Arcana cards symbolically as we are moving towards studying a spiritual tradition.  What qualities of being or character do you associate with Fire?"},{"t":"p","x":" What qualities of being or character do you associate with Water?"},{"t":"p","x":" What qualities of being or character do you associate with Earth?"},{"t":"p","x":" What qualities of being or character do you associate with Air?"},{"t":"p","x":"The four elements are rarely depicted in isolation and are interdependent. They are represented as quarters of a circle that encompasses them all and suggests the 4 season-cycle of the year."},{"t":"p","x":"At the centre, where the 4 elements meet, a point of cohesion is naturally created. This fifth point can represent the 5th element, Akasha, which is invisible yet ever present."}]},{"id":"v1-c10","vol":"I","title":"Chapter 10 · Additional Attributes (Numbers, Court Cards, Mistakes, Last Words)","body":[{"t":"p","x":"Additional Attributes of Tarot Cards When we study the Minor Arcana Cards along with their additional attributes, the reading becomes extra insightful and more accurate."},{"t":"h","x":"Card Card Attributes"},{"t":"h","x":"Aces Individuality"},{"t":"h","x":"New Beginnings"},{"t":"h","x":"Roots of the Power of the suit"},{"t":"h","x":"Will power"},{"t":"h","x":"Spark and chemistry"},{"t":"h","x":"Seeds"},{"t":"h","x":"Ideation"},{"t":"h","x":"Stamina and energy"},{"t":"h","x":"2s Twos Peace"},{"t":"h","x":"Cooperation"},{"t":"h","x":"Duality"},{"t":"h","x":"Partnership"},{"t":"h","x":"Union"},{"t":"h","x":"Synergy"},{"t":"h","x":"Marriage or Love Proposal"},{"t":"h","x":"Collaboration"},{"t":"h","x":"Choice"},{"t":"h","x":"Dilemma"},{"t":"h","x":"Additional"},{"t":"h","x":"Attributes"},{"t":"h","x":"Chapter-10"},{"t":"h","x":"Card Card Attributes"},{"t":"h","x":"Decisions"},{"t":"h","x":"Complementary energies pledging"},{"t":"h","x":"commitment"},{"t":"h","x":"3s Threes Growth & Expansion"},{"t":"h","x":"Travel"},{"t":"h","x":"Success in Business/Profession"},{"t":"h","x":"Leadership"},{"t":"h","x":"Self expression"},{"t":"h","x":"Abundance"},{"t":"h","x":"Networking and Advertising"},{"t":"h","x":"Creating and Planning"},{"t":"h","x":"Celebrations"},{"t":"h","x":"Prosperity"},{"t":"h","x":"Sorrow and emotional realizations"},{"t":"p","x":"4s Fours Solidarity and Consolidation Mercy, Retreat to safety Stability and Security Rest and rejuvenation Stagnation Holding on to Status quo Possessiveness Reflection & Introspection 5s Fives Competition Scarce Resources Adjustments Moulding the behaviour Adapting to change Freedom Change Card Card Attributes Strife and resultant need for harmony Challenges Communication 6s Sixes Service attitude Harmony Balance Success and felicitations Contentment Symmetry Generosity Balanced flow of energy Calm after the storm Rewards and Creativity Steady Motion Responsibility and Empathy towards others Satisfaction 7s Sevens Wisdom Inner world contemplation Detachment Challenges Ingenuity and mental games Flexibility Experimentation Indecision and Fantasies Too many options Flights of Imagination 8s Eights Power and authority Self directed movement Resilience Peak of ability and skills Card Card Attributes Organizing & Prioritizing Maturity Order Structure 9s Nines Compassion Altruism Abundance Accumulation Living in the Present moment Completion Endings Preparing for next cycle Integration Flow 10s Tens Worldly manifestations Endings Transitions Painful achievements Perfection Full expression of an element Complacency Hesitations and Resistance Culmination Court Cards 11s Pages Pages generally represent youngsters and adolescents. May be immature by nature or in early stages of suit evolution. Pages are messangers and carry the raw, pure energy of the suit in initial stages of opportunity."},{"t":"p","x":"Page often appears when you are on the threshold of new idea/passion (Wands); new feeling (Cups); New way of thinking(Swords) or a new activity of value (Pentacles). Pages indicate beginnings & Genesis."},{"t":"h","x":"12s Knights"},{"t":"p","x":"Represent people, situations advice or environment based on elemental energy of suit they represent. Knight is the fiery aspect of the suit. It indicates executive and decision making ability."},{"t":"p","x":"Key attributes of a knight are planning; vision, passion, courage, ability to take risk and bring to manifestation, the germinal idea origanted by the page."},{"t":"h","x":"13s Queens"},{"t":"p","x":"The Queens represent the mature energy of the suit they represent."},{"t":"p","x":"The Queen is the ultimate Yin aspect - receptive, creative, nurturing."},{"t":"p","x":"The Queen's focus is inward without comprimising on her natural instinct to birth and nurturem, she manages and protects and keeps the universe running in immaculate orderliness. She also deals with relationships and emotions in a balanced and way. The Queen represents the subtle undercurrent of the suit represented."},{"t":"h","x":"14s Kings"},{"t":"p","x":"The Kings are the masculine, extroverted energy of the suit they represent. They are the builders and the keepers. The full essence of the suit explodes in the Kingly metaphor. Focus is on getting things done and signifies leadership, authority, action, clarity and perception. Kings represent success & prosperity and motivate the followers to reach the pinnacle of their potential. Kings are victorious and undeniably powerful. Top 3 Tarot Mistakes Beginners Make :"},{"t":"h","x":"1. Doing Spreads that are too big"},{"t":"p","x":"Solution: Ask a specific question or an area of your life you want to ask about. Do a simple spread. Learn to master the interplay of the cards by connecting the individual connotations of each card but unified with each other and against the context of a particular question or life area."},{"t":"p","x":"3 card and 5 card spreads are best to start mastering the Tarot with. Tarot journey is long and you can always incorporate bigger spreads later on. Remember SIMPLICITY is the key to MASTERY."},{"t":"p","x":"2. Doing Card Reversals in the early stages of your Tarot Practice."},{"t":"p","x":"Solution:"},{"t":"p","x":"The Tarot journey is like immersing in a sadhana. Its not merely sufficient to learn the key words and triggers of each of the cards. That is like learning the letters of the Alphabet. It is essential but the primary / junior stage of your learning cycle. You must gain mastery of subsequent steps in order to write sentences and stories with the Tarot cards. The next integral step is to lay out various spreads and be able to intuitively and with deep knowledge understand the interplay of the various cards in relation to each other and also to make an intelligent interpretation in the context of the question asked."},{"t":"p","x":"This is a complex step as each time a different spread will come and cards will connect with each other differently. The more you practise with variety of questions, the more your experience will increase."},{"t":"h","x":"The Last Word"},{"t":"p","x":"Tarot is a sacred discipline of divination and spreading love and light in the world. It carries a divine power. Respect it. Revere it. Respect yourself for having become one of the chosen ones to heal and help. Take it step wise and once you master a step, then proceed to the next step. That is the secret of all mastery in this world."},{"t":"p","x":"Learn the building blocks first and then you will automatically be able to play complex games like card reversals with your cards. You should internalize them upright first. And do it with a clear heart and mind. 3. Laying out spreads without positioning clarity In their enthusiasm, the Novices are in a hurry to become Adepts. They make the mistake of taking up big spreads with no clear positionings. The meanings in this manner will become abstract and no conclusive predictions or guidance may be available. Do take care to start your journey with Single card or Choice Spread of 3 or 5 card spreads. Later on, as your comfort level with the dynamic flow of energy embedded in the Tarot spread increases, you may go in for elaborate spreads and more complex art work decks."}]},{"id":"v2-front","vol":"II","title":"Vol II · Front matter, authors & contents","body":[{"t":"h","x":"Tarot Remedies"},{"t":"h","x":"& Healing"},{"t":"h","x":"Judgement & Correction of"},{"t":"h","x":"Planetary power by Tarot"},{"t":"h","x":"Vol-II"},{"t":"h","x":"Editor Author"},{"t":"h","x":"Dr. Arun"},{"t":"h","x":"Bansal"},{"t":"h","x":"Rrachita Gupta"},{"t":"p","x":"'Ravera'"},{"t":"p","x":"This journey is dedicated to Lord Mahadev, Maa Kaali & the Archangels of Healing © All India Federation of Astrologers Society ® Second Edition : November 2024 Written specially for the Courses of Studies of the Federation Publisher:"},{"t":"p","x":"All India Federation of Astrologers Society ® A-3, Ring Road, South Ex Part-1, New Delhi-49 Ph: 40541000, 40541020 Email: mail@aifas.com, Web: www.aifas.com Printer :"},{"t":"p","x":"Future Point Pvt. Ltd."},{"t":"p","x":"Flagship Store : A-3, Ring Road, South Extn Part-I, New Delhi-110049 Branch Office : B-237, Sector 26, Noida (U.P)- 201301 Ph: 40541000, 40541020 Email: mail@aifas.com, Web: www.aifas.com Price :` 700/- Tarot Remedies & Healing Editor Author Dr. Arun Bansal Rrachita Gupta Ravera About the Editor Dr. Arun Bansal Chairman All India Federation Of Astrologers Society Chief Editor Future Samachar & Research Journal of Astrology Dr. Arun Bansal, aged 60, is the Chairman of Future Point. He was born and brought up in Delhi. Besides doing M.Sc. in Physics from Delhi University, he also did M.Phil and research in computer science from Jawahar Lal Nehru University, Delhi. His knowledge of Astrology and computer science inspired him to develop the first ever program on Astrology in 1981, when computers were not so popular in India."},{"t":"p","x":"He started organization Future Point (P) Ltd. in 1985 and developed the most popular programs in the name of Leo-1, Leo-99, Leo Gold, Leo Star, Leo Star Expert, Leo Star Professional, Leo Touch based on various systems of Astrology like Parashar, Jaimini, Tajik and K.P. He has introduced his astrological software on Palm Organizer and Android based mobiles. He has a research dominated thinking. By conducting various surveys on astrological groups, he has tried to prove that planets behave in a special manner at a particular angle or in influence of other planets. He has developed a highly accurate software to predict rain forecasting, share market, commodity market & money markets based on the last market values & planetary position. He has also developed programs to accurately suggest about matching, profession or illness. In the face of all he stands tall in the portals of astrology, commanding respect and recognition at various levels. His great ambition is to disseminate knowledge of Indian Vedic sciences all over the world. He has successfully organized international seminars on astrology in Mauritius, Singapore, Dubai, South Africa, Netherlands etc. between 2001 and 2016. Mr. Bansal is the President of \"All India Federation of Astrologers Society\", the largest Indian Federation teaching Astrology, Palmistry, Numerology and Vastu in over 100 cities of India. He is also the publisher and Chief Editor of popular astrological magazines \"Future Samachar\" and \"Research Journal of Astrology\"."},{"t":"p","x":"He has written and published many books on astrology. He is a hot favourite of those who seek consultancy in astrology as he has gained limitless clout by way of his uncanny predictions & interpretations."},{"t":"p","x":"Mr. Bansal has given a new direction to the divine science of Astrology and has created awareness amongst the masses towards this science. We hope that the new reseaches performed under his guidance will give a new dimension to Astrology and other occult sciences which will enable the astrologers to make accurate predictions."},{"t":"h","x":"About the Author"},{"t":"h","x":"Ach. Rrachita Gupta"},{"t":"p","x":"Gold Medalist MBA, M.A (Economics), Jyotish Rishi, Tarot Diva Faculty- AIFAS, Life Coach - Astrology, Tarot, Numerology Astrologer Rrachita Gupta (Winner of Tarot Diva Award), is an internationally acclaimed and globally travelled Life- Coach through Mystical Sciences. She is a gold medalist in M.B.A. from Delhi, India and M.A. (Economics) from Delhi University. She is a Consulting Vedic/K.P. Astrologer, Tarot Card Therapist, Numerologist, VastuShastri & Reiki Master. Contributing currently as Tarot Coach and Lecturer with All India Federation of Astrologers Socieity(AIFAS). She has been bestowed with the TAROT DIVA award by Bharat Nirman(GOI)for her unique work in\"Astrological Perspectives into Tarot”"},{"t":"p","x":"She studied deeply and holds accreditions in Jyotish Rishi, Krishnamurthy Padhati Astrology, Ank Shastracharya(Numerology), Vaastu Shastracharya, Tarot Reading and Counselling, Runes, Angel cards and Angel Therapy (certified by Doreen Virtue U.S.A.), Chakra Healing and Dowsing, Vastu Shastra. During her Schooling from Convent of Jesus & Mary, Delhi and graduation days at Lady Shri Ram College, Delhi she started predicting accurately with Horoscopes and zodiac signs. She was awarded the title of\"Divine Counselor with a Rational Mind” as her methodology combines the traditional wisdom with challenges of the modern global world."},{"t":"p","x":"Acharya Rrachita possesses rich corporate experience in India and overseas with a special focus on Mentoring, Training and Psychological Coaching. Her 10-year stay in Europe and Pan - Asia has given her the special skills to deal with multi-cultural temperaments and special training in Feng Shui (Taiwan) and Energy Healing. As Corporate HR of MNC companies, she learnt the analogy that goes behind the human mind and how the psyche works. She is an expert when it comes to behavioural management and reading minds."},{"t":"p","x":"She gives detailed and effective solutions through mantras, Spells, Candle rituals, Crystals, Color therapy, Tarot rituals, Aromatherapy, Vedic traditional solutions, name balancing, affirmations, Chakra meditations, Reiki healing and several other modalities she has developed a strong connection with. She has conducted workshops in esoteric subjects of Osho\u0002Zen Tarot, Angel Realm Therapy, Chakras and Meditation, Visualisations and Success among others."},{"t":"p","x":"Always an exemplary student, she has been a consistent writer and her works have been published in online journals, social media and other publications like Future Samachar, Ravishing, Life Positive. She has a Youtube channel with a healthy viewership and also contributes regularly on her Facebook group Being a firm believer in Laws of Universal Energy and the Power of Self Healing and Meditation, she advocates that the various divination sciences are inter-related and must be used in synergy with each other to understand the problems of the querist who comes to seek an answer and provide him/ her high quality and sincere guidance. She has a list of repeat clientele from around the world who respect her for accurate predictions and empathetic life-coaching and she also conducts sessions, workshops and healing programs regularly. Table of Contents Chap. 1 Tarot as a Psychological GPS : To Make your Life Precious 1 When Silence Speaks - Rrachita Gupta 1 Chap. 2 Tarot Reversal : Tarot & Reversed Cards in a Spread 5 Chap. 3 Comprehensive List of the 78 Tarot Cards (Reversed)"},{"t":"h","x":"9"},{"t":"p","x":"Chap. 4 Directionality in the Cards 25 1. Facing Each Other-Collaborative 25 2. Facing Each Other-Confrontation 26 3. Facing Away from Each other 27 4. Figure Facing Straight 28 Chap. 5 Astrological Association of Tarot 30 Linkage, with Zodiac Signs, Planets , Houses of Horoscope)"},{"t":"h","x":"30"},{"t":"h","x":"What Makes Tarot Cards Reading A"},{"t":"p","x":"Popular System of Prediction and Life Guidance ?"},{"t":"h","x":"34"},{"t":"p","x":"Destiny vs Free Will - Tarot as a Tool to control Emotions and Action 36 Types of Karma - Learning our Life Lession 37 Your Zodiac Sign & Finding your Soul Purpose 39 Using Gems to strengthen Soul Purpose 41 Triplicity of Zodiac Signs & Minor Arcana (Tattva- Air, Water, Earth, Fire)"},{"t":"h","x":"43"},{"t":"p","x":"Chap. 6 Astrologic
