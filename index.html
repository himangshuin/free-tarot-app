nturine Blue sapphire 11 Justice Bloodstone, Jade, Carnelian Emerald, Opal 12 The Hanged Man Beryl, Ametrine, Sodalite Blue Sapphire, Blue hakik 13 Death Bloodstone, Amber 14 Temperance Amethyst, Kunzite, Sardonyx Opal, diamond Card No Card Name Associated Crystals Associated Precious Gem 15 The Devil Obsidian, amethyst, jet stone Moonstone, White Coral 16 The Tower Chrysocolla, Obsidian Ruby, garnet 17 The Star Sugilite, Moldavite, Turquoise Red Coral 18 The Moon Moonstone, Selenite White Sapphire 19 The Sun Sunstone, Amber Ruby, Diamond 20 Judgement Malachite, Fluorite Cat’s eye 21 The World Onyx, Unakite Opal"}]},{"id":"v2-c12","vol":"II","title":"Chapter 12 · Mantras as Remedy","body":[{"t":"h","x":"Mantras as"},{"t":"h","x":"Remedy"},{"t":"h","x":"Chapter-12"},{"t":"p","x":"“If you want to find the secrets of the Universe, think in terms of Energy, Frequency and Vibration……”"},{"t":"h","x":"Nikola Tesla"},{"t":"p","x":"What Is A Mantra ?"},{"t":"p","x":"To harness the Universal energy as given in quote above we must understand power of Mantra. To reach the meditative state, concentration is required first. A scattered, distracted, and inattentive mind cannot truly meditate, even if one sits silently for long periods of time. As the Yoga Sutras teach us, one must first develop the one-pointed mind (ekagra chitta) in order to reach state in which the mind is dissolved into higher awareness (niruddha chitta)."},{"t":"p","x":"There are numerous tools of concentration taught in Yoga and Vedanta. These can be divided into two groups, first those using light and perception, and second those using sound and mantra."},{"t":"p","x":"Mantras are the Primal Sounds. This second group of concentration methods emphasizes mantra or Mantra Yoga, particularly the chanting of seed syllables or bija mantras starting with Om. These concentrated sounds project a single consistent sound vibration through which the mind can be easily concentrated. Generally the mantric approach is more important as our minds are engaged inwardly in sounds and words. It is sound in the form of words that serves to store and carry the information and experience that we gain through perception."},{"t":"p","x":"As one repeats the mantra, the vibration of the mantra will gradually enter into the deeper mind, reaching into the samskaras or karmic patterns at the base of the subconscious. Here we should remember the example of a singer who by holding a single high note can break a glass. The light of the mantra can illumine even the deepest darkest portions of the subconscious mind, releasing any blocked energy within it. The development of concentration through mantra is one of the best tools of psychological healing. It can help break up deep-seated habits, addictions, and traumas, releasing the mental energy and prana trapped within them. It helps dissolve negative emotional patterns, even those forgotten by the conscious mind. It does not require that we analyze the unconscious, relive our traumas, or dig up old memories. The mantra changes the energetic structure of the mind, so that such negative patterns have no place to develop or remain. To achieve this power of attention and concentration requires discipline, effort and practice. Our power of attention is like a muscle and can only grow slowly and incrementally in strength over time. We need patience in developing it like cultivating a garden. Yet if we persist, in a period of a few months, major differences can be seen, and the nature of the mental field can be considerably altered within a few years of steady practice. The greatest Vedic masters, revolutionaries of the spirit, saw mantric prayer, especially spoken mantric prayer, as one of the chief instruments of change. When we use mantras, we are in effect commanding the flow of energy from Spirit to matter. We are entering into a partnership and an interactive relationship with God Using Mantra with Tarot Knowledge “Touch your inner space, which is nothingness, as silent and empty as the sky; it is your inner sky. Once you settle down in your inner sky, you have come home, and a great maturity arises in your actions, in your behavior. Then whatever you do has grace in it. Then whatever you do is a poetry in itself. You live poetry; your walking becomes dancing, your silence becomes music.”"},{"t":"p","x":"Mantras for Planet appropriation. These may be :"},{"t":"p","x":" Recommended for various life aspects after deep analysis of the situation/problem the querist is facing and the remedy has been revealed by the Tarot spread."},{"t":"p","x":" It may also be recommended as per the blockage or healing needed for a specific chakra as evidenced by the Chakra Spread. Each chakra or energy wheel resonates and is under the lordship of a particular planet."},{"t":"h","x":"Chakra Planet/Deity"},{"t":"h","x":"Root /Muladhara Mars"},{"t":"h","x":"Sacral/Swadisthana Mercury"},{"t":"h","x":"Solar Plexus/Manipura Sun"},{"t":"h","x":"Heart/Anahata Venus"},{"t":"h","x":"Throat/Vishuddha Jupiter"},{"t":"h","x":"3Rd Eye/Ajna Saturn"},{"t":"h","x":"Crown/Sahasrara Ketu"},{"t":"p","x":"Mantras for the Planets : Beej Mantra The Beej Mantra is the shortest form of a mantra, just like the beej (seed) which can attain exponential growth when nurtured and repeated over a time period."},{"t":"p","x":"Beej mantra of a specific planet or deity when repeated multiple number of times propitiate the Divine forces and provide wish fulfillment and minimising of loss/pain. They are the vibration and represent the “ call of the soul”. At the time of the creation of the Universe, the beej mantra was produced and due to the sound vibrations produced, the spirit started aligning in particular molecular structure and gave rise to Matter, animate and inanimate. The Humans, animals. Plants, landforms all are created out of sound form that is as fundamental as the Seed."},{"t":"p","x":"Mantra jaap when done along with authentically made and consecrated Yantras are enhanced in the good results they can invite."},{"t":"p","x":"Beej mantras typically contain upto 9 words, ten or twenty words are called mantras and beyond that are referred to as mahamantras."},{"t":"p","x":"The Tantric mantras for various planets are given below. They can be chanted by any native in a pattern of 108 repetitions at one time."},{"t":"h","x":"Planet Mantra"},{"t":"p","x":"Sun Om Hraang Hreeng Hraung Sah Suryaay Namah Moon Om Shraang Shring Shraung Sah Chandramase Namah Mars Om Kraang Kreeng Kraung Sah Bhaumaay Namah Mercury Om Brang Breeng Broung Sah Budhay Namah Jupiter Om Graang Greeng Graung Sah Gurave Namah Venus Om Draang Dreeng Draung Sah Shukray Namah Saturn Om Praang Preeng Praung Sah Shanaishcharay Namah Rahu Om Bhraang Bhreeng Bhraung Sah Rahuve Namah Ketu Om Shraang Shreeng Shraung Sah Ketawe Namah"}]},{"id":"v2-c13","vol":"II","title":"Chapter 13 · Gomti Chakra as Remedy","body":[{"t":"h","x":"Gomti Chakra as"},{"t":"h","x":"Remedies"},{"t":"h","x":"Chapter-13"},{"t":"p","x":" As per ancient belief of Hindu tradition, those who possess Gomti chakra will be blessed with good health and prosperity. Gomti Chakra is a divine spiritual opercula found in the Gomti River and other sacred river of India. The word Chakra is from the Sanskrit, meaning \"wheel\".  It protects children against evil eye and keeps them healthy and shielded."},{"t":"p","x":" It helps to alleviate old and lingering diseases. Being from the bed of the river, it has regenerative properties.  Provider of Name, fame and social prestige as it enhances aura and good karma of the wearer  Being a significator of Goddess Lakshmi the person who possesses Gomti chakra or keeps the sacred tree of gomti chakra near bedside or on working table, is blessed with financial opportunities and wealth."},{"t":"p","x":" Bestows confidence and charisma to the person wearing it on his/her person."},{"t":"p","x":" Works on sharpening the Focus and is very beneficial for children who have attention and concentration deficit problem."},{"t":"p","x":" For business people, wearing a bracelet or a necklace of 11 or 15 gomti chakra brings financial growth and good reputation among clients/customers."},{"t":"p","x":" Restores peace of mind and induces a state of relaxation.  Overall excellent and economical remedy for all round wellness and prosperity. One or more items of gomti chakra must be an integral part of your spiritual kit. Gomti Chakra Benefits Available As “  Gomti Chakra Tree  Bracelet  Pendant  Ring"}]},{"id":"v2-c14","vol":"II","title":"Chapter 14 · Kaballah (Qabalah) & Tarot","body":[{"t":"h","x":"Kaballah Mystical"},{"t":"h","x":"System & Tarot"},{"t":"h","x":"Chapter-14"},{"t":"p","x":"Tarot And The Tree of Life In Kaballah Mystical System The mystic arm of Judaism is called Kabbalah or Qabalah. Its a pictorial representation of the Sacred Philosophy of Life and is encapsulated in the Tree of Life Once the Tree of Life and its teachings were the secretly maintained prerogative of the Rabbi(Judaism prophets), but non Jewish Hermetic thinkers found much in Qabalah akin to soul journey of humans and began to reshape it."},{"t":"p","x":"Its country of origin is Israel. It is ingrained in almost every emotional and non-emotional transaction of that domicile. The hotel reception will have a board with word “Kabbalah” written in large letters.If a guest is invited to a reception, the Hebrew term for the event is “kabbalat panim”. Every teacher/professor is obligated to dedicate few hours to “sheat kabbalah” means door is open for those hours to receiving the students. The word “kbl” is present in almost every sentence of Hebrew and literally translates to mean - “ to receive”, to be receptive. The Journey of Life has also been described by the Buddhist Wheel of Life but Buddhism has never been a persecuted belief system; it never had the historical opportunity to conceal its teachings for safety reasons."},{"t":"p","x":"Mystical Judaism has often been persecuted; it needed to encrypt its metaphysical and esoteric meanings in pictorial representation that could be used as a coded language and was not understood by the persecutors."},{"t":"p","x":"The Rabbis call Qabalah the Bridge of human mind to cross over to meet the Divine. Its a field deeply connected with human daily life and can be integrated very well in mundane matters."},{"t":"p","x":"If we ask ourselves what is the meaning of our lives, these numbered years full of struggle give us not much of an echo of an answer. Qabalah is one sound answer. It tells us that Taste and See the Goodness of the Lord; The Lord is absolutely kind and created It all for our benefit; and gave us Qabalah to attain it."},{"t":"p","x":"You will feel the Goodness while living here in this World. Qabalah urges us to choose Goodness, not Death(a bitter and meaningless existence)."},{"t":"p","x":"Qabalah urges us to Choose."},{"t":"p","x":"Which means we are given a Choice."},{"t":"p","x":"The More Aware we are, the more we can Choose discerningly and thus create our own Destiny."},{"t":"p","x":"Choice pertains only to choosing between 2 paths available to us to take us to the preordained goal."},{"t":"p","x":"One is the route of Spiritual Gains and the other route is of suffering."},{"t":"p","x":"The final goal is to Eradicate Egoism and to acquire a nature of Love and Generosity."},{"t":"p","x":"The Torah is the first part of the Jewish bible. It is the central and most important document of Judaism and has been used by Jews through the ages. Torah refers to the five books of Moses which are known in Hebrew as Chameesha Choomshey Torah. The Torah is the ancient scripture we see so famously and easily identifiable symbol featured in Major Arcana cards of The High Priestess and the Wheel of Fortune Cards."},{"t":"p","x":"According to the Torah’s laws of ritual purity, Levitical purity is a prerequisite for entering God’s presence. Psalm 24 brings that ritual-purity symbolism into the moral sphere. In Psalm 24, the man with “clean hands and a pure heart” is a man of integrity. The journey along the Tree of Life is a process of gradual purification, wherein our lower energies go through strife and Self constraint."},{"t":"p","x":"In this process of Self Continence wherein one’s soul struggles against the temptations and the weaknesses of the environment and of Within, there is the emergence of the Inner Strength. By containing one’s impulses, all the energies misdirected within us begin to Release and Rise."},{"t":"p","x":"This light gets transmuted into our higher chakras enabling us to have a higher, deeper and a more enlightened understanding of the Cosmic laws governing us."},{"t":"p","x":"The Lower self will begin to merge into our higher self and ultimately the divine and the human soul shall merge. How is this to be achieved? One is an austere path where even the basic comforts of life are to be renounced. One must sleep on the ground and consume only bread and water. This shall grant contentment in this world and also the Next. This is a strict method and can be followed only by a selected few seekers of the highest order."},{"t":"p","x":"However Qabalah is a universally applicable mode of living a Higher Life and that’s the exact reason why we should co-relate with another Way of Life that makes us live a life of Choices aligned with our Higher Self and that is the Tarot System. The Light of the Qabalah illuminates the soul and directs us in the right direction. So through judicious use of Heart and Mind we attain the higher goal, and not through physical suffering. The correspondences and deep linkages between the ancient Qabalah system and the equally secretive and esoteric system of Tarot were researched by scholars Court de Gebelin and later by Eliphas Levi."},{"t":"p","x":"By their magical work of interlinking the two Tarot came to be appreciated as a Spiritual Art."},{"t":"p","x":"Tarot became the spiritual journey of an individual through various stages of soul evolution. It became an ART in that each soul contained in the human vessel was subjected to various experiential awakenings. It was different experience for each individual and no two soul experiences were alike. It was Creative Self Expression of the highest order. It was Art and it was Divine."},{"t":"p","x":"Tarot and Qabalah have deep roots that marry them to each other in a merry cosmic dance."},{"t":"p","x":" The Tarot has 22 Major Arcana Cards and the Hebrew Language (the primary communication language of the Qabalah form) has 22 letters in its Alphabet."},{"t":"p","x":" The Tree of Life contains its wisdom as 10 emanations individually called Sephirah and collectively called Sephiroth. These are the 10 Transit Points the human journey goes through in its lifetime and the soul goes through Metaphorically as it advances along its Divine Journey across the continuum of Time and Space."},{"t":"p","x":"The Tarot has its corollary, the 10 numbered cards in each suit\u0002Wands(1 Ace-10). Pentacles (1 Ace-10), Cups/Chalices (1 Ace -10), Swords (1-Ace-10)."},{"t":"p","x":" The foundation of all mystical knowledge is the human being in natural synchronicity with the Elements constituting the Cosmos and into which all energy dissipates and mutates. The Qabalah Tree of Life represents the 4 elements of Earth, Air, Fire and Water using the 4 Sacred Letters called YOD, HE, VAU and a second HE. Taken together, these letters take the most Holy Name of God."},{"t":"p","x":"The Tarot represents the 4 elements as the 4 suits in the form of Earth element - Pentacles Suit Air element - Swords Suit Fire element - Wands Suit Water element - Cups Suit The Tree of Life - TOL is a road map. The 10 Sephiroth together constitute the unfolding Creation. They show the Beginning and the End."},{"t":"p","x":" Like the Aces in Tarot show Initiations and New Beginnings, the 1st Sephirah in Tree of Life is the Kether. It represents the Divine Source of all things."},{"t":"p","x":" Like the 10s in Tarot represent completions and Fulfillment, the 10th Sephirah in Tree of Life is the Malkuth. It represents the Final Outcome of the Journey/Concrete Results. If we examine the Aces in the Tarot, we see in every case a similar image. We see the hand of God, a huge oversized hand coming out of the clouds and making a divine offering of opportunity to the one who is ready to Receive."},{"t":"p","x":"The hand is aglow with a surreal white or golden halo. What is the hand doing? It is offering a Gift."},{"t":"p","x":"In Hebrew, Qaballah means “To Receive”. The Aces signify the Giving and the Universe is doing the Receiving. They give us the gift of Pentacles, of cups, of swords, and of wands. In 1856, Alphonse Louis Constant, known as Eliphas Levi, published the first book to associate the twenty two cards of the Major Arcana with the twenty two letters of the Hebrew Alphabet and the four suits of the Minor Arcana with the Tetragrammaton- the four letter name of God."},{"t":"p","x":"In 1889, Gerard Encausse, a student of Levi known as Papus, published the “Tarot of the Bohemians”, which stipulates that the Tarot was generated by the Tetragrammaton and is to be interpreted in reference to it."},{"t":"p","x":"Also in 1889, Oswald Wirth published a deck of Major Arcana whose twenty two designs incorporated the twenty two Hebrew letters."},{"t":"p","x":"The connection between Qaballah and Tarot continued to be strengthened in the execution of decks by advocates such as Alistair Crowley, Paul Foster Case and Manley Hall. Arthur Edward Waite, a member of the Hermetic Order of the Golden Dawn, assigned Hebrew letters to the cards in his writings."},{"t":"p","x":"The Golden Dawn Deck associates the ten Sephiroth(Sefirot), or vessels to the ten numbered cards, and the four Olams, or realms, with the suits of the Minor Arcana. Alistair Crowley, in the “Book of Thoth” describes the Tarot as a “practical instrument for Qabalistic calculations.”"},{"t":"p","x":"By 1890, Qaballistic teaching was integral to Tarot design. The linkages of two disciplines is rooted and authentic. Qaballah is essentially the interplay of Man’s Relationship with his God. God does the Giving and Man does the Receiving, moderated by the laws of the Universe."},{"t":"p","x":"The Tree of Life and the 22 Major Arcana Cards The Tree of Life spans out into the Mystical tree and is a source of Meditation and Atma Bodha (Enlightenment) for scores of mystical devotees across the world."},{"t":"p","x":"Its beautiful spiritual renditions are very popular and revered all across Central Asia and Middle East. Its worship and meditation is considered a sacred tradition and thought to bring about Divinity in the daily mundane affairs of Mankind too. People of Asia consider Spirituality and Daily Life as intertwined. Scores of Households give it a place of sanctity and hang or place the Tree of Life in their altar as a constant reminder to follow the Way of Divine and strive to be truthful and honest to their soul purpose; Align their thoughts and behaviours with the Tree of Life that constantly encourages us to improve our lives, imbibe more knowledge and aim higher towards final Truth. That’s the way Hinduism in South Asia, Buddhism in Far East Asia and Qabalah in Central Asia lay down the tenets of how to lead the normal life as a salutation to the Divine. We believe God to be in everything - animate and inanimate and bow down to the Divinity present in each of us. Striking examples are “Namaste” in India and “Ohayo Gozaimasu” in Japan (where the greeter bows down reverentially in front of the greeted). Qabalah is a WAY of Life, mingling the touch of the Divinity with the commonest of activities as a work of serving God. The Wisdom of Kabbalah consists of 2 parts:"},{"t":"p","x":"1. The Secret oral tradition which was mostly concealed and has not been described 2. The Revealed Part which was also documented in many books One should study the Revealed part because attaining the Goal solely depends on it."},{"t":"p","x":"“ Let us make Man in our own Image “ - Genesis 1:26 Man was thus created as a prototype of divine attributes. These spiritual attributes were 10 in number through which Man operates. They translated into the physical human anatomy. These are the 10 Sephirah ( individually termed as Sephiroth) which formulates the Tree of Life. The 10 mystical emanations of the sacred Tree of Life."},{"t":"h","x":"sacred Tree of Life"},{"t":"h","x":"sacred Tree of Life"},{"t":"p","x":" Kether - Crown - the initial seed of an idea, flash of undeveloped and raw inspiration. It enables us to be spiritual, enterprising and transcendental."},{"t":"p","x":" Chokmah - Wisdom - enables us to be organized and logical. It enables us to be imaginative and generate ideas and then analyse them."},{"t":"p","x":" Binah- Understanding - Gives us the power to concentrate. Where we concentrate, that element grows as it imbibes our energy. Here our idea becomes more mature and personally meaningful."},{"t":"p","x":" Chesed - Mercy - This is the Power to Love and to look at others with understanding and compassion. It enhances our sociability and optimism skills."},{"t":"p","x":" Gevurah- Severity - This Sephiroth enables us to be disciplined and restrained. Calculate the risks and be cautious of our actions. Seriously analyse the consequences."},{"t":"p","x":" Tiphareth- Beauty - This teaches us the power of beauty and harmony in the world. To combine kindness with strictness. Balance and Empathy are the attributes to be learned at this stage."},{"t":"p","x":" Netzach - Victory - is the power of Determination to overcome obstacles and challenges. Enables us to be persistent and forceful."},{"t":"p","x":" Hod - Splendour - imparts us the power of Humility and submitting to a higher cause, It teaches us the power of Gratitude for whatever we have and to be accommodating around it and further pursue our Path to Fulfillment."},{"t":"p","x":" Yesod - Foundation - the power to focus on others and to build authentic and long lasting relationships. Selflessness is the key attribute at this stage. We have received aplenty at this stage and must learn to forge genuine relationships for mutual give and take or even to just give selflessly and altruistically."},{"t":"p","x":" Malkuth - Kingdom - Its the attribute of effective leadership and being a top notch communicator - written and oral. It propels us to Lead and Achieve."},{"t":"p","x":"The 10 Sephiroth carry the attributes of the numbered cards. The first Sephirah, the Kether carriees the raw energy, unmanifest, neither male nor female of the ACES. Similarly with the other numbered units. Below is a table with the numbered family of the Tarot Cards along with corresponding Sephirah, the ruling Planet and the associated anatomical body part."},{"t":"p","x":"Sephirah - Planet & the associated anatomical body part Sephirah Card/ Numbered Family of Tarot Planetary Association Body Part Kether Aces Entire Cosmoc Crown of head Chokmah Twos All 12 signs of zodiac Right temple Binah Threes Saturn Left temple Chesed Fours Jupiter Right shoulder Gevureh Fives Mars Left shoulder Tiphereth Sixes Sun Heart Netzach Sevens Venus Top of right hip Hod Eights Mercury Top of left hip Yesod Nines Moon Axis between base of spine & genitals Malkuth Tens Earth Soles of feet The soul purpose tarot spread through Qaballah/Kaballah tells us the journey of the individual in the current context and what best path to traverse on the Path of Life to reach the point of this birth’s self actualisation ( highest potential point) The 22 Major Arcana Cards and the interconnecting Two Virtues Table Major Arcana Card Virtue One Virtue Two The Fool Crown Wisdom The Magician Crown Understanding The High Priestess Crown Beauty The Empress Wisdom Understanding The Emperor Wisdom Beauty The Lovers Understanding Beauty The Chariot Understanding Severity Strength Mercy Severity Major Arcana Card Virtue One Virtue Two The Hermit Mercy Beauty Wheel Of Fortune Mercy Victory Justice Severity Beauty The Hanged Man Severity Splendour Death Beauty Victory Temperance Beauty Foundation The Devil Beauty Splendour The Tower Victory Splendour The Star Victory Foundation The Moon Victory Kingdom The Sun Splendour Foundation Judgement Splendour Kingdom The World Foundation Kingdom The soul purpose spread along the tree of life by Qaballah This is a 6 Card Tarot Spread especially designed to understand the Personal Journey along the Soul Route. It examines where you are currently positioned in the Tree of Life, what is your destined path in this lifetime and how best to adopt or let go of personal attributes to reach your highest potential. This Spread is only done with the 22 Major Arcana Cards as there are 22 Life paths that constitute the Tree of Life that symbolises the human evolution journey. Each individual has own destiny, own karmic debts to pay off, own karmic rewards to reap and own karma to settle his karmic account. Each individual will have own soul journey traversing the paths of the Tree of Life. This Spread is very customised and needs to be carried out for each individual/client based on their spiritual understanding of their life purpose. A certain degree of soul purification is required when following the path laid down as counselling after this reading."},{"t":"p","x":"The client should preferably be psychologically mature and possessing a degree of receptivity to the changes that are suggested in their predictable patterns of thinking and doing. Its an excellent tool for Self study and self analysis and aligning your life patterns with your pre-ordained cosmic goals. It will help you to identify which preferred path to take and towards which Sephiroth to navigate your journey."},{"t":"p","x":"Major Arcana Cards Along the Tree of Life Kether Binah Chohkmah Geburah Hesed Hod Netzach Yesod Tipareth Malkuth Major Arcana Cards along the Tree of Life The 6 card spread is as follows:"},{"t":"p","x":"Card 1 : Where am I currently on the Tree of Life? Card 2 : What is the primary challenge I currently face in moving forward on my path on the Tree of Life?"},{"t":"p","x":"Card 3: What is the primary facilitator within me which can be developed to move forward on my path on the Tree of Life? Card 4: What Major Arcana soul lesson do I need to adopt/ imbibe to move forward?"},{"t":"p","x":"Card 5: What Major Arcana soul lesson can I let go of to move forward?"},{"t":"p","x":"Card 6: What is the future goal on my destined path on the TOL?"},{"t":"p","x":"Sample Spread as actually done for a client. The Steps to be followed."},{"t":"p","x":" Shuffle all the 22 Major Arcana Cards  Visualise the Tree of Life and tune into the Universal Consciousness for direction and guidance on your Soul Purpose as per the tenets of the Qaballistic Tree of Life.  Draw 6 cards as per the layout shown in the illustrative picture."},{"t":"h","x":"3"},{"t":"h","x":"2"},{"t":"h","x":"1"},{"t":"h","x":"5"},{"t":"h","x":"4"},{"t":"h","x":"6"},{"t":"h","x":"Kaballah Soul Purpose Spread"},{"t":"p","x":" Interpret the cards as per the positional parameters. The cards that were drawn for a female client. She is self employed and is a spiritual seeker."},{"t":"p","x":"The Tree of Life soul purpose spread read as follows: Card 1 : The Sun Card 2: The World Card 3 : The High Priestess Card 4 : The Hermit Card 5 : Justice Card 6 : Death This can be a deep and philosophical analysis as it contains the microcosm of the existence as present in an individual’s mindscape. The richness of the reader will be influenced by the mutual maturity interplay of the reader and the querist. With each card, study the path of the twin sephiroth it corresponds with."},{"t":"p","x":"An Approach to Analyse :"},{"t":"h","x":"Card"},{"t":"h","x":"No"},{"t":"h","x":"Major Card"},{"t":"h","x":"drawn"},{"t":"h","x":"Going From\u0002Going To"},{"t":"p","x":"(Sephiroth)"},{"t":"h","x":"Positional Meaning"},{"t":"h","x":"1 Sun 8 to 9 Current Situation"},{"t":"h","x":"2 World 9 to 10 Challenge"},{"t":"h","x":"3 High Priestess 1 to 6 Facilitator"},{"t":"h","x":"4 Hermit 4 to 6 Need to adopt"},{"t":"h","x":"5 Justice 5 to 6 Need to Let go"},{"t":"h","x":"6 Death 6 to 7 Future goal"},{"t":"p","x":" Each card may be analysed from the Going from and Going to perspective."},{"t":"p","x":" The Individual meanings of the Card also to be considered deeply in relation to the message carried by the Sephirah it begins from and then culminates into."}]},{"id":"v2-c15","vol":"II","title":"Chapter 15 · The 7 Chakras, Chakra Spread & Healing Grid","body":[{"t":"p","x":"Role of 7 Chakras, The Chakra Spread & the Healing Grid Chapter-15 Tarot is a continual exercise and exploration of Self. It enhances self awareness at an incremental level and gives us tools and techniques to make conscious choices towards our desired goal. Chakras are Psychic centres in the body that are active at all times, in conscious, subconscious and unconscious times. The Chakra spread is a valuable look at how Tarot manages to capture the flow of psychic energy in our physical and etheric body and clearly highlights the blockages or the surplus circulation of energy in the various Chakra points. Before exploring the 7+1 chakra spread, it would be meaningful to understand the gamut of chakra vocabulary, the body parts they govern, the life-aspects they influence and the healing components associated with each Chakra."},{"t":"p","x":"What are Chakras ?"},{"t":"p","x":" Chakra is basically a Sanskrit word meaning Wheel; wheels that spin simultaneously to create a combination of energy and life force.This energy and life force runs from the root base of the body (the Root Chakra), to the crown of the head (the Crown Chakra), and then beyond."},{"t":"p","x":" Chakras “appear” to be spiralling discs of light to someone with clairvoyant tendancies or who has mastered the art of feeling this subtle energy surrounding our physical body.  When the chakras are balanced and spinning at their optimum speed without any effort we have a sense of pure fulfillment. We feel happy and balanced physically, mentally and emotionally. All aspects of our life including health, relationships, achievements, plans, work, sleep, leisure just become effortless and pleasant,  A balanced chakra system can be thought of as refreshing water running down a stream, gently caressing everything it meets, and continuing down its journey with ease, grace, and fluidity."},{"t":"p","x":" When chakras are misaligned or out of balance- they can be either overactive or underactive or what I like to call “clogged wheels”. Life becomes a challenge. It can lead to physical and emotional problems in the individual. This misalignment is not always visible to self or others but if we analyse the situation and go down that person’s psyche the cracks become very evident,  Working on chakras is both interesting and frustrating. A high level of cooperation is required from the person whose chakras need to be balanced else if there is resistance then the problem will persist."},{"t":"p","x":" Basic idea of chakra energy is Flow. Thus flexibility to change constantly and be in balance with the environment by monitoring and fine tuning your life-force centres(chakras) will lead to your physical and emotional well being and help you lead the highest productive life. Crown Chakra Third Eye Chakra Throat Chakra Heart Chakra Solar Plexus Chakra Sacral Chakra Root Chakra Chakras and the Etheric Body? Where Exactly are They Located?"},{"t":"p","x":" The location of chakras in the “Etheric” or “energy body” corresponds directly to placement of the endocrine glands in the physical body."},{"t":"p","x":" The etheric body is an energy body of very fine vibration which totally envelopes the physical body."},{"t":"p","x":" Note that the etheric body and the physical body are interconnected by currents of energy,  The etheric body is also called Sukshma shareer and absorbs the finer levels of energy from the environment and transduces(Transmits in Altered Form) this energy through the Chakras into the physical body via the endocrine glands."},{"t":"p","x":" If chakra system is out of balance, its counterpart, the endocrine system is also out of balance, The endocrine system controls the hormones in our body and thus any chakra misalignment has a powerful effect on the person’s moods and emotions."},{"t":"p","x":" As can be seen from the diagram, each chakra is controlling several organs and certain sections of the nervous system."},{"t":"p","x":" Each chakra corresponds to certain organs, a certain color, crystal, aroma, food items and sound."},{"t":"p","x":" Please understand and appreciate that we cannot touch chakras but they are the invisible battery of our life. the greater its horsepower greater our physical stamina and mental peace. Chakras are powerful because they control us. we will begin learning through this course on how to modify our chakras in our favour so that our life goals are achieved."},{"t":"p","x":"After the flow of the dormant energy coiled in the Muladhara has reached the higher centres, the entire demeanour and attitude of the practitioner changes- he becomes connected to his higher Self. This will require careful maintenance through Mantra Japa and visualisation to maintain this potent and powerful force to keep flowing in the higher centres and also maintain its flow with the Anahata in order that the cosmic energy is harnessed for collective benefit and healing. In the ancient Indian Yogic tradition, the universe is believed to be made up primarily of twin components:"},{"t":"h","x":" Matter"},{"t":"h","x":" Energy"},{"t":"p","x":"Or in simple terms, the Saguna (with attributes) and the Nirguna(without attributes)."},{"t":"p","x":"Matter is treated as the vehicle for energy and Energy is considered to be conscious. This Consciousness, when it becomes manifest, finds a vehicle for itself, which is “Manas” or the Mind."},{"t":"p","x":"The energy flows through our body through the “Nadis”. The word nadi comes the Sanskrit root word “Nad” meaning movement. In the Rigveda, the most ancient of the Hindu scriptures, the word “Nadi” means stream. The concept of Nadi is to be understood in the terms of channels or vessels for transmission of energy. Included in this complex arterial labyrinth of minute energy channels are :"},{"t":"h","x":" Acupuncture meridiens"},{"t":"p","x":" Streams of the cardiovascular system  Lymphatic system streams  Nerves  Muscles  Arteries  Veins  The “manovahini” (the channel of mind)"},{"t":"p","x":" The “chittavahini” (the channel of chitta, of being ) The Shiva Svarodya mentions 72,000 nadis and names 3 principal ones :"},{"t":"h","x":" Ida"},{"t":"h","x":" Pingala"},{"t":"h","x":" Sushumna"},{"t":"p","x":"The Healing aids that are used as part of the Tarot Therapy utilise the energy frequency flowing along these meridians. For this reason, the Precious gem stones, the Crystal Grids, the Crystal beads/wands/clusters act wonderfully for solving the physical, psychological and the energy blockage issues in our Consciousness and lead us to move forward in life with courage and clarity."},{"t":"p","x":"Let us explore the 3 main nadis a bit more closely. 1. Sushumna Nadi This is centrally situated and passes through the meru dand\u0002spinal column. It originates in Muladhara chakra, runs up the body and pierces the talu (palate at the base of the skull) and joins Sahasrara chakra (the thousand petalled lots at top of skull, the plexus of 1000 nadis at the top of the skull). This nadi divided into two branches : anterior and posterior. The anterior branch goes to Ajna chakra, situated in alignment with the twin brows and joins the Brahma Randhra. The passes from behind the skull and joins the Brahma randhra. This hollow space externally is known as the soft spot that is open when a child is born. After 6 months of baby being born, this spot begins to harden and thereafter can be opened only by advanced Yogic practice. In the Shastras, it is said that one who leaves the body from the 10th gate traverses the “path of no return” and achieves liberation from the cycle of birth and death."},{"t":"p","x":"The Sushumna nadi is not time bound. It means that when a yogi or a continual meditator through his meditation severity establishes himself at the midpoint between the Ajna and the Brahma randhra becomes a trikaaldarshi- knower of past, present and Future."},{"t":"p","x":"Tarot is a cosmic medium to look at the past, present and future of a situation and then download the cosmic message and intertwine it with the practicality of daily life counselling. Practising continuous and serious Meditation and understanding of the 5 layers of the CONSCIOUSNESS and the nadi system is essential for understanding and connecting to the vast reservoir of wisdom that can be unleashed through the Tarot cards. Meditation and understanding the Energy system is useful for Tarot pr actioner both for deep analysis of a problem and making future predictions as well as guiding on accurate means to provide Healing and Remedies to address the Energy Body and the Mental Body of the client/querist. Just before death, all human beings breathe the Sushumna breath - whereby both nostrils work simultaneously. In the space outside the meru danda/spinal column, to the left and right are the Ida and Pingala nadis."},{"t":"h","x":"2. Ida Nadi"},{"t":"p","x":"Ida nadi is the left channel. It is the lunar carrier and carries the maternal, purifying and life nourishing energy. It is the feminine nadi. It is called the Ganga of the nadi world due to its cleansing and detoxifying and regenerative attributes. In Svara Yoga, it symbolises the “Left breath” I.e. breath predominantly flowing in and out of the left nostril.When we focus ou breathing on the left nostril breathing, it excites the Ida nadi which originates in the left testicle and ends in the left nostril.Its excitement produces nourishing chemicals that purify the body chemistry, a benefit of which is ease in meditation. When the Tarot spread has an excess of Fire energy, this nadi can be activated by breathing techniques, suitable yantras and mantra jaap and crystals so that the elemental balance is restored in life."},{"t":"p","x":"In Indian Astrology, the Moon(Sanskrit: Chandra) is associated with the psyche. It is said - “ Chan drama mason Fatah” that is, the Moon was born from the Manas of the Virata Purusa (Supreme self)."},{"t":"p","x":"Moon breath mechanism is called Ida breathing. Ida breathing and the clearing of the Ida nadi with the help of remedies is recommended when the pacifying and nourishing and healing qualities are needed to bring about balance in life. Ida nadi is sattvika in character, and by deliberately keeping it operating during the day ( which is dominated by rajasika energy), one can increase sattva. This brings in a balance between the yin and yang energies of Self, one becomes more relaxed and more alert mentally. The anger and agitation dies down gradually and fresh energy is restored to the brain. The sense of perception becomes more embracing and softened, considering multi lateral perspectives. Interestingly, during the ascending moon cycle(Shukla paksha), Ida is naturally dominant for 9 days in a fortnight at the time of sunrise and sunset. For people doing serious meditation and those requiring healing by Moon breathing, these naturally endowed periods must be optimally utilised to align and harmonise the body rhythms with that of the Universe."},{"t":"h","x":"3. Pingala Nadi"},{"t":"p","x":"Pingala is the right channel, located on right side of the Meru dand or spinal column. It is imbued with the carrying of solar currents. Pingala is masculine in nature and a storehouse of destructive energy. Its called the Yamuna of Nadi world, and though this nadi also purifies, but its cleansing technique is fiery. In Svara Yoga the Pingala is recognised as the right breath, that is, breath flowing in and out of the right nostril. Right is male, verbal and rational in character."},{"t":"p","x":"In Tarot, focusing on the Pingala nadi may be recommended as a very practical and effective technique to activate the lacking wands or swords energy. It should be supplemented by chakra crystals to activate the masculine energies, the proactive and courageous combative instincts of the individuals, healing is being given to."},{"t":"p","x":"Surya bhedan pranayama is practised to increase vigor, stamina and vitality of the body. It enhances immunity in medical issues and coupled with solar plexus chakra remedies helps to fight diseases and afflictions."},{"t":"p","x":"The yogic practice of keeping the right nostril open at night, when solar energy is diffused, maintains a balance for healthy organism growth. Right nostril predominance is needed in acts of valour and defence, also in physical jobs, discussions, debates and extensive hardship ridden travel."},{"t":"p","x":"Pingala is rajasik in nature and keeping it activated at night, when the natural energy is tamasik(lazy), increases longevity and alertness. Night time tends to give rise to fantasizing and focus on the Pingala prevents off from burning off energy by illusory and fantasy thoughts. “ From the eyes of the Virata Purush comes the sun”, says our scripture “ Chakshore suryo ajayateh”. The eyes and Sun are related to the intellect, the reasoning and the power to discriminate between what appears to be and what is. It is the source of enlightenment within the being and the Pingala energy galvanises that precious discriminatory power."},{"t":"p","x":"Pingala is more active during the descending moon cycle and operates for nine days in a fortnight at the time of sunrise and sunset. This must be put to wilful control to attain maximum physical and mental health as per our ancient scriptures. Consciousness exists in 5 koshas, or sheaths, that operates through the physical body, the most optimum vehicle for expression. These sheaths or layers are :"},{"t":"p","x":"1. Annamayi Kosha - Sheath of Matter 2. Pranamayi Kosha- Sheath of Vital Air 3. Manomayi Kosha - Sheath of Mind 4. Vigyanamayi Kosha - Sheath of Knowledge 5. Anandamayi Kosha - Sheath of Bliss Annamayi Kosha consists of the Physical Body - DNA, Cells, Tissues, Nerves, Organs, Body systems Pranamayi Kosha - Energy Field - consists of Aura/Bio-Magnetic Field, Nadis, Chakras Manomayi Kosha - Daily Mind - consists of emotions and feelings, fears and phobias, likes and dislikes Vijnanmayi Kosha - Wisdom/Higher Mind - consists of Inner Coscience, Inner Voice, values, belief system, Intellect Anandmayi Kosh - Bliss - consists of Being with Self, Nature, part of Universal Void of No-thingness Diagram : 5 Layers or Koshas of the Consciousness The Chakra spread will be most effective with this information capsule about the chakras."},{"t":"p","x":"1. The Mooladhara or the Root Chakra Sanskrit word: Muladhara = Mul +Adhar Location: Pelvic plexus; region between anus and genitals, Base of spine, the first three vertebrae Tattva(Element) : Earth Shape of Tattva : Square Sense Organ : Nose Bija Color : Gold Bija Sound : Lang Glands : Adrenal Glands Organs : Large Intestine, Rectum bones, legs, feet Systems : Nervous system, Circulatory system Color : Red Aspects : Food and Shelter Ruling Planet : Mars By chanting the Bija sound, Lang, the section of “Ang” vibrates in the upper head. Repeating the sound takes away from insecurities associated with the First chakra and provides the meditator with sense of financial security, financial awareness, self confidence and inner strength."},{"t":"h","x":"This chakra"},{"t":"h","x":"Crystals to balance the Root Chakra"},{"t":"h","x":" Ruby"},{"t":"h","x":" Coral"},{"t":"h","x":" Bloodstone"},{"t":"h","x":" Garnet"},{"t":"h","x":" Red jasper"},{"t":"h","x":" Black tourmaline"},{"t":"p","x":"Muladhar represents the biological age of 0-5 years of age in human timeline."},{"t":"p","x":"2. The Swadishthana or the Sacral Chakra."},{"t":"h","x":"Sanskrit word: Swadishthana"},{"t":"p","x":"Meaning of the chakra name: Dwelling - Place of the Self Location : 3 fingers below the navel, Hypogastric plexus, reproductive area. Genitals Tattva(Element) : Water Shape of tattva : Circle Sense organ : Tongue Bija Color : Gold Bija Sound : Vang Glands : Hypogastric plexus, gonads Organs : Sex organs, genitals Systems : Reproductive system Color : Orange Aspects : Anger, Action, Sexuality, Procreaton, family,fantasy. The earth element of Muladhara dissolves into the water element of Swadisthana. Fantasy and illusions occur as the person begins interrelating with social beings around. The inspiration to create begins in the sacral chakra. Ruling Planet: Mercury lunar, feminine By chanting the Bija mantra, Vang, the sacral chakra is excited. It is best accompanied by the sounds of water falling or gently lapping in the background.This sound opens blockage in the sacral channel, thereby facilitating procreation, sexual desire, sexual fantasy, ability to create and visualise."},{"t":"p","x":"This chakra stores all past emotional memories of you whether of you in your mother's womb, early childhood or even previous births."},{"t":"p","x":"This chakra is referred as Center of Personality. In Japan it is known as *Hara* or the center of gravity. From Hara one maintains balance, no matter what the circumstances and therefore controls himself and the environment without lifting a finger."},{"t":"p","x":"Represents the biological age of 5 to 8 years of age in human timeline."},{"t":"p","x":"Crystals to balance the Sacral chakra  Carnelian  Tiger’s Eye  Amber  Topaz  Citrine  Red Jasper 3. The Solar Plexus or The Manipura or Chakra."},{"t":"p","x":"Sanskrit word: Manipura = MANI + PUR Meaning of chakra name : the city of gems ie mani + pura Location : Solar plexus, epigastric plexus, navel, 3 fingers above the navel, below the diaghragm Tattva(Element) : Fire Shape of tatva : Triangle Sense Organ : Eyes Bija Color : Gold Bija Sound : Rang Glands : Pancreas Organs : Liver, stomach,pancreas, gall bladder, large intestine Systems : Digestive system. Saman Vayu, the vayu or air element that dwells in the upper abdomen, in the area of the navel, helping the digestive system. It carries the blood and the energy produced by the food breakdown to the entire body. Through this vayu, the rasa or essence of the food energy is assimilated by entire body."},{"t":"h","x":"Color : Yellow"},{"t":"p","x":"Aspects : Vision, form, Ego, Colour, Identity, Self esteem, Confidence, Leadership This chakra governs the Prana assimilation in the body. It also dictates the quality and quantum of Fire in the belly quotient that gives us the powr to mark our position on the Sva Loka - celestial plane."},{"t":"p","x":"Ruling Planet: Sun (Solar, Masculine)"},{"t":"p","x":"The Solar Plexus Chakra represents the biological age of 9 to 13 years of age in human timeline.* Crystals to balance the Solar Plexus chakra  Citrine  Tiger’s Eye  Amber  Yellow Jasper 4. The Heart Chakra or Anahata Chakra Sanskrit word: Anahata Meaning of chakra name : ana+ahata that which is not hurt/ destroyed Location: Cardiac plexus, In the center of the chest (the energy center is not located where our actual heart organ lies; rather, the heart chakra is in the center of the chest area); it is the 4th chakra counting from the bottom of the spine in the traditional 7 chakra system."},{"t":"h","x":"Tattva(Element) : Air"},{"t":"h","x":"Shape of the tattva : Hexagram"},{"t":"h","x":"Sense Organ : Skin"},{"t":"h","x":"Bija color : Gold"},{"t":"h","x":"Bija Sound : Yang"},{"t":"h","x":"Glands : Thymus"},{"t":"h","x":"Organs : Heart,lungs, blood, liver"},{"t":"p","x":"Systems: Circulatory system, vagus nerve, arms. Prana vayu. Dwelling in the chest region, it is the air that we breathe, and is rich in life giving negative ions Color : Green (higher energy frequencies can turn to pink) Aspects : Compassion, Love, Life-force, attaining balance between the three chakras above the heart and the three chakras below it."},{"t":"p","x":"Ruling Planet: Venus(lunar, feminine)"},{"t":"p","x":"When the yang sound is produced, the heart will be vibrated and any blockages in cardiac area are opened; when this chakra opens, the prana vayu from lower chakras enters the miraculous portal of Anahata and is free to circulate in the upper chakras, raising the vibration and consciousness of the individual."},{"t":"p","x":"Driven by the principles of transformation and integration, the fourth energy center is said to bridge earthly and spiritual aspirations."},{"t":"p","x":"A person strong on heart chakra brings a balance of physical and spiritual, logic and intuition, science and imagination, god and human. He is in Perfect Balance, Crystals to balance the Heart Chakra  Emerald  Jade  Green tourmaline 5. Throat chakra or Vishuddha Chakra Sanskrit word: VISHUDDHA Meaning of chakra name : Pure, clarity and Pristine Tattva(Element) : Akasha, sound Shape of the tattva : Crescent Sense Organ : Ears, Hearing Bija color : Golden Bija Sound : Hang Glands : Thyroid Organs : Throat, tonsils, lower jaw, shoulders, vocal chords, palate Systems : Metabolic System Color : Blue( higher energy frequencies can turn to pale blue) Aspects : Communication, asserting truth with clarity and courage, knowledge and the human plane Udana Vayu, which dwells in the throat region. The tendancy of this vayu is to carry air up through the head, aiding in the production of sound."},{"t":"h","x":"Ruling Planet: Jupiter"},{"t":"p","x":"Vishuddha chakra is known as the purification center, where the nectar amrita drips down from the Bindu chakra and is split into a pure form and a poison. In its most abstract form, it is associated with higher discrimination and is associated with creativity and self-expression. It is believed that when Vishuddha is closed, a person undergoes decay and death. When it is open, negative experiences are transformed into wisdom and learning. The success and failure in one's life are said to depend upon the state of this chakra, whether it is polluted or clean. The feeling of being guilty is given as the most prominent reason for this chakra to block the Kundalini energy moving upwards. It is associated with the element Akasha, or Ether, and the sense of hearing, as well as the action of speaking."},{"t":"p","x":"Crystals to balance the throat chakra  Turquoise  Aquamarine  Green opal  Blue agate  Lapis lazuli  Sapphire 6. The Ajna or the 3rd eye Chakra Sanskrit word: Ajna Meaning of Chakra Name : Authority, command, unlimited power Location: Medula plexus, Pineal plexus, point between the eyebrows Tattva(Element) : Maha Tattva, in which all other tattvas are present in their rarified pure essence; Mahatattva consists of the three gunas and includes manas, buddhi, ahamkara, and chitta. From mahatattava comes the panchmahabhut -akasha, vayu, prithivi, agni, jal Bija color : Gold Bija Sound : Aum Glands : Pituitary glands Organs : skull, eyes, brain, nervous system, senses Systems : Nervous system Color : Violet Aspects : Psychic power, higher Intuition, Clairvoyance, sense of discrimination and judgement, devotion, connection with divine Planet: Saturn Meditation is best carried out while focusing on the Ajna chakra. The pea-sized Pituitary gland regulates emotion and intellect and works in partnership with the pineal gland to achieve overall balance."},{"t":"h","x":"Crystals to balance the Ajna Chakra"},{"t":"h","x":" Amethyst"},{"t":"h","x":" Indigo"},{"t":"h","x":" Azurite"},{"t":"p","x":"7. Crown or Sahasrara Chakra represented by 1000 Petalled Lotus Sanskrit word: Sahasrara Meaning of Chakra Name : Thousand petalled; also called Shunya / Void chakra Bija color : Golden Bija Sound : Visarga (a particular breathing sound in the pronounciation of Sanskrit)"},{"t":"h","x":"Glands : Pineal gland"},{"t":"p","x":"Organs : Has a strong connection with the Cerebrum and the Pineal gland."},{"t":"h","x":"Systems: Central Nervous System"},{"t":"p","x":"Color : White or flashes of violet and white Aspects : Connection with the Divine, complete union with the Spirit, the constant state of being in Anandmayi Kosh, be of utmost surrender and available for service to a higher power or Universal command Immortality is achieved within Sahasrara chakra. Upto the sixth chakra, the meditator may enter into a trance but a form of activity or form still remains in the consciousness. In The mind establishes in the shunya mandal- at this time all feelings and desires, which are the activities of the mind, dissolve into their primary cause. The meditator is sat-chit-ananda : truth being bliss Ruling Planet: Ketu Crystals to balance the Crown Chakra  Clear Quartz  Amethyst  Selenite  Fluorite Bloackages In The Chakras And What Crystals To Use To Balance The 7 Chakras Chakra Deals With? Blocked By?"},{"t":"h","x":"Root /Muladhara Survival Fear"},{"t":"h","x":"Sacral/Swadisthana Pleasure Guilt"},{"t":"p","x":"Solar Plexus/Manipura Will-Power Shame Heart/Anahata Love Grief Throat/Vishuddha Truth Lies 3rd Eye/Ajna Insight Illusion Crown/Sahasrara Cosmic Energy Ego-Attachment White light enters through the Pranamayi kosha or the Energy Body. White light consists of 7 colours and each of the seven rays infuses the appropriate energy-centre or chakra with its particular quality. Each chakra absorbs a special ray of the vital energy, both from the physical environment and from the higher levels of consciousness.The chakras are the etheric organs working through thought and feeling directly upon the physical body."},{"t":"p","x":"Below table shows how the seven rays corresopond to the seven chakras:"},{"t":"h","x":"Color of Ray Chakra Quality"},{"t":"h","x":"Violet Crown (Pineal"},{"t":"p","x":"Gland)"},{"t":"h","x":"Spirituality"},{"t":"h","x":"Indigo Third Eye (Pituitary"},{"t":"p","x":"Gland)"},{"t":"h","x":"Intuition"},{"t":"h","x":"Blue Throat (Thyroid"},{"t":"p","x":"gland)"},{"t":"p","x":"Communication, religious inspiration Green Heart Harmony, sympathy Yellow Solar Plexus Intellect Orange Sacral Energy Red Base of spine Life-force Every item of creation- from plants, animals, humans, natural marvels possesses a keynote of its own. The sum total of these notes make up the music of the spheres. The body temple is a beautiful illustration of these sounds we live in. The beating of the heart, the rhythmic flow of the blood, the pulsations of breath are all a part of this great body orchestrated symphony. All stones emit sounds that have great potential for healing. The Crystal is a powerful receiver and transmitter of electrical energy, emits sonic frequencies of a high vibratory rate. To the tarot readers and the healers this is called the music of the crystals and they use its subtle energies to balance the chakras and to provide relief and regenerative life to the etheric body(which brings about happiness and supreme health in physical body)."},{"t":"p","x":"Healing & Balancing of Chakras by Using Suitable Gems and Crystals Chakra Gems & Crystals to bring healing, balance and Relief Root /Muladhara Ruby Coral Garnet Red jasper Bloodstone Sacral/Swadisthana Carnelian Fire opal Moonstone Orange jasper Solar Plexus/Manipura Yellow topaz Yellow sapphire Citrine Amber Yellow jasper Heart/Anahata Emerald Green tourmaline Malachite Peridot Moss agate Green jasper Green aventurine Jade Rose quartz Crysophase Throat/Vishuddha Blue topaz Blue lace agate Blue sapphire Chakra Gems & Crystals to bring healing, balance and Relief Lapis lazuli Turquoise Chrysocolla Aquamarine 3rd Eye/Ajna Azurite Sodalite Blue sapphire on violet shade Azurite Indigo Crown/Sahasrara Chrysoberyl Cat’s eye Selenite Clear quartz Amethyst fluorite The Chakra Spread For Tarot  The chakra spread is a wonderful, insightful tool to find in a snapshot the condition of the 7 chakras or energy centres in an individual’s etheric body."},{"t":"p","x":" Interestingly, on research it is proved that imbalances as shown in the Chakra spread are manifest in real physical and psychological problems for the individual which he sometimes shares and sometimes may be withholding from the Tarot Reader."},{"t":"p","x":"1. The cards are shuffled with the intention of doing a comprehensive Chakra spread and the diagnosing Prana vayu or Life force energy circulation in the etheric body of the person for whom the spread is being performed."},{"t":"p","x":"2. If the person is sitting in front or in real - time contact with the Tarot reader, ask the individual to sit with spine straight or to lie down on his spine on the ground or a similar hard surface."},{"t":"p","x":"3. In case the person is not in contact with tarot reader at the time of the spread being performer, the Tarot reader should imagine the person sitting cross legged in front of him, focus on his virtual chakra points and then meditate for a short while and asking for divine guidance on this auric study, perform the spread."},{"t":"p","x":"4. The cards are taken out one at a time, taking the name of the chakra, focusing on its core healthy color. The cards are laid out in a vertical column with Card 1 at the bottom, Card 2 vertically above it, Card 3 vertically above Card 2 and henceforth till Card 7 3 2 1 5 4 6 7 Example : Now I am drawing the chakra cards for ________ (name of the individual for whom the reading is being carried out)."},{"t":"p","x":" I am taking out his/her Root chakra energy card. Show me the existing level of Prana energy in his Root Chakra.  Place this card upside down at the bottom of the spread.  I am taking out his/her Sacral chakra energy card. Show me the existing level of Prana energy in his Sacral Chakra.  Place this card upside down above Card 1  I am taking out his/her Solar Plexus energy card. Show me the existing level of Prana energy in his Solar Plexus.  Place this card upside down above Card 2  I am taking out his/her Heart chakra energy card. Show me the existing level of Prana energy in his Heart Chakra.  Place this card upside down above Card 3  I am taking out his/her Throat chakra energy card. Show me the existing level of Prana energy in his Throat Chakra. Place this card upside down above Card 4  I am taking out his/her Third Eye chakra energy card. Show me the existing level of Prana energy in his Third Eye Chakra."},{"t":"p","x":" Place this card upside down above Card 5  I am taking out his/her Crown chakra energy card. Show me the existing level of Prana energy in his Crown Chakra. Place this card upside down above Card 6 Interpretation :"},{"t":"p","x":"Now we have the spinal column of Tarot cards depicting the Life force energy as circulating in the chakras or energy wheels of the individual. Each card will depict the blocked energy, the surplus energy and which of your chakra has become tired and needs to be healed. All sorts of interesting and perceptive answers and healing avenues will come up when the Chakra spread is analysed thoroughly."},{"t":"p","x":"For the chakras which are throwing up messages via Tarot cards that are at tangent or contradictory to the natal energy of the chakra, healing methods may be recommended. Some of these are :"},{"t":"h","x":" Usage of appropriate crystals"},{"t":"h","x":" Crystal Grids"},{"t":"p","x":" Tarot rituals or prayers along with aids of divine idols and angel statues. Example if heart chakra is clogged, one may suggest Ganesha idol made of rose quartz invocation.  Use of appropriate Precious gems and stones. Example if Solar plexus needs activating, the ruby stone may be recommended."},{"t":"p","x":" Meditations especially Shambhavi meditation-Details are given in the below section."},{"t":"h","x":" Use of yantras and mantras"},{"t":"p","x":" Use of Rudraksha matching it with the sphere of abundance the chakra is lacking in. Example the Rudraksha for money attraction is prescribed when the Root chakra is seen imbalanced  Mudra therapy as per Yoga shastra  Yoga asanas as per Patanjali yoga  Lifestyle changes  Nutritional changes and suggestions  Colour therapy as each chakra resonates to a certain color 7 Chakra Spread Shivalingams In The Chakras  The fourth chakra contains a lingam in which Rudra shiva appears as Sadashiva(sada: eternal, shiva-benefactor). He is Omkara- the combinaiton of the three gunas of sattva, rajas and tamas which are represented by the sounds A,U, M respectively, combining to form the sacred syllable AUM."},{"t":"p","x":"This Shivalingam is the second lingam in the body and is known as the Bana lingam, the first being the Svayambhu lingam of the first chakra, around which the kundalini energy is wrapped. The lingam of the fourth chakra acts as a conscience or a guide, warning or inspiring the aspirant along the path of upward energy movement. One needs to monitor the heart beat to keep a check on this upward movement. An increase or decrease in the rate of the heart serves as an error in practice. This lingam radiates with golden light. It shines like a jewel in the centre of the chakramala ( garland of chakras/ the spine). Mystics and meditation teachers advise the students and spiritual seekers to visualise a clear light in the heart when they begin the practise of tuning their chakras and enabling the root energy to travel upwards.It is here that the anahata-nada - the unstricken cosmic sound- is produced."},{"t":"p","x":"The Chakra Spread is a powerful tool to delve deeper into our energy centres and understand their workings and how energy is circulating within our physical body and the etheric body."}]},{"id":"v2-c16","vol":"II","title":"Chapter 16 · Tarot Exhaustion / Burn Out","body":[{"t":"h","x":"Tarot Exhaustion/"},{"t":"h","x":"Burn Out"},{"t":"h","x":"Chapter-16"},{"t":"p","x":"As advanced Tarot readers who are playing with and modulating the Universal energy and the individual energy systems of your client, this section is of utmost importance, I feel. Tarot Reading can become exhausting for a number of reasons."},{"t":"p","x":" You may be carrying out multiple readings within a short span of time and do not have time to clear out previous energies before the next reading."},{"t":"p","x":" Your readings were intense and very charged with emotions."},{"t":"p","x":" The issues discussed during the reading were suffused with strong feelings and opinions by the client and his ambience. Issues regarding anger, resentments, revenge, self esteem came up for exploration which deeply tested the depths of your own psyche and life experiences while counselling."},{"t":"p","x":" May be you don’t have the training or have forgotten to Ground yourself before the reading."},{"t":"p","x":" The querist may be a friend or a family member and their energy chords become entangled with yours as you become personally invested in the reading and its outcome."},{"t":"h","x":"Symptoms of Tarot exhaustion"},{"t":"h","x":" Lethargy and tiredness in body"},{"t":"h","x":" Severe and lingering headache"},{"t":"h","x":" Heaviness in the heart area"},{"t":"h","x":" Brooding sense of sadness"},{"t":"h","x":" Apathy towards own life matters"},{"t":"p","x":" Keenness to lie down and just wanting sleep to overtake  Unexpected anger spurting inside you  Occasionally a reader may have a bout of tears  Verbal outbursts  Non interest in further Tarot readings or other types of reading you do that may extend upto several days  Poor concentration skills  Desire to be silent and retreat into shell  Inability to Meditate and do the sacred rituals that you may be doing regularly otherwise So what are some Tools and Tips to Re-centre yourself after Tarot exhaustion and ensure that one can stay protected from this Exhaustion?"},{"t":"p","x":" Grounding and Centering - This means that we regulate our Chakra Energies with Mother Earth at a regular basis so that all the excess fuel in our body flows back into earth element and our body and mind remain stable. Some Grounding activities include the Tree Visualisation, Yoga asanas especially the floor exercises, Hugging Tree, walking on bare soft Earth, Body balancing exercises and many others."},{"t":"p","x":" Protection: Protecting your own aura and your own Psychic energies is a power you must learn even before you start to learn about Tarot cards and start practising with them. Some clients have more spiritual and emotional baggage than others. You being in Tarot field, have a high degree of Empathy and connection with Universal energies. So you are extra sensitive in absorbing emotional undercurrents of others around you."},{"t":"p","x":" Protection can be done by using Crystals that swiftly absorb negative energies and heaviness in the environment. You might develop your own affinity towards certain Protection Crystals. For recommendation Purposes, I would list :  Black Obsidian  Dark shades of Tourmaline  Nephrite Jade  Unakite Raw You can choose to keep the raw or cluster form of cluster near your Reading area as also wear them on your person in the form of pendant/amulet/ring or bracelet. Remember to cleanse and energise your crystals regularly so they are decluttered of previous toxic energy and can serve to protect you afresh. Crystals to Protect you against Burnout Several of the crystals in your crystal toolkit are extremely effective in protection against people sending out negativity to you and also against the energy vampires(of which the psychic burnout is a symptom)."},{"t":"p","x":"Sensitive people often experience a pull in their solar plexus if anyone is drawing on their energy."},{"t":"p","x":"Additionally some Tarot reading people also feel a blocked feeling or a very heavy deadened feeling in the head when they have been ruminating over the problem of an energy leech."},{"t":"p","x":"When we’re cooking, our minds are working. When we’re stirring and rolling and baking, we’re thinking. When we are doing Tarot reading and even when we are done with it, we are thinking."},{"t":"p","x":"Thinking creates vibrations because that’s what thoughts do. These vibrations will keep on affecting the tasks that the Reader is doing and its imperative that he/she is well protected once the tarot reading is over so as the negativity of the vampires (whose sucking effects last much longer than their physical presence) does not affect you negatively."},{"t":"p","x":"Few Relevant Crsytal Tips to protect you:"},{"t":"p","x":" If the pull is felt around the Solar Plexus use a Yellow Jasper or Citrine. Tape it over your stomach or lie down for 20 minutes with the yellow crystal over the navel area.  A Smoky Quartz or a Tourmaline can be programmed and placed in your vehicle or your place of tarot reading, safe at all times. Simply hold this crystal in your hands for a few minutes, visualising it surrounded by white light and ask that it offers protection and shielding to you. Tourmaline is particularly effective in EMF negativity."},{"t":"p","x":" Another observation of having faced an Energy vampire is faced when uneasiness happens in the Spleen chakra. If you feel overly tired after a reading or feel an ache beneath your left armpit when in contact with a particular person, Green Aventurine will reenergise you and protect your spleen area."},{"t":"h","x":"Crystal Relaxation/Healing Grid"},{"t":"p","x":"Use a combination of the following crystals in a particular layout/shape for Re-Charging after a Burnout or for more accurate Tarot Reading sessions."},{"t":"p","x":"This layout may be followed after a Session or 2 hours prior to a taxing / extensive session. This may also be performed to protect you if you are expecting to do a series of Readings like in an exhibition or a Marriage party."},{"t":"h","x":"Crystals Required"},{"t":"p","x":"1. Amethyst is a natural tranquilizer. It induces a profound sense of calmness and divine connection within you. The turbulence of the heart and mind becomes minimal or ceases."},{"t":"p","x":"2. Blue Lace Agate links your intellect and thought process to the spiritual vibrations. The serenity of this crystal brings astounding peace at a cellular level."},{"t":"p","x":"3. Green Aventurine is a heart healer and heart balancer. It opens up the heart chakra flower and provides emotional stability and confidence for mutually beneficial inter\u0002personal relationships. 4. Rose Quartz is a wonderful stone of providing emotional equanimity. It dissolves negativity and self doubts and promotes self love and self esteem."},{"t":"p","x":"5. Smoky Quartz is an excellent crystal for sucking in negativity and heaviness in the environment. Any kind of EMF from the electronic gadgets and human etheric bodies, it absorbs and transmutes into a relaxed feeling inside the physical body."},{"t":"p","x":"6. Clear Quartz is the Master Crystal and the most powerful stone for Healing and protection. It is potent enough for self cleansing. It does deep cleansing of soul and brings the Energy body and physical body in balance with each other."},{"t":"p","x":"7. Yellow Jasper has a very positive energy. It makes you physically vibrant and is an excellent de-toxifier. It releases blockages and removes old baggage from the solar plexus, bringing about a unity in the energy layers/sheaths of the individual."},{"t":"h","x":"The Layout"},{"t":"p","x":"1. Lie down on the floor or a hard surface and make yourself comfortable. Make sure the entire spine is in alignment with the hard surface underneath. Relax till the curve in the spine straightens out to the maximum possible. 2. Turn off the phone and any probability of disturbance must be minimised."},{"t":"p","x":"3. Place Clear Quartz just above the head(above the Crown chakra) on the floor/hard surface."},{"t":"p","x":"4. Place Amethyst on your forehead. Tape it to the place if needed, with medical tape."},{"t":"p","x":"5. Place Blue Lace Agate on the hollow of your throat. Again, tape it if necessary."},{"t":"p","x":"6. Place Rose Quartz over your heart. Tape if necessary. 7. Place Yellow Jasper over your solar plexus."},{"t":"p","x":"8. Place Smokey Quartz at your ankle level between the two feet. Make sure both ankles are touching the crystal. 9. Now close your eyes and focus on your breathing becoming rthymic and deep. Focus on the inhalation through your nostrils and the exhalation through your mouth, gently. This is called “BREATH OF HEALING”"},{"t":"p","x":"10. After 20 minutes, gently remove the crystals, starting with the top of the head. At this point you may do this by yourself or ask another person to help you as you may still be in a languid and contemplative state. Take care to get up gently, maintaining your physical balance. When you get to your feet, be aware of a grounding cord going from the soles of your feet deep into the Earth to hold you erect in your physical body."}]},{"id":"v2-c17","vol":"II","title":"Chapter 17 · Meditation as Remedy","body":[{"t":"h","x":"Meditation as"},{"t":"h","x":"Remedy"},{"t":"h","x":"Chapter-17"},{"t":"p","x":"Meditation as remedy and essential part of being a Tarot Reader What is Meditation?"},{"t":"p","x":"Meditation is not chasing thoughts and feelings out of your mind. Meditation is not sitting forcibly in silence while the monkey chatter goes on within you. Most people feel and say sceptically that they have never meditated and do not know how to go about it. They visualise meditation to be something profound and difficult which only spiritually inclined or ritually trained people are capable of performing."},{"t":"p","x":"Actually Meditation is nothing of all that it is thought of as a misconception. Meditation is a Natural state to be in. Each of us was born in silent rhythms of the womb where our own heartbeat was in sync with the mother’s heartbeat. Now in this material world, we simple have to re-discover and re-align our own heartbeat with the Sound of the Silence. The sound of silence is the Primal sound and puts our body chakras into perfect working condition and it results in a highly peaceful and productive individual."},{"t":"p","x":"The essence of Meditation lies in being still. This stillness is not of inaction. In every heartbeat the human organism is engaged in some work. Sitting in one place, in a state of being in non\u0002action, the individual gradually acclimatizes to the natural beats of the nature or the Shaka whirling all around. This sitting peacefully is a test of endurance and patience. Patience is infact another name for Meditation. When we do not want to control anything around us or within us and simply focus our mind energy on a void or a chakra diagram ( Internal chakra dharana or internal meditation as described in below section), we attain a high meditative state."},{"t":"p","x":"Thus, meditation is not done. Its rather not done. Yes, what is not done and is simply a state of Being, is actually Meditation. It may involve chanting or it may not. Silent meditation or Mental Meditation is as powerful as the verbal meditation, sometimes more so as you may enter an infinite Black hole of existential reality while in one of the higher realms of dhyana or trance. There is no action here, no will, no target. Its not achieving something but rather letting go of all the sheaths of existence and acquired thoughts and impressions we have formed over the years. As you advance in meditation practise, you will become lighter and less pretentious. You will also transform into a non-judgemental person as your acceptance of others as souls is realised and not merely as a physical entity with opinions. You will realise that each soul is on its own path of evolvement and one must graciously accept the soul contracts one comes across with people you may not like or be averse to. Transacting with even your so called “adversaries” will become easier and effortless for you when you meditate on a regular basis and smoothen the flow of Pran Vayu or Chi or Universal Energy flowing along your chakras."},{"t":"p","x":"The primary quality to be fostered while in meditation is of Receptivity. By simply sitting, you are not trying to do this or that- you simply sit."},{"t":"p","x":"Meditation is not a kind of activity. It is a Quality. That is the fundamental difference. Prayer means you are trying to talk to God. Meditation means you are trying to listen to God. You are willing to just listen to Existence, to the silence of the Infinite void in which you are placed by Nature."},{"t":"p","x":"You have nothing to say and you simply listen. Be Alert. Do not be passive, do not be sleepy. Be full of life and alert to the divine messages that will enter inside you silently or with a soft whisper. It requires consistent practise and a deep faith in wanting to be still and attuning to sounds of God transmitting through Nature. Shambhavi Mudra or Internal Chakra Meditation This technique involves internal meditation on the chakras. It is very powerful and a very personal exercise of inner stillness and contemplation. The chakras are spiritual shrines located in our energy field or the 2nd layer of Consciousness, the Pranamayi Kosha. The concentration is not on the physical organs or regions, but on the sukshma shareer or the subtle energy of the individual."},{"t":"p","x":"How is it carried out?"},{"t":"p","x":" The sadhaka or the meditator as we can call him focuses with single minded concentration upon the chakra diagram to establish the image in his mind."},{"t":"p","x":" This image entails several dimensions of the chakra including :"},{"t":"h","x":" The presiding deity of the chakra"},{"t":"h","x":" The Shakti manifestation"},{"t":"h","x":" The bija(seed) sound"},{"t":"p","x":" The vahana (carrier of the bija)"},{"t":"h","x":" Yantra (diagram) of the chakra"},{"t":"p","x":" After this external preparation is complete, the meditator shifts to the inner world. In an environment of austerity and simplicity, he now travels in his silent space of the depths of the heart, also interpreted as the Subconscious."},{"t":"p","x":" Internal meditation on the images is carried out. This is possible only when unwavering attention has earlier been devoted to imprinting the images on the mind canvas.  In slow progression, the meditation begins with the Muladhara or the root chakra and then in sequence travels upwards through the sacral, solar plexus, heart, throat, third eye and to the crown chakra. At each energy transit, meditation is carried out for balancing the energy quantum."},{"t":"p","x":" When the mind and the breath are in complete unison, the breath become shallow and almost imperceptible, the mind ceases to register outside stimulants and the pupils of the eyes become motionless ( we are focusing on the chakra images with the internal eye) then the meditative arc is reached. Its a moment of union with the Divine or the infinite consciousness."}]},{"id":"v2-c18","vol":"II","title":"Chapter 18 · Yantras as Remedy","body":[{"t":"h","x":"Yantras as Remedy"},{"t":"h","x":"Chapter-18"},{"t":"p","x":"Yantras are a very useful and practical way to propitiate the concentrated energy of a planet or its deity."},{"t":"p","x":"Yantra is a Sanskrit word that is composed from two words: Yam – meaning to control and Tra – meaning an instrument or device. Astrological Yantras are cosmic devices that demonstrate sacred geometry, which when energized emit cosmic energies."},{"t":"p","x":"Yantras are prepared in such a way that power of the deities concerned permeates them and henceforth is stored as potent latent energy. By worshipping the concerned yantra at home or office or any suitable and holy place to the querist of the Tarot, the latent energy, much like the sleeping life-force energy inside the base of our spinal column(meru dand), is invoked and the blessings of the deity concerned starts getting transmitted."},{"t":"p","x":"In this Kaliyug age, the power of chanting and yantra worship is akin to doing severe penance or japa that was the norm of our ancient civilisation. In less time, more profit in terms of deity pacification or wish fulfillment is the aspiration of many. When yantra worship is accompanied with the appropriate mantra jaap, the benefits increase manifold and the life of the querist enhances in happiness, good health and bounties of the Almighty."},{"t":"p","x":"Yantras act as a security shield to mankind. There is no importance of yantras if they are not prepared and consecrated properly. Yantras are prepared on a sheet of paper or the bark of the birch tree or on copper, silver or gold plate. Yantras give miraculous results if they are consecrated by an able person. Yantras are a divine tool and their preparation is a sacred task by a person speciallly trained to make them with immaculate proportions and thereafter to infuse them with right mantras to consecrate them."},{"t":"p","x":"Mantras are used in preparing and charging the Yantras. When mantras act in symphony with the instrument of yantra, their power gets multiplied enormously. Accuracy if constellations, dates (tithis) and planetary combinations (yogas) should be carefully considered while preparing and charging the yantras. The authenticity of the yantras is most important aspect of yantras and one must buy from the best in the spiritual industry else it will be ineffective and all the devotion will not be harnessed to provide suitable results."},{"t":"p","x":"Which yantra should a native/querist worship?"},{"t":"p","x":" As per the tarot spread and its recommendations, the native should worship the aspect of his life that is lacking or not giving aspired results."},{"t":"p","x":" He should worship the yantra tha
