al, emotional"}],"astro":{"zodiac":"Scorpio","zodiacText":[{"t":"p","x":"Scorpio is about passion and power. When you draw Death, the astrological aspect of this card is the power to Transform your life. To end one cycle that is not working for you and begin again. Life moves in cyclical pattern and the Death card guides on not being fixated in or wallowing in the past; not to hold grudges and to have the power to reinvent and move on. If this energy, you feel, is lacking, check that you are not wielding power just for the sake of it."}],"house":8,"houseName":"House of Death","houseMeaning":"Legacies, death, taxes and partner’s money, spiritual knowledge"},"crystals":"Bloodstone, Amber","gems":"","keywords":["Transformation","Ending","a New Beginning","Life-Lesson","Hope"],"tone":null},{"name":"Temperance","num":14,"arcana":"major","suit":null,"start":117,"end":120,"meta":{"Archetype":"The Soul Guide","Task":"Trusting the higher guidance, finding the right mixture","Element":"FIRE","Crystal Guidance":"Amethyst, Kunzite","Color Guidance":"Green"},"rating":null,"body":[{"t":"p","x":"The Temperance card depicts an angel balancing two forces. Dressed in pure white and protective wings, the Angelic presence has his right foot in the stream of water and his left foot on earthy threshold. He has two chalices in his hands and with full concentration and enjoyment he is creating a blend of the two liquids such that the most conducive temperature of the blend is reached."},{"t":"p","x":"The yellow triangle on the chest of the Angel symbolizes fire and the flowering blooms all around in his habitat are messengers of abundance and divine governance. These symbols indicate that for abundance to come through, the right proportion of conflicting or contrasting variables must be sought with patience and focus. The Temperance is the card for Harmony, Moderation and Circumspection. It calls for qualities of cooperation and collaboration to come through. A very beneficial card, the Temperance indicates the blessings of the Angels in your life and that your environment is harmonious for your growth and development. Temperance card tells you to find balance and equilibrium in our life. Most of the challenges in our life consist of choices that are not only wise but also should be palatable to responsibly incur them for a long time. These call for constant adjustment in our inner values as also our outward speech and behaviour. Harmony in relationships, a peaceful and calm mind, empathy and patience to listen to the other person and trying to sync your energy with theirs for an amicable working and living environment, are all the indicators for a smoother life that the Temperance card offers as tools. This is also a warning image that any decision taken rapidly or on an impulse can lead to your destruction. It also portends the arrival of a saviour or a wonderful life guide who will bring you out of the darkness of your dilemmas into the light of knowledge and a successful life."},{"t":"p","x":"The card may describe someone who will be a positive influence on you. There may be a helpful friend or a compassionate mentor or counsellor. Temperance teaches the human mind that one can make constructive use of the time that situations simply ask us to wait for the maturation of the outcome. You use these times to consider your actions of the past, explore your own needs and motives, and to let the learnings be assimilated into the psyche."},{"t":"p","x":"On the downside, the card can bring up messages of disharmony, competing interests, unfortunate alliances, hormonal imbalances, lopsided collaborative ventures, neglect of health and well being, inability to balance work and home life, imbalanced budgets, inability to balance materialistic and spiritual dimensions of life as one may take precedence. Being receptive to new experiments, being cautious and testing the waters before making a commitment and maintaining your Equipoise in the face of problems are central themes of this 14th card of the Major Arcana reflecting on the inherent energy of Number 5 for balance and communication between contrasting energies."}],"id":"temperance","reversed":[{"t":"p","x":"Need to act and take pro active actions No time to test the waters and make calibrated judgement Swift decision making Overspending of energy or not putting in enough efforts Lack of adjusting quality Problems in professional and personal life due to communication blockage"}],"astro":{"zodiac":"Sagittarius","zodiacText":[{"t":"p","x":"Sagittarius is optimistic and explorative."},{"t":"p","x":"When you draw Temperance, you have the opportunity to work on your desires and take the road towards achieving your goals. The flexibility of the Temperance card to be open to various avenues to get to the goal is its strength. So is the constant quest for perfection just like a Sagittarius native."},{"t":"p","x":"If you identify too easily with this energy, then its time to slow down and moderate your plans. Rethink and re-formulate before rushing headlong into something new."}],"house":9,"houseName":"House of Philosophy and Religion","houseMeaning":"Law, philosophy, religion, ideals, higher education, long distance travel, learning we do out of willingness"},"crystals":"Amethyst, Kunzite, Sardonyx","gems":"Opal, Diamond","keywords":["Equilibrium","Adjustment","Balance","Partnership","Good Prospects"],"tone":null},{"name":"The Devil","num":15,"arcana":"major","suit":null,"start":120,"end":123,"meta":{"Archetype":"The Adversary","Task":"Overcoming inner resistance, Insight into unlived shadow aspects, Taking back projections","Element":"EARTH","Crystal Guidance":"Obsidian, Haemetite","Color Guidance":"Black"},"rating":null,"body":[{"t":"p","x":"The Devil is a dark card of the Tarot Deck and totals to Number 6 being the 15th Major Arcana. Its an anti-thesis of the pure synergistic energies of Card Number 6, the Lovers. The Devil is depicted in animalistic form, often as a combination of animals. The Rider Waite shows Satan or a Satanic prototype with huge curved horns towering devilishly over a naked male and female couple who are seen bound in chains. They both have chains wrapped loosely around their necks yet it is obvious that they could easily slip these off and run away. So why have they not done so?.This is the crux of the message that the Devil contains, and it is not always an easy question to answer. If you feel trapped in a chaotic and stressful job that offers no rise for you, you may decide it is better to stay put because atleast you know what you are dealing with. The comfort zone induces in you a kind of lethargy that makes you unable to slip off your chains and look for a better opportunity outside."},{"t":"p","x":"If you are estranged from someone and unhappy about it, you may be adamant that you will not make the first move because the entire situation is the other person’s fault and it is up to them to apologise for it. However the Devil is reminding you that you need to examine your own role in what has transpired and to break free from the imprisonment of your self defeating attitudes."},{"t":"p","x":"The Devil has no links to black magic or voodoo. Its appearance in a spread does not mean the presence of witchcraft. Occasionally it can mean that the querist may be the target or victim of extreme negative energy but the surrounding cards must be studied deeply in that context. Extreme ambition and greed may be on your mind when the Devil pops up. This is displayed by the Pentacles sign on the forehead of the Devil. Any fixation with material assets and becoming ruthless in your pursuit of it is an associated attribute of this Card energy."},{"t":"p","x":"The Devil is more the victory of vices within self than virtues. There is a feeling of being trapped in a situation and inability to break free. However abject the conditions, the human mind and human spirit are capable of courage and this card calls forth to draw upon the inner sense of liberation. There are many addictions to which we all are prey and which operate in more subtle ways. You might be drawn to relationships in which you are always compelled to play the subservient role. This subtle abuse has become your second nature and even though the severity of the abuse might increase, you would have fear and apathy to moving out. You are addicted to your own negative patterns and will not move out of the chains holding you, when needed."},{"t":"p","x":"You could be so used to playing the victim and and basking in other people’s sympathy or playing on the harp of self sympathy that you do not know how to break out of the vicious circle and assert yourself. The Devil card constantly tells us to break out of destructive boundaries and become aware of what is going on and what you can do about it constructively."},{"t":"p","x":"On the downside, the Devil spells excesses and addictions, unethical and illegal behaviors, obsessive thoughts about a person or object, jealousy, lust, crimes and violence. In special cases regarding non commitment, this card may indicate that the connection between two persons in destined and they will keep coming back to each other. The bond of commitment is visible here."},{"t":"p","x":"The Devil can be a life changing card in the reading because it highlights the depth of a problem and that extreme determination may be needed to set yourself free and move to a natural state of divine existence where each human soul is free of bondage of self and others."}],"id":"the-devil","reversed":[{"t":"p","x":"Sense of liberation as a problem disappears Ending of an addictive pattern Ending of an abusive relationship Professional expansion and willing to move jobs or domains. Resisting temptation Hard work being more important than personal pleasure"}],"astro":{"zodiac":"Capricorn","zodiacText":[{"t":"p","x":"Capricorn is self-reliant and conventional."},{"t":"p","x":"The Devil card is deeply connected with the Capricorn tendancies to be obsessed about its self interest and ambitious goals. It makes them too conventional and narrow minded about own modus-operandi and way of perceiving the world. Its unhealthy and myopic at times."},{"t":"p","x":"If you draw the Devil card this attribute may be surplus in your life and you need to let go of an obsessive habit or way of doing things. If you feel this energy is lacking then maybe its time to adhere to certain conventions and discipline yourself to achieve your goals without harming those around you."}],"house":10,"houseName":"House of Profession","houseMeaning":"Public life, social status, profession, ambition, fame, the father, honors, social responsibility"},"crystals":"Obsidian, Amethyst, Jet Stone","gems":"Moonstone, White Coral","keywords":["Material Desires","Obsession","Lust","Avarice","Bondage"],"tone":null},{"name":"The Tower","num":16,"arcana":"major","suit":null,"start":123,"end":125,"meta":{"Archetype":"The Liberation","Task":"Bursting boundaries that are too narrow, Breaking out of the outdated","Element":"FIRE","Crystal Guidance":"Chrysocolla, Haemetite","Color Guidance":"Brown"},"rating":null,"body":[{"t":"p","x":"The Tower card is rather dramatic looking and shows a stone fortress or a light house being struck by lightening from the Heavens. The top of the Tower is sheared off, and the tower is falling to pieces. Fire rages in the background. Two figures are seen falling from the tower towards the ground. They could represent two male figures or a male and female."},{"t":"p","x":"The most famous story from History that corresponds to this imagery is the Fall of the Tower of Babel, They wanted to control the world as a splendidly unified force but had to face God’s wrath and feel to their decline. Simply constructing a heaven-reaching edifice and presuming you are all powerful sooner or later will lead to Fall from Grace and the eventual downfall of the conceited. If you are tempted by the possibility of ruling the world instead of striving for wisdom and spiritual humility, you will lose all you gained."},{"t":"p","x":"Its a gross misuse of the blessing of Free Will. The Falling Tower represents losses and painful endings. The one striking feature of this card is that the Loss will be unexpected and shocking. It could be a loss in relationship, material losses, loss of prestige or achievements."},{"t":"p","x":"Its a card f violent changes of and destruction, of falling apart and leaving the person disoriented and seeking guidance and succour. In the Eastern mythology, it is matched by the destructive rage power of the Kali, who makes space for the new beginnings to grow. She is born when the darkness(of the soul; of the karmas) has grown suffocating and all pervasive and needs to be swept away in a radical manner."},{"t":"p","x":"Though the changes that this Card energy brings is shocking and upsetting, yet it is necessary for the restructuring. When the dust has settled and more understanding of why it happened has entered the querist’s mind, it would be satisfying to redesign your life in a more orderly manner with stronger foundations. The Devil is strongly about the mind and the idea of self perceptions. When this energy strikes, there might be loss of how a person perceives himself or any other. The fall from exaltation and the resultant reality checks are significant steps to march towards the Truth."},{"t":"p","x":"Since this card describes loss of image and embarrassment, it features prominently when professional life is on the downswing, asking for concrete changes in direction and planning. Relationships going astray due to infidelity are characterized by the Tower card. Political loss of face, failure in competitive exams, poor appraisal ratings, demotions, public insults and disgrace can occur when this Card energy is about to strike. This card will bring out the skeletons from the closet and make you face the harsh truth and realign your life on more authentic terms. The edifice is only as strong as the Foundation, whether of the self or an institution or of a relationship."}],"id":"the-tower","reversed":[{"t":"p","x":"Ending of a troublesome period Pain and problems becoming less severe Recovery / improvement in health situation Repressed emotions Blockage in expressing real feelings leading to confusion or stress Sweet talking and sychophancy"}],"astro":{"planet":"Mars","planetText":[{"t":"p","x":"The astrological Tower tells you that it is the time to shake up the status quo. Get rid of old perceptions, or toxic relationships or wasteful habits. Bring a new lease of freshness into your life and do not be afraid of Change."},{"t":"p","x":"Refrain: Do not act explosive or impulsive."},{"t":"p","x":"Assess the situation before making a breakthrough. Use your judicious mind, and not just volatile feelings."}]},"crystals":"Chrysocolla, Obsidian","gems":"Ruby, Garnet","keywords":["Crash of Expectations","Necessary Change","Unfulfilled Expectations","Shocking News"],"tone":null},{"name":"The Star","num":17,"arcana":"major","suit":null,"start":125,"end":128,"meta":{"Archetype":"Wisdom","Task":"Gaining hope. Vision of new future","Element":"AIR","Crystal Guidance":"Sugilite, Turquoise","Color Guidance":"Yellow"},"rating":null,"body":[{"t":"p","x":"The Star card is 17th card of the Major Arcana and is a card of renewal, healing and optimism. Its a card of divine blessings and is a very auspicious omen for any new beginnings. The imagery shows a naked lady bending down on her knees and creating channels of irrigation from the oasis in the desert. She is holding two pitchers, one in each hand, from which she is emptying the water. She dips into the eternal water source on one hand and uses it to fertilize the ground around her. Some of that water is going back to the original source. Above her head are stars, seven in number, arranged in a halo like effect and encircling a big yellow star. This is a celestial configuration and denotes her divine mission on Earth which allows her to dream big and gives her the inner light and vision to manifest it into reality. Astrology teaches us that stars influence our lives and our thoughts and dreams. The North Star has since times ancient, been the guiding light for the travellers to find their way."},{"t":"p","x":"The stars represent the universe in all its mystery and potential for growth, learning and power.The Stars show the opportunity the emancipated human mind can have to chart the course of history and leave a long lasting legacy."},{"t":"p","x":"The background shows an open landscape, which is conducive for abundant results. Its not yet lush and would require sustained and patient efforts to develop by the human figure in the picture."},{"t":"p","x":"The singing birds and the green tree indicate that the results will be fruitful and regenerative in nature."},{"t":"p","x":"The central theme of this card is to return to the source a portion of the blessings that the human has been given. The Star is a incredibly powerful card, pregnant with infinite possibilities. What the Magician in stage 1 was only imagining, the Star now puts you into the exalted status where the stars are aligning themselves to help you on your mission. Its a card of sure-shot success, long lasting fame and deep impact on the heart and minds of history."},{"t":"p","x":"But to gain and retain this power, you must put something back. The lady in the picture is pouring the life force, back into the earth element, even as the skies above are aligning in her favour."},{"t":"p","x":"The beginning of a transformation is near; and this card always brings positive news and good tidings."},{"t":"p","x":"The Star reflects upon our need for having faith in the signals of the Universe and be open to inspiration and guidance, and about having hope in dark places. As a card of fortune, this is beneficial and fortuitous and speaks of God gently guiding us through the bleakness or doubts into a space of clarity. There may be prophetic dreams and omens associated when this card appears in the reading. It advises us to be sensitive to such subtle signals and be in our receptive dimension. For success questions, this Card is very fortunate as it celebrates the inner talents and richness of our personality. Great appreciaiton or felicitation might follow when this card appears."},{"t":"p","x":"The Star appears to be unattainable yet this symbolizes your innermost hopes and aspirations. What the world may seem to find impossible, if you in your deepest core find to be attainable, the Star will give you the divine guidance to work against the odds and the hardships. The only cosmic condition is that you follow the divine signals, your intuition and a deep abiding confidence in the power of the Self. At its downside the Star may portend loss of fame, unfulfilled expectations, frustration and impotence."},{"t":"p","x":"At its best, the Star promises immortality, leaving behind material or intellectual legacy, progress towards goals, connection with the Divine, success in daunting tasks, spiritual enlightenment."}],"id":"the-star","reversed":[{"t":"p","x":"Loss of optimism and cheerfulness Depression and feeling demotivated in the heart Purposeless life and no desire to contribute to society Focusing on past pains and unable to express negative emotions. No emotional clearing Talent not getting recognition Loss of fame and goodwill"}],"astro":{"zodiac":"Aquarius","zodiacText":[{"t":"p","x":"Aquarius is idealistic and independent. When you draw the Star and you feel this energy is lacking in your life, its time to believe in yourself. Trust your inner voice and be resilient to doing things your way. The destination may seem far fetched but your self-reliance and the blessings of the heavens that the Star card manifests will give you resounding success. If you identify too readily with this independent energy, then take care that you are not trying to influence others without a thought for their personal needs."}],"house":11,"houseName":"House of Hopes and Wishes","houseMeaning":"Friends, associates, groups, hopes, wishes, aspiration, public festivals"},"crystals":"Sugilite, Moldavite, Turquoise","gems":"Red Coral","keywords":["Solace","Sustained Hard Work","a Gift","Universal Blessing","Insight","Optimism"],"tone":null},{"name":"The Moon","num":18,"arcana":"major","suit":null,"start":128,"end":131,"meta":{"Archetype":"The Night, Daybreak","Task":"The Tightrope walk, cautiously overcoming the threshold of fear,not getting lost or losing oneself","Element":"WATER","Crystal Guidance":"Selenite, Labradorite","Color Guidance":"Aquamarine"},"rating":null,"body":[{"t":"p","x":"The Moon is the 18th card of the Major Arcana and a rather mystical and mysterious one, just like the unfathomable extent of the Mystic Number 9."},{"t":"p","x":"The Moon is shown in both its full and crescent form.There is a face in the Moon, on the left side of the crescent, looking down at the scene below. There are tear shaped rays around the Moon falling from the Moon onto the Earth below, symbolizing the descent of spirit into matter."},{"t":"p","x":"Its interesting to observe that the crescent and the disc is a very old representation of the moon deity. Ancient steles from the Mideast, inscribed in Aramaic show this Lunar symbol as also this imagery is found in excavations of ancient North Africa. This is evidence of the Tarot symbolism, especially the Major Arcana having its archaeological roots to much older than the fourteenth century European culture."},{"t":"p","x":"There is the recurring portal theme of the Tarot in the form of the twin pillars. Two animals are represented here, a wolf and a dog, positioned between the towers and howling up at the Moon. They represent our pagan, animal nature. They are are both in fear and awe of the effects of the Moon, ever affected by it rather than controlling it."},{"t":"p","x":"The bottom of the imagery shows a pool or lake from which is climbing out a clinging lobster or a scorpion. The watery depths denote our subconscious, the deepest part of our emotional self."},{"t":"p","x":"Water is again represented as the life force(as in the Star card) but in this allegory, its also full of unknown and serendipitous dangers, lurking in the shadowy depths. The Moon is our\"Chitta” and stores all the remembered and forgotten impressions through our soul journey."},{"t":"p","x":"The central message of the Moon is that the moonlight plays tricks on us because it alters the appearance of the surrounding environment. In this flavour, its been compared with the abstruse and mystical lights of the underwaters where nothing is as what is seems to be. We are not entirely sure what we are looking at."},{"t":"p","x":"When the Moon appears in a reading, its a complex signal to look at situation in the true light. You are reluctant to acknowledge the truth. It could be because all the facts are not yet revealed before you; more mysteries and clues have to be unfolded before you can grasp the entire picture. It could be due to your latent fears and anxieties that you are sceptical of facing the facts and welcoming clarity into your life."},{"t":"p","x":"Deliberately certain persons around you might be trying to emotionally blackmail you or put a blindfold over your analytical acumen."},{"t":"p","x":"Its a time to be wary and on your guard when the Moon energy is surrounding you in the Tarot."},{"t":"p","x":"The Moon card is tricky and guides you towards the murkiness in the situation. People will not be truthful or will hide the information from you. It will be difficult to decipher what their real intentions are. As the Moon tarot card is the link between our subconscious and the conscious mind, it can refer to all that is concealed and secretive in our life."},{"t":"p","x":"Secrets and fears that you have been trying to push to the back of your mind may start to emerge unbidden, forcing you to confront them."},{"t":"p","x":"Its a favourable card for any creative, poetic, literary and psychological activity and venture. It advises us to explore our subconscious and be confident of our own emotional strengths and to use them to sift through the chaff and come up with the golden grain of reality."},{"t":"p","x":"Its our ability to translate emotions, moods and repressions into the light of our life."},{"t":"p","x":"When this card appears, pay close attention to your Intuition and the dreamscape. Its giving you strong signals on where the truth lies. Constantly scan your environment for clues on what will help you maneuver the ambiguity surrounding you and to emerge from the murky depths of the emotional cesspool where the dangerous scorpions lurk, waiting to devour you."}],"id":"the-moon","reversed":[{"t":"p","x":"Will power becoming stronger and desire to be active in material world."},{"t":"p","x":"Clarity in mind after an ambiguous time."},{"t":"p","x":"Time of trust and new networking Calmness and feeling centered."},{"t":"p","x":"Renewal of positivity in a troublesome relationship or life situation Positive card in health and finance situation"}],"astro":{"zodiac":"Pisces","zodiacText":[{"t":"p","x":"Pisces is impressionable and deeply emotional, If you draw the Moon card feel this energy is surplus then you are living in an illusory world of feelings and mental fluctuations. You are being misled by what people around you are saying or making you believe, Do not be so gullible, You could even be beset by doubts and uncertainties to a very large extent. See beyond the empty promises."},{"t":"p","x":"If you believe this energy is lacking in your life then its time to be more in touch with your Intuition and feelings."}],"house":12,"houseName":"House of Bondage","houseMeaning":"Personal limitations, secret desires, frustrated ambitions, unknown enemies, institutions that restrict or confine, karmic lessons, what we know subconsciously, where we escape to, expenditures, losses"},"crystals":"Moonstone, Selenite","gems":"White Sapphire","keywords":["Insight","Organic Change","Hidden Currents","Ambiguity","Distrust"],"tone":null},{"name":"The Sun","num":19,"arcana":"major","suit":null,"start":131,"end":134,"meta":{"Archetype":"The Day, the Rosy Dawn","Task":"True Reconciliation","Element":"FIRE","Crystal Guidance":"Tiger’s Eye, Bloodstone","Color Guidance":"Bright Yellow"},"rating":null,"body":[{"t":"p","x":"The Sun is the Nineteenth Trump of the Major Arcana and like the numerological counterpart of Number 1, it is the most positive and radiant card of the deck. The Sun is the centre of the solar system and is integral to the continuation of life on this planet. The Sun represents our inner life force, our vitality. Without it, our planet will cease to exist. It will be a mere lump of molten mass, devoid of life and hurtling through darkness. Similarly, the Sun card in the Tarot is its brightest illumination. When the SUN appears in a spread as a person, it shows they bring you happiness, contentment and encouragement. The Sun represents Love and succour. It is essential for our survival. When it disappears from our life, its as if the light has gone out of our life. This is the primary lesson of the milestone card of the Sun. While it represents love, in its pure and unaffected form, it also warns us of co-dependance on a person or a passion to an extent that when we are bereft of them, we cease to live productively."},{"t":"p","x":"The Sun is the lowest aspect of the Divine and the highest aspect of the mundane. It serves as a mediator between the visible light of this world and the divine light."},{"t":"p","x":"How do you combine your own sovereignty (Sun energy symbolizes individuality) while opening yourself to divine light? This question is central to the Sun card when it has been appearing in your spread or Daily Guidance.. Let the Mind expand and Open. Hold the Dream of what brings you JOY? Keep holding it and let its brilliant light enter your Mind to an extent that each muscle is filled with its fulfillment. This is the message of this card-Of envisioning and then continually reflecting on the idea and aligning all your thoughts and actions towards it coming true. The Sun is about making your dream come true."},{"t":"p","x":"The Sun is the most joyful card of the Tarot deck representing happiness, laughter, success, generosity of heart, spontaneity. It can also represent the birth of something joyful whether it is a child, a new relationship, a marriage or a work project that will offer us growth and excitement. If this card springs up when you are going through a difficult time in life, it brings with it massages of hope and recovery of good times. In relationships, this is a very positive card as it talks of times of total and transparent communication. Even if there have been misunderstandings or conflicts in the past, the partners will enter a new phase of understanding the other’s perspective and jointedly work towards solidification of the relationship."},{"t":"p","x":"Recovery after an illness, whether physical or emotional is also a feature of the Sun card. Its as if the clouds have lifted and Destiny has moved into high gear for you to take you on path of reassurance, health and all the means by which you can enjoy your life. The Sun is a perfect card for professional queries. It indicates promotions, accredit-ions and felicitations. You may be publicly rewarded or awarded and gain lot of popularity amongst your group members."},{"t":"p","x":"At its downside, the Sun imparts braggart attitude, arrogance and pompousness in character. The person may suffer from megalomania and be on own thought trip, even behaving with selfishness in pursuit of own goals. The Sun card may also indicate an excess sensation of happiness which as we know in the moderate ideology of Tarot teachings must be earthed in order to balance. The generosity and helpful predisposition of the Sun dominated personality will easily turn to that. The Sun Card is always positive, showing way for a better future."}],"id":"the-sun","reversed":[{"t":"p","x":"Loss of happiness and joy Health situation taking a downturn Demotion or loss of face publicly Lack of decisiveness and physical/emotional vitality. Loss of confidence Opportunities being denied. You may feel good fortune is evading you"}],"astro":{"planet":"Sun","planetText":[{"t":"p","x":"The astrological Sun card advises you to act positively and with complete confidence in your abilities. Leadership comes naturally to you so perform your administrative and welfare duties with compassion and fareness."},{"t":"p","x":"Refrain from acting egoistic and acting out of dictatorship or selfishness."}]},"crystals":"Sunstone, Amber","gems":"Ruby, Diamond","keywords":["Enlightenment","Transparency","Confidence","Success","Joy","Prosperity"],"tone":null},{"name":"Judgement","num":20,"arcana":"major","suit":null,"start":134,"end":137,"meta":{"Archetype":"The World of Transformation","Task":"Redemption, Liberation","Element":"WATER","Crystal Guidance":"Unakite, Onyx","Color Guidance":"Violet"},"rating":null,"body":[{"t":"p","x":"The Judgement is a Karmic card and a significant stopover point of review and appraisal and paybacks before the human soul moves to the final stage of World. In this picture tapestry, a winged angel dominates the skyline, holding the trumpet of judgement in his hands. He is blowing from the trumpet and leans down from the clouds. Below, naked human figures rise out from the coffins or out of earth itself, their faces suffused with wonder and expectation.The symbolism of this card represents that of the raising of the dead, the Last Judgement. This is the time when all the souls will be invoked for accounting of their activities during this lifetime and even earlier(if it has a bearing on this life time’s actions) and when the divine judgement will be passed on their karmic results. The judgement has not been passed yet. This is a significant factor because the human soul, in spite of the strong divine scrutiny here, has the ability to change their results with their judicious use of Free Will."},{"t":"p","x":"The Judgement brings with it memories and account taking of the past. You may be compelled to remember your past experiences and review them. These may be instances where due to your action or non-action someone might have suffered or had a loss. The Judgement will advise you to atone for the same to the afflicted. In case that is not possible, then reprimands and regrets must be gone through. You should be prepared for some transparent sessions, even of experiences that may have become buried in the sands of time in your memory."},{"t":"p","x":"Judgement also symbolizes the end of the old life and beginning of a new one. Whatever change is about to happen, will be for the beginning. The old skin will be shed off and much like transformation, this will entail a purer soul ready to move to the culmination of the Fool’s journey. The changes can be at the spiritual or the mundane level. The Mundane changes could be change in location, change in career, a new romance, leaving behind a relationship; whatever it takes for you to be more in alignment of your soul purpose. At the spiritual level, when this card appears in the reading there are very profound changes."},{"t":"p","x":"You will be faced with evidence that what you have subconsciously known to be your life purpose is very much your Higher Calling. There is no need to merely believe. You will Know. A higher level of psychic awareness will engulf you. Synchronicities will surround you, angel communication and intuitive signals will rain over you and you will experience the presence of the Divine."},{"t":"p","x":"This is a time of total surrender of Self and the Ego which makes you perceive the world from the\"I” perspective needs to be dissolved as you become receptive to the higher level messages being transmitted at you from various directions. Judgement is a positive card symbolizing regeneration, rebirth and understanding. You have a right to these rewards because of your constant faith and your striving despite doubts and adverse situations. On the downside, this card could bring up memories you find yourself unable to face in the present context. Here too the cosmic plan is to enhance your tolerance threshold and move you more towards being accountable and align you with the CAUSAL NEXUS - the philosophy that each of your actions cause results that you will have to face at some stage in your life-journey. No act exists in isolation. It will have its corresponding reaction in your universe one day."}],"id":"judgement","reversed":[{"t":"p","x":"The person knows that a chapter has ended but is unwilling to change."},{"t":"p","x":"Non acceptance of situational reality Non willingness to apologize/show regret over a folly committed Disconnect with Higher Self/Divine Over confidence in self and self-karma and denying the role of Destiny Feeling judged yourself and also being judgemental of others"}],"astro":{"planet":"Pluto","planetText":[{"t":"p","x":"The astrological Judgement card says it is time to let go of the past, to forget your petty resentments and embrace the future. Make the change now while you can and feel liberated. Pluto is the planet of the past and this card brings up issues, unresolved, from the Past. Embrace them, forgive and forget and bring dynamism towards future march."},{"t":"p","x":"Refrain: Do not be tied to habits and regrets from the past. Do not be scared to face the past skeletons and injuries and try to resolve them."}]},"crystals":"Malachite, Fluorite","gems":"Cat’s Eye","keywords":["Decision","Change of Direction","Final Settlement","Amendments","Regrets"],"tone":null},{"name":"The World","num":21,"arcana":"major","suit":null,"start":137,"end":139,"meta":{"Archetype":"Paradise regained","Task":"Arriving; Taking one’s place","Element":"EARTH","Crystal Guidance":"Malachite, Fluorite","Color Guidance":"Green"},"rating":null,"body":[{"t":"p","x":"This is the last card of the Major Arcana and carries the energy of completion and culmination. The Wheel of the Major Arcana has come a full circle. There is a sense of fulfillment and celebration that will surround you much like the circular wreath that is the mainstay of the World Card image. This celebration could be outwardly manifest accolades, success and felicitations. It could even be an internal deeply satisfying emotion that fills your senses, heart and Mind. Here the celebration is full of gratitude and is quiet and private, in your inner world, in your dialogue with the Divine that is so dear and personal to you."},{"t":"p","x":"The World card foretells of major changes in your life such as change in career, change in direction of education, a relocation abroad, change in partner, recovery after fatal accident or disease, resurgence after a bankruptcy and other life impacting changes."},{"t":"p","x":"This is a very positive card as it spells all round success in life. You may be receiving parallel news about positive developments in different aspects of your life. If you have been going through a difficult period in life, it is indicating to keep striving hard in your desired direction and utilize all your abilities to reach your goal."},{"t":"p","x":"The World card shows strong affiliations with foreign lands. Its appearance in the spread may take you to foreign lands, or become expert in foreign language, or engage in international trade, or even travel to foreign lands or you might even become involved with someone who belongs to a foreign land. You will engage in activities and pursuits that expand and enlarge your understanding of the World.You feel that an unseen force is guiding you and supporting you. This card epitomizes the Akasha element. All the other four elements - fire, water, air, earth originate from it and finally submerge in Akasha itself."},{"t":"p","x":"We note that the books and scriptures that featured in the 4 symbols of the fixed zodiac signs in the Wheel of Fortune (No X card) are no longer present in Card No XXI. The subjects have been mastered, the lessons have been learned, the virtues have been absorbed by the character. The World person is mature and in connection with the Divine blessings in totality. The purple colored fluttering scarf over the nude human body in the picture is indicative of the umbrella protection and the total unity of the human with the elements around. This Trump helps you to expand your horizons. It will encourage you to work on international projects and affiliations. This Trump is a portal into a universalized and continuously expanding consciousness. It enhances a global outlook. Though your physical dimension might not be travelling, the mental and spiritual dimensions are expanding and you may delight in experiential travels of astral travel, out of body travel and past life regressions."}],"id":"the-world","reversed":[{"t":"p","x":"Being unable to finish a job or a project Feeling disappointed at last minute turn of events. Achieving a small victory but feeling inadequate when comparing to another’s larger victory Clinging to past laurels and not willing to move forward. A strange kind of incompleteness in life, restless, spiritual seeking Minor Arcana"}],"astro":{"planet":"Saturn","planetText":[{"t":"p","x":"The astrological World tells you to face reality, to put your feet on the ground and to accept what is possible and what is not."},{"t":"p","x":"Refrain: Do not limit yourself by perceived limitations. Karma should dictate your freedom from this bondage by sheer grit and clarity of thought and simplicity of behaviour. Accept what what you cannot do but go full force ahead on the aspects you can change in this lifetime. Understand your karmic footprint."}]},"crystals":"Onyx, Unakite","gems":"Opal","keywords":["Completion of a Cycle","Fulfillment","Achievement","Success","Satisfaction"],"tone":null},{"name":"Ace of Wands","num":1,"arcana":"minor","suit":"Wands","rank":"Ace","start":143,"end":145,"meta":{"Element":"Fire","Planets":"Mars, Sun,Jupiter","Astrological Significance":"Root of the Powers of Fire. All Fire Signs Combined -Aries, Leo, Sagittarius","Favourable Color":"Red Brown","Chakra Associated":"Solar Plexus"},"rating":"A Very Positive Card","body":[{"t":"p","x":"The Ace of Wands is the root card of the Wands suit. This suit stands for fire element of dynamism, growth and constructive expansion."},{"t":"p","x":"Imagery : A hand holding the wand issuing from a cloud. Ace is club shaped, being rounded at one end showing the power and willingness to fight for the idea. Leaves and branches are springing out of the wand, showing new growth."},{"t":"p","x":"Ace of Wands is a wonderful card of opportunities which are fuelled by internal passion and give the person incredible amount of self confidence to fuel his dream. It quite literally means enthusiasm and new beginnings and could signify a new job, a birth, or a new course of study. Essentially an optimistic card, the Ace of Wands encourages us to bring our passion and insights to coherence in realizing our desires. It signifies the beginning/initiation of a creative or artistic project based on new vision or inspiration."},{"t":"p","x":"It even leads to growth of a new romance or a love affair where the mutual chemistry is very sharp and if provided the correct support, can become a very durable relationship as long term vision and ideology of both the partners is very similar."},{"t":"p","x":"The Feelings as shown by this card are of contentment and triumph. Its an original vision that is taking shape in your Mind and that fills you with energy. It might be a break from an unsuccessful past and that gives you a sense of freedom and solace."},{"t":"p","x":"Your attitude is about to change and expand and your horizons are looking bright as you make new plans for the future."},{"t":"p","x":"The beginning of a new enterprise, involving business or finance or of a personal nature where your heart’s desire is involved."},{"t":"p","x":"Possibly an inheritance, which may be either of money or property, or of the ability needed to make the enterprise begin successfully."}],"id":"ace-of-wands","reversed":[{"t":"p","x":"Lack of inspiration and direction, misplaced focus, feeling hyper and restless, delayed starts"}],"tone":"positive"},{"name":"Two of Wands","num":2,"arcana":"minor","suit":"Wands","rank":"Two","start":145,"end":147,"meta":{"Element":"Fire","Planets":"Mars, Sun, Jupiter","Astrological Significance":"Mars In Aries","Favourable Color":"Red Brown Orange","Chakra Associated":"Solar Plexus"},"rating":"A Very Positive Card","body":[{"t":"p","x":"The Two of Wands is the execution card of the Wands suit. This suit stands for putting ideas into action. Astrologically it denotes Mars in Aries so the drive and determination are supremely high."},{"t":"p","x":"Imagery : The 2 of wands represents the original spark of the Ace has been combined with planning and organizing and has now become stronger. The merchant in the red robe is looking with focus on his mind with aspirations of global achievements as evident from the Globe in his right hand. With the left he grasps on the new idea/plan while the original conquest is depicted by the fastened wand on his right. Two of Wands encourages you to assess your current achievement and to purposefully plan what you wish to accomplish ahead."},{"t":"p","x":"Its a very relevant card if you are in the early stages of a new venture or a relationship. You must stop a while and assess your initial journey and make the necessary practical adjustments to move ahead, all the while bearing in mind your final vision."},{"t":"p","x":"At times, with initial success, the person may become careless or complacent. This card is a warning / shout out that while the beginning has been strong, due dedication is still required to keep the enterprise in momentum."},{"t":"p","x":"The two of wands also signifies very strongly the needs for working partnerships. You will require the collaboration of various complementary parties to achieve the goal. The rewards shall accrue to all and they would want to work with you in the future too portending well for oncoming professional accomplishments."},{"t":"p","x":"The 2 of wands may also indicate the arrival of someone in your life whom you can learn from and develop a strong respect for. They might have some technical or spiritual knowledge that would guide you tremendously leaving an impact on your work ethos."},{"t":"p","x":"This is a card of astute planning and being in the right place at the right time. Due to your diligence and glowing reputation, more work will flow your way."},{"t":"p","x":"A card where your initial flame of passion is burning brightly and you are working with full sincerity and enthusiasm towards gaining more expertise in your field. The ultimate goal now seems closer."}],"id":"two-of-wands","reversed":[{"t":"p","x":"Feel forced to take action while being unprepared, lack of confidence, lack of options, using power in hurtful/abusive way"}],"tone":"positive"},{"name":"Three of Wands","num":3,"arcana":"minor","suit":"Wands","rank":"Three","start":147,"end":149,"meta":{"Element":"Fire","Planets":"Mars, Sun, Jupiter","Astrological Significance":"Moon in Aries","Favourable Color":"Red, Green Brown, Orange","Chakra Associated":"Solar Plexus"},"rating":"A Very Positive Card","body":[{"t":"p","x":"The Three of Wands is the card which is seeped in ambition and a strong desire for unlimited growth and fame. Imagery : The merchant has now become clothed in elaborate costume with also a sash proclaiming he is head of a clan or a social group. His headgear also indicates his highly respectable position in the society or the organization he is representing. He looks out over the horizon with his back to us. He has no time for past regrets and only wants his vision fixed tightly on the glorious future. He holds the wand with a firm grasp. He stands elevated on a hillock where gets a bird’s eye view of his entire operations."},{"t":"p","x":"Three of Wands representation traditionally is of a ‘boyar”, one of the wealthy land holding merchant families who exercised great power in Russia’s history. This card astrologically represents Sun in Aries where the brilliant planet becomes exalted and marches ahead with maximum force."},{"t":"p","x":"Here too the merchant has reached the peak of success in reference to current time and is affluent and famous. He stands on an elevation showing also the rise in his thinking and his levels of goal setting which have now risen above the mundane. He is an extraordinary thinker and achiever. The teamwork and cooperation of the previous card has proved highly fruitful This card shows travel is likely in connection with work. Good news is also likely in relation to work expansion."},{"t":"p","x":"A golden period of wish fulfillment is on the cards regarding what you are pursuing. Your enterprise, vision and creativity will bring exciting results. There is still plenty to be accomplished but the beginning has been tremendous."},{"t":"p","x":"The three of wands signifies expansion by problem resolution. If earlier troubles in your pursuit besieged you, they will now be resolved by amicable negotiations. If your problems were solved by interference or opposition of others, you can still resolve them by taking things in firm hands this time. A disciplined approach will be necessary and a professional approach that makes your pursuit systematic and time bound is necessary at this stage."},{"t":"p","x":"If you are considering branching out into a different sphere of your life, the three of wands is a very encouraging signal. It also speaks of family expansion and the entry of a new person in your family on a happy note or a birth in the family. Its a signal of expansion in personal happiness and sense of achievement."}],"id":"three-of-wands","reversed":[{"t":"p","x":"Lack of support from people and situations in moving ahead, over impulsive in taking decisions, lack of expansion in job or business, rejection in love"}],"tone":"positive"},{"name":"Four of Wands","num":4,"arcana":"minor","suit":"Wands","rank":"Four","start":149,"end":151,"meta":{"Element":"Fire","Planets":"Mars, Sun, Jupiter","Astrological Significance":"Venus in Aries","Favourable Color":"Red, Brown","Chakra Associated":"Solar Plexus"},"rating":"A Very Positive Card","body":[{"t":"p","x":"Four of Wands is a card of relief and celebrations. Its a fresh burst of oxygen as your system goes into a restful state and its time to pause and celebrate the achievements along with the team and co-helpers who helped you get to the summit. Imagery : The festoon lined canopy with the background of the castle denotes that success and accomplishments now surround you. Its time for thanksgiving and gratitude to the Universe as well as those who helped you along the way to reach your goal. The raised hands of the workers show a sense of victory."},{"t":"p","x":"This card denotes the pleasures that money can buy and can indicate buying of a new property whether residential or commercial. It also encourages purchase of a new vehicle or a grand renovation of the existing assets. It shows weddings and get together in the family or in your social circle. There is a general air of glamour and prosperity all around. The time for relaxation is here. You have been working very hard and you now should take a well deserved rest. You can afford to let the work tarry for a while while you review your past achievements, thank your supporters and share with them the bounty earned and then set into motions expansionary plans for the future."},{"t":"p","x":"Four of wands features frequently as Feeling Card. It represents the reassurance and the sense of satisfaction that comes from doing a job well and being able to have surplus enough to share with others and attract their good wishes. This card also appears when you are emerging from a stressful situation in your life, one of the reasons being you have been working round the clock to meet the pressure or the severe deadlines. Your social life has been compromised greatly and you have had a work-life imbalance lately. This card advises you strongly to feel nurtured and loved again by aligning with your friends and family in a loving environment. Like the Number 4 that it represents, it carries the quality of stabilization and consolidation."},{"t":"p","x":"Its a lovely card for peace and harmony with your partner as you will find many areas to be jointly thankful for. Its the card for emotional security and warmth. Its the classic card for moving house. The new premises will be close to nature and if accompanied by other lush cards like the Empress or Ten of Cups will be spacious and ergonomically very conducive. A time to connect with your roots and your loved ones, this card aligns with the Heart Chakra and makes you feel emotionally strong and vital"}],"id":"four-of-wands","reversed":[{"t":"p","x":"Unhappy personal or home life, feeling of lack, feeling of instability, ungratefulness, boredom from responsibilities"}],"tone":"positive"},{"name":"Five of Wands","num":5,"arcana":"minor","suit":"Wands","rank":"Five","start":151,"end":154,"meta":{"Element":"Fire","Planets":"Mars, Sun, Jupiter","Astrological Significance":"Saturn in Leo","Favourable Color":"Red Brown, Blue","Chakra Associated":"Solar Plexus"},"rating":"A gray card","body":[{"t":"p","x":"The five of wands is the first chord of competition in the Wands journey. Its one of those times when your progress is halted by opposing forces, known and unknown."},{"t":"p","x":"Imagery : The imagery shows five able bodied competitors fighting it out with their own wand. They are similarly dressed and of similar build indicating the struggle and opposition coming form surrounding environment."},{"t":"p","x":"When this card appears, problems beyond your control will suddenly rise up. Carefully made plans by you will be halted or face strange interruptions. You may have to cope with a series of petty disputes with people, especially in your working environment. Competition is a very powerful theme of this card. You will have to prove your point of view in front of a group of sceptical persons and be convincing enough to get through their wall of reluctance."},{"t":"p","x":"In the market space you will face direct competition by your rivals. They might use underhand means to bring down your reputation or would encroach upon your designated areas of expertise. The best way to deal with this strife is to be patient and cope with the surprises being flung at you. Be persevering and deal with one annoyance at a time. Carefully plan your strategy to deal with those who oppose you."},{"t":"p","x":"Remember this kind of strife or combat is a necessary part of your progress in your pursuit. Another lesson with the five of wands is to be flexible in your approach. If a different perspective has come up to counter yours, be patient and listen with an open ear. It could increase your own knowledge and teach you a useful thing or two. So decide on the basis of the merit of the case if this battle is worth fighting or you can give it up in order that the bigger war has to be fought. In that case pick the smaller battles carefully so your energy is conserved for the right purpose."},{"t":"p","x":"5 of wands as a Feeling shows deep disappointment as the events might turn out contrary to your expectations. The people you trust might turn against you. They might openly challenge you or they might be backbiting you. Its a time of treason and betrayal by those you trust. One of your trusted ones might even be sharing your confidences with your opponent or rival. So beware when the five of wands turns up in the reading."},{"t":"p","x":"Travel plans are also thwarted when this card has been appearing in the reading. Its again a reminder to pay attention to small details and documentation. Even the slightest overlooking on your part can give an advantage to your opponent or adversary. Destiny is not really supporting you at this juncture and its a test of your fortitude and combative spirit."},{"t":"p","x":"In a positive spirit this card can show innocuous events like a friendly sports match or appearing for a competitive exam or a public bidding for a project."},{"t":"p","x":"There is a dark side to this card and the fire energy can quickly escalate into trouble so always proceed with caution with this card of Conflict of the Suits wand."}],"id":"five-of-wands","reversed":[{"t":"p","x":"Combative situation, emotionally trying times, arguments and being in negative whirlwind, dear ones also opposing your views, need to retreat to silent space"}],"tone":"mixed"},{"name":"Six of Wands","num":6,"arcana":"minor","suit":"Wands","rank":"Six","start":154,"end":156,"meta":{"Element":"Fire","Planets":"Mars, Sun, Jupiter","Astrological Significance":"Jupiter in Leo","Favourable Color":"Red Brown Green","Chakra Associated":"Solar Plexus"},"rating":"Very Positive Card","body":[{"t":"p","x":"Six of wands is a signal of victory and success after a hard fought battle. Your leadership is publicly acknowledged and felicitated."},{"t":"p","x":"Imagery : The leader is sitting atop a white horse and moving through a cheering crowd. His leadership is proclaimed by the winning wreath on the wand he is holding."},{"t":"p","x":"This card is a very positive card of the Wand series and a clear indication of success, victory and accomplishments. In a reading it shows that your aims will be fulfilled, you will be rewarded with gifts or monetary incentives, you have made or are about to make a significant conquest."},{"t":"p","x":"Long delayed success and pending rewards are also indicated when this card comes in the reading."},{"t":"p","x":"Since it comes after the five of wands which showed fierce combat or competition for the rewards, this six shows the victory of the smartest, the strongest or sometimes even the most fortunate for when Lady Fortune smiles on her favoured one, all competition falls far behind."},{"t":"p","x":"Here is a clear victor who has marched ahead of all others and is extremely delighted about it. As a feeling card, it signals extreme happiness, sense of pride and achievement as also relief at having obtained what you long desired. This card actually describes how the moment of Triumph can be reached. It shows that high amounts of confidence and optimism are required to rise the horse of victory as also popularity. Its the followers who make the leader and thus having a great chemistry and rapport with your followers is also integral to the secret of being a successful leader. The inherent lesson is a leader needs to cooperate rather than compete. In its best representation, the six of wands shows a person who can inspire others with belief and confidence. Another theme of this card is that the accomplishment should be enjoyed at the present but there is lots more to conquer for a leader. The white horse is symbolically slowly moving forward so it advises to not rest on past laurels and not get complacent about the success. Celebrate and feel exhilarated and then keep your mind on the next goal. A winner is always thinking forward."}],"id":"six-of-wands","reversed":[{"t":"p","x":"Corruption, megalomania, fall from power, loss in elections, loss in competitive exam, loss of popularity, not getting recognition for your efforts"}],"tone":"positive"},{"name":"Seven of Wands","num":7,"arcana":"minor","suit":"Wands","rank":"Seven","start":156,"end":158,"meta":{"Element":"Fire","Planets":"Mars, Sun, Jupiter","Astrological Significance":"Mars in Leo","Favourable Color":"Blue, Brown Green","Chakra Associated":"Solar Plexus"},"rating":"Gray Card indicating struggle.","body":[{"t":"p","x":"The Seven of swords , much like the Five of wands suit is also carrying the message of troublesome times. Stressful times are beckoning and you will need all your inner reserves to face the challenging situation."},{"t":"p","x":"Imagery : The young man is standing atop an elevation in a very defiant posture. With his wand firmly held horizontally across his chest, he is combating against several other wands that are opposing him. His mismatched shoes indicate he is fighting on the backfoot and was not prepared for the onslaught. The 7 of wands is a card that highlights the value of Courage. The astrological signature for this card is Mars in Leo. This is a combination of great dynamism and pulsating will power and desire to dominate and establish own sovereignity. In this card a very tough situation can come to challenge you. The adversary or adversaries are not of a common stature and have the influence to alter your decisions and your way of thinking. They might belong to your family or close circle of contacts, persons whose opinions matter to you. The time for celebration has passed and now you must prove with new and harder challenge that you are upto the task. Its a test of whether you will succeed or whether you will give up and withdraw. This is a card which tests your determination and staying power. A big challenge is flung at you. You may be unprepared or just partially prepared but its imperative that you make a success out of it so you can proceed towards the culmination points of 9 and 10 of wands."},{"t":"p","x":"It shows you are in for a power struggle but the fact that you are elevated as compared to the adversaries shows you having the upper hand. So you must capitalize upon that advantage. Inner battle will be paramount. You will have doubts and conflicts in your mind. Keep your faith. It is said that winning is a result of not only having a view point but also putting all your energy behind sustaining it in face of all conflicting opinions. So make your choice and then defend it with all your might. You have the resilience to make your presence felt with a thump. Very often the struggle depicted in seven of wands takes place inside you. You may feel the burden of other people’s expectations and this will stress you out as you garner all your resources to rise to the occasion. As feelings this card is of confusions and dilemmas and having self doubts. The resultant mental battle will make you stronger and also clearer in your convictions."},{"t":"p","x":"This card can also bring to you a situation where you have achieved a great deal but still have some way to go. You may know that the end is in sight but yet its a struggle to muster the necessary energy for that final effort. The message is not to give up and keep at it doggedly as resilience makes you a better person as also more successful, in the mundane world as well as your soul journey. This card is difficult but when taken in the positive spirit can burn the impurities inside you and make you gold in the fire of trying times."}],"id":"seven-of-wands","reversed":[{"t":"p","x":"Lack of self conviction, easily being defeated or persuaded, health deterioration, voices in the head troubling your daily life, powerlessness"}],"tone":"mixed"},{"name":"Eight of Wands","num":8,"arcana":"minor","suit":"Wands","rank":"Eight","start":158,"end":160,"meta":{"Element":"Fire","Planets":"Mars, Sun, Jupiter","Astrological Significance":"Mercury in Sagittarius","Favourable Color":"Brown, Blue, Green","Chakra Associated":"Solar Plexus"},"rating":"Very Positive card","body":[{"t":"p","x":"In the Tarot, the suit of the wands is all about adventure, risk\u0002taking, and creative enterprising. The 8 of this suit represents events unfolding that will help you to take the lead on a situation you are asking the Tarot about."},{"t":"p","x":"Imagery : Here we see 8 wands moving quickly against a bright and sunny background, with some water in the background showing the passage of time. The wands are facing downwards towards the Earth and there is no human or animal figure in this card indicating that the proceedings are beyond the control of Human will to a large extent. The 8 of Wands is a powerful card for long pending changes which have not been transpiring inspite much effort and desire. The recent past has been plagued by stagnation and the situation is demanding a breakthrough."},{"t":"p","x":"When this card appears, Big positive changes have already started gaining momentum in the environment. The change will now be swift and decisive. Its a very positive card when one is waiting for a situation to improve or decision to be delivered. This card is also redolent with passion and feelings of attraction. When asked for a relationship issue, it brings welcome news where attachments will become stronger and transparent communication about feelings will be exchanged."},{"t":"p","x":"Travel is surely on the cards when the eight of wands makes an appearance. Air travel is generally indicated but it can encompass swift road travel too. The wands are moving swiftly so plans will be made swiftly. There shall be no obstacles and sometimes it can catch you by surprise because you were not expecting a change in the situation so rapidly and might be caught unawares."},{"t":"p","x":"Some Tarot readers also see a symbol of seasons changing under this card, so you may see a new\"season\" of life in the situation you are asking Tarot about."},{"t":"p","x":"The only thing you know for sure when you see the 8 of Wands is that change is coming, and it is likely coming out of the blue. Being able to roll with unforeseen scenarios in both love and life will be the keys to your success when you see the 8 of Wands. This is not a card to stop and think things through on. Whatever opportunity the Universe presents you with, use it or lose it."},{"t":"p","x":"Eight of wands is also a message of rapid communication. It could be an exchange of ideas in a board meeting or an interview or a debating event or a political showdown. The exchange of ideas will be intellectual and would need to be moderated intelligently and channelized towards a constructive decision."}],"id":"eight-of-wands","reversed":[{"t":"p","x":"Excess physical or nervous energy, confusion regarding where to focus efforts, abrupt delay in ongoing work, too many castles in air but lacking groundwork, speaking too quickly so message is not understood, caution in travelling and driving, lack of sleep, over-excitement so lack of attention to details"}],"tone":"positive"},{"name":"Nine of Wands","num":9,"arcana":"minor","suit":"Wands","rank":"Nine","start":160,"end":162,"meta":{"Element":"Fire","Planets":"Mars, Sun, Jupiter","Astrological Significance":"Moon in Sagittarius","Favourable Color":"Brown Green","Chakra Associated":"Solar Plexus"},"rating":"Medium Positive card with note of caution","body":[{"t":"p","x":"Nine of Wands is one of the final cards of the wands suit and displays a cycle that is about to be completed and the feelings of exhaustion or hopelessness that may creep in when a person is about to achieve his goal."},{"t":"p","x":"Imagery : The weary and defensive person is standing against eight wands in the background he holds on to one wand in defence. He is injured and bandaged and may have been afflicted physically or mentally during his long wand journey. The initial fire has been consumed to a large extent and the embers need some stoking so that the fire burns again and the completion point is reached."},{"t":"p","x":"This card can represent life’s resiliency- a [person who has suffered great level of sorrow, or oppression or suppression of innate desires has the ability to come back in a fighting position. Its the card of the underdog, who has suffered enough at the hands of adverse circumstances but finds the last ounce of energy to hit back and race to the finishing line. If you have been feeling exhausted due to previous skirmishes, the card reassures you that not only will you cope with the trying circumstances but also succeed especially if this card is supported by success cards like six of wands or the Sun. Somehow you will find the necessary courage and strength to see things through. You should try to rely on a good adviser or a support system for this critical time to pass through. This card can also indicate jealousy and negativity by people who have been following your success graph till date. They might try to discourage you to take the last step or demoralize you by weakening opinions. Defend yourself; shield yourself against such attackers. Conserve your psychic energy. Stay resilient and strong. You are close to the Goal Point."}],"id":"nine-of-wands","reversed":[{"t":"p","x":"Over defensive about something, not accepting necessary cooperation, physical exhaustion, mental over-wroughtness, nervous breakdown, Burn Out"}],"tone":"mixed"},{"name":"Ten of Wands","num":10,"arcana":"minor","suit":"Wands","rank":"Ten","start":162,"end":165,"meta":{"Element":"Fire","Planets":"Mars, Sun, Jupiter","Astrological Significance":"Saturn in Sagittarius","Favourable Color":"Brown","Chakra Associated":"Solar Plexus"},"rating":"Positive card with caution","body":[{"t":"p","x":"The Ten of wands is a card of reaching the end of your wands journey. Its a card spelling achievements and fulfillment of one’s passions. There might have been a price to pay for it though. This card imbues you with the feeling that you can do anything, but also warns not to take things for granted. Imagery : The inspiration for the image of the lone person being weighed down by his ten wands of excessive responsibilities has the astrological reference of Saturn in Sagittarius. The heaviness of Saturn has overcome the joyous freedom of the Sagittarian spirit, which is oppressed within the confines of the material world."},{"t":"p","x":"The excessive burden indicates his sole struggle over a long period of time. He seems fatigued but he is now almost near the destination and will have time to rest and revel. The ten of wands indicates that a long journey full of challenges and struggles is finally over. The destination or goal post is very near. The burden however still remains daunting and it will overwhelm you if you are not cautious. You have clearly taken on more than you can shoulder and now its weighing heavily on you. Your physical or mental health is deteriorating due to the extra pressure."},{"t":"p","x":"This card indicates an obsession with undertaking responsibilities. Sometimes it could be thrust upon you by work exigencies but this card shows the willingness of the person to take on more than he can handle. You have taken on something for which you may be totally equipped. You are feeling the heat of the demands made on you but your dedication to the purpose will make you work harder to fulfill it even though your own health and life quality may be compensated Sometimes its difficult to set your boundaries and the 10 of wands is one such illustration. In your enthusiasm and firm self confidence you may jump in to shoulder projects or obligations without considering if you will be able to handle them long term. You have taken on too much, this card suggests and are now finding it difficult to fulfill your commitments. Another factor which is aggravating the situation is your non desire to delegate or share the responsibilities. You are not sure if any other person will be able to perform the task as well as you can and hence keep on accumulating more and more in your own portfolio till it becomes a one man army. At times the pressure may come to you from a higher authority and you are not in a position to say No. You are simply burdened with over work and not get enough time to recuperate. And the hard worker that you are, you will put your head down and keep slogging at it."},{"t":"p","x":"If you are self employment, this indicates a period where you will be inundated with work and you will be racing against time to complete it. Sometimes your reputation may have increased and thus you become the next big thing in your field and there are many agencies demanding your time, attention and opinions. All of it can be exciting for a wands(fire) driven person like you but will leave you exhausted. As per the image the figure is so immersed in the details of his work that he cannot see ahead. Maybe its the time to step back and see where exactly this work load is taking him and whether he can adjust the responsibilities in a manner that the individual load on him is eased."},{"t":"p","x":"10 of wands advises to share your work load with others in your team. That will help you devise a more practical strategy to bear the load till the end. Else there might be a physical or mental breakdown much before you get to enjoy the results of your achievement."}],"id":"ten-of-wands","reversed":[{"t":"p","x":"Time of great relief, unburdening of duties, feeling relaxed and free spirited, accepting cooperation for greater good of all, win-win situation, balancing work and pleasure, health situation improving"}],"tone":"mixed"},{"name":"Page of Wands","num":11,"arcana":"minor","suit":"Wands","rank":"Page","start":165,"end":168,"meta":{"Element":"Fire","Planets":"Mars, Sun, Jupiter","Astrological Significance":"Personification of Fire (Element only)","Favourable Color":"Orange Yellow Red Brown","Chakra Associated":"Solar Plexus"},"rating":"Positive Card","body":[{"t":"p","x":"The page of wands is the young message bearer or initiator of the WANDS suit and carries the seed of new project, new passions and is high on excitement and energy to achieve. Imagery : A well dressed dapper looking young man is holding up the wand and gazing at with speculation on its potential. The landscape is barren where the fire of creativity has yet to fructify the manifestation. The page looks set for travel and adventure as his red feather signal his connection to the spirit realm from where he downloads his messages."},{"t":"p","x":"As a situation the page of wands is a new opportunity or the seed of an idea that is inspired by a passion birthed inside your heart. It signals your deepest attachment to a dream you have always wanted to follow and which keeps the fires of your enthusiasm burning brightly. Its the beginning of an exciting new enterprise, or following a new spiritual endeavour or pursuing a passion that has been dear to you. It can also indicate an exciting new romance or friendship where mutual chemistry is crackling. Its an idea that keeps you awake at nights; it inspires you to that great an extent. Even if you are of a mature age or not very excitable by nature, this is one initiative that is making your heart beat fast again. It males you feel young and full of energy and aspiration. It could be related to pursuing a new course of study or writing a book or creating a design of a new home. Its energizing and achievement oriented and will give you a personal high. Its something you owe to yourself; your ode to self-creation. Right now, with the wand popping up its still at the idea stage and will need careful planning. Do not allow it to fizzle out since it fills you with so much renewed energy and objectivity."},{"t":"p","x":"Page of wands indicates excitement and new experiences coming in your life. It the time to explore the hidden aspects of your personality and not shy away from popularity and good times. Its a time to be free and express yourself in ways that make you feel alive. Travel also is on the cards when this page comes along. Generally it will be a holiday but can indicate relocation too if accompanied by majors of change like the Wheel of Fortune or The World in the spread. Life will also move at a more hectic page, this page denotes. The fire energy is crackling here and your motivation to meet and connect with like minded souls will be greater. There will be more intensity and warmth in your temperament and there will be a lot going in your life and you will be loving the need for being on your toes."},{"t":"p","x":"As a person the page of wands is high on enthusiasm and eager to achieve. He has high levels of physical energy and mental excitement that make him an exciting companion to have around. He takes orders well and has good management skills. He is flexible in his thinking and is willing to travel to achieve his goals. He is intellectually stimulating and willing to try out various options. He is terrific person to have on your team as he is self motivated and keeps the environment upbeat too. Sometimes the Page may bring unexpected news which might compel you to change your pre scheduled plans at the last minute.Life will be at a faster pace and you will need to be buoyant and mentally receptive to live out this phase."}],"id":"page-of-wands","reversed":[{"t":"p","x":"Love for thrill and achieving the impossible, finding ways to add excitement to life, holding a new idea close to chest, temper tantrums in frustration or unhappiness, riddled with self-doubts"}],"tone":"positive"},{"name":"Knight of Wands","num":12,"arcana":"minor","suit":"Wands","rank":"Knight","start":168,"end":171,"meta":{"Element":"Fire","Planets":"Mars, Sun, Jupiter","Astrological Significance":"Cusp of Scorpio / Sagitarrius","Favourable Color":"Yellow Red Brown","Chakra Associated":"Solar Plexus"},"rating":"Positive card","body":[{"t":"p","x":"The knight of wands is that breakthrough moment in life when all the inertia and procrastination that had been with you needs to be shed off, swift decision needs to made and followed up by aggressive, even defiant march to attain your goals."},{"t":"p","x":"Imagery : The knight is in armour and seated on a horse that looks ready for battle action. The legs of this horse are in the air indicating his energy and drive to go straight for the kill. The fire element is most manifest when the Knight of fire/ wands is in action. The horse is orange in colour and his teeth are bared because he is angry."},{"t":"p","x":"The look on the knight’s face is determined. The tassels on his dress, the mane of the horse are all quivering and represent the fiery energy of this element in its prime."},{"t":"p","x":"This is a situation of brimming vitality and unrestrained energy. Be prepared for hectic and bustling times. The targets will be ambitious and the drive to achieve them will be higher. When this knight appears, you have no patience for protocol and rules and want to take swift and cutting action. This card also brings you travel and adventure. The trips will excite you to physical and mental limits of your being as you may experiment with activities that till now you have only admired from afar but not had the courage to get into. Your confidence is high and thrill beckons you."},{"t":"p","x":"You may be going in for long distance road travel or a trip to another country. The trip will seldom feature resting in a secluded spot or luxuriating in a spa. You may be visiting somewhere for the first time and exploration of the local treasures will be high on the agenda."},{"t":"p","x":"This card can also indicate that you would get visitors to visit you from another country. You will be engrossed in keeping them entertained and after a while it might become a bit tiresome for you."},{"t":"p","x":"This constant action is a feature that is often seen with the knight of wands and over a period of time others mind find it difficult to match pace with the frenetic activity level. As a person the knight is a conqueror, of milestones, of hearts, of whatever he sets out to establish his control over. He is very popular with the people due to his vitality that he exudes. His presence itself is energising. Moving and interacting swiftly, he motivates people and mostly towards a higher ideal. His aura and energy is larger than life. His reputation precedes him and people look for opportunities to talk with him because he transfers his unique energy on to whomever he meets. Within minutes he maintains fiery eye contact and motivates those he comes in contact with."},{"t":"p","x":"He is a natural leader and relishes being so. Loves being the centre of attraction where he gains applause and stimulating company. He has many interests and projects, which he supports with enthusiasm. He hates to be bored and loves fun and adventure. Fond of travel, he is an impulsive and daring person who has an inherent attraction to dangerous sports and dare devilry acts."},{"t":"p","x":"His hastiness and unwillingness to listen to others wishes and fears is one of his weaknesses. He wants quick action and quicker results but this impulsiveness may be unpalatable to many. This also makes him the black sheep of the group dynamic at times but he is charming enough and intelligently makes his way back into hearts."},{"t":"p","x":"As a friend and lover, he is exciting company to have around. He will plan with enthusiasm and keep all those around excited with his eagerness to experiment and explore their talents."},{"t":"p","x":"This knight has an unpredictable streak and is capable of galloping alone forward if the inner vision seizes him and his team members are unable to match his energy. He might pursue several projects at one time but may not have the patience to see them through. His interests shift rapidly and he needs constant new challenges to his mind."},{"t":"p","x":"All in all he is a great leader and initiator but his unbridled ebnergy and dynamism needs to be channelized for great achievements to be consolidated."}],"id":"knight-of-wands","reversed":[{"t":"p","x":"Love for attention but lacking natural rapport building skills, quick tempered & demanding, creating controversies to be noticed, attention seeker, prone to sudden emotional outbursts, impatient and manipulative"}],"tone":"positive"},{"name":"Queen of Wands","num":13,"arcana
