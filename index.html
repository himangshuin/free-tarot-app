<title>Tarot Reader's Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Marcellus&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: sticky top bar with five sections; Cards = search + grid beside a detail column (detail replaces list on phones). Plum ink, marigold accent, one colour per suit. */
:root{
  --bg:#F2F0F6;--surface:#FFFFFF;--surface2:#E9E5F0;--ink:#26183A;--muted:#645A7A;--line:#D8D2E3;
  --accent:#B7791F;--accent-ink:#85540C;--on-accent:#FFFFFF;
  --wands:#B8431F;--cups:#1F6A9C;--swords:#5E5A8C;--pent:#3F7A33;--major:#A8680B;
  --good:#2F7A3B;--warn:#9A6A00;--bad:#B3341F;--mark:#F7DE9A;--shadow:0 6px 24px rgba(38,24,58,.12);
  --f-display:'Marcellus','Cormorant Garamond',Georgia,serif;
  --f-body:'Source Serif 4',Georgia,'Times New Roman',serif;
  --f-ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151021;--surface:#1E1730;--surface2:#2A2140;--ink:#EEE8F7;--muted:#A79DBD;--line:#3A2F55;
  --accent:#E9B045;--accent-ink:#F0C26A;--on-accent:#1B1226;
  --wands:#F07A50;--cups:#5FB0E6;--swords:#A9A4E0;--pent:#88C46F;--major:#E9B045;
  --good:#7CCB87;--warn:#E9B045;--bad:#F08A78;--mark:#5B4720;--shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151021;--surface:#1E1730;--surface2:#2A2140;--ink:#EEE8F7;--muted:#A79DBD;--line:#3A2F55;
  --accent:#E9B045;--accent-ink:#F0C26A;--on-accent:#1B1226;
  --wands:#F07A50;--cups:#5FB0E6;--swords:#A9A4E0;--pent:#88C46F;--major:#E9B045;
  --good:#7CCB87;--warn:#E9B045;--bad:#F08A78;--mark:#5B4720;--shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.wrap{max-width:1240px;margin:0 auto}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
.brand svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:2}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
@media(max-width:620px){.tabs{order:3;flex-basis:100%}.brand{flex:1}}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current=page]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs a:hover{color:var(--ink)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
/* generic */
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4vw,40px)} h2{font-size:24px} h3{font-size:19px}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.sm{padding:4px 10px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px}
button.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.page{padding-top:22px}
.lead{max-width:62ch;color:var(--muted);margin:6px 0 0}
/* card faces */
.cf{--c:var(--major);width:var(--w,88px);aspect-ratio:5/8;border:2px solid var(--c);border-radius:7px;background:var(--surface);color:var(--c);display:grid;grid-template-rows:auto 1fr auto;justify-items:center;align-items:center;padding:6% 5%;position:relative;flex:none;
  box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent)}
.cf.s-Wands{--c:var(--wands)}.cf.s-Cups{--c:var(--cups)}.cf.s-Swords{--c:var(--swords)}.cf.s-Pentacles{--c:var(--pent)}
.cf .n{font-family:var(--f-display);font-size:calc(var(--w,88px)*.2);line-height:1}
.cf svg{width:56%;height:auto;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cf .t{font-family:var(--f-display);font-size:calc(var(--w,88px)*.115);line-height:1.1;text-align:center;color:var(--ink);text-wrap:balance}
.cf.rev{transform:rotate(180deg)}
.cf.back{background:repeating-linear-gradient(45deg,var(--surface2) 0 6px,var(--surface) 6px 12px);color:var(--accent)}
.cf.back>*{display:none}
.cf.back::after{content:"";width:40%;aspect-ratio:1;border:2px solid var(--accent);transform:rotate(45deg);position:absolute;inset:0;margin:auto;background:var(--surface)}
.revtag{font-size:11px;font-weight:600;color:var(--bad);letter-spacing:.04em}
/* cards view */
.browse{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:start}
@media(min-width:980px){.browse.has-detail{grid-template-columns:minmax(0,1fr) minmax(0,560px)}}
@media(max-width:979px){.browse.has-detail .list{display:none}}
.searchbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 10px}
.search{flex:1 1 280px;position:relative;min-width:0}
.search input{width:100%;padding:12px 14px 12px 42px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
select{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
.tile{display:flex;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;text-decoration:none;color:inherit;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile[aria-current=true]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent)}
.tile .tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.15}
.tile .snip{font-family:var(--f-body);font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.groupt{grid-column:1/-1;margin:14px 0 0;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.daily{display:flex;gap:16px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;margin-top:6px;text-decoration:none;color:inherit}
.daily:hover{border-color:var(--accent)}
.tone{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.tone::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.tone.positive{color:var(--good)}.tone.mixed{color:var(--warn)}.tone.challenging{color:var(--bad)}
/* detail */
.detail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
@media(min-width:980px){.browse .detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);max-height:calc(100vh - 80px);overflow:auto}}
.dh{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.dh .ti{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:8px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:14px 0 0;font-size:14px}
.meta dt{color:var(--muted)} .meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:16px 0 4px}
.seg button{border:0;background:var(--surface);padding:7px 14px;font-weight:500}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.sect{margin-top:18px}
.sect>h3{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px}
.sect>h3 small{font-family:var(--f-ui);font-size:12px;color:var(--muted)}
.prose{font-family:var(--f-body);font-size:17px;line-height:1.65;max-width:68ch}
.prose p{margin:0 0 .85em;overflow-wrap:anywhere}
.prose h4{font-family:var(--f-ui);font-size:14px;font-weight:700;margin:1.2em 0 .4em}
.prose ul{margin:0 0 .85em;padding-left:1.2em}.prose li{margin:.2em 0}
.prose p.dim,.prose li.dim{opacity:.28}
.prose .nomatch{color:var(--muted);font-style:italic}
.revbox{border-left:3px solid var(--bad);padding-left:14px}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:20px;flex-wrap:wrap}
.crumb{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
/* spreads */
.spgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:18px}
.spcard{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px}
.spcard:hover{border-color:var(--accent)}
.spcard b{font-family:var(--f-display);font-weight:400;font-size:19px}
.layout{margin:20px 0;--w:clamp(58px,13vw,92px)}
.layout.row{display:flex;flex-wrap:wrap;gap:18px 14px}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;width:calc(var(--w) + 30px);text-align:center;background:none;border:0;padding:0;color:inherit}
.slot .pn{font-size:12px;font-weight:600;line-height:1.2;color:var(--muted)}
.slot .cn{font-size:12px;line-height:1.2}
.slot .pk{border:1px dashed var(--line);border-radius:7px;width:var(--w);aspect-ratio:5/8;display:grid;place-items:center;font-size:12px;color:var(--muted);background:transparent}
.layout.celtic{display:grid;grid-template-columns:repeat(3,auto) auto;grid-template-areas:". p4 . s10" "p5 p1 p6 s9" ". p3 . s8" ". . . s7";gap:12px 10px;justify-content:center;max-width:640px;margin-inline:auto}
.layout.mandala{display:grid;grid-template-columns:repeat(3,auto);gap:14px;justify-content:center}
.layout.ring{position:relative;aspect-ratio:1;max-width:760px;margin:50px auto 60px;--w:clamp(40px,9vw,64px)}
.layout.ring .slot{position:absolute;transform:translate(-50%,-50%);width:calc(var(--w) + 14px);gap:3px}
.layout.ring .slot .slot{position:static;transform:none}
.layout.col{display:flex;flex-direction:column;align-items:center;gap:12px}
.layout.col .slot{flex-direction:row;width:auto;gap:14px;min-width:min(100%,300px);justify-content:flex-start;text-align:left}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;margin-top:16px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--muted);font-weight:600}
.tw{overflow-x:auto}
.insight{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px}
.insight>div{background:var(--surface2);border-radius:10px;padding:12px;min-width:0}
.insight b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
textarea{width:100%;min-height:80px;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
input[type=date],input[type=number],input[type=text]{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.big{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--accent-ink)}
/* library */
.lib{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media(min-width:900px){.lib{grid-template-columns:280px minmax(0,1fr)}}
.toc{display:flex;flex-direction:column;gap:2px;font-size:14px}
@media(min-width:900px){.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);max-height:calc(100vh - 90px);overflow:auto}}
.toc a{padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--ink)}
.toc a:hover{background:var(--surface2)} .toc a[aria-current=page]{background:var(--surface2);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.toc h4{margin:12px 10px 4px;font-size:12px;color:var(--muted);letter-spacing:.05em}
.hit{display:block;padding:10px 12px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.hit:hover{background:var(--surface2)} .hit small{color:var(--muted);display:block}
.hit span{font-family:var(--f-body);font-size:15px;overflow-wrap:anywhere}
/* modal + toast */
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,6,20,.6);display:grid;place-items:start center;padding:max(20px,env(safe-area-inset-top,0px)) 12px 20px;overflow:auto}
.modal>div{background:var(--surface);border-radius:14px;max-width:640px;width:100%;padding:18px;box-shadow:var(--shadow)}
.modal .x{float:right}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:90;font-size:14px}
.pickres{display:grid;gap:6px;margin-top:10px;max-height:50vh;overflow:auto}
footer{margin-top:40px;color:var(--muted);font-size:13px;max-width:70ch}
@media (prefers-reduced-motion:no-preference){.cf{transition:transform .25s}.detail,.panel{animation:in .2s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}
</style>
<header class="top"><div class="top-in">
  <a class="brand" href="#cards"><svg viewBox="0 0 48 48"><path d="M24 4l4 16 16 4-16 4-4 16-4-16-16-4 16-4z"/></svg>Tarot Reader's Desk</a>

</div></header>
<main class="wrap page" id="app" aria-live="polite"></main>
<script type="application/json" id="data">{"cards":[{"name":"The Fool","num":0,"arcana":"major","suit":null,"start":82,"end":84,"meta":{"Archetype":"The Child","Task":"Trying out new things without any bias","Element":"AIR","Crystal Guidance":"Quartz, Green Tourmaline","Color Guidance":"Yellow"},"rating":null,"body":[{"t":"p","x":"As Card 0, the Fool lies at the beginning of the Major Arcana, but also somewhat apart from the other cards. In a few traditions of Tarot thought its regarded as Card No 22 who has completed the journey to Completion. There is an inherent wisdom and detachment in this card that in a way is a metaphorical allegory to soul freedom."},{"t":"p","x":"A male figure stands at the edge of the cliff. He has a dreamy smile on his face and is looking up at the sky, lost in his own thoughts. At the very next step, of he is not cautious, he would step over into the steep ravine, to calamitous results. He carries a hobo’s sack over his shoulder which seems light and basic. There is a small dog nipping at his feet, the voice of caution. It is warning him of the danger ahead. The Fool does not seem to be cognizant of the warning bells. The Fool is an archetypal traveller who stays just long enough to break old patterns and set new ones. He hides a deep wisdom that comes from having an unconventional, observant eye and standing on the periphery rather than in main stream."},{"t":"p","x":"The Fool is an eternal optimist and travels through life with no emotional baggage and assumptions from past experiences. He is receptive, open, innocent, trusting, spontaneous and joyful. He is a man who lives his life on his own terms and has no regard for societal norms and restraints. A Free Soul. This card indicates new beginnings, setting out on a new adventure and being open to novelty in experience after a painful period has gone by. It indicates the blind\"Leap of Faith” that life sometimes demands of us in order to experience the self enlightenment that awaits each of us."},{"t":"p","x":"A thousand mile journey, they say begins with a single step and the Fool is ironically wise because without fear and guilt, he is brave enough to set out his first steps into an unknown world."},{"t":"p","x":"On the downside, the Fool may also be read as a reckless or an unplanned action that could lead to losses for self or others. The voice of caution needs to be heeded else you could face destruction. Refusal to acknowledge it is a sign of foolishness."}],"id":"the-fool","reversed":[{"t":"p","x":"Impractical and naive behaviour. Too much trust in the goodness of people."},{"t":"p","x":"Not listening to wise counsel. Indifferent to Intuition. Impulsive and rash decisions."},{"t":"p","x":"Poor leadership and overconfidence in own vision. Not having individual confidence and being bound by social conventions excessively."}],"astro":{"planet":"Uranus","planetText":[{"t":"p","x":"The astrological Fool tells you to move forward and try a new direction, even if it seems risky. This is your chance to do your own thing, guided by inner confidence / latent talent so take the Leap of Faith ahead. Refrain : Do not listen to others who try to discourage you from taking a chance to try something new."},{"t":"p","x":"Beware of jealousy and possessiveness of those who try to hold you back. Also beware of being arrogant or overconfident. Take the leap only if inner belief is very strong."}]},"crystals":"Lepidolite, Agate, Tourmaline","gems":"","keywords":["Beginnings","Originality","Spirituality","Eccentricity","Unconventional","Folly"],"tone":null},{"name":"The Magician","num":1,"arcana":"major","suit":null,"start":84,"end":87,"meta":{"Archetype":"The Creator, the Master","Task":"Activity, Taking Initiative, Giving Impulses, Accepting Tasks and Mastering them","Element":"AIR, EARTH","Crystal Guidance":"Opal, Garnet","Color Guidance":"Red"},"rating":null,"body":[{"t":"p","x":"The Magician can be male or female but even if female, the energy will be Alpha and very masculine. This figure stands alone and dominates the frame. He has a young face and wise eyes; he is ageless. Dressed in Red, the Color Guidance of power and ambition he was born to create the world that downloads into his mental space and has the divine blessing (symbolized by the Infinity symbol above his head) to manifest it into reality."},{"t":"p","x":"One arm, holding the Crystal Guidance wand, points towards the Heavens indicating his divine connection and high level of imagination. The other arm points towards the Earth indicating his determination coupled with his vision to actually make his dream come alive into reality in the material world. It resembles the Greek letter ‘ALEPH” which translates into\" AS ABOVE, SO BELOW”"},{"t":"p","x":"The belt around his waist is of special importance. In most decks it is a coiled serpent, possibly Ourobouros, (the alchemical serpent swallowing up its own tail or perhaps the serpent that Moses and the Egyptian magicians were able to make come alive from their staffs)."},{"t":"p","x":"Spread out in front is a table with four objects symbolizing the four suits of the Tarot deck. There is a sword, a wand, a pentacle and a cup on the table. These are the resources which the adept has under his control. And that is the essence of this card; all the tools One needs to master Self and the World are within Himself. The abundance all around in the form of blooming flowers and lush greens indicate the prosperity and power inherent in this card’s energy. This card indicates the ability of the individual to use the resources that the Universe has gifted him with. He is blessed with intelligence and analytical mind and must learn to use the suits of the Universe in the perfect proportion like an Alchemist such that what he envisions can be translated into material manifestation."},{"t":"p","x":"The Magician is a card of material success and attributes. It indicates great ambition and foresight as also the blessings that will guide the Magician like person to find his way through the crossroads of life to create a spectacular world for Himself. The Magician indicates great success and power. It stands for high level of will power; self-control; discernment; self-confidence; freedom from control from others and a free imagination and the force of character that is required to establish your identity in the competitive world."},{"t":"p","x":"When this card comes up, it shows huge potential in the situation or the person being analyzed. Discernment and acumen must be used to translate this potential into bringing trans-formative changes that could positively affect the world.On the downside, this card could bring in misuse of power and the corrupt use of resources under control. The person could be manipulative and deceitful and cause harm to others on personal ascent to success. He could be a liar and a cheat and be engaged in fraudulent activities since he has supreme intelligence coupled with access to resources. He possesses superb communication skills and a subtle comprehension that he uses to his advantage and gain. The Magician is a powerful card, a trans formative Energy and how it plays out depends on the intentions as shown by the surrounding cards."}],"id":"the-magician","reversed":[{"t":"p","x":"Blockage in Self expression."},{"t":"p","x":"Carrying emotional pain and fears from past and not going with the flow Trapped energy manifesting as physical troubles or depression."},{"t":"p","x":"Poor communication skills and poor negotiation skills. Arrogance and misuse of personal power to dominate others or a situation."}],"astro":{"planet":"Mercury","planetText":[{"t":"p","x":"The astrological Magician tells you to be wise and assess your surroundings wisely & then take your decisions. Use communication skills to build your rapport & manage your responsibilities."},{"t":"p","x":"Refrain: Watch out for dishonesty and trickery from others. Be careful about paper work and documentation that you are involved in."}],"yearNumber":1},"crystals":"Amethyst, Tiger’s Eye, Citrine","gems":"Garnet","keywords":["Initiative","Skill","Activity","Cleverness","Contructive Power"],"tone":null},{"name":"The High Priestess","num":2,"arcana":"major","suit":null,"start":87,"end":90,"meta":{"Archetype":"The Queen of Heaven","Task":"Patiently waiting for an inner or outer impulse, silence, receptivity, healing serving as an echo","Element":"WATER","Crystal Guidance":"Aquamarine, Rose Quartz","Color Guidance":"Pale Yellow, Cream"},"rating":null,"body":[{"t":"p","x":"The High Priestess is denoted as a Female, generally seated on a high backed throne. She is holding a scroll or a book(called Tora) representing the divine law that rules and orders the Universe. The costume is pristine white and on her head is an elaborate Crescent Crown. The symbol of Holy Cross adorns her neck and she sits serenely, with a beatific expression on her face. She sits amidst two columns, black and white. The black column has the letter\" B” emblazoned on it while the black carries the letter”J” on it."},{"t":"p","x":"“B” signifies the word BOAZ which stands for Severity and\"J” stands for JACHIN which indicates Compassion / Mercy. These are Hebrew terms and represent the twin pillars of the Temple of Solomen (the Wise). The pillars act as a portal to the Mysterious. The top of the pillars culminate in lotus - like adornments, the symbols of enlightenment in Hinduism and Judaism. The two pillars bear the inherent duality of Nature which is ever present in our Mind as a tussle. This Dual-Unity we find is the key or evolution of Spirit, and the reason that these two ancient pillars has been preserved in our scriptures. The Human mind is fickle and fallible and oscillates between good and evil, anger and peace, divinity and materialism, detachment and attachment, action and passivity and so many other dualities."},{"t":"p","x":"The High Priestess represents the Wisdom to lead life on moderate terms. The Mind swings in a volatile manner from the extremes of darkness to brightness as it seeks to find divine unity in the duality of the nature of things. The Moon represents our Mind, in the astrological terms, and the High Priestess is the Queen of Emotional Equilibrium as she wears it a Crown upon her head. This signifies control over emotional fluctuations and temptations, recognizing the ingrained Oneness with the rules of the Universe."},{"t":"p","x":"The pomegranate laden background is the entrance to the Divine wisdom. If we make earnest calls to quieten the mind and listen to our Inner Voice, we shall be freed forever from the discord and struggle and be transmuted to harmony and purity. The High Priestess is the female creative force; the mother of all wisdom; the female aspect of God. She teaches that the knowledge and the understanding you seek is within you; the subconscious mind, To tap it, you must bypass your conscious mind, and avoid being seduced by the worldly distractions. The High Priestess expends her inner wisdom to be an excellent teacher or guide to souls in darkness and to nurturing those in need."},{"t":"p","x":"The High Priestess is deep in symbolism and makes us understand beautifully that there are times in life when absolute stillness is required to observe the action and chaos around us. No action is also an action and is required at certain junctures."},{"t":"p","x":"The High Priestess brings us to understand the power of Inner Silence and hearing the voice of the Intuition. It advises us to be patient and wait for the divine signal; not jump to conclusions and wait till all the information is presented before us in Divine timing-much like the waxing and waning of Moon presenting the completion of Moon before us but in divine synchronic timing."},{"t":"p","x":"The Crescent moon at her feet is symbolic of the half processed, impulsive emotions being under under her control and her possessing the grace and maturity to wait. When the High Priestess appears in a reading, its time to be passive and take stock of the situation without displaying any over\u0002reactions. Diplomacy and discretion are the need of the hour. There is also a sign that a higher force is at work so be humble and wait for suitable signals before making any decisions or judgements. The advice of a spiritual or psychological counsellor might be sought for complete comprehension of a situation and an unbiased course of action be given. This card additionally means secret knowledge, study of the Occult sciences, strategic and secret planning, high level of judgement power, spiritual powers and practices, deep research and study of a specialized subject, a female presence who can be intuitive and compassionate, a healing time in life, spending time communing with nature especially near water bodies."},{"t":"p","x":"On the down side the High Priestess displays delays in timing of an event. It shows a person who might be secretive and concealing the truth from you. A note of caution is also there as there might be undercurrents of strategic planning against you. The High Priestess also signifies solitude and loneliness, depressive tendancies, anti-social behaviour, mood swings, unpredictable behaviors, miscarriage and delays in conception."}],"id":"the-high-priestess","reversed":[{"t":"p","x":"Time to take initiative and make things happen by own energy. Warning that person should not sit passive but take active part in the situation."},{"t":"p","x":"Compulsion to introspect which causes discomfort to many. Miscarriage or abortion Depression and nervous breakdown Secrecy and matters hidden from the world."}],"astro":{"planet":"Moon","planetText":[{"t":"p","x":"The astrological High Priestess tells you to listen to your Intuition. Be silent and observe rather than being vocal or active."},{"t":"p","x":"Refrain: Do not be eager to perform action."},{"t":"p","x":"Think deeply about the situation and wait for divine guidance towards the right moment."},{"t":"p","x":"Listen to the Inner Voice & not be swayed by others’ opinions."}],"yearNumber":2},"crystals":"Aquamarine, Moonstone, Labradorite","gems":"Pearl, Moonstone","keywords":["Secrecy","Intuition","Delays","Spiritual Knowledge","Deep Issues","Things Hidden"],"tone":null},{"name":"The Empress","num":3,"arcana":"major","suit":null,"start":90,"end":93,"meta":{"Archetype":"The Mother, The Nurturer","Task":"Being fertile; bringing something new in this world","Element":"EARTH, AIR","Crystal Guidance":"Emerald, Green Jade","Color Guidance":"Brown"},"rating":null,"body":[{"t":"p","x":"The Empress is a commanding figure, resplendent in her flowing floral robes, glittering crown on her head; resting attentively yet languidly on her elaborate throne. Lush trees and crops thrive around her and fill the scene with bounty and happiness. She is holding aloft a sparkling Crystal ball topped wand in her right hand and her head is adorned with a 12 gem encrusted crown. The 12 gems signify the 12 zodiac signs of astrology and the twin red rubies embody the union of material and spiritual world. The throne on bottom left is emblazoned with the astrological symbol of planet Venus, the planet for Affluence, lavish lifestyle, material comforts and Passion."},{"t":"p","x":"The Empress is a mother figure, she is both a creative force and the ensurer of unity of elements required for the parables of the world to work in unison and not in opposition to each other. She represents the Earth element, the Mother Earth which is highly productive and compassionate and tends to the nourishment needs of all who reside on her, humans; animals; trees ; all flora and fauna who depend on her generosity and fertility power."},{"t":"p","x":"The Empress signifies a time of abundance and fructification, the result of consistent hard work and dedication. The symbol of Venus rules Taurus (security and determination) and Libra (balanced efforts, harmonising skills and favourable results). This figure can stand for the matriarch of the family or the head of a department or a corporation or a self employed creative entrepreneur. Wherever the Empress features there will be success through a visionary outlook, the patience and tact required to make various resources work in collaboration with each other and the flexibility to enjoy the fruits of the labour with abandon and lavishness."},{"t":"p","x":"She is the symbol of feminine instinct-intuitive flashes that enable you to make right decisions at the right time. The Crystal balled wand she carries gives her a deep imagination and divine flashes. She signifies love and harmony and spreads the message that when we collaborate peacefully and willingly to reach a common vision, the end result is well being and prosperity for all."},{"t":"p","x":"This card is very favourable in queries related to financial security and gains. Shows profitability and all round success. She creates an atmosphere where each person is free to develop their own individual potential. In a reading this advises that for your goal to be achieved, its desirable to take help or counsel from an experienced female figure. She could be wife, daughter, a close female relative, female boss, sister Etal."},{"t":"p","x":"This card also signifies deep and abiding love and passion. In marriage related issues, it promises dedication and commitment to marital vows. In love affairs, a deeply rooted attraction to each other that would become more mature and secure as time progresses. It indicates an upcoming marriage or an engagement in the surrounding environment. In fertility and conception related situation, indicates a time for family expansion and the impending birth of a child. The card comprehensively means fruitfulness of action; beauty and sexuality, domestic harmony, personal development and progress, soul understanding derived from personal experience, a period of success and riches after an unfortunate period; emotional and physical comforts;investments yielding lucrative results, luxuries and a comfortable lifestyle."},{"t":"p","x":"On the downside the Empress can show a selfish and self centered human presence, loss of power and control, misfortune and the feeling that stars are not supportive, doubts and difficulties, abortion or inability to conceive, domestic quarrels and inter personal clashes."},{"t":"p","x":"The Empress is a positive and empowering Tarot cards and generally indicates a time of personal glory and growth. As a single card or a significator card, its a direct message to work on your latent talents, self love and to be proud in a humble manner of your achievements and contributions in whatever domain of life you have been ordained to perform."}],"id":"the-empress","reversed":[{"t":"p","x":"Creative block and fear to express one’s ideas and opinions. Creative flow stagnating example-writer’s block."},{"t":"p","x":"Lack of inspiration and desire to live joyfully Financial difficulties and money flow being blocked. Delays in business bringing returns."},{"t":"p","x":"Problems in relationship with mother or with one’s own children. Sexual block, frigidness, lack of interest in physical proximity"}],"astro":{"planet":"Venus","planetText":[{"t":"p","x":"The astrological Empress tells you to think about your true values. Do nurture your generous and productive side that provides love and nourishment to many."},{"t":"p","x":"Refrain : Go easy on flaunting your abundance and propagate the message not only of material assets but of life ethics like hard work, patience and saving resources."},{"t":"p","x":"Control your sensual impulses."}],"yearNumber":3},"crystals":"Rose Quartz, Carnelian, Peridot","gems":"Zircon, Diamond","keywords":["Fertility","Abundance","Sensuality","Nurturing","Happiness","Fruitfulness"],"tone":null},{"name":"The Emperor","num":4,"arcana":"major","suit":null,"start":93,"end":96,"meta":{"Archetype":"The Father","Task":"Uncompromisingly turning long held intentions., ideas into reality","Element":"FIRE","Crystal Guidance":"Carnelian, Red Jasper","Color Guidance":"Orange"},"rating":null,"body":[{"t":"p","x":"The Emperor is mature, masculine figure seated on a stone throne. He looks stern and commanding with feet firmly planted on his territorial ground. He wears his robes over a full suit of armour. His throne is outdoors and mountains can be seen in the background. The mountains look stark and forbidding."},{"t":"p","x":"The essence of this card is Defence. The empire of love and bonds that the Empress had created with fortitude is now under threat and so the next milestone on the Fool’s Journey, the Emperor has stepped into the picture strongly. The Emperor is always ready to protect his territory and his beliefs. He is an imposing figure and in the real world will translate into a figure of official authority, a Law enforcement officer, Head of a family, head of a business enterprise or any other variation where resources need to be protected. The Emperor is the metaphorical male protector of the home; the father who guards and guides all those within his care. The Emperor is very strong in his authority and his convictions. He loves to rule over his people and dependancy with absolute control. At times a strict disciplinarian, he has total confidence in his leadership abilities and will not hesistate to turn to the stick in case disciplinary needs demand it. Sometimes a misfit in a rebellious and free-thinking group of people, the Emperor is nevertheless an experienced and reliable person and a gift to have around. He is loyal, wise and protective and is widely acknowledged for his fair and wise decisions."},{"t":"p","x":"He is also an empathetic teacher. The white beard is symbolic of his years of experience, could be actual or a reflection of his deep knowledge of a subject. He is very intelligent and has a keen eye to keep all perspectives in mind while making a judgement."},{"t":"p","x":"He is also very practical and worldly wise. The Emperor card teaches the meaning and use of worldly power. There are forces in the world which will try to thwart you, however fair and ethical you are. You must be prepared, at all times to fight for what you believe is yours or what you believe is right. The Ram’s head on the throne signifies power, force and virility. There are 4 ram heads carved in his throne, showing the stable energy of number 4. The Emperor card leads to creating structure out of chaos and laying down rules, policies and procedures for uniform governance."},{"t":"p","x":"This Major Arcana is associated with the Zodiac sign of Aries which reminds us of the fiery and authoritative energy of Aries Ram. It spells activity, energy and determination and a single minded focus to reach a predecided target or vision. The Emperor card is excellent when there is need for reassurance, whether emotional or material in the face of uncertainty. Where you need specific boundaries, achievement of specific goals, need for an authority figure then the Emperor is a much needed energy."},{"t":"p","x":"He brings logical thought processes that serve goal oriented situations very well."},{"t":"p","x":"This card indicates success and is regarded as a positive card in the deck in situations which need to systemised out of disorder."},{"t":"p","x":"Indicates promotions and financial security, deep understanding in relationships provided one partner gets the upper hand and a high level of expertise for students and career aspirants."},{"t":"p","x":"On the downside, when the surrounding energies are independent and calling for flexible contemplation and decision making then The Emperor can be seen as a dogmatic figure. His convictions are strong and he does not wish to change unless very strongly convinced."},{"t":"p","x":"He can also indicate unseen enemies and challenges, dissipation of energy, loss of power, demotions, fall from official grace and an indecisive temperament."},{"t":"p","x":"The Emperor stands for boundaries and ethics and duties. He stabilises and protects the extravagance that life offers. Its an attitude that's a necessity in order to move forward in the journey of self growth"}],"id":"the-emperor","reversed":[{"t":"p","x":"Breaking of unnecessary social norms."},{"t":"p","x":"Progressive movement. Long delayed work getting accomplished. Flexibility in approach and democratic decision making required."},{"t":"p","x":"A person developing sensitivity to others Loss of control and dominance Demotion or professional difficulty"}],"astro":{"zodiac":"Aries","zodiacText":[{"t":"p","x":"Aries is about asserting yourself and taking control of your life. Showing who the boss is. High on dogmatism and discipline and self initiated action. The Emperor carries attributes of conservatism and being high handed, not taking in opinions of others. Being single minded and protective and possessive will get you ahead for now, but take care that you do not push others too far."},{"t":"p","x":"Astrological Connotations of the 22 Major Arcana Cards Chapter-6"}],"house":1,"houseName":"House of Self","houseMeaning":"Physique, personality, all beginnings, outlook on life, health and vitality","yearNumber":4},"crystals":"Carnelian, Topaz, Sunstone","gems":"Ruby, Emerald","keywords":["Stability","Power","Authority","Discipline","Boundaries"],"tone":null},{"name":"The Hierophant","num":5,"arcana":"major","suit":null,"start":96,"end":99,"meta":{"Archetype":"The Saint","Task":"Paying attention to and respecting what is apparent and what is concealed; the search for meaning","Element":"EARTH","Crystal Guidance":"Blue Topaz, Celestite","Color Guidance":"Deep yellow (mustard)"},"rating":null,"body":[{"t":"p","x":"This card is regarded as the male counterpart of the High Priestess. A deep degree of spiritual and moral values is the lordship of the Hierophant card. This card, much like the Emperor also plays the role of the Protector and the Organiser. In the Hierophant imagery, a religious or spiritual guru / teacher is firmly seated on a throne. He is wearing red robes and the underdress is white with clearly demarcated 3 crosses Two fingers of his right hand are pointing upwards towards the Heavens while two fingers are pointing towards the Earth. He also holds in his left hand a scepter bearing the representative symbol of the religious trinity. The three crosses on his white collar indicate the presence of trinity in his speech and in his heart - he Father, The Son and the Holy Spirit."},{"t":"p","x":"It can also be translated as the Hindu Trinity of Brahma-Vishnu\u0002Shiva ; the Creator, the Preserver and the Creative Destroyer. Seated at his feet are two apostles, in a position of surrender and humility. They are awaiting more knowledge or are paying him homage. The inter-crossed golden keys are the keys of our subconscious which the Hierophant can enable us to access to open the portals of our progress."},{"t":"p","x":"The Hierophant is seated between the twin contrasting columns beyond which lies the realm of future growth in material or spirit terms. The Almighty functions at a frequency not discernible to the common man so the High Priest or the Hierophant is emblematic of the human representation of the divine presence in our society. All religions have individuals whose task it is to interpret the divine will for their followers. The more organised or structured the religion, the greater the authority of the Hierophant."},{"t":"p","x":"The Hierophant, in Tarot symbology, represents not just religious authority but also the Search for Truth. He is the interpreter of the secrets of the Universe, the mysteries of the Divine Will, the magician who shows us glimpses of what is our Higher Purpose in this lifetime."},{"t":"p","x":"He has an esoteric role to perform and ascend our knowledge to higher levels. Thus he could appear in our life as a Life coach, Astrologer, Tarot Reader, any Occult or Divination practitioner or a illuminated soul who provides you life guidance when you need it most."},{"t":"p","x":"This figure also symbolizes any philosophical or educational organization that mentors and conditions the minds of its followers/students. When this card appears in a reading, it is time to upgrade our beliefs or existing knowledge levels. The Hierophant has come or is about to come into our life for showing us our potential for growth and we should accept the invitation with humility."},{"t":"p","x":"The Hierophant is not always a favourable card. Unlike the High Priestess who selflessly uses her wisdom and compassion to enable others to find their true path, the High Priest or the Hierophant uses his power to increase his own authority over others. He is an institutionalized figure and may use the power he has over people to manipulate them or to serve his ego needs."},{"t":"p","x":"This card thus also gives the subtle message that in order to grow, we can explore the needs of our own soul or adapt your Self to the requirements of others."},{"t":"p","x":"On the downside the Hierophant can indicate religious dogmatism, extreme conservatism, need for social acceptance and approval, blind faith in an authority figure. The Hierophant is a powerful figure. He has the ability to make you or break you. You must decide if the advancement you want is worth placating this individual."}],"id":"the-hierophant","reversed":[{"t":"p","x":"Introspection of a long standing relationship and willing to cross examine it Rejection of “expected behaviour” and embracing change Out of turn promotions, swift academic/ professional advancement. A fun loving and adventuresome person or situation."},{"t":"p","x":"Taking risks to break the conventional limits and soar higher"}],"astro":{"zodiac":"Taurus","zodiacText":[{"t":"p","x":"Taurus needs to feel secure and safe and plans far ahead. Bestowed with prudent mind and a strategic intent, he is a careful planner. The Hierophant likewise who upholds traditions and rules in a situation or institution and will remind you constantly of keeping with the norms. But security sometimes can be suffocating and this energy too needs to be mellowed and stop being so fanatical about your goal."}],"house":2,"houseName":"House of Money","houseMeaning":"Financial matters, assets, material possessions, sense of self worth","yearNumber":5},"crystals":"Haematite, Carnelian, Turquoise","gems":"Yellow Sapphire, Yellow Topaz","keywords":["Organised Religion","Test Of Life","Knowledge","Dogmatism","Revelation","Spirituality"],"tone":null},{"name":"The Lovers","num":6,"arcana":"major","suit":null,"start":99,"end":101,"meta":{"Archetype":"The Crossroads","Task":"Making a decision of one’s own Free Will and based on what lies at the bottom of the heart","Element":"AIR","Crystal Guidance":"Peridot, Ametrine","Color Guidance":"Green"},"rating":null,"body":[{"t":"p","x":"This card represents union of opposites whether between a couple, two contrasting polarities of a paradigm, relationship between two persons and even between two separate ideologies. The desire for union is overwhelming. Our need to be loved is inborn. Our search for the one who complements us and completes us is endless. The urge to express love is universal and gives us the goal and motivation to follow our dreams that lead to our heart’s fulfillment."},{"t":"p","x":"The Lovers card can literally show the attraction and cosmic chemistry between a couple. The male and the female figures shown on the card represent the contrasting Yang and Yin energies whose synthesis leads to more creation and beauty in the Universe. They are naked which indicates their willingness for total commitment and transparency in the relationship."},{"t":"p","x":"This Union is blessed and in a way destined as depicted by the magnanimous Angel with the large wings protecting them while they iron out their differences and reach the zenith of perfect understanding with each other.This card can indicate the start of a new love affair or any new partnership, even a business one where deep and heartfelt exchanges will be required. Business but with a strong emotional bond. Its appearance indicates all is going well on the inter personal front or will turn out to be very pleasant in the near future. It is a reassurance that the relationship you are asking about will soon see more collaborative times and you will be reconciled with each other. The second meaning of this card is about the need to make a choice about something. Very often this involves a form of sacrifice. There is a strong crossroads situation coming up where in order to move ahead, you have to choose between your heart and your mind."},{"t":"p","x":"This choice between logic and emotions can be very painful at times but must be done. This card advises you to go after what your heart desires most of the times as that will ensure that your commitment is coming from a deep space within you. In case the situation requires an ethical choice, then logic would be a more judicious preference."},{"t":"p","x":"The card also speaks of union of elements within yourself. This can be contrasting elements within us like daring and passivity, love and hate, fear and recklessness etc. This card tells us to embrace elements of both and take a decision which is a fusion. That helps us to become whole."},{"t":"p","x":"On the downside, indicates failure in personal relationships, inability to make the right choice, Unhappiness and emotional frustrations. This card is a beautiful message of synthesis with outsiders as well as the elements inside us. For growth, we need to amalgamate with grace and commit ourselves to long term goals."}],"id":"the-lovers","reversed":[{"t":"p","x":"Frustration due to repressed emotions or sexuality. Unsuccessful love affair or marriage proposal. Unable to follow one’s heartfelt desire. Recognize and embrace that that sex and spirituality are interconnected and enrich each other. Feeling of loneliness and social isolation. Low physical self esteem leading to anxiety and fear of rejection. Lack of balance I.e. being over emotional or over analytical"}],"astro":{"zodiac":"Gemini","zodiacText":[{"t":"p","x":"Gemini ruled by the versatile Mercury seeks variety and constant stimulation. Gemini can make one illusional and always searching for multiple options rather than a focus."},{"t":"p","x":"When the Lovers card appears, its time to make a choice. Are you using your wit and intelligence and banking on your Mind or will you listen to your heart and disregarding the tempting options, narrow your attentions to a single point of focus. The choice is yours and its necessary."}],"house":3,"houseName":"House of Communications","houseMeaning":"Communications, letters and writings, public relations, younger siblings, short journeys, what you know, early learning style","yearNumber":6},"crystals":"Ametrine, Rose Quartz, Banded Agate","gems":"Diamond, Fire Opal","keywords":["Love","Personal Relationships","Choice Between Heart & Mind","Selfless Union","Marriage","Inspiration"],"tone":null},{"name":"The Chariot","num":7,"arcana":"major","suit":null,"start":101,"end":103,"meta":{"Archetype":"The Departure","Task":"Mastering contradictions, Risking something new","Element":"WATER","Crystal Guidance":"Moonstone, Citrine","Color Guidance":"Ochre"},"rating":null,"body":[{"t":"p","x":"The card of the Chariot stands for victory and success after the mastery of opposing forces by decisiveness and strength of will."},{"t":"p","x":"A royal male figure, dressed in full uniform of a commander of a territorial leader, is driving a chariot. Its an impressive looking imagery as he is fully in armour, the chariot bears the royal insignia, and a canopy dotted with celestial stars. Two sphinx are pulling at the chariot. In some decks they are depicted as mythical creatures like unicorns or winged-horse like creatures. The two creatures bear contrasting Color palette of black and white."},{"t":"p","x":"They represent our opposite natures that lie nestled within us. They are our own aspects that may work in opposition to each other, but are driving towards the same goal, as in your spiritual and physical natures."},{"t":"p","x":"The twin horses or sphinxes represent the pull of two opposing forces within us, the eternal DILEMMA that is constantly inter\u0002playing in the human mind.. The Chariot in the Tarot symbolizes victory over all who oppose you. Its a card of unmitigated success as it combined speed with intelligence."},{"t":"p","x":"The added feather in the Chariot card is the Focus and concentration which the commander is possessing. He has no distractions and is only single mindedly seeing the goal of conquest. Victory reigns supreme in his Mind and as they say victory over Mind is half the battle won already."},{"t":"p","x":"Since you have drawn strength from within by making your opposites work together, you can now defeat your enemy by identifying its weakness and over riding it with your synthesis\u0002ed strengths. This card in a reading stands for Success and Victory in any area the query is about. The only requirement is to curb your weaknesses, work through them till you can use them as weapons."},{"t":"p","x":"This card also indicates that you will get strong support from able bodied or able minded in your time of need to strengthen your forces so that your march to victory continues. On the downside, this card can show emotional weaknesses, conflict and violence, defeat or disharmony."},{"t":"p","x":"The Chariot is a strong card advising us to have clear goals, harness our internal and external resources after introspection and then go after success with full confidence and might. You are unstoppable."}],"id":"the-chariot","reversed":[{"t":"p","x":"Abrupt delay in situation Loss of concentration and focus Over emotionalism and possible emotional blackmail. Decisions and verdicts getting delayed. Lack of will power Going with the flow of things and letting destiny take its course"}],"astro":{"zodiac":"Cancer","zodiacText":[{"t":"p","x":"Cancer years for belongingness and wants to acquire a safe haven for itself at all times. Its a watery emotional sign. When the Cancer attribute is overwhelming, the Chariot card reminds to be single-minded on the goal and forge ahead with ambition and clarity. It needs toughness to acquire and belong."}],"house":4,"houseName":"House of Domestic Life","houseMeaning":"The first home environment, your roots, the mother, the imagination, outcome of contests and litigation, emotions, home, conveyance, comforts of material life","yearNumber":7},"crystals":"Amber, Howlite, Chalcedony","gems":"Ruby, Cat’s Eye","keywords":["Travel","Movement","Ambition","Balance","Self-Assertion"],"tone":null},{"name":"Strength","num":8,"arcana":"major","suit":null,"start":103,"end":105,"meta":{"Archetype":"Taming the Animal","Task":"Enjoyable acceptance of life, courage and commitment","Element":"FIRE","Crystal Guidance":"Ruby, bloodstone","Color Guidance":"Saffron"},"rating":null,"body":[{"t":"p","x":"This card shows a young woman, spiritually dressed in pristine white robes and the divine Infinity symbol floating above her head, prising open the jaws of the lion. This might apparently seem foolish and even dangerous but this card teaches us that the problem we will be faced with looks insurmountable but with adequate faith and calmness, is within our ambit to tackle. Strength calls for both physical stamina and the strength of spirit and feeling. This reflects upon the fact that Strength comes from within, not only by physical prowess but also the inner reserves. Strength card calls for a situation where you will be the only one to execute the solution to the problem and to do so with Fortitude. Heads on, the problem would have to be taken on so summon your bravado, daring and dauntless resolve. The Strength card may indicate that you alone may have the leadership skills so an independent approach and initiative will be needed. Supporters may not be available so face the problem in a fortuitous manner and perform your duty with a sense of idealism. The strength associated with this card is in its purest form, which is expressed in gentle encouragement. This card also brings with it good tidings of recovery from ill health and vitality being restored. This card has links with the Greek myth about the labours of Hercules, who was presented with twelve tasks and who cleverly completed all of them by using his wits."},{"t":"p","x":"When the Strength card appears in the spread, its time to show presence of mind. Stay alert to even the slightest signal, almost as an animal instinct. Do not feel defeated by the magnitude of the problem. Remember that you have been placed in this Divine Time and Divine Place to solve a problem that only you can do and in it is concealed an opportunity for incredible internal growth. So embrace it with surrender and Grace. The allegory in this card also displays the battle between the spiritual and the physical. You are on the road to Spiritual enlightenment."},{"t":"p","x":"To achieve your ends, you must tame your base passions and force them to surrender to your Higher Self. The card spells Triumph provided you do not shirk from the challenge. Go ahead, much like the Leo feminine energy this card represents. Address the issue, and confront the areas that need to be worked upon for resolution. On the downside, this card can signify physical or spiritual weakness, rigidity in accepting problems, despotism, failure and disgrace. This card is putting you in a space of incredible endurance. If your will is stronger than your opponent, you will survive and succeed. If not, you shall be defeated and your growth might be stumped. You will lose only if you choose to quit, so in any recourse stay determined and graceful and you shall be protected."}],"id":"strength","reversed":[{"t":"p","x":"Gratification of one’s desires Questioning belief in God as sense of self becomes dominant The brave front is only a sham Feeling anxious and jittery from the Insides Giving in to lower energies and also carnal desires. Abuse of power at disposal"}],"astro":{"zodiac":"Leo","zodiacText":[{"t":"p","x":"Leo wants to be special. When you draw Strength are you under the spotlight, do you like being the center of attention. Or do you feel left out in the cold or immune to praise? If this quality is lacking in you then its time to gently reveal your qualities that make you the ruler. If this quality is overflowing, then restraint is necessary so that spotlight may be shared by the deserving others too."}],"house":5,"houseName":"House of Children","houseMeaning":"Affairs of the heart, children, love affairs, adventures, exciting activities, speculations","yearNumber":8},"crystals":"Citrine, Topaz, Tourmaline","gems":"Diamond, Garnet","keywords":["Self Control","Fortitude","Spiritual Strength","Patience","Self Mastery"],"tone":null},{"name":"The Hermit","num":9,"arcana":"major","suit":null,"start":105,"end":107,"meta":{"Archetype":"The Wise old man","Task":"Retreating into oneself, appropriate seriousness, contemplation","Element":"EARTH","Crystal Guidance":"Kyanite, Peridot","Color Guidance":"Gray"},"rating":null,"body":[{"t":"p","x":"An old man, with a long white beard is dressed in grim Colored clothes, with his head bent in deep contemplation. The robe is hooded and is bound at the waist by a knotted cord. He is walking alone, lit only by a lamp. This represents the need for introspection to to walk one’s own path, following one’s own light."},{"t":"p","x":"This card refers to the need for the individual to shut out all external voices and noises and to deeply attune to the Silence of the self."},{"t":"p","x":"Sometimes our analytical and intuitive abilities which are in fact best guides for our soul growth get lost in the noises of the increasing socialization processes we are captured by. This card advises is to go back to our solitude self and rely upon the internal voice of wisdom that will bubble up when we focus on hearing it in silence."},{"t":"p","x":"The road to solitude can be unnerving for some, as signified by the barrenness of the white icy cliffs the Hermit is treading on. However this ice is full of purity and a beautiful example of untouched Nature."},{"t":"p","x":"The Hermit is also a card of self-initiation but on an interior level where we are undistracted and take time to gauge where we have been as individuals, where we stand at present and how all our actions will determine the course of our future. The lantern that the Hermit carries in his hand is his internal light, one he must light and then depend upon to tread the road less travelled. The Hermit has no fancy robes or adornments. He is dressed very simply, almost inconspicuous in his Colorless robes. His ego is overthrown and he is one with his Inner Voice. This card shows that solitude and being away from the temptations of civilisations are as much as a search of God and more importantly to find own inner balance."},{"t":"p","x":"When this card comes in a reading, it is time to be a beacon of light for yourself and if need be, for others. The staff in the Hermit's hand introduces you as wise person, capable of deep contemplation of an issue and being a support system for others in need."},{"t":"p","x":"On the downside the Hermit may indicate fraud and deception, lies, miscommunication, misinformation, concealment."},{"t":"p","x":"The Hermit is in search for truth in its pure form, uncorrupted by the ideologies of the self-serving world. Its time to re-evaluate your life. There is little that is comfortable about this card and sometimes the skeletons of your weaknesses may come popping out. This cleansing, its necessary and soul purifying. Detox of the Soul."}],"id":"the-hermit","reversed":[{"t":"p","x":"Desire to mingle with outside world Superficial way of decision making, without much research Time for team work and collaborative efforts Confused person who is naive and listens to others’ opinions rather than trusting own judgement. Ignoring the truth and change it will bring. Turning away from others who need your counselling"}],"astro":{"zodiac":"Virgo","zodiacText":[{"t":"p","x":"Virgo is reclusive and critical and often goes deep into analysis when confronted by a situation or an issue. It is also discriminating and detail oriented. When you draw the Hermit ask yourself if you are being too self-critical or critical of others. Are you making too many demands on yourself or others? Its time to turn inwards"}],"house":6,"houseName":"House of Health & Work","houseMeaning":"Job, service, competition, diseases, victory over enemy, responsibilities, mundane work, daily habits","yearNumber":9},"crystals":"Peridot, Bloodstone","gems":"Blue Sapphire, Hessonite (Gomedh)","keywords":["Isolation","Deep Study","Introspection","Wisdom","Inner Counsel","Celibacy"],"tone":null},{"name":"Wheel of Fortune","num":10,"arcana":"major","suit":null,"start":107,"end":110,"meta":{"Archetype":"The Calling","Task":"Insight into what is necessary, facing one’s task","Element":"FIRE","Crystal Guidance":"Yellow Sapphire, Yellow topaz","Color Guidance":"Golden"},"rating":null,"body":[{"t":"p","x":"The Wheel of Fortune is a wonderful card of unexpected opportunities. It symbolises the forces of Chance and Destiny in all its splendour as well as confusions. It signifies that the Universe is granting us miraculous opportunities to grow and expand to our full potential. Dark times are behind us and the postals of good fortune are benevolently smiling upon us. It is card of new beginnings, new ventures,movement, vision and good fortune. Like the wheel which is constantly moving, this card advises us to keep moving on the path of life. Its a card of higher learning and constantly upgrading our skills. The more we learn about various aspects of life, the more the doors of opportunities open before us and we are ready and equipped to take on the challenges that might come in our life as SYNCHRONICITY (related events happening in a sequence such that life takes a major step forward). The imagery of the Wheel of Fortune shows a massive wheel whose axle is supported by two uprights. There are 3 layers to the wheel which signify the physical, mental and spiritual dimensions of the human life. The spokes in the wheel indicate need for balance in life. The sphinx (half man half lion figure from Egyptian mythology) epitomizes the perfect balance once achieved between the good and evil within us makes us masters of the wheel of time and we can run the course of time as per our intentions."},{"t":"p","x":"The imagery also reflects the four fixed signs of Taurus, Leo, Scorpio and Aquarius displaying the various qualities needed to move on the road of expansion. All the figures are holding books indicating the need for knowledge, ancient and new, to capture the short lived opportunities that come knocking at our door. The salamander, a reptile signifies upwards movement of luck and the snake correspondingly talks of the inevitable downside in the cyclical wheel of Time. We are all connected with the Wheel of Fortune. Some are travelling upwards while others are facing down times while some have mastered the time and remain relatively unaffected by its vagaries. This card is hugely positive in the Tarot language and indicates promotions and success, money windfall gains, love and happiness in relationships and big strides in spiritual evolution, amongst other gains it can bring into your life."},{"t":"p","x":"But the wheel is turning for everyone. The Wheel spares no one and rewards no one. Its impartial and just echoes the primordial ethos of life that CHANGE IS CONSTANT. When this card appears in a spread, be prepared for big positive changes. They will require you to come out of your comfort zone and be proactive. The opportunity will come out of the blue literally but the preparation to capitalize on it has to be human. Your life is being affected by these changes and if you want success, you have to fight to take control of the uncontrollable."},{"t":"p","x":"On the downside, the Wheel of fortune can bring in unexpected bad luck, rigid attitude towards change, stagnation in professional and personal matters. The WOF is an incredibly powerful card full of potential to understand the meaning of life and to align your personal energies with the greater life plan that Destiny has in mind for you. It decides your Future and you must take control of your life while the wheel is turning else you will be compelled to stay plateaued and stationary in your present."}],"id":"wheel-of-fortune","reversed":[{"t":"p","x":"Unexpected turn of events not always fortunate Delays, hindrances, recurring problems and setbacks Complications arising that were not foreseen Difficulty to adjust to change Destiny playing a hand and a situation not much in your control"}],"astro":{"planet":"Jupiter","planetText":[{"t":"p","x":"The astrological Wheel of Fortune tells you take advantage of unexpected or new opportunities. Be aware and vigilant and constantly upgrade yourself to stay relevant. Refrain: Let go of that which pulls you down, Refrain from hanging onto lower forces and develop yourself intellectually. Do not be pessimistic and wait for your time to change for the better."}]},"crystals":"Lapis Lazuli, Amethyst, Aventurine","gems":"Blue Sapphire","keywords":["Unexpected Turn","Expansion","New Horizons","Dame Fortune","A Change","Cycles Of Life"],"tone":null},{"name":"Justice","num":11,"arcana":"major","suit":null,"start":110,"end":113,"meta":{"Archetype":"Intelligence","Task":"Understanding the laws of this world, passing an intelligent and balanced judgement, personal courage","Element":"AIR","Crystal Guidance":"Blue Sapphire, Lapis Lazuli","Color Guidance":"Dark Blue"},"rating":null,"body":[{"t":"p","x":"The Justice Card represents the Law of Karma, and the victory of righteousness and good conduct in the wheel of life. Its one of the cards of the Major Arcana whose title is succinct. As its name suggests, it indicates the need for fair play. The Goddess of Justice is seated on a throne resplendent in the red power robes indicating she is in a official capacity (granted by her status or her destined role) to take a balanced and judicious decision."},{"t":"p","x":"The sword in one hand and the scales in the other are indicating that the decision needs to be based on facts and evidence, It should be the result of intellectual analytics. It should not be driven by personal ego or emotional factors. Fairness should be the deciding factor above all else. When a situation to make a decision comes in our life, we should not jump to presumptions. We should not be quick to judge situations and people. What has happened is a cause and effect of a particular pattern and we as Justice bearer must understand the nuances and undercurrents of a situation before passing a verdict. Unlike the Lady Justice in modern times, the imagery in the Justice card has the Goddess of Justice with eyes wide open. It describes impartiality and an open mind while reviewing all the aspects of situation under analysis and making the judgement."},{"t":"p","x":"When this card appears in a reading, you must adopt a systematic approach towards the situation under scrutiny. This task will require all your wits and sincere efforts, It advises you to be disciplined and balanced in your approach. Consider the pros and cons, both of the situation, in case a new project or enterprise or relationship is being considered. How the situation can benefit you and how it can harm you must both be considered in detail before embarking on a new step. Do not be swayed by emotional tides or become a victim of emotional manipulation by the parties involved in the task. Use your own intelligence and analyse the facts form all angles and then decide. Literally the appearance of this card indicates an upcoming litigation, court proceedings, contracts and settlements in your life. If a litigation case has been underway, it calls for swift verdict in the recent future. In case you have been righteous in your karma, then the verdict would surely be in your favour."},{"t":"p","x":"This card is a card of Karmic balance and eulogizes the basic Hindu philosophy of karma being a pivot of cause and effect. If the input has been on the right path, then the rewards shall ensue while if the karmic intentions have been flawed, then the punishments would be swift and justified. On the downside, this card indicates injustice and legal confusion, imbalance in the activities of life, the ambiguity regarding what is right code of conduct, losses in legal cases, false implications and being dragged into law and order situations by external agencies, The Justice Card is a shoutout to all for maintaining Balance and Objectivity in Life. Karma gets its payback, sooner rather than later and one must be cognizant at all times of acting out of fairness and impartiality and applying moderation in life-situations."}],"id":"justice","reversed":[{"t":"p","x":"Lack of analytical ability and putting blame on situation or just one party Legal or emotional justice denied Need to act out of habit and question the “how” and “why” of a situation Extreme or unfair behaviour Unbalanced decision / poor judgement"}],"astro":{"zodiac":"Libra","zodiacText":[{"t":"p","x":"Libra seeks balance and diplomacy. If this energy is strong for you now, too much compromise means you are giving up on your own beliefs or opinions just to make others happy. If you believe it is lacking, learn diplomacy to resolve a dilemma and be more civilized about life. Justice seeks to find balance between contrasting aspects of life."},{"t":"p","x":"Use patience, tact and analytical mind to get to root of the problem and then work upon the Truth so found, to bring fairness to the situation."}],"house":7,"houseName":"House of Marriage and open conflict","houseMeaning":"Marriage, lawsuits, partnerships, marital sex life, known enemies, business transactions"},"crystals":"Bloodstone, Jade, Carnelian","gems":"Emerald, Opal","keywords":["Legal Affairs","Karmic Balance","Cause And Effect Laws","Decision","Judgement"],"tone":null},{"name":"The Hanged Man","num":12,"arcana":"major","suit":null,"start":113,"end":115,"meta":{"Archetype":"The Test","Task":"Changing one’s way, Insights and willingness to make a sacrifice","Element":"WATER","Crystal Guidance":"Beryl, Sodalite","Color Guidance":"Brown"},"rating":null,"body":[{"t":"p","x":"The Hanged Man carries a vivid and interesting image of a noble looking, mature man hanging upside down from a tree branch. His left leg is bent in a yogic position and the right leg is fastened to the tree. His arms are tied behind his back. The trees are lush and the face of the Hanged Man is aglow with a brilliant radiance of halo around it. This is a special card and a special milestone in the Fool’s Journey on the path of Truth. Its embedded deep in philosophy and lessons one needs to tarry and absorb in order to become a finer version of our human self."},{"t":"p","x":"The point to observe here is that the Hanged Man shows no signs of distress at his uncomfortable position and infact has flexibly adjusted himself in a way that his body is in perfect symmetry to the surrounding environment. His face has a peaceful expression and even carries a hint of inner delight. He is in contemplation and an inner satisfaction radiates on his face as he faces the ordeal with a grace that will grant him a gain or goal he secretly aspires for. This card represents self sacrifice and martyrdom. It shows that in life there will be a necessity to bear flexibility of mind and let go of one’s preconceived ideas and to accept limitations with an open mind and heart. The Hanged Man is a\"Transformative” card teaching us that giving up something we cherish is needed at particular juncture in life in order to gain something more valuable."},{"t":"p","x":"The Hanged Man at first study, might seem like a gray card showing us limitations and constraints. However, when studied in the deeper perspective, its the time to become more holistic in your thinking. It warns against becoming biased or prejudiced. If in conflict with someone, this card is very meaningful as it tells you to rise above your very human emotions and do what is best for everyone concerned. The Hanged Man observes from the other person’s perspective and become more broad based and universal in his understanding of this world. The Hanged Man usually involves some form of compromise of one;s own desires for the sake of benefit of someone else. It may involve a choice and you may be asked to renounce something or someone that’s dear to you."},{"t":"p","x":"The downside of the card could bring up selfishness, self interested behaviour, political machinations, loss of something you want or need. The point is that the Hanged Man’s choice must be yours; and the sacrifice must be made willingly. Its that important milestone where the EGO must be renounced as we are initiated to become more immersed with higher matters. In the Major Arcana journey, from now onwards the cards will focus on cosmic qualities and reflect the movement into higher dimensions of the human soul, leaving the petty and lower concerns of the human existence behind."}],"id":"the-hanged-man","reversed":[{"t":"p","x":"Over confidence and arrogant behaviour Lack of receptivity Lack of sensitivity and indifference to what other party feels or wants Fear of social conventions or penal action Being inflexible to changes and continuing to be adamant Being stuck to a particular idea or person though it has become non-useful for growth"}],"astro":{"planet":"Neptune","planetText":[{"t":"p","x":"The astrological Hanged Man resonates to the Uranus planet and tells you that it is time to relinquish your attachment to things or people, which serve no purpose to you."},{"t":"p","x":"Change is inevitable and the only constant of life so accept the moving wheel of change and learn to let go and move on."},{"t":"p","x":"Life is filled with other beautiful colors so live your life and enjoy the Divinity in each particle of creation."},{"t":"p","x":"Refrain: Do not get so deeply involved with people or things that even when it no longer serves your growth, yo continue to cling on due to insecurity. Take action to let go. The Neptunian element of fatalism that brings stagnation, must be avoided."}]},"crystals":"Beryl, Ametrine, Sodalite","gems":"Blue Sapphire, Blue Hakik","keywords":["Act of Sacrifice","Unconventional Behaviour","Surrender","Flexible Thinking"],"tone":null},{"name":"Death","num":13,"arcana":"major","suit":null,"start":115,"end":117,"meta":{"Archetype":"Death","Task":"Leave taking and descent into the underworld, Withdrawing, Separating","Element":"WATER","Crystal Guidance":"Black Tourmaline, Ametrine","Color Guidance":"Slate Gray"},"rating":null,"body":[{"t":"p","x":"In many decks the DEATH card is depicted as a skeleton with a scythe. In Rider Waite Death is riding a white horse with the Flag of Death fluttering in the night sky. The figure of the skeleton, seated atop the horse is grinning, sometimes appearing angry or vengeful."},{"t":"p","x":"The scene is littered with dead bodies while a few symbols of life like a couple of children a holy priest are asking for redemption. Far at the horizon, the bleakness of the scene is cleaved by a pale Sun struggling to find its radiance. The Death card is Absolute and symbolizes a complete severance from the past. A certain aspect of life is undeniably dead and will never again live in the capacity it used to. It could be the death of a relationship, of a career, of a business, of a certain lifestyle or even an old way of thinking or behaviour. An end of old ties and associations. A crossing over from one mode of existence to another."},{"t":"p","x":"Generally this card will entail some loss but it would be a loss that has reached its organic expiry date and needs to either end or be rebirthed in a new form or a higher dimension. For this purpose the Death card is regarded as the TRANSFORMATION or REBIRTH card rather than merely the Death attribute. Its a time of creative destruction and remind of the Tandava of Lord Shiva, the dance of cosmic Resurrection. Some endings are necessary. Unavoidable."},{"t":"p","x":"The lesson is to pick up the teachings from the loss or ending, understand the larger picture of what the future vision entails and then creating with hope and tenderness a new world. Ask Mercy for the sins committed in the past which led to the painful endings. Be innocent and trusting like the children in the imagery whose future can be moulded in any way the higher thinking dictates."},{"t":"p","x":"Death tells you to clear the deadwood in your own life so something new can grow. You may be called to make radical and sweeping changes When this card appears in a reading, a major change is about to happen in your life. Good or Bad, it cannot be avoided. On the downside and this card can be considered one of the darker shades of Gray in the Deck. It spells destruction, Loss, Failure of Plans, Apathy, Loss of Hope This Card is a message of deep Transformations and far reaching changes that could impact the remainder of your life. The Death like experience will leave a profound effect on you and you will emerge from the cocoon to become the Butterfly that the Divine Plan wants you to be."}],"id":"death","reversed":[{"t":"p","x":"Sense of stagnation and procrastination Life comes to a standstill Philosophical attitude to life as you understand the power of Time and how it will pass on Inability to change and make a fresh start Clinging to old patterns of behaviour, or old situation no longer valid Undergoing pain and dealing with it - physic
