f pentacles figure will make luxuries a part of life in an aware manner. You have not got to this point by being foolish with your money."},{"t":"p","x":"If surrounded by cards that encourage enjoyment like the Sun or 9 of cups, its your signal that now you must enjoy the fruits of your labour and Indulge in sensual pleasures.Your previous struggles have given you the spiritual understanding about the flow of money and you are possessing the inner strength to enjoy your material and creative freedom and not get trapped into it."},{"t":"p","x":"The nine of pentacles is excellent for marriage and any type of romantic collaboration queries. It indicates a passionate and well grounded union that will bring bounty in the long run. As an advice card, this card asks you to be in gratitude to your hard earned abundance. You are capable enough to have created this edifice and your calibre is so high that no other person can negate it or take it away from you. You have to ability to create and procreate. Card of self assurance, empowerment and self sufficiency."}],"id":"nine-of-pentacles","reversed":[{"t":"p","x":"Spending more than you can afford to build self esteem, low profits and financial blocks, creative businesses shutting down, getting into easy money by social contacts, overindulgent luxury loving habits, shallowness and superficiality. At times guidance card to enjoy the bounty you have earned by your hard work and toil."}],"tone":"positive"},{"name":"Ten of Pentacles","num":10,"arcana":"minor","suit":"Pentacles","rank":"Ten","start":277,"end":280,"meta":{"Element":"Earth","Planets":"Venus, Mercury, Saturn","Astrological Significance":"Mercury in Virgo","Favourable Color":"Red Yellow Green Red","Chakra Associated":"Root/Muladhara Chakra"},"rating":"Extremely Positive Card","body":[{"t":"p","x":"Ten of Pentacles is the\"Satisfaction Card” and denotes the culmination point of material and emotional security. Attainment of all things that bring a sense of satisfaction to you. Imagery : The aged man with white beard sits contentedly under an archway dressed an ornate expensive cape. The cape is decorated with moon crescents and grapes indicating the union of spirit and matter; He is looking out towards his son and his daughter in law who are engrossed in a conversation. The young grandson playfully reaches to the dog. 10 golden pentacles adorn various parts of this image displaying an environment of affluence and solidity. The Ten of pentacles is an incredibly fortunate card to receive in any query related to future prospects. It indicates material satisfaction and a blissful married life. It denotes comforts of all types- whether financial or health related or spiritual. Ten of pentacles deals with permanence and security. All the efforts and struggles you have encountered till translate into fruits that will only grow and multiply with time. The bounty is not just for the present but for future times as indicated so strongly by the presence of three generations co-existing harmoniously in the card image."},{"t":"p","x":"Relationship problems if any will be resolved soon as you understand the true value of each other on a humane level and will make a strong resolve to stay together and build a stronger future. It may also indicate buying a new home or creating your own customized space within a larger unit which will carry your stamp as a couple."},{"t":"p","x":"In love affair, you are inextricably bound to each other and will have the resilience to face any opposition and still stay united and loyal to each other. If related to conception, this card is a strong indicator of happy news regarding fertility. The child will be healthy and will grow up surrounded by the warmth and love of an extended family. Ancestral lines are strongly indicated when this card appears. The security that so surrounds you may have been passed down through the generations. It could herald the initiation or progress in family business or gains through family held property. You may come into inheritance or receive a cherished family heirloom. When this card comes up with regards to choice of profession you are being guided by destiny to pursue the family business or the family profession such as architecture, chartered accountancy or medicine if many of your relatives are already following them. You are likely to receive invaluable references and advice from those already engaged in that line of profession. With this card its time to celebrate your family bonds. You are blessed to be surrounded by the genuine warmth and experience of your family and must put in your efforts to strengthen the familial bonds."}],"id":"ten-of-pentacles","reversed":[{"t":"p","x":"Rebellion against traditions and norms, rejecting family practices and walking down new paths, getting into unconventional means of business, entrepreneurship on individual basis, financial uncertainty, feeling of who am I and what am I doing here?, nuclear family and small family, selling ancestral home or property, attraction to new and aversion to the old."}],"tone":"positive"},{"name":"Page of Pentacles","num":11,"arcana":"minor","suit":"Pentacles","rank":"Page","start":280,"end":283,"meta":{"Element":"Earth","Planets":"Venus, Mercury, Saturn","Astrological Significance":"Personification of Earth (Element Only)","Favourable Color":"Yellow Green Red","Chakra Associated":"Root/Muladhara Chakra"},"rating":"Stable Card of New Beginnings","body":[{"t":"p","x":"The Page of Pentacles is a cautious, business minded young person who plans and analyses prior to taking action. He is loyal and reliable and is rooted to the reality of life. The image shows a young man holding a disk of pentacle in his hands and gazing reverently in it. He is well dressed and looks pleased with himself. The setting is lush countryside. As a situation this card is the arrival of good or pleasant news. It could be a person who will bring you good news about work or could mean a communication, mail or a meeting offer with regards to consolidation of your work or security plans. The situation is still young,. Pages indicate the early stages of a project and since the pentacles are connected with finance, security and the physical body, the project could pertain of one of these and will require careful nurturing. You are at the planning stage and a strong foundation at this stage can mean the difference between final success or failure. At this a fruitful opportunity for expansion is present but it is still an idea and will need intensive implementation. When this page comes along, some news regarding your monetary health is on the way. It would not be a large amount unless surrounding cards indicate profits and gains but will be of pleasant proportions nevertheless. You could also receive some useful information related to investment opportunity or a job offer you were awaiting."},{"t":"p","x":"If life has been stressful of late, the news carried by this reliable Page could bring respite and stability. There might be an opportunity to experience which provides you artistic or cultural refinement."},{"t":"p","x":"This page carries an opportunity of reinventing yourself. The coin in the page’s hand is a new opportunity which he is handling with sensitivity and attention and obviously delighting in the unfolding of the new interest. There might be the beginning of a new course, a new fitness or makeover program, a new job experience, a new artistic venture, a new work challenge or even a new competition which requires meticulous preparation."},{"t":"p","x":"An opportunity to begin anew has presented itself in the present context and it must be graciously accepted. Its a means to reinvent yourself. T would require being practical and organised; not going into flights of fancy but rather to ground yourself and be sincerely interested in each step of the process."},{"t":"p","x":"As a person, this page is cautious and stable. He is not swayed by emotions. obviously refined and cultured, his personal demeanour is important to him. He wants people to appreciate him for his classy behaviour and his well presented exterior."},{"t":"p","x":"He is also very sensitive to others’ needs and will go out of his way to systematize the issue for the other. He has an innate command over financial and business matters and approaches each new venture as a chance to add value to it by useful contributions."},{"t":"p","x":"He is grounded in his perspective to life and his ideas are matter of fact and practical. He may not go info fancy high education but will be successful in his profession or business because he goes about it in a logical and empathetic manner. With his ears close to the ground, he is natural at changing market trends and is also a calm and analytical people’s person. He is an excellent team worker and provides implementable ideas that bring positive results."},{"t":"p","x":"Being very practical in nature, he is not romantic or emotional or even fanciful. He believes in action more than speech and conversations. Some may find him staid and boring if looking for more exciting company. However there is a solidity and reliability in him that makes him an indispensable friend and a partner for life."}],"id":"page-of-pentacles","reversed":[{"t":"p","x":"Lack of growth in matters related to security and productivity, unfocused and unorganised attitude, poor budgeting skills, losses and poor returns financially, not having a head for numbers"}],"tone":"positive"},{"name":"Knight of Pentacles","num":12,"arcana":"minor","suit":"Pentacles","rank":"Knight","start":283,"end":286,"meta":{"Element":"Earth","Planets":"Venus, Mercury, Saturn","Astrological Significance":"Cusp of Leo / Virgo","Favourable Color":"Yellow Brown Red","Chakra Associated":"Root/Muladhara Chakra"},"rating":"Promising and Hopeful Card","body":[{"t":"p","x":"The Knight of Pentacles denotes practical and sustained efforts directed towards a goal and as persona attributes a detailed oriented and dedicated person interested in material matters. The heavy black horse and the full armoured knight is a man on a mission. The road ahead indicates his path of ambition he is willing to traverse slowly and steadily. He holds the pentacle disk directly in his line of vision, making him focussed on his goal at all times."},{"t":"p","x":"As a situation when this Knight comes in a reading, it is time for the material manifestation idea that had originated with the Page of Knights to transmute into an executable plan. The knight of pentacles is a very devoted worker. He is meticulous and carrying properties of the Earth element which symbolizes astrologically the signs of Taurus, Virgo and Capricorn, he is obsessed with his vision and pays no heed to distractions. When this card comes up a work opportunity will come along that will require unflinching detailed oriented efforts from you. There will be no time for leisure and pleasure. Instead of getting bored or distracted, its the time to become extra hardworking and perform your duty like a penance. It could even signal a situation that has come to a temporary halt. The knight of Pentacles is an overcautious, slow moving character of the Tarot Court and this is translated in the progress of the situation that is being analyzed. You may have reached an impasse with someone so all you can do is wait it out for the flow of events to happen. It will require patience and the surrender that though you want to act, it would not be useful."},{"t":"p","x":"Perhaps there is a clash of ideologies with the other players in the situation. You would need to stand firm if you feel you are morally in the right. You may even be feeling a sense of dullness or stagnation at your place of work when this knight trudges along in the reading. Maybe the sheer routine of your daily activity is making you feel irritated. On the positive note, when this knight comes up in a reading it shows you have more patience and capacity to slog than you would imagine yourself to have. Its time to utilize those inherent skills as the work at hand is requiring mundane, clerical and repetitive approach to work."},{"t":"p","x":"As a person, the knight of pentacles is practical, determined, and you can easily repose your trust in him. If you belong to another suit, he may appear to you rather stolid and slow moving, at times incapable to take quick decisions. He is not very invigorating company and is reticent by nature. In feelings, he may be undemonstrative but his loyalties run deep. He is a steadfast and faithful lover and friend. Being from the earth element, there are hidden fires raging inside and they possess a depth of passion and sensuality. This knight is an asset to an organization as he is the pillar that may hold diverging energies together. He is particular about deadlines and deliverables and focused on customer delight. Any work related to property, project management, Money management, Banking, Business, General Management, Hotel Industry, Teaching, education dissemination among others would be suitable for him."}],"id":"knight-of-pentacles","reversed":[{"t":"p","x":"Skills not being fully honed, less staying power, no competitive spirit, lacking determination to self improve, apathy towards body and health, lack of hygiene, indifference to physical and emotional environmental clutter, poor allocation of time and energy being spent"}],"tone":"positive"},{"name":"Queen of Pentacles","num":13,"arcana":"minor","suit":"Pentacles","rank":"Queen","start":286,"end":289,"meta":{"Element":"Earth","Planets":"Venus, Mercury, Saturn","Astrological Significance":"Cusp of Sagittarius / Capricorn","Favourable Color":"Green Red Yellow","Chakra Associated":"Root/Muladhara Chakra"},"rating":"Very Positive Card","body":[{"t":"p","x":"The Queen of pentacles is a calm, nurturing, nature oriented, practical woman of achievements. She creates an environment of warm energy and reassurance in her domain. Success and fertility are indicated."},{"t":"p","x":"Imagery : The beautiful queen sits on a decorated throne in her red robes and golden crown. She holds the golden disk in her hands and gazes at it lovingly. Around her vines bloom and trees flourish. The challenging mountains recede in the background. A brown hare is about to jump into the image showing the queen’s fertility. It also cautions that for prosperity to sustain, one must think before chasing after success. The Queen of Pentacles appears as an assurance of success and fertility. She denotes achievements and progress in all matters of material world. She also gives out the secret to acquiring this wealth."},{"t":"p","x":"Sheer hard work and the judgement of how and when to spend are the twin ingredients of success in the world of outward manifestations. When this card appears, you will have a fabulous opportunity to move ahead in your career aspirations. Your efforts will be lauded and your seniors will support you."},{"t":"p","x":"You will however have to believe mainly in your own skills and will power. Be steadfast and continuous in your work. Its this ambition which will make you squash the opposition and make you emerge as the winner. Your attitude is extremely important if you want to harness the promised riches of this card. If the correct attitude falters, then the gains would not reach you."},{"t":"p","x":"You are a clear and fearless communicator. You do not waste your energies in unnecessary talking but will happily share all information required to get the work done. Your task orientation is a glowing example of your professionalism and your admirers learn the tricks of the trade from you. With this card, rest assured you are a role model for many aspirants. When this card appears your home may be beckoning you for some management and discipline. Your practical and logical decisions appease the human emotions and people take their responsibilities more seriously. In your warm yet stern manner you keep all processes under control and when the work is done, you let your guard down and also have a good time bolstering your fame as a good hostess."},{"t":"p","x":"Banking and money management are in your blood so with this card, be prepared to get some accounts in spanking order. Monitor the expenses and make intelligent choices regarding how much to spend and how much to invest. Your shrewd businesswoman instincts may be required in the present situation."},{"t":"p","x":"You should be investing in material or emotional ventures that will last for long. Its prudent to go for high quality items since their performance will be optimal over a longer duration. You are attracted to natural fabrics and all things natural. Being naturally close to Mother Earth and its treasures, this Earthy Queen will encourage you to live simply yet comfortably. As a woman, the Queen of pentacles is very calm and patient. She can teach you wise use of resources so you can become self sufficient and do not need to depend on others for your sustenance. She is a big advocate of financial independence and will have her secret egg’s nest stored away. She can be an excellent confidante as she never gives away secrets. Averse to gossip, she has few but long lasting friendships who share her taste for aesthetics and common sense."},{"t":"p","x":"A loyal friend and a fantastic business woman, the Queen is an asset who will keep giving you service for a long time. Invest in her. You will stay wealthy."}],"id":"queen-of-pentacles","reversed":[{"t":"p","x":"Undeveloped creativity, not able to make use of talents and skills, Relying on others to make decisions, low self confidence and low self awareness, afraid of action and responsibilities, may blame others for own failure"}],"tone":"positive"},{"name":"King of Pentacles","num":14,"arcana":"minor","suit":"Pentacles","rank":"King","start":289,"end":292,"meta":{"Element":"Earth","Planets":"Venus, Mercury, Saturn","Astrological Significance":"Cusp of Aries / Taurus","Favourable Color":"Green Purple Yellow","Chakra Associated":"Root/Muladhara Chakra"},"rating":"Extremely Positive Card","body":[{"t":"p","x":"The King of Pentacles is the emblem figure of wealth, prosperity and financial success. Signifies high ambition, superior status, generous sharing of bounty, kingmaker, materialistic satisfaction."},{"t":"p","x":"Imagery : The King of Pentacles sits in the shadow of his own success. He sits on a throne adorned with bulls carvings and vines. The robe he wears is also adorned by the multiplicity inducing grapevine. He holds the golden disk in his lap and is fully engrossed in its contemplation. The castle in the background denotes his riches earned over time with determination."},{"t":"p","x":"His gold glistens, and he's very serious about his wealth. He's regal, he's reached the pinnacle of his success, he has riches and material possessions. This level of professional success and almost fanatical ambition is the message of the card. If you wish to reach the pinnacle of material success, are you prepared to make the emotional compromises involved in the process? His iron boots suppress the living creature which symbolizes his emotions and sensitivities. If you wish to become like him then your emotional bondings will have to be suppressed. The overwhelming thought in your mind should be only of your financial and material progress. Its an all consuming Passion you will have to exhibit."},{"t":"p","x":"Like all kings, the King of Pentacles represents motivation. This card can also refer to a man, in particular, someone who is either a pragmatic businessman, or someone with deep connections to the land. You may be coming in contact with such a person who will be in a more established position to you but will give you important technical or monetary help to move up the ladder of success."},{"t":"p","x":"This card s represents everything that comes to mind when you think of wealth or success; control, power, security, possessions, and more. So be prepared for work for it and you are destined to receive plenty."},{"t":"p","x":"Your capacity to multiply money is also being awakened now. Do your market research, follow your shrewd instinct of being a money magnet, tap on your networking contacts. Make some sharp moves to rule the market and beat the competition. Your market savvy and killer instincts are all required in full flamboyance now."},{"t":"p","x":"As a person, being in a King of Pentacles prototype, you are being advised to be cautious financially. Keep your money details to yourself and do not get into any reckless partnerships."},{"t":"p","x":"Help a smart but cash deficit young businessman launch himself. You are a king maker and its your duty as well as your interest to help others rise materially. You are a good leader of people, and are an excellent example of how to become an affluent and powerful person even if the beginnings had been modest. You can also be a great financial advisor or fund manager. Sometimes you back political figures by being their financial backer too. Power is tempting to you but since you do not like the limelight, you prefer to give sensible money advice from behind the curtains."},{"t":"p","x":"In relationships you are a loyal and dutiful companion. You are no demonstrative and do not have much affection to squander. Time is money to you your work will always remain your first priority. However you have no parallel when it comes to your protective and caring attitude. A natural nurturer, you want to provide the best for your family and cherished friends and do it with humility and grace."},{"t":"p","x":"A man of steel, you show the world how grit and grace can combine to make the diamond sparkle. Your authentic shine cannot be missed."}],"id":"king-of-pentacles","reversed":[{"t":"p","x":"Greedy and avaricious person or energy, very conscious of monetary & financial security, conservative, cautious investor, possessive, jealous, workaholic, overindulgent, exploitive of loved ones"}],"tone":"positive"}],"library":[{"id":"v1-front","vol":"I","title":"Vol I · Front matter, authors & contents","body":[{"t":"h","x":"Tarot Secrets"},{"t":"h","x":"Unveiled"},{"t":"h","x":"78 Rays to Power & Peace"},{"t":"h","x":"Vol-I"},{"t":"h","x":"Editor Author"},{"t":"h","x":"Dr. Arun"},{"t":"h","x":"Bansal"},{"t":"h","x":"Rrachita Gupta"},{"t":"p","x":"'Ravera'"},{"t":"p","x":"This journey is dedicated to Lord Mahadev, Maa Kaali & the Archangels of Healing © All India Federation of Astrologers Society ® Second Edition : January 2023 Written specially for the Courses of Studies of the Federation Printer :"},{"t":"p","x":"Future Point Pvt. Ltd."},{"t":"p","x":"Flagship Store : A-3, Ring Road, South Extn Part-I, New Delhi-110049 Branch Office : B-237, Sector 26, Noida (U.P)- 201301 Ph: 40541000, 40541020 Email: mail@aifas.com, Web: www.aifas.com Publisher :"},{"t":"p","x":"All India Federation of Astrologers Society ® A-3, Ring Road, South Extn Part-I, New Delhi-110049 Email: mail@aifas.com, Web: www.aifas.com Tarot Secrets Unveiled Editor Writer Dr. Arun Bansal Rrachita Gupta 'Ravera'"},{"t":"h","x":"Price :` 600/-"},{"t":"h","x":"About the Editor"},{"t":"h","x":"Dr. Arun Bansal"},{"t":"h","x":"Chairman"},{"t":"p","x":"All India Federation Of Astrologers' Societies Chief Editor Future Samachar & Research Journal of Astrology Dr. Arun Bansal, M.Sc. in Physics from Delhi University, he also did M.Phil and research in computer science from Jawahar Lal Nehru University, Delhi. His knowledge of Astrology and computer science inspired him to develop the first ever program on Astrology in 1981, when computers were not so popular in India."},{"t":"p","x":"Mr. Bansal did research work on intricate topic of longevity in astrology and for this valuable research work Mewar University conferred him the degree of doctorate in Astrology on 23rd December 2018."},{"t":"p","x":"He started organization Future Point (P) Ltd. in 1985 and developed the most popular programs in the name of Leo-1, Leo-99, Leo Gold, Leo Star, Leo Star Expert, Leo Star Professional, Leo Touch based on various systems of Astrology like Parashar, Jaimini, Tajik and K.P. He has introduced his astrological software on Palm organizer and Android based mobiles."},{"t":"p","x":"He has a research dominated thinking. By conducting various surveys on astrological groups, he has tried to prove that planets behave in a special manner at a particular angle or in influence of other planets. He has developed a highly accurate software to predict rain forecasting, share market, commodity market & money markets based on the last market values & planetary position. He has also developed programs to accurately suggest about matching, profession or illness."},{"t":"p","x":"In the face of all he stands tall in the portals of astrology, commanding respect and recognition at various levels. His great ambition is to disseminate knowledge of Indian Vedic sciences all over the world. He has successfully organized international seminars on astrology in Mauritius, Singapore, Dubai, South Africa, Netherlands etc. between 2001 and 2016."},{"t":"p","x":"Dr. Bansal is the President of \"All India Federation of Astrologers Societies\", the largest Indian Federation teaching Astrology, Palmistry, Numerology and Vastu in over 100 cities of India. He is also the publisher and Chief Editor of popular astrological magazines \"Future Samachar\" and \"Research Journal of Astrology\"."},{"t":"p","x":"He has written and published many books on astrology. He is a hot favourite of those who seek consultancy in astrology as he has gained limitless clout by way of his uncanny predictions & interpretations."},{"t":"p","x":"Dr. Bansal has given a new direction to the divine science of Astrology and has created awareness amongst the masses towards this science. We hope that the new reseaches performed under his guidance will give a new dimension to Astrology and other occult sciences which will enable the astrologers to make accurate predictions."},{"t":"h","x":"Ach. Rrachita Gupta"},{"t":"p","x":"Gold Medalist MBA, M.A (Economics), Jyotish Rishi, Tarot Diva Faculty- AIFAS, Life Coach - Astrology, Tarot, Numerology Astrologer Rrachita Gupta (Winner of Tarot Diva Award), is an internationally acclaimed and globally travelled Life\u0002Coach through Mystical Sciences. She is a gold medalist in M.B.A. from Delhi, India and M.A. (Economics) from Delhi University. She is a Consulting Vedic/K.P. Astrologer, Tarot Card Therapist, Numerologist, VastuShastri & Reiki Master. Contributing currently as Tarot Coach and Lecturer with All India Federation of Astrological Socieities(AIFAS). She has been bestowed with the TAROT DIVA award by Bharat Nirman(GOI)for her unique work in\"Astrological Perspectives into Tarot”"},{"t":"p","x":"She studied deeply and holds accreditions in Jyotish Rishi, Krishnamurthy Padhati Astrology, Ank Shastracharya(Numerology), Vaastu Shastracharya, Tarot Reading and Counselling, Runes, Angel cards and Angel Therapy (certified by Doreen Virtue U.S.A.), Chakra Healing and Dowsing, Vastu Shastra. During her Schooling from Convent of Jesus & Mary, Delhi and graduation days at Lady Shri Ram College, Delhi she started predicting accurately with Horoscopes and zodiac signs. She was awarded the title of \"Divine Counselor with a Rational Mind” as her methodology combines the traditional wisdom with challenges of the modern global world."},{"t":"h","x":"About the Author"},{"t":"p","x":"Acharya Rrachita possesses rich corporate experience in India and overseas with a special focus on Mentoring, Training and Psychological Coaching. Her 10-year stay in Europe and Pan - Asia has given her the special skills to deal with multi-cultural temperaments and special training in Feng Shui (Taiwan) and Energy Healing. As Corporate HR of MNC companies, she learnt the analogy that goes behind the human mind and how the psyche works. She is an expert when it comes to behavioural management and reading minds."},{"t":"p","x":"She gives detailed and effective solutions through mantras, Spells, Candle rituals, Crystals, Color therapy, Tarot rituals, Aromatherapy, Vedic traditional solutions, name balancing, affirmations, Chakra meditations, Reiki healing and several other modalities she has developed a strong connection with. She has conducted workshops in esoteric subjects of Osho\u0002Zen Tarot, Angel Realm Therapy, Chakras and Meditation, Visualisations and Success among others."},{"t":"p","x":"Always an exemplary student, she has been a consistent writer and her works have been published in online journals, social media and other publications like Future Samachar, Ravishing, Life Positive. She has a Youtube channel with a healthy viewership and also contributes regularly on her Facebook group Being a firm believer in Laws of Universal Energy and the Power of Self Healing and Meditation, she advocates that the various divination sciences are inter-related and must be used in synergy with each other to understand the problems of the querist who comes to seek an answer and provide him/her high quality and sincere guidance. She has a list of repeat clientele from around the world who respect her for accurate predictions and empathetic life-coaching and she also conducts sessions, workshops and healing programs regularly."},{"t":"h","x":"Table of Contents"},{"t":"p","x":"Chap. 1 Introduction to Realm of Tarot 1 Chap. 2 History of the Tradition of Tarot Card Reading 8 Chap. 3 Symbols in Tarot Cards 14 Types of Decks 14 Symbols In Tarot Cards 17 Can the Tarot Cards be Categorised as Positive or Negative?"},{"t":"h","x":"28"},{"t":"p","x":"Chap. 4 The Tarot Deck - Structure 30 Wands 34 Cups 35 Swords 35 Pentacles 36 Tarot-Window to the Soul 38 Chap. 5 Preparing Your Deck for a Tarot Reading 39 Deck Selection 39 Storing the Cards 40 Cleansing & Energising of the Deck 41 Chap. 6 Performing & Giving the Reading 44 Creating own Spread 49 Pop out Card 50 During the Reading : Important Tips 54 Chap. 7 Popular Tarot Spreads 56 Single Card Spread 56 1. Guidance of the Day (G.O.D.) Card 56 2. Yes/No Spread 57 3.\"Meditation of Day” Card 59 Three Cards Spread (Two Cases) 59 Celtic Cross Spread 62 Relationship Spread 65 5 Card Pointed Arrow Spread for Problem Resolution 68 True Love / New Love Spread 69 Career Path Spread 70 Mandala Spread 71 Chap. 8 Major Arcana Cards 72 The Fools Journey & Major Arcana 76 The Soul Journey Flowchart 78 Ready Reckoner: 80 0 The Fool 82 1 The Magician 84 2 The High Priestess 87 3 The Empress 90 4 The Emperor 93 5 The Hierophant 96 6 The Lovers 99 7 The Chariot 101 8 Strength 103 9 The Hermit 105 10 Wheel of Fortune 107 11 Justice 110 12 The Hanged Man 113 13 Death 115 14 Temperance 117 15 The Devil 120 16 The Tower 123 17 The Star 125 18 The Moon 128 19 The Sun 131 20 Judgement 134 21 The World 137 Chap. 9 Minor Arcana Cards 139 Wands 1 Ace of Wands 143 2 Two of Wands 145 3 Three of Wands 147 4 Four of Wands 149 5 Five of Wands 151 6 Six of Wands 154 7 Seven of Wands 156 8 Eight of Wands 158 9 Nine of Wands 160 10 Ten of Wands 162 11 Page of Wands 165 12 Knight of Wands 168 13 Queen of Wands 171 14 King of Wands 174 Cups 1 Ace of Cups 177 2 Two of Cups 180 3 Three of Cups 183 4 Four of Cups 185 5 Five of Cups 187 6 Six of Cups 189 7 Seven of Cups 192 8 Eight of Cups 194 9 Nine of Cups 197 10 Ten of Cups 200 11 Page of Cups 203 12 Knight of Cups 205 13 Queen of Cups 207 14 King of Cups 210 Swords 1 Ace of Swords 214 2 Two of Swords 216 3 Three of Swords 219 4 Four of Swords 222 5 Five of Swords 225 6 Six of Swords 228 7 Seven of Swords 231 8 Eight of Swords 234 9 Nine of Swords 237 10 Ten of Swords 239 11 Page of Swords 242 12 Knight of Swords 244 13 Queen of Swords 246 14 King of Swords 249 Pentacles 1 Ace of Pentacles 252 2 Two of Pentacles 255 3 Three of Pentacles 258 4 Four of Pentacles 261 5 Five of Pentacles 264 6 Six of Pentacles 267 7 Seven of Pentacles 269 8 Eight of Pentacles 272 9 Nine of Pentacles 275 10 Ten of Pentacles 277 11 Page of Pentacles 280 12 Knight of Pentacles 283 13 Queen of Pentacles 286 14 King of Pentacles 289 Chap. 10 Additional Attributes 292 Court Cards 295 Top 3 Tarot Mistakes Beginners Make 297 The Last Words 298"}]},{"id":"v1-c1","vol":"I","title":"Chapter 1 · Introduction to the Realm of Tarot","body":[{"t":"p","x":"Encountering the Tarot for the first time is like opening a door to a new portal; a new dimension of human living and human awareness."},{"t":"p","x":"The Tarot is a deck of cards now commonly used in\"Fortune Telling” or Divination."},{"t":"p","x":"Divination using Cards is called Cartomancy and the experts who can predict and guide using cards, especially in reference here Tarot Cards are called Tarot Cartomancers. What Are Trumps In The Tarot?"},{"t":"p","x":"The Major Arcana, also called the TRUMPS is called the Heart of the Tarot. In these 22 image laden cards, the primary teachings and philosophical journey on the Tree of Life are expressed."},{"t":"p","x":"Each of the Illustrations on the TRUMPS is an allegorical representation of a different state of evolution of the human experience. The Trumps flowchart the Fool’s Journey which is essentially a progression of the soul from Neophyte------> to Initiate ----> to Adept."},{"t":"p","x":"The Trumps in this book are described for both prediction purpose and if one wants to dive deeper into the metaphysics, the mystical journey from the Major Arcana/Trumps is also a delightful journey."},{"t":"h","x":"Introduction to"},{"t":"h","x":"Realm of Tarot"},{"t":"h","x":"Chapter-1"},{"t":"p","x":"The Major Arcana or Trumps is a box of hidden treasures that bears your name and energy stamp on it. However you see the Tarot, it has great power to transform your life and make you more aligned with the Universal forces."},{"t":"p","x":"The term Arcana is derived from the Latin word Arcanum, meaning a mystery or a secret. There is a subtle difference between the two terms. A Secret can be told or withheld, but a mystery can never be fully explained."},{"t":"p","x":"Studying the Tarot cards with a peaceful mind and an enquiring intellect and an awakened Intuition will bring about deep and everlasting positive transformations in your life. You will enter into a world of mystery, waiting to give you beautiful and startling insights into human psychology and behaviour that are shaping the environment around you, constantly influencing your own way of interacting with the world. When we know how to decipher the Tarot cards and its esoteric language we are empowered with the following gains."},{"t":"p","x":"1. Tarot is an incredible tool for making predictions for the future and to orient our life towards the positive outcome. 2. Tarot cards are miniature masterpieces. Their intricate figures and symbols illuminates our most complex dilemmas and desires."},{"t":"p","x":"3. When faced with dilemmas of not knowing which route to take that will lead us to success, the Tarot with its Choice Spread is a great advisor, giving correct non\u0002biased advice. 4. It connects us to the Divine within us. The scriptures are all of uniform view that\"AS ABOVE, SO BELOW; AS THE UNIVERSE SO THE SOUL”. The human soul is the repository of our accumulated knowledge and experiences over the myriad births of our soul journey. Tarot through its rich mystical imagery mirrors our soul and the karmic patterns that have shaped our patterns over the births. Its a glimpse into the DNA of our soul."},{"t":"p","x":"5. Tarot is a fabulous psychological tool. When we want to assess what another person is feeling or having thoughts about, Tarot gives very clear answers. Its like a mystery solved when we gain understanding of the other’s inner mind working."},{"t":"p","x":"6. Find that which you can do; which only you can do. That gives the world someone special and someone great. Tarot makes you aware of your strengths and talents and you can harness them to fulfill your soul purpose and be a unique personality and follow your passions."},{"t":"p","x":"7. Relationships and matters of the Heart have always been sensitive and complicated. In the current times of individual self-awareness, its difficult to achieve harmony and thus relationships are getting fractured and result in break ups, divorces and separations at a higher amplitude. Tarot is a wonderful tool for identifying the factors going wrong in the relationship and how the partners can adjust their energies that they put into the relationship in order to enhance mutual love and understanding."},{"t":"p","x":"8. Marking an identity and creating a livelihood and an aspirational lifestyle have always been the pursuit of most of mankind. There are a multitude of issues concerning career and profession that trouble a working person’s mind and those affected by it. Tarot effectively answers choices and worries regarding career and profession, job and business such that person gets clarity on how to maximize his potential and be successful at work."},{"t":"p","x":"9. How we see the world around us is a factor of our Perception. What’s happening in your outside world is a reflection of what is happening in your inner world and whats happening in your inner world(psyche) can also be a reflection of whats unfolding in your outer world. Once this understanding comes, one can consciously work on the inner world and the Chitta(perceptive part of our mind) to align it with the outer world for success, peace of mind and conducive relationships."},{"t":"p","x":"10. Tarot is an inter personal relationship roadmap. It has specific and customized spreads for relationships be it between friends, business partners, parent-child, marital partners, lovers, boss-employee and others. One can even chart the relationship between a new joinee and the organization. All of this helps to build strong, sustainable and win-win situation condition."},{"t":"p","x":"11. Tarot brings about a fusion of the masculine and the feminine attributes (yin-yang) of the human personality so that he can function as a complete individual."},{"t":"p","x":"Various life situations call for the proactive or receptive modes and with Tarot our stance can be adjusted as per the need of the situation. This leads to best solutions and inner calm."},{"t":"p","x":"12. As a tool of Self Guidance, Tarot is perhaps the most powerful weapon. Its in fact the Brahmastra (the ultimate cosmic weapon) as we can ask the Tarot cards about our innermost feelings, fears and emotional impulses. In a confidential and loving manner, the Tarot cards will untangle our mental webs and bring about suggestions to take the best action in a particular circumstance. Issues you cannot discuss with others, you can safely take the shelter of the Tarot."},{"t":"p","x":"13. As a source of Visualization, Tarot is being incorporated in Life coaching and Self Empowerment programs in the contemporary times. The archetypes of the Major Arcana and the inherent\"energy” of the elemental four suits provide the basis for the direction in which to visualize the desired outcome and then take steps - corresponding THOUGHTS----->BEHAVIOUR ----->PERFORMANCE/GOAL to achieve the same."},{"t":"p","x":"14. If feeling stuck in business or job or even facing the dilemma of switching area of work or verticals at work place, the Tarot gives clear and bang on advise on where your true potential lies and thus your ultimate success."},{"t":"p","x":"15. Meditation becomes deeper and more meaningful when accompanied by the evocative imagery of the Tarot. It provides the focal point where you can concentrate your attention and the Mind will gain its equilibrium."},{"t":"p","x":"16. Tarot through the past, present and future spread gives insight into the underlying roots of an issue or a habit. It helps to glimpse into the genesis and thus influence the future outcome."},{"t":"p","x":"17. Tarot provides peace of Mind. It is an immediate answer of the Oracle to the burdens and botherations of the Mind."},{"t":"p","x":"18. Tarot usage enhances your Intuitive and psychic abilities. The cards are a medium through which your Subconscious is galvanized into action and the cards reading is primarily done by connecting your higher self(Intuitive self that lies within each of us) to the Signals of the Universe."},{"t":"p","x":"19. Compatibility and Match making for romance or marriage purposes is another delightful way to use the rich language of the Tarot."},{"t":"p","x":"20. Tarot can be combined with other esoteric modalities of divination such as Astrology, Numerology, Chromotherapy, Crystal Guidance Therapy, Energy Healing, Runes et al to provide comprehensive and very effective support and healing to the client."},{"t":"p","x":"21. When a person is looking for answers and does not know what are creating blockages in his life and is just being tossed around like a ball by environmental factors, Tarot can provide the clear perspective and inspiration to make intelligent choices and take clear path to self improvement and self actualization."},{"t":"p","x":"22. It provides Hope and Optimism and the stamina to deal with problems of life and the emotional body."},{"t":"p","x":"23. On several occasions, a non judgemental and realistic Tarot counselling session saves a person from acute mental distress and depression. It is like a Psychic life-line to safety and support."},{"t":"p","x":"24. In case a delay is seen in outcome then Tarot provides you strength to gracefully wait and accept the present situation."},{"t":"p","x":"25. Excellent tool of remedies as tarot readings throw up an exciting plethora of remedial interventions that you can offer to the querist viz. Vedic remedies, yantras, mantras, donations, gem stones usage, Crystal Guidance usage, Crystal Guidance healing, vastu remedies, feng shui tips, reiki healing, Crystal Guidance grid healing, numerological analysis and many others."},{"t":"h","x":"Tarot - The Language of the Stars"},{"t":"p","x":"“ I don’t believe in Tarot\""},{"t":"p","x":"This statement is incorrect in itself. Tarot is not a belief system like religion which you may or may not believe. Tarot is a language."},{"t":"p","x":"The language of the higher self and the universe."},{"t":"p","x":"The language that we need to decipher and understand in order we align our actions and thoughts and way of perceiving our world with the absolute truth."},{"t":"p","x":"Its the divine talking to us to enable us lead a fuller life on earth. the language of wisdom."},{"t":"p","x":"The universe speaks to us, embraces us, through the mystical magickal Tarot."},{"t":"p","x":"-Rrachita Gupta 'Ravera'"}]},{"id":"v1-c2","vol":"I","title":"Chapter 2 · History of the Tradition of Tarot Card Reading","body":[{"t":"p","x":"The origins of Tarot card reading are still shrouded in mists of mystery but its universally accepted that it was propagated by the nomadic gypsies. This group of wandering tribes, closely associated with Earth magic and nature worship travelled to various parts of Europe in the 13th century and therein Tarot gained ground and was subject of research and deep study. For nearly four centuries, Tarot fascinated the European world who practised it, delved into its many meanings and came up with their own interpretations. During this period Medieval Renaissance in the Middle world, the imagery and the form of Tarot was changed many times."},{"t":"p","x":"Its also believed that the present day Tarot has been influenced by the Maqluk Cards of the Muslim world. The Maqluk cards also carry the symbolism of Suits like cups, coins, swords and Polo sticks."},{"t":"p","x":"Tarot over the centuries has proved itself to be a flexible system of Human guidance and has responded to differing places and times. The roots can be traced back to Pre Christian era where the Tarot religious imagery was relegated and limited to the hallowed portals of the Church and thus quite inaccessible to the public at large. After following a degree of religious persecution, the Tarot tradition stayed unexplored for a few centuries."},{"t":"h","x":"History of the"},{"t":"h","x":"Tradition of Tarot"},{"t":"h","x":"Card Reading"},{"t":"h","x":"Chapter-2"},{"t":"p","x":"When Tarot developed in the Middle Ages in Europe, it was the time of the Intellectual Renaissance or the REAWAKENING of human intellect and talents."},{"t":"p","x":"In this period the philosophical trend was shifting from Religion to\"Power of Self”. For long the Church and other well established institutions of the society had been guiding man to follow a rigid set of rules and regulations. The human spirit which is always in need for answers and for improving its understanding of the world resented this rigidity and orthodoxy."},{"t":"p","x":"In 1450 Cosimo de Medici commissioned the scholar, physician, herbo specialist and priest Marsilio Ficino to some significant artwork that later was incorporated into Tarot imagery. Ficino in his book\"The Book of Life” (based on the concept of living life as per cosmic principles) advocated the use of images or mental pictures in a way that we might now call Creative Vizualisation."},{"t":"p","x":"The Renaissance spirit provided the fertile ground in which creativity could thrive. What beautifully received impetus was the fusion of artistic sensibility with spiritual hunger and impregnated the metaphysical world with seeds that became the Tarot."},{"t":"p","x":"Playing cards containing the familiar four suits appeared in Europe in 1377. Some 60 years later, a new set of cards emerged known as\" CARTE DA TRIONFI” or\" Cards with Triumphs”. These cards contained a separate suit of Triumphs and included an additional picture cards in each of the four suits."},{"t":"p","x":"**The Triumphs referred to Trumps or the Major Arcana. The popular evidence of Tarot resurfacing and becoming a part of the intellectual circle was in Italy where it gained almost cult status as an ancient game called TAROCCHI (from which the modern name of Tarot is derived) which was a card game bearing similarities with the card game of Bridge. Tarocchi usage was first recorded in 1516. Had this term not come into usage, we might still be referring to these 78 cards as Carte da trionfi."},{"t":"p","x":"Tarocchi(pronounced TA-RO-KHI) is still practised in many parts of the world but does not resemble the modern Tarot much in terms of card meanings and card structure. A very valuable contribution to the development of Tarot thought comes from Visconti-Sforza families who commissioned 11 different sets of Tarocchi cards. Such packs were commissioned to document ceremonial events."},{"t":"p","x":"A striking event of such stature was the wedding of Francesco Sforza to Bianca Maria Visconti in 1428. Of the original 11 sets, two sets remain almost complete and four sets with 1 card each. The other sets have disappeared in the mists of oblivion. A set of 16 hand painted cards were sent as a gift to Queen Isabella in 1449. Commissioned by Visconti, the cards played on the themes of pleasure, virginity, riches."},{"t":"p","x":"The Renaissance was an era of exuberance; celebration of life in full splendor the human beauty of form and thought. Man at once was the most beautiful creature, the most Divine and the most Intellectual."},{"t":"p","x":"Such a well rounded perspective of human potential is actually, as per me, the maturity and depth of the philosophy of Tarot."},{"t":"p","x":"It celebrates and reveres the decision making power of the Human psyche in alignment with Divine will and blessings. The Tarot deck is an allegory of Divine and Devil, personal power vs total surrender, mind control and manipulation. It oscillates between the paradigm contrasts that are so special to the Human heart and therein lies its strength as a perfect mirror to the human soul."},{"t":"p","x":"The Tarot became firmly entrenched in Human divine guidance realm by 15th century. The Printing Press was inaugurated in the 1450s and this gave a fillip to the card industry at large as the decks became more easily available in uniform imagery."},{"t":"p","x":"Europe was dotted with quaint and magical little chambers where fortunes were read and cards were used extensively to predict the future and to provide valuable insight and psychological help to the querists. At this stage it was more prophetic in nature than therapeutic."},{"t":"p","x":"This stage of flourish again received a dent when the radical thought associated Tarot with negative connotations of misleading the common populace and anti-establishment and many practitioners had to shut shop."},{"t":"p","x":"Rediscovery of Tarot by Court de Gebelin In 1781, Antoine Court de Gebelin, a French protestant pastor was wonderstruck by the metaphysical beauty and mystery of the Tarot cards and its connection with the ancient civilisation of Egypt. He wrote :"},{"t":"p","x":"“ Imagine the surprise which the discovery of the Egyptian book would cause if we learned that a work of the ancient Egyptians still existed in our time. The book does exist. It is composed of seventy seven, even seventy eight, sheets or pictures divided into five classes, each showing things that are as varied as they are amusing and instructive. In a word, this book is the game of the Tarot.”"},{"t":"p","x":"It was Court de Gebelin who connected the 22 Trumps of the Tarot with the 22 letters of the Hebrew Aphabet (discussed in detail in Part 2 of the book - Tarot linkages with Qabbalah) and rechristened the Papess as the High Priestess (as we know her today) and the Pope as the Chief Hierophant, among others. Court de Gebelin’s own work, LE MONDE PRIMITIF, included an additional essay in which Tarot was called\"The Book of the Thoth”, a name that has lived on in the present century. Tarot in 19th Century The French occultist Eteilla regarded the Tarot as a book of wisdom covering a history of mankind. His writings on Astrology. Alchemy and Tarot as a form of fortune telling resulted in resurgence of interest in the intelligentsia and opinion makers of France. The French opinions were regarded as elitist and were respected and sought after the entire European continent."},{"t":"p","x":"Another French philosopher and occultist Eliphas Levi escalated the Tarot research and linked it to ancient mystical traditions like Qabbalah. The recreation of the Tarot was completed in England by Order of the Golden Dawn. Several relevant decks were produced during this time including the Order of the Golden Dawn Deck, Rider Waite Deck, Crowley’s Deck among others."},{"t":"p","x":"Tarot in the 20th Century And Current Scene Tarot over the centuries underwent a complete transformation, all for the better, embracing a richness of ideas and experiences."},{"t":"p","x":"From the domain of a secret few it has developed into a universally popular wisdom window to life."},{"t":"p","x":" It began as a secret symbolic code shared only among members of a close metaphysical society. Members took sacred oath to maintain the secrecy of the Tarot code. Tarot cards were hand-drawn and were fiercely guarded by the privileged apostles."},{"t":"p","x":" Traditionally, Tarot also got the treatment of being subjected to distrust and suspicion. It was not valued outside the secret group that was attuned to its imagery and practised it. Meditation was an unheard of term in the Western thought through which Tarot has emerged.  In the current times, Tarot is claiming a lot of attention and enthusiasm. Spirituality and Psychology are integral part of the global thought process and Tarot is an invaluable tool that links both of them."}]},{"id":"v1-c3","vol":"I","title":"Chapter 3 · Symbols in Tarot Cards","body":[{"t":"p","x":"There is a multitude of Tarot card decks available in the modern times. Due to online shopping the choice and the availability of decks around the world has become convenient. Tarot has gained by this prevalent usage as seekers can now peruse and obtain a deck of their choice."},{"t":"p","x":"The choice, at times, can be quite overwhelming. Its also worthwhile to visit a Book Store or Metaphysical Store and\"see” and\"feel” the cards in person and in their actual format. Card decks, even when new and packed, carry a certain latent energy and it is interesting to examine the decks physically and buy the deck that appeals to your philosophical stance and personal-energy grid."},{"t":"h","x":"Historical Tarot"},{"t":"p","x":" Ancient Tarot of Marseilles- A reproduction of the original 1760 pack  Spanish-English Tarot: A deck based on woodcuts dating 1736  Visconti- Sforza Pierpont Morgan Tarocchi- A reproduction of the 74 existing cards plus 4 recreated ones. An especially beautiful and alluring deck."},{"t":"p","x":" Cary Yale Visconti Deck- A unusual set containing 16 cards per suit Classic Tarot This category needs to be noted as its a descendant of the creative spiritual works of Hermetic Order of the Golden Dawn Symbols in Tarot Cards Chapter-3 and they have stood the test of time and acquired cult status  Crowley Thoth Deck : This deck is designed by Alistair Crowley who delighted in his own creativity and unconventionality  The Golden Deck Tarot  The Rider Waite Deck: This is the most popular of all Tarot decks."},{"t":"p","x":" The Zolar Astrological Tarot: Based on the Rider-Waite Tarot, but uses a standardazised colour code."},{"t":"h","x":"Goddess Tarot"},{"t":"p","x":" Motherpeace Round Tarot: This is a popular contemporary Deck based on theme of celebrating women’s culture."},{"t":"p","x":" Gendron Tarot: This Tarot takes you into the world of the Goddess and her animal companions."},{"t":"h","x":"National Tarot"},{"t":"p","x":"These packs are inspired by national mythology and Tarot and are particularly appropriate if your ancestral lineage taps into any of these roots."},{"t":"p","x":"They are also an incredibly rich source of mythology and traditions and the core spiritual philosophy of a country or an ethnic group."},{"t":"p","x":"Some of these decks are:"},{"t":"h","x":" Mayan Tarot"},{"t":"h","x":" Chinese Tarot"},{"t":"h","x":" Russian Tarot of St Petersburg"},{"t":"h","x":" Osho Zen Tarot"},{"t":"h","x":" Sacred India Tarot"},{"t":"p","x":" Kalevala Tarot(based on Finnish epic poem)"},{"t":"h","x":"Fantasy Tarot"},{"t":"p","x":"These decks combine traditional Tarot format with characters drawn from the world of the Fantasy  The Lord of the Rings Tarot  Unicorn Tarot  Dragon Tarot Angel and Oracle Decks These use the imagery of the Angels, Archangels, fairy and spirit guides’ realm and have found deep resonance as they are kind and comforting in nature. Gentle advice and guidance is imparted along with some spectacularly beautiful flowing visuals."},{"t":"p","x":"They are very often used in consonance with regular Tarot Deck as Top Up Cards for a well rounded empathetic reading session."},{"t":"h","x":"Current Study"},{"t":"p","x":"The Rider Waite Deck is being used for study in this context.  It is the most popular deck in the world today and finds most recognition amongst Tarot readers and followers in various countries across the globe."},{"t":"p","x":" With its 78 card treasure, its one of the largest and most comprehensive database of Tarot cards covering all aspects of life."},{"t":"p","x":" Its elemental suit structure is very relevant. It corresponds to the 5 elements theory and appeals to both the Heart and the Mind."},{"t":"p","x":" This Tarot has been closely emulated by other Tarot decks."},{"t":"p","x":" It presents a Qabbalistic philosophy in a clear symbolic language."},{"t":"p","x":" This deck was developed by publisher William Rider and popular mystic A.E. Waite who commissioned Pamela Coleman Smith to illustrate the deck. It came into wide public usage since 1909."},{"t":"h","x":"Symbols In Tarot Cards"},{"t":"h","x":"Epochal and Paradigmatic in nature"},{"t":"p","x":"Tarot was developed over centuries by minds that carried very high spiritual frequencies."},{"t":"p","x":"Tarot cards are replete with Color Guided visuals and symbols. Its like a book of symbolic pictures and we need to learn its language. Each card is a veritable treasure of ancient symbols, religious allegories and historic events. Each card is a golden key that unlocks a deeper understanding of the world around us and within us."},{"t":"p","x":"Symbols have developed over centuries from real life around us and have taken on an abstract meaning through a shared understanding of the human consciousness."},{"t":"p","x":"The visuals have great meaning and we need to understand the meanings of these symbols so that we can relate the positive and darker shades of these symbols to the question being investigated or the situation being analyzed by the Tarot cards in a particular context."},{"t":"p","x":"Imagine that the philosophy of life and death has to be conveyed only through symbols and an overriding consideration is that the symbols should be understood in similar context by tarot readers from across the world. Just appreciate the complexity and yet the beautiful simplicity of the human mind that will understand the symbols in uniform meaning, whatever his national or cultural background may be."},{"t":"p","x":"The Symbols of Tarot is an exemplary subject in itself. The categories of symbols are derived from the work of Robert Assagioli, the founder of Psychosynthesis."},{"t":"p","x":"He placed great importance on the use of symbols as a route to psychological growth and personal well-being. Here are the categories of the symbols found on the Tarot cards: 1. Natural Symbols Earth, air, fire, water, sky, sun, moon, stars,mountain, sea, stream, river, lake, pond, wind, cloud, fog, tree, cave,flame,fire, wheat, seed, flowers, rose, lotus, sunflower, jewels, light(sunrise, rays of light, darkness)"},{"t":"h","x":"2. Animal Symbols"},{"t":"p","x":"Lion, tiger, bear, snake, wolf, deer, bull, goat, worm, chrysalis, butterfly, birds, domestic animals."},{"t":"h","x":"3. Human Symbols"},{"t":"p","x":"Father, mother, son, grandfather, grandmother, son, daughter, child, wise old man, magician, king, queen, prince, princess, knight, teacher, human heart, human hand, the eye, birth, growth, death, resurrection."},{"t":"h","x":"4. Man-made symbols"},{"t":"p","x":"Bridge, channel. Flag, fountain, lighthouse, candle, road, wall, door, house, castle, ladder, mirror, box, sword. 5. Western religious symbols God, Christ, Holy Mother, angels, devils, saints or holy men, priest, monk, resurrection, hell, heaven, the grail, purgatory, temple, chapel, cross."},{"t":"h","x":"6. Eastern Religious symbols"},{"t":"p","x":"Brahma, Vishnu, Shiva, the Buddha."},{"t":"h","x":"7. Mythological symbols"},{"t":"p","x":"The Ankh, Venus, Diana, Hercules, Pluto, Saturn,Mars, Mercury, Jupiter and in other ethnic decks you may find many more mythological symbols."},{"t":"h","x":"8. Abstract symbols - Numbers"},{"t":"p","x":"Geometrical shapes like triangle. Square, dot, cross, diamond, five - pointed and six-pointed stars, sphere, cube, cone, ascending spiral. Here are the detailed interpretations of the symbols featuring prominently:"},{"t":"h","x":"1. Angel"},{"t":"p","x":"Angels are celestial messangers and their presence in the spread indicates a strong divine presence guarding and guiding. It may indicate presence of a divine presence who can rectify a troublesome situation."},{"t":"p","x":"Messages or positive powerful divine intervention is at hand."},{"t":"h","x":"Angel"},{"t":"p","x":"It shows that a Union is blessed. Shows need for balance of energies in life. Additional meanings are union between heart and mind, sound decision making, making adjustments as per situation, happy coincidences and serendipity. Also indicate are high intellectual capability, spiritual signals, angel dreams, intuition, purpose and drive, awareness and inner voice."},{"t":"h","x":"2. Ankh"},{"t":"p","x":"Ankh is an ancient Egyptian symbol and was carried as a sacred omen by the powerful Pharaoh and nobles of royal court. The circular shape on the top is indicative of the sole brilliance of the Sun(supreme authority)"},{"t":"p","x":"and the vertical meridian intersecting it is the horizon of the earth."},{"t":"h","x":"Ankh"},{"t":"p","x":"The cosmic union of the Sun and the Earth is magical and divine. Indicates the ultimate in perfection and abundance and the unlimited potential to create. Some coonect it to union for perfect Human being created. It also shows Sacral/ Swadishthana Chakra where the perfect idea or energy may take root and blossom. Additional meanings are security, purity, royalty, power, control, egomania, respect, traditions, consistency, continuity."},{"t":"h","x":"3. Arch"},{"t":"h","x":"The arch symbolizes new and fresh"},{"t":"p","x":"opportunities for expansion; its a gateway or portal to higher levels of learning or achievement, shows that the issue at hand is concealing both positive and negative aspects; the intellect should be used to make sound judgement ; judgement will decide the level of success achieved."},{"t":"h","x":"Arch"},{"t":"p","x":"Also symbolic of the expansiveness of sky. Indeed, arches were symbolic of Greco-Roman sky gods Zeus and Jupiter. Additional meanings are gaining another perspective, empathy etc."},{"t":"h","x":"4. Bird"},{"t":"p","x":"Bird signifies high intellectual acumen and a superior intelligence. They show that the querist is in a strong position with a powerful control over the situation / matter at hand."},{"t":"p","x":"Birds also denote ethereal realms and communication as they belong to the Air element."},{"t":"h","x":"Bird"},{"t":"p","x":"Shows need to shrug off emotional burdens and soar high on an emotional or core level."},{"t":"h","x":"5. Boat"},{"t":"p","x":"The presence of the boat shows rumblings within the heart space. The subconscious is receiving signals for change or movement."},{"t":"p","x":"The movement that comes after lot of contemplation is evident when the boat comes in the reading. It also stands for protection, movement, security. Boat 6. Brick Wall Brick wall is an indication of solidity and stability in the reading. It may also indicate that mental blocks are about to break down and the sunlight of knowledge or emotional acceptance will soon stream in. Additional meanings are boundaries, obstacle, progress, courage, resilience etc Brick Wall 7. Bridge When the bridge shows up its a very positive sign. Its a movement of the subconscious towards recovery and a brighter future. It shows an opportunity that must be availed of to move to higher ground. The bridge is generally symbolic of the presence of a consultant, a well wisher, a counsellor or an empathetic supporter who will help get over the travails or confusions and move over to clarity and brightness."},{"t":"h","x":"Bridge"},{"t":"h","x":"8. Bull"},{"t":"p","x":"The bull is a symbol of power, force, royalty and stability. It appears to show that dogged persistence and an unflinching attitude are either present or required to be put into the situation."},{"t":"p","x":"Whatever the goal may be, self belief and sustained effort will be required. Signifies a person who is resolute and determined and in extreme cases very stubborn. Additional meanings are courage, self confidence, strength. Bull 9. BUTTERFLY The butterfly is a beautiful and pure symbol in Tarot language. It denotes transformations and the emergence of a higher being after going through a painful or a struggling period. It denotes flight into higher realms where the soul has found a higher purpose to strive for."},{"t":"h","x":"Butterfly"},{"t":"p","x":"The butterfly is vibrant and soars and relishes multiple sensory experiences. It denotes that a positive change is inevitable, however dark the current period. Additional meanings are beauty, gentleness, love, divine blessings, changes in thought and demeanour, circular aspect of life, premonition, coming into full glory. Its an inspirational symbol and provides hope that self- love, self-growth is the key to come out of darkness/ ignorance."},{"t":"h","x":"10. Caduceus"},{"t":"p","x":"This indicates Duality, Opposing forces."},{"t":"p","x":"The two snakes intertwined around the Staff(wand) of Hermes symbolize polar opposites co-mingling for fusing their polarities. Its a union of the opposites. One serpent represents sulphur (male) while the other represents quicksilver (female)."},{"t":"h","x":"Caduceus"},{"t":"p","x":"The focal point is the Rod of Wisdom denoting harmony in duality. The Caduceus gives the message of cooperating and collaborating to reach a common vision. Additional meanings are balance, sexual relationship, intellectual compatibility, power to procreate, Transcendence, Integration, child birth, power of life, amicability 11. Castle Castle is a sign of solid achievements and a celebration of financial solidarity. High status, rewarding investments, fulfilled family life are all displayed when castle image emerges in the spread. Also indicates that what you are aspiring for is very close to being obtained. Castle Success and abundance and community support are other meanings of this symbol. Unparalleled success is also indicated by this symbol if the context of the spread pertains to it. Additional meanings are wealth, place of pilgrimage, leisure and recreation, strategic thinking, power, imagination, high ideals, protection, building and construction. 12. Chain The chain is a symbol of bondage and limitations. It denotes inability to perform our activity due to strict regulations or boundaries."},{"t":"p","x":"If the boundary is crossed, punishment and reprimand may follow. Also denotes an emotional weakness in own capability. Chain Low self confidence and anxiety about the future."},{"t":"p","x":"Maintenance of status duo and being stagnant in the present position rather than coming out of comfort zone. Future indicator of obstacles and shackles. Additional meanings are slavery, ignorance, trap, restrictions, complacence, penalty, darkness, disillusionment, falling into wrong habits. 13. Children The child is a very strong symbol in Tarot."},{"t":"p","x":"Since the child is the epitome of innocence, in Tarot language it indicates the arrival of total honesty and transparency, The truth may be about to come to Light. The darkness of ignorance and illusion is about to disappear."},{"t":"h","x":"Children"},{"t":"p","x":"Additional meanings are childlike nature of enthusiasm, impulsive thinking, no pre-existing prejudice in relationships, an active and vibrant personality, new beginnings, freedom, self-will and independence."},{"t":"h","x":"14. Flower"},{"t":"p","x":"When the Flower appears in the Tarot spread, it indicates that our thinking is positive and receptive. The results of the question asked will bring success and certification. It also signifies end of conflict and that opposing parties are coming together amiably and cooperatively."},{"t":"h","x":"Flower"},{"t":"p","x":"Its a healing symbol for partnerships of all types, whether related to work or personal relationships. Additional meanings are flourishing, growth, blooming and blossoming of talents, fresh opportunities, self belief in talents, appreciation of creativity, creative self expression etc."},{"t":"h","x":"15. Mountain"},{"t":"p","x":"Mountains indicate challenges and difficulties. Low hills will bring about smaller obstacles that need to be addressed with the right balance of passion, effort and intelligent planning. They bring positive results in shorter span of time. If the mountains are overbearing in the symbol then the challenge will be arduous. It might be a karmic test for the person in issue. It will require stamina and mental control to surmount the challenge and emerge victorious. Mountain denotes the spirit of courage and never-say-die attitude. Also signify being stoical and unwavering in face of crisis. Mountain also shows spiritual silence and the call of the soul to be in stillness."},{"t":"h","x":"16. Rose"},{"t":"p","x":"The Rose in Tarot indicates beauty, sensuousness and a ripe, full nature of the subject. In Occult it carries a deep significance and depth. In Tarot additional meanings are sensual nature, physical desires and passions, love, obsession, creativity, spirituality, abundance, happiness, joy, full satisfaction, purity, balance, premonition, growth and development etc."},{"t":"h","x":"Rose"},{"t":"h","x":"17. Sphinx"},{"t":"p","x":"The Sphinx is a fascinating creature, derived from the ancient Egyptian and Babylonian hieroglyphs. Its always been the vanguard of royal and superlative achievements. Its part Man-part animal lion construct indicates the complexity of the human sensory system and how that must be fully harnessed to achieve our goal. It indicates secrecy and riddles that must be solved in order to get ahead. The Sphinx guards and protects the secrets of life. As per mythology, the Sphinx provoked the traveller with riddles and only those who could satisfy its curiosity were allowed entry into the hallowed portals of knowledge of accredit-ion. Additional meanings are control, safety, intellectual expansion, professional success. 18. Staff The staff in tarot indicates dynamism and leadership. The staff is deeply rooted in the wandering ancient tribes and it was used by the shepherds to monitor the sheep and the goats in the herding communities."},{"t":"p","x":"It indicates total control and authority over the collective. In Tarot it indicates guidance, advisory role, pride and prestige, lordship, ownership, high ranking status etc."},{"t":"h","x":"Staff"},{"t":"h","x":"19. Water"},{"t":"p","x":"Water imagery is almost a constant in the Tarot linguistic dictionary Its an evocative symbol and common in the Cups suit apart from the other cards. Water represents our subconscious and the deep part of our emotional self. Signifies flow and fluidity, intuition, relationships, healing . Water also symbolic our imagination and the fantasy world. Running water indicates flow of emotions. May also indicate deep desires and feelings of the heart."},{"t":"h","x":"20. Wreath"},{"t":"p","x":"This symbol is remnant of the Graeco-Roman influence on the development of Tarot. Its a symbol of victory ever since the first ancient games upon mount Olympus where the victor was crowned in laurels (hence the term\"resting on his laurels\" comes when one relies on his/her credentials rather than further achievements)."},{"t":"p","x":"The wreath is sweet smelling and invokes the sweet smell of success. Its circular shape also indicates a cycle being completed (and thus the wreath is laid on the final passage/ death ceremony). In Tarot additional meanings are fertility, being victorious, abundance, fulfillment, divine intervention, blessings of God being upon you Can the Tarot Cards be Categorised as Positive or Negative?"},{"t":"p","x":"The self awareness that we gain by exploring the Tarot chart opens up tremendous opportunities for growth that allow us to get out of our own way."},{"t":"p","x":"We are often our biggest critics and the biggest obstacle in own growth. The world may tell us we are great but if we lack confidence we cannot get work accomplished. Similarly if the world tells us that we lack a particular quality or skill and would never be able to accomplish a specific but we believe that it can be done then nothing can stop us marching on our road of conviction and reaching the goal post. Success and Failure are two sides of the same coin and which side we flip and see our life coin coursing through, is really a matter of Self Perception."},{"t":"p","x":"For elaborating this point, let us consider The Tower card which remains one of the most powerful cards for self awareness. It indicates the pain we go through when we live a life of lies. We live in denial of acceptance of self or of another person or of a situation."},{"t":"p","x":"Its unhealthy and unnatural. And what is unhealthy can never be long lived. Its bound to crumble under its own weight some day. Tarot in such cases fore - warns us of the inherent fallibility of that aspect of our lives and we can take timely steps to salvage the Tower like situation."},{"t":"p","x":"The pain of letting go of an addiction or an unhealthy situation is far less than living the lie and watching its decay affecting other healthy aspects of our life. Even a seemingly dark card like the Tower is a ray of light in Tarot because it is the light of Truth."},{"t":"p","x":"It liberates us from what is not in our best interest and its riddance will bring about a freshness in your life. As if a heavy burden has been lifted from your shoulder."},{"t":"p","x":"Each of the 78 cards in the Tarot is extremely rich in symbols and in contextual meanings. No card is totally dark and no card is totally positive. Each card will carry a duality. Yes its accept worthy that certain cards do indicate more brightness while others may have a sense of foreboding lurking around them."},{"t":"p","x":"Cards reflect our Life is all its beauty and complexity. Its natural that they will carry all Colors of Abundance of Living. So its imperative to understand the essence of each Tarot card and to work on its strengths and weaknesses both, as the context of the situation or Question guides."},{"t":"p","x":"Remember: Challenges are opportunities for Growth and the Abundance that comes after, is an opportunity for Gratitude. This cycle leads to Karma becoming void and our Mastery over Self."},{"t":"h","x":"Challenges è Growth"},{"t":"h","x":"Growth è Gratitude"},{"t":"h","x":"Gratitude è Karma becoming void"},{"t":"h","x":"ê"},{"t":"h","x":"Mastery over Self"}]},{"id":"v1-c4","vol":"I","title":"Chapter 4 · The Tarot Deck – Structure","body":[{"t":"p","x":"The Tarot consists of seventy eight cards, which are divided into two sections: the Major and Minor Arcana. Together, they describe virtually every experience we are likely to meet in life. Such as birth and death, marriage and separation, beginnings and endings, friendship and enmity, prosperity and impoverishment."},{"t":"h","x":"Major Arcana"},{"t":"p","x":"The Deck consists of 22 Major Arcana Cards numbered through 0 to 21. The 0 card is the beginning of the journey and is represented by the FOOL card."},{"t":"p","x":"Some traditions may take the Fool Card as beginning of the next cycle and hence number it as 22. So the Deck begins with Number 1 card, the Magician for them and culminates in Card 22, the Fool."},{"t":"p","x":"However in the Rider-Waite paradigm, the 0 represents the Fool and the 21 represents the World."},{"t":"p","x":"The Major Arcana cards are associated with one or the other Zodiac Signs or the Celestial Planets."},{"t":"p","x":"Each of the cards will speak to you in the language of its words that will awaken your Subconscious, which is deeper and truer and more submerged than the Conscious Mind and elicit responses and emotions in you."},{"t":"h","x":"The Tarot Deck -"},{"t":"h","x":"Structure"},{"t":"h","x":"Chapter-4"},{"t":"p","x":"The 22 Major Arcana depict a person’s PATH THROUGH LIFE. With all the stages that are encountered along the way, this is essentially a journey of initiation or self-discovery. The Major Arcana contain figures that act as ARCHETYPE, such as a Magician or a Hermit or an Empress. The Archetype is one of the secrets why human minds across the world relate so effortlessly and intuitively to the Tarot cards. These tend to represent certain characters and qualities that we have all encountered in real life. They contain certain attributes that are universally recognised."},{"t":"p","x":"The illustrations on each card include symbols that expand on the meaning of that particular card and act as TRIGGERS to your unconscious, prompting an understanding that goes much deeper than the evident message."},{"t":"p","x":"As your proficiency with Tarot increases, and more you are attuned with your cards as well as your Interpretation power, the more you will be delighted by the depth and richness of your readings."},{"t":"h","x":"Minor Arcana"},{"t":"p","x":"To give sustenance and substance to this allegorical journey of the Fool through the Major Arcana sojourn are the Minor Arcana Cards."},{"t":"p","x":"Carl Jung, the Father of Esoteric Psychology, developed a psychological version of the four elements."},{"t":"p","x":"Fire becomes Intuition, Water Feeling, Air Thinking, and Earth Sensation. Jung considered these as primary means through which people experience the World."},{"t":"p","x":"The Minor Arcana consists of 56 cards that are categorised into 4 suits of 14 cards each. The 4 suits are also referred to as the 4 Elemental Groups."},{"t":"h","x":"1. Wands"},{"t":"h","x":"2. Cups"},{"t":"h","x":"3. Swords"},{"t":"h","x":"4. Pentacles"},{"t":"p","x":"Cards 1-10 are called Numbered Cards and then there are the Court Cards for each suit numbering 4 and termed as the Page, Knight, Queen and King of that particular suit. To clarify this nomenclature there would be in Cups Suit,  Numbered cards viz. Ace of Cups-Two of Cups-Three of Cups-Four of Cups-Five of Cups-Six of Cups-Seven of Cups-Eight of Cups-Nine of Cups-Ten of Cups  Court Cards viz. Page of Cups-Knight of Cups-Queen of Cups-King of Cups While the Major Arcana describes the major transit points in the journey of life, the Minor Arcana cards describe the bylanes and the meanderings of daily interaction. The Minor Arcana portray the mundane details of our existence. The numbered cards Aces to Tens, also called Pip Cards in European tarot vocabulary, describe the various stages that we meet in life, from the inception of an idea or venture, through its challenges, to its completion. The Court Cards have a dual meaning, because they can refer to either a situation or a person."},{"t":"p","x":"When several court cards appear in a spread, they indicate that the influence of several other people needs to be analyzed. They are directly or indirectly, trying to affect the situation or its outcome."},{"t":"p","x":"The Minor Arcana consists of 56 cards. They are composed of 4 suits called Wands, Swords, Cups and Pentacles."},{"t":"p","x":"The 4 suits correspond with the 4 elements while the 22 Major Arcanas correspond to the all pervasive Akasha (Ether) element."},{"t":"p","x":"The 5th Element, the Ether is the all encompassing tattva or element and is alluded in properties to be covering the 22 Major Arcana cards as they provide the umbrella inclusiveness of the human experience on a macro level."},{"t":"p","x":"The correspondence of the Tarot suits with the elemental energies is as follows:"},{"t":"h","x":"Tarot Suit Elemental Energy"},{"t":"h","x":"Wands Fire element"},{"t":"h","x":"Swords Air element"},{"t":"h","x":"Cups Water element"},{"t":"h","x":"Pentacles/Coins Earth element"},{"t":"p","x":"Major Arcanas Represent The Unifying Element of Ether/ Akasha This association will be discussed more in the section of ASTROLOGICAL LINKAGES OF TAROT(Book 2) as each of the 4 elements represents Zodiac signs and planets too."},{"t":"p","x":"The Minor Arcana suits are also connected with key functions of Life and Astrological signs as below:"},{"t":"h","x":"Tarot Suit Life Aspect Zodiac Sign"},{"t":"p","x":"Wands Action Aries. Leo, Sagittarius Cups Emotions Cancer, Scorpio, Pisces Swords Intellect Gemini, Libra, Aquarius Pentacles Finance/Wealth Taurus, Virgo, Capricorn Each of the four suits has a unique Energy and unique character of its own."},{"t":"h","x":"Wands"},{"t":"p","x":"Wands are connected with movement and travel, whether it is mental, physical or spiritual. It is connected with the human qualities of daring, adventure, risk and speculation. Negotiations, adventures, gambles, innovations, dreams t
