ical dictionary definition of this Term. The Quintessence is the fifth element, or the Spiritual Element of the Reading."},{"t":"p","x":"We use the Quintessential Number in a Tarot Reading for : 1. Obtaining a bird’s eye view of the entire reading by a single card or divinatory meaning."},{"t":"p","x":"2. Acts as a bonus or take away from the Principal Body of the Tarot Reading."},{"t":"p","x":"3. Acts as an overall guide or directional beacon towards where the trend is moving in a Reading."},{"t":"p","x":"4. Sometimes throws up an additional insight into the Reading that the positional cards in the layout have not yet evidenced."},{"t":"p","x":"5. It serves as the Essence of the Reading and may be interpreted as the summary and epilogue of the Tarot Story of that spread."},{"t":"p","x":"You will be amazed by the Usage of the Quintessential Concept as it is startlingly insightful. Do try in your readings, irrespective of the size of the Spread."},{"t":"p","x":"In this book we will deal with the term quintessential in two distinct ways so as to maximise the benefits of the Tarot Reading: 1. Quintessential Number Calculation and Usage 2. Quintessential Card and Usage Each of the Cards in the Tarot Spread carries a numerical value. The Major Arcana Cards range from 0 right through 21 and the Minor Arcana cards range from 1 uptil 10 in each suit. The Magic of Quintessential Number & Card (QC) in a Tarot Reading Chapter-9 The Court Cards are an interesting supplement to the numbered cards in each suit. Besides the human metaphorical undertone they impart to the reading, each of them also carries a Numerical value. The Court Cards are numbered as follows : Pages : 11 Knights : 12 Queens : 13 Kings : 14 Some Tarot schools ascribe the Numerical values of Court Cards differently."},{"t":"p","x":" A particular school holds it as Page = 7, Knight = 3, Queen = 2, King = 1  Another School relegates all Court Cards to Numerical value of Zero - 0  Some ascribe the values as Page = 4, Knight = 3, Queen = 2, King = 1 The Tarot Reader is at liberty to follow any of the above numerical system for court cards most comfortable and accurate to personal preference. Its important however to maintain uniformity in all readings that are carried out. However to keep the calculations logical and linear it is best that the Court Cards are counted after the Numbered cards and hence the Pages, knights, Queens and kings carry the value of 11,12,13,14 respectively."},{"t":"p","x":"How to Calculate the Quintessential Number in a Reading? The Cards are laid out in a Spread and the Interpretation is done in reference to the :"},{"t":"p","x":" Interplay of the cards in reference to each other  In the context of the query being analyzed  In the backdrop of the cultural norms, relevant time period and temperament of the players involved in the drama of the situation ( This is called consideration of Desh, kaal, patra in Indian divination sciences)"},{"t":"p","x":"Thereafter to gain deeper insight into the Reading and placed as the Significator or Overall Guidance, the Quintessential Number is calculated."},{"t":"p","x":"This is done by adding up the Numerical value of all the Cards in the Spread and reducing the total to a Single Number Between 1 and Nine (1-9)."},{"t":"p","x":"Remember the quintessential number is always to be taken as a single digit between one and nine. (1-9)"},{"t":"p","x":"Once this number is calculated, then refer to the table below and it will guide you on the direction and focus of the Tarot reading at hand."},{"t":"p","x":"What Each Quintessential Number Means One The number of Action. Singe minded."},{"t":"p","x":"Independent. The No 1 informs you that you must be innovative and motivated to succeed in your plan."},{"t":"p","x":"Two The number of Negotiation. Cooperative and laid back, this number is telling you to adapt to circumstances to fulfill your dreams."},{"t":"p","x":"Three The number of Communication. Express yourself through a creative outlet and your life journey will benefit from fun loving and adventurous relationships Four The number of realistic thinking. If you are practical and self reliant, you will have the motivation to achieve whatever you set out to do and can turn any situation to your advantage."},{"t":"p","x":"Five The number of Creative Advantage. Its time to be more outgoing, exploring and questioning of others’ motives. The expressive side of your nature will enable you to make changes to suit you."},{"t":"p","x":"Six The number of the Protector. It is time to be of service in some way to bring out your nurturing side. However six also reminds you not to let others decide your future for you."},{"t":"p","x":"Seven The number of Mysticism. On your life journey you will encounter many people involved in healing. You have an extraordinary talent for understanding the world. Listen to your Intuition for the answer to the current dilemma."},{"t":"p","x":"Eight The number of Ambition. Right now you have a secret inner drive for success and power. You will feel cheated if you don’t achieve material results. Plan ahead, sort out finances and the results will be equal to your goal."},{"t":"p","x":"Nine The number of Vision. You have extraordinary vision for the future but following things through will be hard. You must try to avoid making promises you cannot fulfill. Then you will gain the top prize. Example of Calculating the Quintessential Number Example 1 Card 1 : 5 of Cups, Card 2 : Temperance, Card 3 : 10 of Pentacles, Card 4 : 3 of Cups The total numerical value of this four card spread is 5 + 14+ 10 + 3 = 32 = 5 The Quintessential Number is 5 for this Reading and will provide additional insight and depth into the Reading."},{"t":"p","x":"The situation being discussed will become more perceptive for your querist when it is supplemented by the extra information gained by the Quintessential Number 5. It urges to be explorative and intellectually examine all the aspect of the situation and be receptive and proactive."},{"t":"p","x":"Example 2 (Using Court Cards)"},{"t":"p","x":"Card 1 : Knight of Cups, Card 2 : 7 of Swords, Card 3 : The Chariot, Card 4 : The Hanged Man)"},{"t":"p","x":"The total numerical value of this four card spread is 12 + 7+ 7 + 12 = 38 = 11 = 2 The Quintessential Number is 2 for this Reading and will provide additional insight and depth into the Reading."},{"t":"p","x":"The actual meaning and counselling of the spread may be supplemented by utilizing the No 2 approach of collaborations, negotiations and adaptability."},{"t":"p","x":"How to Calculate The Quintessential Card in a Reading?"},{"t":"p","x":"The Quintessential Card is a very potent Add on to any Reading and gives surprising new angle to the reading at hand, that adds an extra gravitas and contemplative approach to the Layout. The quitessential card only pertains to the Major Arcana section of the Tarot Deck and will range from the fool to the world. The numbered cards and the court cards are not counted as the quintessence card."},{"t":"p","x":"How to calculate the quintessential card in a reading? The Quintessential Card is calculated by adding up the Numerical value of all the Cards in the Spread and reducing the total to a number between 1 and 22."},{"t":"p","x":"So for example if the total of all the cards in the spread is 18 then the Quinessential Card would be Card Number XVIII- The Moon and would draw your attention to the Ambiguity and Emotional Depth of the issue being studied under the spread. However, if the total value of all the cards is exceeding 22, then an additional calculation is carried out."},{"t":"p","x":"The Total of Card Value - 22 = Quintessential Card For example, the total value of all the cards is 41 then you would need to subtract 22 from the total."},{"t":"h","x":"41 - 22 = Card No 19"},{"t":"p","x":"The Sun which is Card No XIX of the Major Arcana would be the Quintessential Card."},{"t":"p","x":"Note : The total value of the cards in the spread must be reduced until a number between 1 and 22 is obtained to follow the guideline as given by the corresponding major arcana card."},{"t":"p","x":"Example : Case Study Using Quintessential Card & Obtaining extra insight into traditional Tarot Reading Card 1 : 2 of Swords, Card 2 : Knight of Swords, Card 3 : Knight of Wands, Card 4 : 6 of Wands."},{"t":"p","x":"The query is regarding a national level professional competitive exam for a young individual and the probability of success. Traditional Interpretation of the Spread **The following cards in the spread signify that the aspirant must adopt an incisive study plan and hone his/her communication skills. The personal conviction and confidence has to get enhanced as the low self esteem is evident by the first card. If required input and dynamism is displayed and the youthful energy is channelised towards a vision of leadership, there is very high probability of succeeding and ascending a high administrative official position."},{"t":"p","x":"The Quintessential Card for this particular spread will be calculated as follows:"},{"t":"p","x":"Card Vale Total = 2 + 12 + 12 + 6 = 34 Now we need to subtract 22 from the Card Value total. 34 - 22 = 12 Thus The Quintessential Card in this Case is Major Arcana Card Number XII - The Hanged Man Analysis of the Spread along with input from Quintessential Card Its interesting to see here how the appearance of the Hanged Man towards the culmination of the Reading will give it a delightful twist."},{"t":"p","x":"When the 4 card spread was analyzed in the traditional sense, the verdict was positive with regards to personal success. The Aspirant should harness his buoyant levels of intellectual energy and extraordinary communication skills and with concentrated efforts strive to reach his goals."},{"t":"p","x":"His passion and target orientation are his strong pillars and he would ride his way to success."},{"t":"p","x":"The Hanged Man in the Quintessential Card position offers a tangential explanation to this analysis, While the primary spread is redolent with speed and high energy and impulsiveness and achievements, the QC is a milestone card for the entire reading."},{"t":"p","x":"It puts a question mark on the entire approach of fast results in this analysis. It shows that the Aspirant is undergoing deep emotional issues and dilemma regarding pursuing this path of professional growth. The First card in the 4 card spread had signalled this ambiguity in the mind but the corresponding high movement cards had deflected the Tarot Reader’s attention from the mulling to the action thus indicating a positive turn of events in success ladder."},{"t":"p","x":"A deeper study of Card no XII which astrologically resonates to the Planet Neptune which also rules over the Astrological zodiac sign of Pisces is significant in this scenario. Pisces is a sign of duality and deep introspective thoughts. It also indicates a time when the person is secretive about real emotions and plans. The imagination of heart is infinite and spread is asking for attention towards exploring the undercurrent of confusion that the aspirant is undergoing at the moment."},{"t":"p","x":"The entire flavour of the Reading changed from extrovert efforts to inner, contemplative efforts at framing the energies towards the desired goal."},{"t":"p","x":"The Hanged Man card is associated with dual form of energy that all souls must deal with on their larger spiritual journey : Sacrifice and the inner conflict that rages inside the mind when a critical decision regrading two divergent life-paths needs to be taken ( as signified by the 2 of swords and the subsequent Knight of Swords in the primary spread). The Pisces mood of two fish swimming in opposite directions needs to be addressed here as it indicates the emotional conflict That is assailing the inner recesses of the aspirant who may not be vocalising it. Once the duality is clarified by clear analysis and decision making ability of the Knight of Swords, the Wands constructive energy can take over. A passion for achievement borne out of inner desire and conviction would then lead the aspirant to achieve the victorious pinnacle predicted by the spread."},{"t":"p","x":"The juxtaposition of the quintessential card in the situation needs to be analysed thoroughly. the astrological and numerological connotations of the card must be considered and amalgamated into the primary reading for great insight and prediction. this card can change the focus of the reading."}]},{"id":"v2-c10","vol":"II","title":"Chapter 10 · Muhurta Fixation by Numerological Tarot","body":[{"t":"p","x":"Using Numerology for choosing best date for an event - Muhurta fixation by Numerological Tarot Muhurta Fixation is a classic and inextricable component of Indian Vedic Astrology and based entirely on Panchang Vichar for its sanctity. The sanctity of fixing an auspicious muhurat or starting date/time for an event will primarily lie in its ambit. The Tarot cards are an interesting technique to decide on the best date for an event based on the energies and predictive powers of the Moon planet which governs the Horary component of Tarot spreads."},{"t":"p","x":"The Tarot is combined with Numerology for checking out special dates and if they are compatible for a particular event or happening. For this purpose, multiple dates are chosen from the calender or asked from the querist."},{"t":"p","x":" Write down each date in full including the date, month and the year."},{"t":"p","x":" The numbers for each date are added up and a single number between 1 and 9 is arrived at."},{"t":"p","x":"For example a female client wants to start with a new job. She has the flexibility to choose the date she wants to start work in a particular month."},{"t":"h","x":"Muhurta Fixation"},{"t":"h","x":"by Numerological"},{"t":"h","x":"Tarot"},{"t":"h","x":"Chapter-10"},{"t":"p","x":"The dates she proposed are :"},{"t":"h","x":"02 February 2021"},{"t":"h","x":"10 February 2021"},{"t":"h","x":"17 February 2021"},{"t":"p","x":"Now we take out the numeric value of each date under consideration. This is called the Life Path Number Calculation of the job and would indicate the longevity and the satisfaction she would derive from this job."},{"t":"p","x":" The calculation would be as follows :"},{"t":"h","x":"2 + 2+2+2+1 = 9"},{"t":"h","x":"10 + 2+2+2+1 = 17 = 8"},{"t":"h","x":"17 + 2+2+2+1 = 24 = 6"},{"t":"p","x":" The next step is to shuffle the Tarot deck with the visualisation of the client in her work place, engaged in fulfilling and rewarding experience."},{"t":"p","x":" After shuffling the card deck is held in the left palm and with the right hand, the 9th card from the top of the deck is picked up and laid face down on the table as the Tarot Card for Date Option 1  Without disturbing the deck, from the top, 8th card is now picked and placed on the table face down as Tarot Card for Date Option 2  Now the 6th card from the top of the deck is picked and laid face down on the table as Tarot Card for Date Option 3  The Three cards are then turned upwards and each card is examined in its suitability as per the nature of the query. Card 1 : Ace of Pentacles Card 2 : The Devil Card 3 : Knight of Cups For example 3 Cards were drawn by the procedure given above for the job query. Let us see which option was most suitable as starting date for the event under consideration. When we examine each of these cards, the Ace of Pentacles signifies a very fruitful, blessed beginning to a new financial initiative. It belongs to the rooted and productive elemental suit of Earthy Pentacles and is the perfect significator card of a wonderful new professional opportunity that when carried out with diligence and sustained hard work will lead to prosperity for the client."},{"t":"p","x":"Thus the Best Date for the Client was Recommended 2nd February 2021 Major Arcana Approach Using Numerology for choosing best/auspicious date for an event - muhurta fixation by Numerological Tarot  There is another approach wherein by the method shared above of finding out the Life Path Number (the total numeric value of each date) can give us the best date for an event or happening."},{"t":"p","x":" This is the Major Arcana Card Approach wherein the actual Tarot Card is drawn out based on the calculated number."},{"t":"p","x":"For example let is continue with the situation in the above scenario wherein the best date of 3 options has to be selected for beginning a new new job."},{"t":"p","x":"The dates she proposed are :"},{"t":"h","x":"02 February 2021"},{"t":"h","x":"10 February 2021"},{"t":"h","x":"17 February 2021"},{"t":"p","x":" The calculation would be as follows :"},{"t":"h","x":"2 + 2+2+2+1 = 9"},{"t":"h","x":"10 + 2+2+2+1 = 17 = 8"},{"t":"h","x":"17 + 2+2+2+1 = 24 = 6"},{"t":"p","x":"Herein based on the total numeric value of the date, the compund number may also be taken provided it is less than 22 (since we are dealing only with the 22 Major Arcana section for this analysis)"},{"t":"p","x":"The Number 0 does not have any numeric value during this analysis. the major arcana card zero called the fool is considered as also the culmination of the journey and regarded as card number 22. (In many Tarot schools across medieval Europe the Fool has been interchangeably regarded as Card 0 and Card 22. He is referred to as the Wise Old Man who has realised the self actualization manifest in the Number 21 Card of the World and has begun the journey afresh at number 0. Since 22 is a Master Number in Numerology, the Fool Card is ascribed this exalted status)."},{"t":"p","x":"Thus the Cards of the Major Arcana might be enumerated as follows for this Numerological-Tarot Analysis."},{"t":"h","x":"1. The Magician"},{"t":"h","x":"2. The High Priestess"},{"t":"h","x":"3. The Empress"},{"t":"h","x":"4. The Emperor"},{"t":"h","x":"5. The Hierophant"},{"t":"h","x":"6. The Lovers"},{"t":"h","x":"7. The Chariot"},{"t":"h","x":"8. Strength"},{"t":"h","x":"9. The Hermit"},{"t":"h","x":"10. The Wheel Of Fortune"},{"t":"h","x":"11. Justice"},{"t":"h","x":"12. The Hanged Man"},{"t":"h","x":"13. Death"},{"t":"h","x":"14. Temperance"},{"t":"h","x":"15. The Devil"},{"t":"h","x":"16. The Tower"},{"t":"h","x":"17. The Star"},{"t":"h","x":"18. The Moon"},{"t":"h","x":"19. The Sun"},{"t":"h","x":"20. Judgement"},{"t":"h","x":"21. The World"},{"t":"h","x":"22. The Fool"},{"t":"p","x":"So for this study using the Card Symbolism and Mystical Messages of the Tarot Cards, we will study the following :  Option Date 1 : Card No 9 The Hermit  Option Date 2 : Card No 17 The Star  Option Date 3 : As the date value total is 24 and our Major Arcanas are upto Number 22 we take the difference of date value total - 22 = Card no 6 The Lovers Analysis Looking at the three card options we have now drawn viz The Hermit, The Star and the Lovers we can analyse the meaning of each card individually against the context of the purpose for which the Best Date is being decided."},{"t":"p","x":"In this situation, the Hermit Card is best suited for serious application of skills towards a higher end. This card is comparatively more appropriate for professional purpose. The Star Card is positive and full of potential but is also riddled with striving over a long period of time to see the results getting manifest. The Lovers card signals mainly going after the emotional gratification which may not be suited for a question related to professional advancement, Thus the Hermit Card and its corresponding date of 2 February 2021 may be selected for the best Date for starting the new job."},{"t":"p","x":"Calculation of How Will This Day be for me ?"},{"t":"h","x":"Example 1"},{"t":"p","x":" If you ask questions surrounding a specific date, for example, “ I want to inaugurate my showroom on a particular date. How will it be for me. How does it relate to the success of my business?”"},{"t":"p","x":" The date proposed by the client is 11 August 2020.  We take the total of this date and reduce it to a single digit."},{"t":"h","x":"11 + 8 + 2 + 2 = 23 = 5"},{"t":"p","x":" Add this number to the Date of Birth of the Client or the owner of the showroom."},{"t":"p","x":"If for this illustration we take the DOB for client as 24 December 1990 His Life Path Number would be 2 +4 + 12+ 1+9+9= 37 = 1  Now total the Date Number with LP Number of client 5+1=6  Draw the 6th card from the top of the Tarot deck after shuffling the deck to discover what the card is and analyse it accordingly in reference to the query of the client.  How Will This Business Fare? - was also the client query. For answering this, You may even look up Number 6 as the Fortune/Trend Number of this business by treating it as the Quintessential Number and referring to the interpretation of the Quintessential numbers already given in previous section."},{"t":"p","x":" Thus a comprehensive reply may be given to client in terms of Prediction of how the day and the future of the business would be."}]},{"id":"v2-c11","vol":"II","title":"Chapter 11 · Remedies: Gems & Crystals","body":[{"t":"h","x":"Remedies in Tarot"},{"t":"h","x":"Gems & Crystals"},{"t":"h","x":"Chapter-11"},{"t":"p","x":"“Tarot is the divine microscope to study cause and effect pattern by which we trigger remedial options” - Rrachita  Tarot is a wonderful tool for life guidance that analyses the inherent problems in the situation or the psychological profiling of the players in the dynamics that the situation is describing."},{"t":"p","x":" Its most useful contribution is providing clear and specific steps of action to be taken to reduce the problem or to reach an aspired goal."},{"t":"p","x":" It analyses the situation which may have its roots in the past. It comments on the present situation and then goes on to predict the future with various courses of action available."},{"t":"p","x":" It illustrates how our Free Will and chosen course of remedial action will impact our coming life. It acts like GPS or a beacon of light and tells us the dark areas we should avoid and how to best traverse the road of life to reach our destination with least resistance."},{"t":"p","x":" Besides the attitudinal, environmental and behavioral changes that Tarot beautifully gives answers to, Advanced Tarot studies also associates with Traditional remedy methods and is used very successfully with other Healing and Remedial modalities."},{"t":"p","x":"Astrological association of Tarot informs us which planets are acting as obstacle for the client. The Astrological spreads also inform us which planets can be appeased/strengthened in order to grant benevolent results to the client. We can prescribe with great benefits remedies related to -  Gem Stone Therapy -  Crystal Therapy via raw or wearable form  Crystals as Healing Grid  Planetary Yantras  Mantras  Pilgramage Journeys  Vedic remedies related to the planet under study in form of donations, fasting etc  Rudraksha usage  Meditation  Worshipping Planeatry deities & Lords  Chakra Balancing  Blessings  Colour Therapy  Aroma Therapy  Healing Therapies like Reiki, Pranik Healing, Chakra Meditation Precious Stones/Planetary Gemstones are an effective remedy in Tarot Most people associate Precious gem stones as traditional remedy since ages with Astrology and Horoscope study. It is indeed true that the study of horoscope reveals a detailed picture about the planetary configurations in an individual’s life and is a window to how certain planets can be strengthened by using specific gemstones."},{"t":"p","x":"Interestingly, Tarot cards also associate with Planets and Zodiac signs as also planets in a specific sign."},{"t":"p","x":"The 22 major arcana cards of the Tarot correspond with 10 planets and 12 signs of the astrological zodiac wheel. In the section on Astrological linkages of Tarot, the detailed description of this association is described."},{"t":"p","x":"In this section we will discuss 2 very effective Tarot spreads How To Recommend Gems for Your Client As Remedy?"},{"t":"p","x":"Planetary Spread for Native XYZ - Case Study This is a 12 card Astrological spread detailing the strength of the 12 planets under study in the traditional Horoscope. It includes the 9 planets of Vedic Astrology as well as western astrology planets of Neptune, Uranus and Pluto. Interestingly the Mahabharata by Rishi Ved Vyasa mentions these but subsequent Vedic texts have no mention of them. They are considered extra-outer planets or extra-Saturnine planets and are not really considered in Vedic astrology. However they correspond to Tarot cards in Major Arcana and in Tarot world are considered a subject of study."},{"t":"p","x":"** This spread can also be modified to be read as a 9 card spread should the Astro-Tarologist wish to only study the Vedic horoscope planets 3 2 1 12 11 10 9 8 7 6 5 4 Planetary Tarot Spread  After thorough shuffling, the deck is energised with the energy of the question of the client. Here the karkatva or the Signification of the planet concerned becomes important. Example Venus for marriage or wealth related query, Mars for livelihood related query. The Kaal Purush horoscope significators may be considered for this analysis. The table will be given below for your convenience.  The 12 cards are then pulled out and placed in a circular layout spread as shown in diagram."},{"t":"p","x":" The sequence of the cards I.e. Positional meaning will follow the following :"},{"t":"h","x":"Card Number Planet Under Study"},{"t":"h","x":"1 Sun"},{"t":"h","x":"2 Moon"},{"t":"h","x":"3 Mars"},{"t":"h","x":"4 Mercury"},{"t":"h","x":"5 Jupiter"},{"t":"h","x":"6 Venus"},{"t":"h","x":"7 Saturn"},{"t":"h","x":"8 Rahu"},{"t":"h","x":"9 Ketu"},{"t":"h","x":"10 Neptune"},{"t":"h","x":"11 Uranus"},{"t":"h","x":"12 Pluto"},{"t":"p","x":" Study the card drawn up under each position and relate it with the signification of that planet and analyse if it is in strong or weak results."},{"t":"p","x":" The weak planets can then be strengthened by suggesting remedies as suited to the client. For example if Sun is not strong in the spread then gemstone, yantra and mantra related to the concerned planet can be advised. By following the remedies, the native will surely benefit.  Another way to analyse this spread is to check the planets with reference to the question being asked. For example if a female native is having obstacle in getting married, then the concerned planets Venus, Jupiter and Moon may be studied in the spread and remedies suggested accordingly."},{"t":"h","x":"Planet Matters Signified"},{"t":"h","x":"Sun"},{"t":"p","x":"Soul, Self, Physical Constitution. Health, Vitality, Ego, Sense of Self, Soul Purpose, Fame, Power, Father, Boss, Career, Achievements Moon Emotions, Mother, Mind, Peace of mind, Friends Mars Valour, courage, younger siblings, property, real estate, speculation, enemies, diseases, accidents, loans, Mercury Speech, learning, memory, scholarship, writing and public speaking skills, student, work, achievement, honours, credits, business Jupiter Marriage, family, wealth, traditional learning, children, teacher, intelligence, learning, religion, fortune, elder brother, gains Venus Vehicles, wife, husband, marital bliss, bed pleasures Saturn Following,, longevity, troubles, losses, hospitalisation Rahu Accidents, occult knowledge, pilgrimages, going abroad Ketu occult knowledge, pilgrimages, going abroad, moksha Uranus Abrupt happenings, sudden upsets, suicide, telepathy, tragedy, Magic, tantra, omens, rebellion, exaggerations, unorthodox event or thought, scientific discovery or event, temptations, social reforms, perversion Planet Matters Signified Neptune Drowning, Illusion, hallucinations, deception, Intuition, ocean related matters, sudden ad mysterious death, kidnapping, Drugs, Dream Interpretation, Rainstorm, cyclone, secret society Pluto Planet of underworld, transformative changes in life, Turning point in life, struggles, criminal activity, caves and minerals, archaeology, interest in ancient, grave and morbid issues, gloominess."},{"t":"p","x":"Gem Stones as per planets to be recommended as remedy :- Sun Ruby, Garnet Moon Pearl, Moonstone Mars Red Coral, White Coral Mercury Emerald, Green Hakik Jupiter Yellow Sapphire, Pale Yellow Sapphire, White Venus Diamond-Solitaire, Zircon, Opal Saturn Blue Sapphire Rahu Hessonite-Gomedh Ketu Cat’s Eye - Lehsuniya Uranus Amber, Yellow Hakik, Cat’s Eye Golden in Color Neptune Aquamarine, Sapphire with Shades of Violet Pluto Onyx Why Are Crystals an Effective Remedy in Tarot?"},{"t":"p","x":"What are Crystals?"},{"t":"p","x":"Crystals have existed since time immemorial and have always fascinated mankind; royalty and the common man alike. Their beautiful colors and the way they sparkle attracted even the primitive man who recognised that these stones were different from the soil and rock among which they were found and guided by his instinct collected them as a precious item. Esoteric thinking and connection with the Divine forces was an integral part of the early societies and the crystals soon came to be imbued with magical and healing properties."},{"t":"p","x":"The Ancient Egyptians are harbingers of using crystals effusively in daily cosmetics, healing powders and for their Rituals and Secret religious activities. They firmly believed that crystals could ensure robust health, worldly fortune, and protection from evil spirits in this birth and in the netherworld. They practised burying crystals with the bodies of the dead believing that the special powers would keep the departing soul protected and give them additional powers in the next birth. The word “Crystal” has a Greek origin and comes from the root word “Krystallos” that means both ICE and Quartz."},{"t":"p","x":"This was because the Greeks believed that Clear Quartz (the earliest known and classified crystal known to them) was simply Ice that had been transmuted into a more permanent state. Like precious gems, Crystals too share an important attribute:  The less common a crystal is, the more precious it becomes. example Genuine Jade, Malachite, Diamond  The larger the crystal is, the more precious it becomes example the raw clusters and Geodes of a crystal are very expensive compared to the tumbles or pebbles form of crystals."},{"t":"p","x":"Different Forms of Crystals Available to Use 1. Rough or Raw Crystals are most commonly found in this form and are the most powerful."},{"t":"p","x":"They emit powerful vibrations that can change the atmosphere of the room or enclosed habitat they are placed in."},{"t":"p","x":"The energy in this type is gentle, natural and diffused. Raw Iolite Rough Rose Quartz 2. Points or Wands Crystals also find abundant usage in Healing and activation/Balancing of Chakra points in the etheric body. In such usages, the most potent and effective shape of the crystal being used is the Point or Wand form."},{"t":"p","x":"In the pointed form we can get Crystals in primarily 3 shapes :"},{"t":"h","x":"i. Multiple pointed cluster"},{"t":"h","x":"ii. Wand shaped"},{"t":"h","x":"iii. Pyramid shaped"},{"t":"h","x":"Clear Quartz Multi Point Raw"},{"t":"h","x":"Cluster"},{"t":"h","x":"Green Fluorite Single Point"},{"t":"h","x":"Crystal Wand"},{"t":"h","x":"Amethyst Pyramid Crystal"},{"t":"h","x":"The Point can be"},{"t":"h","x":" Single Point or"},{"t":"h","x":" Multiple Point"},{"t":"h","x":"This Pointed crystal can be"},{"t":"h","x":" Natural Point"},{"t":"h","x":" Polished Point"},{"t":"p","x":"In the Pointed form the crystal can be in raw form having a single point or multiple point. The more the number of points, the more powerful it is."},{"t":"p","x":"However in Multiple points the energising influence will be felt in the immediate environment while in the Single Point Crystal, the effect is felt on certain part of the body or a Single Chakra."},{"t":"p","x":"The pointed crystal has very potent and concentrated energy. It is mostly used to :"},{"t":"p","x":" In the case of treating a weak or underactive chakra the suitable crystal is taken in the form of the wand and then held over or along the affected portion for a finite period of time. This allows the underactive chakra to absorb the rays of the crystal and to regain its balance."},{"t":"p","x":"This may need to be done in several sessions over a period of time so that the chakra becomes healthy again."},{"t":"p","x":"This will depend on the efficiency and expertise of the Tarot Healer who will decide the duration of each session and how many sessions are needed for the energy flow to be regularised again through the Chakras."},{"t":"h","x":"3. Clusters and Geodes"},{"t":"p","x":"A Geode is a rounded, hollow void in sedimentary or volcanic rock filled with crystals and other minerals. A Geode is large in size and also expensive to buy. Its main advantage is that it not only breathtaking to look at but its energy is so sharp and intense that it can energise an entire huge room."},{"t":"p","x":"Geodes are powerful energy transmitters and are best used in a large enclosed space like a performing centre, an office, a healing space, an educational institution reception area etc."},{"t":"h","x":"Amethyst Geode"},{"t":"p","x":"Clusters are also slightly large in size and are best used when kept in designated directions in a room ( prescribed as per the suitable directional guidance of Feng Shui or Vastu Shastra)."},{"t":"p","x":"Cluster can also be kept on body past that needs healing. Examples:"},{"t":"p","x":" Carnelian cluster kept on lower abdomen helps in menstrual cramps and if expecting in easier natural delivery."},{"t":"p","x":" Sunstone cluster on forehead helps to provide relief in migraines and intense headaches  Amethyst cluster helps to remove negativity from aura and increases psychic abilities Amethyst Cluster 4. Tumbled Stones Tumbled Stones Tumbles are very popular with most people. These are polished by machine. The energy radiation is even. These are convenient to be carried in pocket or purse and excellent for laying on the body."},{"t":"h","x":"5. Slices of Crystal"},{"t":"p","x":"These days the Slices of crystal have gained wide appreciation and popularity."},{"t":"p","x":"These are gorgeous to look at and reveal the inner crystalline pattern and beauty of the crystal."},{"t":"p","x":"Used primarily for jewellery and also for general usage items like tea coasters and for energising water elixirs. Sliced Crystal Pendants Using Crystals as Remedies-Lets Learn How I come from the Mineral Kingdom To bring you riches of wisdom and Transmission of Light - Ancient Shaman There are three kingdoms as per the ancient healing world viz.  The mineral kingdom,  The plant kingdom and the  Animal kingdom."},{"t":"p","x":"There is a living power existing in the forgotten and often misunderstood mineral kingdom."},{"t":"p","x":"In order to live a life of completion and fulfillment, we must rediscover the magic of the mineral kingdom. In this section of the book we will discuss the benefits of Crystals and how you can choose the Crystal or a combination of Crystals to reduce your problems, heal your issues and move towards a a heightened state of happiness."},{"t":"p","x":"Crystals are an integral component of the mineral kingdom and have a subtle molecular structure. They originate from the Earth or the creatures that feed on Earth and are living, pulsating, transmitting beings of Matter."},{"t":"p","x":"They emit vibrations and frequencies that have very powerful potential effects on our entire being."},{"t":"p","x":"Case study of chakra healing via Tarot Spread and Crystals Illustration : Professional Spread and Query is - “Why is the native not getting a promotion in last 2 years in his banking organisation inspite of having a good appraisal record and being eligible for promotion as per HR policy?” Case Dealing:"},{"t":"p","x":"1. The Professional 5 Card Spread is laid out with the Tarot Cards."},{"t":"p","x":"2. The cards as laid out are :"},{"t":"h","x":"Emperor The Moon Page of"},{"t":"h","x":"Pentacles"},{"t":"h","x":"Reversed"},{"t":"h","x":"The Sun 7 of"},{"t":"h","x":"Swords"},{"t":"h","x":"Cards Analysis"},{"t":"p","x":"3. As per the cards The Emperor Card shows that the native is possessing the required experience and wisdom to move ahead in his career. This card also shows that an element of stagnation is besetting the entire situation and the move forward in the career has been halted."},{"t":"p","x":"The Moon Card reflects both the anguished mental state of the native as well as the forces of conspiracy and politics that surround him in the organisation."},{"t":"p","x":"The Page of Pentacles Reversed is indicative clearly of lost advancement opportunities within this organisation and of how the new offer of promotion is being taken away from the native."},{"t":"p","x":"The Sun is the Significator Card here. It represents the Solar Plexus Chakra which is in paapkartari yog being pressurised by Page of Pentacles reversed on one side and the 7 of swords on the other."},{"t":"p","x":"The native’s self esteem and confidence are very low as this chakra is underactive and very weak at this moment. Its leading to 9 of swords health situation for him in the form of severe anxiety and worry about the future and also negative thinking about his own identity."},{"t":"p","x":"4. The Pendulum Test carried for chakra scanning showed that the Solar plexus chakra was underactive and was showing signs of blockage."},{"t":"p","x":"5. Crystal therapy was recommended as the primary method of Blockage removal in the energy wheel lying in the area 2 inches above the navel called the Manipura chakra or solar plexus chakra."},{"t":"p","x":"6. The psychosomatic signs were all pointing at the centre of Ego and self-identity being blocked due to circumstantial reasons. For HEALING in such cases, using crystals is a very effective remedy."},{"t":"h","x":"Crystal"},{"t":"p","x":"7. Citrine Crystal wand and Clear Quartz pyramid were used for healing the person affected."},{"t":"p","x":"8. The pointed Citrine crystal sent focused and intense balancing energy to the afflicted chakra and coupled with White light therapy and affirmations connected with Crystal therapy, the blockage was sought to be removed. 9. A number of sessions were conducted with the native using the prescribed crystals for the chakra under affliction. Result of Crystal Healing 10. The person reported a surge in his confidence level within a few days. He felt more energetic and optimistic about his professional skills. His digestion improved dramatically ( a biological symptom of a blocked solar plexus chakra is loss in appetite, rise in bile and stomach cramps). 11. Crystal remedy resulted in a person getting healed. He then performed the karma (also suggested by another Tarot spread done for his future professional course of action post the crystal healing) of negotiating with the seniors in his current organisation. A balanced solar plexus chakra resulted in overall efficiency of energy distribution within the chakra circuit."},{"t":"p","x":"Positional Tarot Spread →Diagnosis of Problem and afflicted chakra → Crystal Remedy for specific problem → Crystal therapy and healing → Problem Resolution and a satisfied and happy client Crystal Therapy & Fitment with Tarot How To Choose Right Crystal For You?"},{"t":"p","x":" Crystals are powerful and subtle stones belonging to mineral kingdom meant to Heal and bring you happiness and vitality."},{"t":"p","x":" There are various crystals available for various ailments or psychological or situational problems."},{"t":"p","x":" Selecting the right crystal and then energising and programming it in the right manner brings miraculous results in your life."},{"t":"p","x":" Crystal therapy is world famous and universally accepted and appreciated."},{"t":"p","x":" The Western world is crazily in love with crystals and has large stores and collections of them."},{"t":"p","x":" Tarot is a primary medium of knowing which crystal will suit your problem."},{"t":"p","x":" Tarot gives insight into Chakras which are functioning well in your auric system and those which may be imbalanced. Use Crystals to balance your chakras so you can enjoy all aspects of life to the fullest possible within your destined boundaries."},{"t":"p","x":" Tarot will startle you by revealing with accuracy your psychological blockages and thought processes. Use crystals to heal the thought process and thus change your behaviours and re-design your future."},{"t":"p","x":" Tarot answers medical questions when correctly framed queries are addressed to it. Crystals will help in improving ailments and help to hasten recovery."},{"t":"p","x":" Certain life issues like marital incompatibility can be explored and remedies found via Tarot spreads. Crystals are then used with high level of success."},{"t":"p","x":" Financial and work related problems can also be solved by using crystals. Use professional guidance related Tarot spreads for getting more customised information on which remedies would be best for you."},{"t":"p","x":" Angel tarot decks are available that give insight into various remedies like which gems and crystals would help to bring positive changes in your life."},{"t":"p","x":"Amid the great variety of crystals that are available, it is sometimes difficult to choose the right crystal. Here are some important points that should be considered before making up your mind."},{"t":"p","x":"1. Customise as per your need as revealed by the tarot guidance As shown in the illustration in the preceding section, crystals have to carefully selected."},{"t":"p","x":"They are like a para medic aid and must be suited to your problem area and the technique and dosage of use must be carefully explained to you by a crystal practitioner or by your Tarot therapist who has a deep knowledge of crystals and can tell the combination of crystals that will work best for you. 2. Carefully investigate the properties of the various Crystals and Gem Stones Crystal therapy and gem therapy are technical and specialised fields where people who have studied the subject and also experienced personally the power of the stones, can help you best select your gemstone or crystal."},{"t":"p","x":"You should also make the effort to familiarise yourself with various types of crystals available and suggested for you. As crystals emit continuous rays, you are also an important person to finally pick the crystal that resonates with your needs, conscious and subconscious."},{"t":"p","x":"3. You can use your intuition to pick your Gemstone or Crystal You don’t pick your crystal; your crystal picks you it is said popularly and infact this is an interesting and authentic experience."},{"t":"p","x":" Crystals have a life and a will of their own. As per ancient traditions of the shamanic and healing world, the crystals are imbued with partly magical and divine properties and choose their own recipient to make their life better.  Trust your Intuition when you go to select your crystal.  Some crystals may stick to your fingers and you can feel their energy in some particular way like tingling in finger tips or a sudden warmth in your hand that is holding/close to the crystal that’s calling out to you. Remember crystals are divine and bring light and love to your life. So be confident and receptive to their healing when you choose the crystal. Fear should not be there, nor any scepticism.  Some crystals will bring joy to your heart when you hover your hand over them or also a flash of lightening in your 3rd eye chakra may appear as you intuitively realise that the energy of that particular crystal is beckoning you.  All such indicators, like a divine message for you, indicate that you found the right crystal for yourself. All of you may feel such signals in different intensity. It depends how receptive your chakras are so if indications are subtle then too it is acceptable."},{"t":"p","x":"4. The color or pattern may attract you The appearance of a crystal may attract you. There are certain colors that are missing in your auric spectrum and to balance that out, a certain color palette of the crystal may call out to you."},{"t":"p","x":"Feel free and be guided by your subconscious voice in such cases. Example if the red/dark brown family of crystals is attracting you then your Root energy centre may need more strengthening or you may need some grounding to perform better in materialistic world."},{"t":"p","x":"Listen when the colors or the patterns on the crystals are inviting your attention to them."},{"t":"p","x":"*Note: Recommended to take guidance of a crystal therapist/ healer after you have responded to your intuitive call and picked up the crystal."},{"t":"p","x":"5. You wish to combine utility with Aesthetics  Crystals come in beautiful patterns of jewellery and show pieces too. You can choose to avail the benefit of the crystal by focusing on its aesthetic feature. Example jade mandarin ducks or bloodstone figurines are excellent for enhancing financial abundance if kept close to the working area. Moreover they look beautiful too and catch the eye and become great conversation points."},{"t":"p","x":" You can choose to be discreet with your crystals and choose to keep spheres and pyramids made of suitable crystals near you but not not visible to public view.  Bracelets, necklace, ring, brooches are available for various crystals and gem stones. Full benefit is derived for your problem if you wear your crystal in these forms too.  Crystals help to improve health, improve concentration and focus, enhance prosperity and riches, wish fulfillment, attract love, increase creativity, expand your visualistaion and imagination, add to your mental abilities, get over pain and trauma, help you heal yourself, deepen your intuition, revive your suppressed memories and lead you into enlightenment."},{"t":"p","x":" Choose the way you wish to use or wear your crystal and enhance the quality of your life."},{"t":"h","x":"Crystal Cleansing"},{"t":"p","x":" Crystals are sensitive beings and need to be protected from not only physical damage but also energetic imbalance."},{"t":"p","x":" Crystals register a wide range of vibrations, from electricity and magnetism to sounds, emotions and thoughts."},{"t":"p","x":" Cleansing or purification of crystals means we free the crystals from the energy they have gathered in the past. Not only is the outer surface cleaned, but also the inner cleansing takes place that removes it of pre rogramming and negative energies that the crystal absorbs in the process of improving your life."},{"t":"p","x":" Purification of precious and semi-precious stones takes place with the help of the four elements: Water, fire, air, earth 1. Soak the crystals in sea water for 3 days. Then rinse them thoroughly and put them to dry out in the Sunlight. Some crystals react with sea water so be careful to exclude them."},{"t":"p","x":"2. Keep under the flow of lukewarm water for 3-4 minutes. Be careful to note that some crystals should not be put in water as they are soft in structure viz selenite, azurite, lapis lazuli, malachite and turquoise."},{"t":"p","x":"3. Purify your stones by Incense smoke. Light a herbal origin incense such as juniper or sage or cedar and put the incense stick below the crystal and make sure the crystal is bathed in the holy smoke for few minutes. This is an excellent and practical manner of purifying crystal and the environment in one go."},{"t":"p","x":"4. Passing the crystal through candle flame is also a popular way of cleansing the crystal. If the stone is fire-sensitive simply hold over the flame at a distance for a few minutes and chant the cleansing affirmations / statements. 5. Burying in the Earth is an ancient and very effective method of removing all impurities in the stone. This is also most effective method of cleansing the precious stones like ruby, coral, sapphire, cat’s eye."},{"t":"p","x":"It is a sort of rebirth of the stone or crystal to be put back in the womb of the earth, the environment form which it has been taken out."},{"t":"p","x":"6. Moonlight bathing of the crystals especially in the waxing fortnight and most prominently on the Full Moon Night (Puranmasi) is my personal favourite way of decluttering your crystal energy. Keep out all precious, semi precious stones and crystals under the healing light of the Full Moon and light an incense and candle near it. This is most benign and powerful method to regularly keep your crystal babies cleansed and pristine."},{"t":"p","x":"7. Sunlight bathing is also used to clear the crystals. Make sure the sunlight is not too harsh and avoid putting stones like Citrine or Sunstone as they already have the sunny energy."},{"t":"p","x":"Also avoid stones that fade in sunlight such as amethyst, rose quartz and turquoise."},{"t":"p","x":"8. Some crystals require no cleansing. They are self cleansing like kianite, azulite, diamond and others."},{"t":"p","x":"9. Visualisation is a very powerful medium of cleaning your crystals. We are using the air element here."},{"t":"p","x":"How to cleanse Crystals by Visualisation Method  Its to be done in a clean and quiet place where there is no one likely to disturb you."},{"t":"p","x":" Keep away all electro magnetic radiating gadgets like mobiles, computers, microwaves etc when doing cleansing by Visualisation Method  Be relaxed and with positive feelings and intentions.  Try to experience love or a pink flame in your chest area, let it expand over your upper body  Close your eyes and hold the crystal or gem in the palm of the left hand facing upwards."},{"t":"p","x":" Visualise a golden orb of light above your head. Allow it to glow for few minutes till it becomes bright and shiny. You may also experience rainbow colors at this phase. Allow this light to fully become radiant."},{"t":"p","x":" Visualise this light entering your crystal through the right palm cupped over the left. Allow the light to fully permeate into the crystal held between the cupped palms. The palms may feel warm or a tingling may be felt by you. It may not happen in few cases so accept the experience as it happens with you. You are unique."},{"t":"p","x":" Feel The crystal as it is releasing the negative energy and starts to emit smooth, tender and balanced energy.  Visualisation technique may be used frequently, after each healing session or after each meditation session you undertake. The more hands-on you are using your crystal or stone, the more frequently you can clean it."},{"t":"h","x":"Programming Your Crystal"},{"t":"p","x":"1. Clear the crystal with any of the methods you prefer as given in preceding section on (Clearing your crystal) and be in a place that is your reading station or your sacred altar or your place of worship. You can also choose to be in a nature redolent place like your garden or near a water body. Make sure you are not liable to be disturbed. 2. Hold the crystal in dominant hand, generally right hand. Clear your mind of unrelated thoughts and start to focus on the task at hand."},{"t":"p","x":"3. Your thoughts have energy. Make your thought crystal clear. Focus on your breathing. Inhale deeply and exhale through the mouth releasing all doubt and apprehensiveness."},{"t":"p","x":"4. Say aloud your sentences or affirmations. Affirmation is a positive and short and focused sentence that specifies what you intend to program your crystal for."},{"t":"p","x":"An affirmation is like coded language in a computer. For example if you are programming a prosperity crystal and wish to improve business sales keep chanting the words “ Increase business sales and customers” over and over again."},{"t":"p","x":"A whisper is fine if you feel loud voice may attract attention or you yourself are not comfortable with the loud chanting. Make sure the chant is melodic and is audible to your own ears. Do not mumble."},{"t":"p","x":"5. Whisper the intent into the cupped non dominant hand and then place it over the hand holding the crystal. 6. Now intend that the vibrations are flowing from the upper hand and being pushed inside the crystal being held by the lower hand. Continue holding in this position and repeating your intentions till your intuition guides you that the intent vibration has fully been immersed into the crystal."},{"t":"p","x":"7. Open your hand and thank the crystal and the celestial forces that helped you in the programming process. This method can be used also for precious gem stones, tumbles, bracelets, and crystal jewellery."},{"t":"p","x":"Once the intent or your wish has been accomplished, you may reuse the crystal for a fresh intent. Remember:  Only one intent at one time per crystal  Reprogram the crystal with same affirmation/intent after a suitable interval if you feel that obstacles have been too many in the task assigned to the crystal."},{"t":"p","x":" Once task accomplished, crystals like clear quartz and rose quartz can be programmed for another purpose. Note : Keep your charged crystal in a safe place where other people will not see it or touch it. Crystals that are not being used should be kept on a soft bed of tissue paper in a box or drawer so that they are out of light. If you wish to carry your crystals with you, you can wear them as pendant, ring or bracelet or carry them in a small ventilated pouch."},{"t":"p","x":"Healing Crystals and their Properties and Applications 1. Amethyst  Amethyst is a stone that attaches itself to its wearer and actually dies out when there is any physical danger to its wearer."},{"t":"p","x":" Its a Deaddiction Stone. When a person is addicted to drugs or alcohol, then using this stone is very beneficial."},{"t":"h","x":"sAmethyst"},{"t":"p","x brahma sthan ( approximately the central block of the space) will cleanse and purify the energies, promoting a sense of positivity in speech and action."},{"t":"p","x":" Connection with angels and spirit guides becomes strong wit regular usage of Labradorite."},{"t":"h","x":"12. Lapis Lazuli"},{"t":"h","x":" Has an opaque light of deep royal"},{"t":"p","x":"blue."},{"t":"p","x":" It has been asacred stone of ancient cultures like the Atlantis and the Egyptians."},{"t":"p","x":" Represents the infinite openness of the Akasha element / Sky. Lapis lazuli  Its the crystal for the Crown chakra in a major way and instills high idealism by instilling within the user the essence of fellowship, cooperation."},{"t":"p","x":" Leads to rise in soul consciousness and accelerates our connection with the Divine or the Source Power."},{"t":"p","x":" Its deep blue rays penetrate the throat and surrounding area, clear the congestion."},{"t":"p","x":" Heals in stammering and speech related disorders.  Works on the auditory canal and removes any knots or blockages  Gives courage to speak your Truth with assertiveness & clarity."},{"t":"p","x":" If public speaking incites fear in you then using a lapis will bring confidence and lucidity in speech."},{"t":"p","x":" It has a cooling quality and gives relief in swellings and inflammations."},{"t":"p","x":" Stress relief at a fast pace, bringing deep peace.  Health wise, it alleviates insomnia, vertigo, migraines, headaches  Aids friendship and business collaborations and dissolves any emotional bondages and blocks."},{"t":"p","x":" Bone marrow diseases also benefit by using this stone. 13. Peridot  Peridot is the most favourite crystal for activating and balancing the Heart Chakra."},{"t":"p","x":" Its remarkable green color restores compassion and love in the heart and makes the person who wears it connect well with people around them, even if circumstances are challenging."},{"t":"h","x":"Peridot"},{"t":"p","x":" The wearer of this stone is regarded as a problem solver and will attract personal growth opportunities and his leadership skills will improve dramatically."},{"t":"p","x":" If a person lives too much in Past or is anguished by past memories, recommend this stone. This normalises the continuum of time and space for the wearer and gradually the pain of the past will become manageable and recede."},{"t":"p","x":" This stone imbues the wearer with feelings of Love and Happiness."},{"t":"p","x":" This stone improves the financial flows especially the petty cash and working capital of a business."},{"t":"p","x":" If a housewife keeps a peridot in her wallet, she will never be short of cash for personal expenses."},{"t":"p","x":" It also makes the heart stronger and improves heart conditions and ailments in supplement to the regular medical treatment."},{"t":"p","x":" Helps in healing of diseases related also to Lungs, Intestinal Tract, Spleen and Lymph."},{"t":"p","x":" Peridot ignites the Creativity of the user. Excellent stone for creative people like writers, painters, professions dealing with people interaction."},{"t":"p","x":" If you are feeling creatively stuck or blocked, use of Peridot will help to ease the situation and help to awaken your talents and skills."},{"t":"p","x":" In case of loss of a departed dear one, wearing a Peridot close to the heart/chest will ease the pain and focus on the positive times spent with the departed person.  Financially, this stone when kept in locker or cash box and regularly energised by any of the below methods will keep the flows activated."},{"t":"p","x":"1. Smudging with Sage leaves or Incense 2. Moonlight bathing on Full Moon night - Puranmasi of each month 3. Washing with Sea water / Ganga water(in Indian context) every week and then naturally Sun drying."},{"t":"h","x":"14. Pyrite"},{"t":"p","x":" Fool’s Gold it is famous as, as its sparkling golden color can dazzle your eye."},{"t":"p","x":" Primary stone for attracting money and financial prosperity."},{"t":"p","x":" Keeping pyrite chunks in wallet and in the safe/vault attracts riches to you."},{"t":"h","x":"Pyrite"},{"t":"p","x":" If worn on the body, enhances the planet Venus effect and increases personal magnetism and ability to earn more money and multiply money."},{"t":"p","x":" Being a Protection stone, if worn around the neck it protects the physical body from harm and danger."},{"t":"p","x":" Energy shielder- Blocks out pollutants and negative energy at all levels including infectious diseases."},{"t":"p","x":" Women who are servile or victims of an oppressive home environment will benefit if they wear or carry Pyrite. It helps to overcome inferiority complex and assert oneself against a hostile environment at office or home."},{"t":"p","x":" The stone is clairvoyant. When placed on a business negotiation or a Consultation desk, it helps to look into the behind the scenes reality. One cans see behind the facade."},{"t":"p","x":" Medically, Treats bones’ health and and repairs cellular formation and repairing DNA damage."},{"t":"p","x":" Protects against infectious/contagious diseases 15. Red Jasper  Red Jasper is a humble and commonly found crystal and is known as the “Mother of All Stones“."},{"t":"p","x":" Mainly worn as jewellery as it gives a beautiful lustre after polishing."},{"t":"h","x":" Closely connected with the Earth"},{"t":"h","x":"energies and perfect stone for"},{"t":"p","x":"grounding and rooting."},{"t":"h","x":"Red Jasper"},{"t":"p","x":" Beneficial for diseases connected with Root Chakra\u0002Mooladhara chakra imbalance.  Worry Stone- it relieves the wearer of unnecessary worries that some persons are prone to habitually."},{"t":"p","x":" Deaddiction aid as strengthens the root chakra and helps the person to break free of addictive habits like alcohol, drugs, medicinal dependence."},{"t":"p","x":" Enhances physical strength and fills one with vitality and a superb energy to face life’s challenges."},{"t":"p","x":" Medically, it improves blood circulation in the body and also brings glow to the skin."},{"t":"p","x":" Protects against witchcraft as per belief of ancient Peruvian civilisation."},{"t":"p","x":" When tarot spread is showing that masculine energy like Emperor or the Chariot are needed in a situation, go for the Red Jasper as Remedy."},{"t":"h","x":"16. Rose Quartz"},{"t":"h","x":"Rose Quartz Rose Quartz"},{"t":"p","x":" The fascinating pink shades of the Rose quartz make this a favourite of many as the primary stone to heal hearts and emotions."},{"t":"p","x":" It is strongly resonating with the Balancing of the Heart chakra and fosters a feeling of compassion when one wears it as a pendant."},{"t":"p","x":" The very soft shades of pink and light pink Rose quartz promote feeling of friendship and good will. This is to be used when person wants to be well liked by people around him and has a job or vocation that requires tactful and diplomatic handling of people."},{"t":"p","x":" Its knows as the LOVERS STONE and wearing it attracts new love energies into your life."},{"t":"p","x":" Couples facing marital conflict or emotional misunderstanding benefit by:"},{"t":"p","x":" Wearing Rose quartz pendants around the neck as pendants set in silver chain."},{"t":"p","x":" Keeping raw rose quartz under the pillow while sleeping so that subconsciously the emotional hardness begins to melt away."},{"t":"p","x":" Keep rose quartz hearts beside the bed and energise in altar every day till the situation improves."},{"t":"p","x":" Its a gentle and soothing stone and works well to calm down those who have been through a heartbreak or emotional betrayal by a trusted one."},{"t":"p","x":" Physically it improves blood circulation and also helps to improve low blood pressure condition."},{"t":"p","x":" Its attraction also lies in the fact that it is easily available in a variety of shapes and sizes and is an affordable crystal.  Ideal for gifting on birthdays and marriage anniversaries to your family and friends. Denotes that you are their well wisher and wish for their happiness and well being. 17. Sodalite  SODALITE is a deep blue stone that is still in the process of evolution . Physically it looks like lapis lazuli but functions at a much lower vibration. For persons who require subtle tuning of the throat chakra, this stone is magical as it is easily available in supreme quality and is also reasonably priced."},{"t":"p","x":" Its optimally used in conjunction with other high frequency blue stones like lapis."},{"t":"p","x":" It aids in balancing the glands that con trol our metabolism."},{"t":"p","x":" It has an ethereal energy that promotes the highest form of self expression. It acts like a blessing from the Heavens for the creative persons and is a wonder stone for writers, painters, sculptors, aspiring singers and theatre performers and others in the self expression vocations and professions.  During the Renaissance, this particular shade of blue was considered a sacred color (sacre bleu) & was often used to color the robes of Mother Mary and the Archangel Michael, a warrior-archangel with a flaming sword.  It stimulates the pituitary gland, thus opening up the third eye portal and helping a person to become clear headed and take excellent deciszions in business planning and expansion."},{"t":"p","x":" It is too dense to be considered a meditatative stone and is excellent when carved into amulets and pieces of jewellery. It makes an excellent stone to carry when performing in public or making a stage appearance.  It helps to clear electro-magnetic pollution and is an excellent environmental detoxifier. Placing it near the laptop or television will help to neutralise the emissions and while acting as immunity to the negativity generated by the EMF vibrations, will also supplementarily promoted peace and calmness in the minds of the workers or the family members operating in that environment on a sustained basis."},{"t":"p","x":" Sodalite consists of manganese and calcium, a beautiful cocktail of minerals that balances the adrenal glands. If these glands are agitated, the person becomes hyper active and may act aggressively in temperament, requiring constant dose of provocation to stay satisfied. If these glands are underactive/sluggish, the person becomes lethargic and without any motivation. Wearing a sodalite pendant or bracelet or even meditating with a sodalite raw cluster will balance out this powerful adrenaline hormone, bringing about a personality with poise and maturity."},{"t":"p","x":" It acts as a stone of releasing you from mental bondage to a specific set of ideas or beliefs. It assists in clarifying perceptions at all levels and makes you fearless to feel and then speak about your talents and your own awareness of the world in a calm and assertive manner."},{"t":"p","x":" Treats calcium deficiences and boosts the immune system. Sodalite cools the fever and lowers the blood pressure, and when placed under the pillow treats insomnia."},{"t":"p","x":"As it resonates with the throat chakra, it treats sore throats or hoarseness, also strengthening the vocal chords and supporting the larynx."},{"t":"p","x":"Sodalite combats radiation damage and is a must have stone for those undergoing any kind of radiation therapy, for example cancer."},{"t":"p","x":"Helps to ease lymphatic cancers as it reduces swelling. Its very helpful for persons suffering from phobias and panic attacks."},{"t":"p","x":"Helps to ease the emotions of people who are oversensitive and may feel overdefensive all the time . For tarot readers its an excellent protection stone as it reduces their vulnerability to over agitated querists."},{"t":"h","x":"18. Tiger’s Eye"},{"t":"p","x":"The wonder stone/crystal of tarot realm and negative conversions."},{"t":"p","x":"Tiger’s Eye stone/crystal is a powerful stone resembling the eye of a tiger or a feral cat."},{"t":"p","x":"The best quality of it will carry fascinating bands of yellow-golden color running through it."},{"t":"p","x":"Like the animal it represents it imbues you with invincibility and helps to reduce anxiety in your life."},{"t":"p","x":" We know that the Tarot is a wonderfully insightful tool for highlighting the problems you are facing in your real life. Many clients suffer from a fluctuating financial situation and may be concerned with business losses, business obstacles or a debt situation that refuses to improve. Crystals act as an effective medium to provide relief to them. Carefully analyse the client’s “Business/Financial Flow Tarot Spread” and provide Tiger’s eye remedy.  If you are facing incessant loans and are unable to come out of the maze, then wear a Tiger’s eye stone, duly cleansed and energised, on a Friday. Best worn as a pendant in a white thread or platinum chain."},{"t":"p","x":" When Business losses are surmounting and fresh orders or opportunities are not materialising then a Tiger’s Eye crystal will be beneficial. Best worn on Wednesday of the shukla paksha of the moon(bright fortnight) in the ring finger of the right hand."},{"t":"p","x":" If you are in a job and facing stagnation in pay hikes then a Tiger’s eye stone worn on a Sunday in Right hand middle finger, will bring about positive changes."},{"t":"p","x":" Tiger’s Eye is a divine stone. It is a Catalyst Stone in the sense that it not only brings about powerful changes in your life just by wearing it independently but its usage also awakens the other auspicious Yogas (planetary configurations) lying dormant in your horoscope."},{"t":"p","x":"Tiger’s Eye can be worn by almost anyone with good results. Dormant energies lying stagnant in any part of your life whether personal or professional or spiritual will gain a new momentum and you will see desired changes begin to manifest.  Tiger’s Eye is best crystal to minimize Vastu Dosh(defect) in your place of residence or work."},{"t":"p","x":"Maximum negative energy tends to accumulate in the South West direction of an office or home. This direction called Nairitya Kon is governed by the malefic and shadowy energies of Rahu and Ketu. These are respectively, the North and South Nodes of the Moon and are known as shadow planets in Astrology being ephemeral and malefic."},{"t":"p","x":"Note : Placing 2 tumbles of Tiger’s eye in South West Direction in the problem area will act upon the negative energy and cleanse the environment. The crystal absorbs the shadowy effect of the planets and begins to reveal their beneficial nature to the native."},{"t":"p","x":"Be careful to keep this crystal in the exact South West. This can be verified by using a well calibrated Vastu compass to determine the degree of accuracy."},{"t":"p","x":" Tiger’s Eye is a protective stone and should be carried as a Talisman or “shield stone” against ill-wishes and curses or hex."},{"t":"p","x":" For youngsters high on anger and low on emotional tolerance it is the best crystal to wear as pendant or ring. It absorbs the emotional upsurges and leads to mental composure."},{"t":"p","x":" Its an excellent crystal for persons suffering from low self esteem and self doubt. Wearing it enhances your self\u0002worth and you become more focused on your strengths and goals to be accomplished. This leads to self love and eventually to becoming more popular and appreciated by the world around you."},{"t":"p","x":" If cards such as The Tower or Judgement are featuring repeatedly in your Daily Guidance Card or the Immediate future card, then Tiger’s Eye will protect you against physical injuries or accidents and minimise the loss to your physical self."},{"t":"h","x":"19. Tourmaline - Black"},{"t":"p","x":" Tourmaline in black color is a symbol of the mysterious\u0002which is unseen or unevident yet very powerful.  Its name is derived from the Sinhalese term (Sri Lankan) - Tura-Mali which means ‘Stone mixed with vibrant colors’ .Its available in a variety of colors like green, pink but Black is the most popular for protecting and shielding and Mood enhancer."},{"t":"p","x":" Tourmaline has supernatural powers and the special ability to generate an electric charge and emit far infrared rays. Far Infrared rays are invisible waves of energy that are able to penetrate all layers of the human body and reach the inner most region of tissues, muscles and bones.  Its the most powerful Protection and Shielding stone and can be effectively used by any person to construct their own energy shield against jealousy and negativity of the environmental variables."},{"t":"p","x":" It has the quality of the electrical transformer- it handles negativity by deflection rather than absorption."},{"t":"p","x":" Tourmaline should be coupled with Rose Quartz and kept at entrance of the office or home to prevent negative or harmful energies from entering the space. This is a tried and tested Vastu-crystal formula and when the Tarot spread throws up presence of ostructing forces, this crystal combination may be used to clear the physical space or even the personal aura."},{"t":"h","x":" Black tourmaline absorbs psychic"},{"t":"h","x":"attacks and negative feelings that"},{"t":"p","x":"are directed towards the owner."},{"t":"p","x":" This stone is beneficial for those who are working with physically or mentally challenged people as it protects you from their health vagaries and keeps you motivated and high functioning, emotionally and spiritually.  When there is too much conflict among family members or among team members in a professional set up, a a large cluster of tourmaline must be kept at the convening place. This will dissipate the high p-itched emotions and help to balance out the emotions. Alternatively, the members must wear the stone on body to handle individual fluctuations of mood."},{"t":"p","x":" Black tourmaline is a rapidly manifesting stone and its continued usage ( it requires regular cleansing) will bring about very clear and effective benefits."},{"t":"p","x":" If the womenfolk of a house remain low in motivation or even on bordeline depression, using tourmaline can bring dramatic improvement."},{"t":"p","x":" For protection, it is best to wear Tourmaline on the left side of the body, because from this direction, the human energy body is more susceptible to the dark energy entering."},{"t":"p","x":" Medically, Black tourmaline helps to combat menstrual disorders  It supports in reducing water retention and inflammation  Effective in healing varicose veins problem  Supports effective functioning of liver and kidneys.  Also promotes weight loss efforts  Improves blood circulation and helps to rid of toxic metals, lactic acid from the body."},{"t":"h","x":"Black Tourmaline Protection Spell"},{"t":"p","x":"Here is an interesting Tarot ritual when you have been facing dark cards for some time . This spell uses Black Tourmaline and provides effective shielding against the darkness or danger surrounding you. You would require raw black tourmaline for this spell. A picture is enclosed for easy reference as Tourmaline stone should be accurately identified in colour and texture suitable to the purpose of usage."},{"t":"p","x":" Best performed in the dark fortnight as the demonic/ negative energies are most prominent and can be vanquished."},{"t":"h","x":" Meditate on the archangels of"},{"t":"p","x":"protection to support you in your spell of white magic where you seek divine help to protect yourself and your loved ones."},{"t":"h","x":"Raw Tourmaline"},{"t":"p","x":" Best begun on a Saturday."},{"t":"p","x":" On the preceding Friday, pour out 6-7 tsp of white vinegar into a glass bowl and add sone fennel seeds (1 tsp) into it. Let this mixture rest till the next day (24 hours is ideal)  On Saturday/day of ritual wait till after sunset. When it is sufficiently dark, dip your first three fingers into the solution and apply it to both your wrists, behind your ears and your forehead."},{"t":"p","x":" Sit with your eyes closed, in silence, facing South west direction and visualise white energy pushing out from your body at the points you have dabbed the liquid."},{"t":"p","x":" Visualise you are forcing the dark arrows away from you and transmitting it back to the sender. In case the sender is not to your awareness, imagine a gray colored shadow to your left and send it back to that entity."},{"t":"p","x":" Hold the tourmaline for 2 minutes in your hand and visualise it constructing a yellow smoky wall around your energy body."},{"t":"p","x":" Now soak the tourmaline in the liquid in the bowl for 6 nights."},{"t":"p","x":" On the 7th day, drain out the contents of the bowl and wash the tourmaline stone with sea water or pure running water."},{"t":"p","x":" Keep this Crystal, now holy and consecrated with you in an aerated pouch. You can also keep under your pillow while sleeping to protect tour subconscious from any psychic attack in the night time."},{"t":"p","x":" This ritual is very strong and will protect you against the daily worries and tensions that are caused by negativity of those who are your energy vampires."},{"t":"h","x":"20. Turquoise"},{"t":"h","x":" Its the Love Stone and when the"},{"t":"h","x":"relationship is strained between"},{"t":"h","x":"husband and wife or between an"},{"t":"h","x":"engaged couple, gifting each other"},{"t":"p","x":"a Turquoise ring set in silver will make the love strong and commitment long lived."},{"t":"h","x":"Turquoise"},{"t":"p","x":" Turquoise or Firoza(Arabic/Hindi name named after its distinctive blue color) stops a person from doing any immoral act, outside of his social boundaries. It makes the Mind controlled and lessens attraction to temptations.  This stone enhances social status and brings fame and popularity to the wearer."},{"t":"p","x":" Firoza also removes emotional misunderstandings between people and helps to improve inter-personal harmony."},{"t":"p","x":" It enhances muscular strength and also strengthens nerves of the mind making one determined and clear in purpose.  Its called the SYMPATHY STONE and helps make the person compassionate and sensitive to others’ pains and problems."},{"t":"p","x":"Thus, excellent stone for Healers, Astrologers, Tarot Readers, Medical professionals and nurses, psychotherapists, social workers and counsellors."},{"t":"p","x":" The person who wears Turquoise or Firoza will feel their charisma & attraction power increasing. They will develop a more magnetic personality and gain more admirers."},{"t":"p","x":" Its also called the Luck Stone and enhances the general fortunes of the person who wears it. It attracts lucrative opportunities and the helpful people who will partner you attain your goals."},{"t":"p","x":" Since its the Fortune or Luck Stone, if the wearer is going to face any misfortune in coming days, this stone may either crack or break or will develop a severe discoloration thus giving a warning call."},{"t":"p","x":"This is a very auspicious and fortunate stone and can be carried or worn by most people, irrespective of their planetary configurations."},{"t":"p","x":"Health Spread in tarot and using Crystal as a Remedy Medical expert guidance is necessary and recommended when facing a health situation."},{"t":"p","x":"In addition to the traditional forms of treatment, we should make use of various colorful and magical Crystals to progress towards better health and well being."},{"t":"p","x":"Here is an indicative list of various situations and diseases: Part of Body Crystal 1 Crystal 2 Brain Blue lace agate Amber Ear Amber Orange Calcite Eyes Aquamarine Sapphire Teeth Aquamarine Rutilated quartz Neck Aquamarine quartz Shoulders Selenite Lungs Peridot Lapis Lazuli Spleen Bloodstone Amber Stomach Fire agate Beryl Intestines Peridot Citrine Hands Aquamarine Moonstone Skeletal system Agate Pyrite Throat Lapis Lazuli Blue tourmaline Thyroid Citrine Aquamarine Heart Peridot Sunstone Liver Beryl Bloodstone Gallbladder Carnelian Citrine Kidney Haemitite Rose quartz Spine Selenite Tourmaline Female reproductive Organs Carnelian Moonstone Bladder Jasper Amber Joints Calcite Azurite Health Spread in Tarot  This spread will help to decide which crystal to use when the card comes in guidance/advice position in spread?  Shuffle all the 22 Major Arcana Cards thoroughly and energise them with the intent of Tarot guidance on the crystal you need to adopt in your life."},{"t":"p","x":" Connect with your Ishta deva/divine power/archangel and then take out a Significator card that will indicate the crystal energy you need to help in the situation you are in.  This is a process of the Divine helping you and so do it with faith and sincerity. Do not amuse yourself at the expense of crystals or gem stones."},{"t":"p","x":" Gems and crystals are not magical in themselves alone. They enhance your personal power and empower you with the characteristics of the planet whose stone you are working. Hard work and focus will always be required from your end."},{"t":"p","x":"Table of Cards and the corresponding Crystals and Gem Stones Card No Card Name Associated Crystals Associated Precious Gem 0 The Fool Lepidolite, Agate, Tourmaline 1 The Magician Amethyst, Tiger’s Eye, Citrine Garnet 2 The High Priestess Aquamarine, Moonstone, Labradorite Pearl, Moonstone 3 The Empress Rose Quartz, Carnelian, Peridot Zircon, Diamond Card No Card Name Associated Crystals Associated Precious Gem 4 The Emperor Carnelian, Topaz, Sunstone Ruby, Emerald 5 The Hierophant Haematite, Carnelian, Turquoise Yellow Sapphire, yellow topaz 6 The Lovers Ametrine, Rose Quartz, Banded Agate Diamond, Fire Opal 7 The Chariot Amber, Howlite, Chalcedony Ruby, Cat’s Eye 8 Strength Citrine, Topaz, Tourmaline Diamond, Garnet 9 The Hermit Peridot, Bloodstone Blue Sapphire, Hessonite (gomedh)"},{"t":"h","x":"10 Wheel of"},{"t":"h","x":"Fortune"},{"t":"p","x":"Lapis Lazuli, Amethyst, Ave
