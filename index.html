t fulfills his desire and goal in life example for gain of wealth, to conceive a child or to have all round prosperity by propitiating the nine durgas.  He should propitiate the planet/deity related to the obstructing factor as evident in the Tarot spread.  He should worship the deity that lords over the Chakra the native wants to balance in his life."},{"t":"p","x":" He may worship the deity of the malefic or badhak planet in his horoscope after cross-examining it with exact weak results that will be seen in the Tarot spread. Its interesting that the tarot spread reflects the current state of the problem being faced by the native in more detail than being seen in the horoscope. For example if the native is running a particular mahadasha in his horoscope and its planet is posited in a malefic house like 8th (in case of finance, lets say), the tarot spread will reflect the financial failures and the professional setbacks that this native will face. How does this happen? This happens because Tarot is a precise divination tool when carried out by knowledgeable hands. It works on the principle of the Prashna Kundali(Horary Astrology) and uses the transit of the Moon to predict and make psychological divinations. We know all gochar or transits of planets in Astrology are examined from the Moon Horoscope / Chandra Kundali and hence the Tarot is a visual representation of the happenings or the current energies as reflected in the transit horoscope of the native."},{"t":"p","x":"A consecrated yantra is e powerful machine at your disposal. Careful discretion and noble intent must be put in for the best results and welfare. Another point to consider is that when using the Yantra, the Universal energy is being invoked. Like all wishes put out in the Universe, one must have the temperamental characteristics of patience and total faith that the yantra will work in the intended direction. How much welfare and how soon the benefice will start coming in is also a subject of native’s own karma. So the thought, lifestyle and actions of the natives must also follow the laws of Dharma and good moral conduct. Planetary Yantras Let us take the illustration of the Surya Yantra. This is a very benefic yantra and is most often used by natives for professional supremacy and personal peace and for enhancing individual charisma and circle of influence."},{"t":"p","x":"In India, it is a tradition to cast or invoke the Panchadashi Surya Yantra on Deepawali tithi since ancient times. On this yantra, the digits 1 to 9 are written in such a way that when added, they will sum to 15 in each direction."},{"t":"p","x":"Our ancient scriptures give detailed descriptions and instruction on creating these powerful weapons of sacred geometry to enliven and awaken the Truth in the metaphysical and material planes of Life."},{"t":"h","x":"Planetary Yantras"},{"t":"p","x":" Digits written in Surya Yantra sum up to 15 from every side.  Digits written in Chandra Yantra sum up to 18 from every side."},{"t":"p","x":" Digits written in Mangal Yantra sum up to 21 from every side."},{"t":"p","x":" Digits written in Buddha Yantra sum up to 24 from every side."},{"t":"p","x":" Digits written in Brihaspati Yantra sum up to 27 from every side."},{"t":"p","x":" Digits written in Shukra Yantra sum up to 30 from every side.  Digits written in Shani Yantra sum up to 33 from every side.  Digits written in Rahu Yantra sum up to 36 from every side.  Digits written in Ketu Yantra sum up to 39 from every side. Future Point 24 K. Gold Plated ¶;wpj ikWbaV 6 1 8 7 5 3 2 9 4 ¬ gzka gzha gzkSa l% lw;kZ; ue%A 7000 Jh lw;Z;U=e~ tikdqlqeladk'ka dk';is;a egk|qfre~A reks·fja loZiki?ua iz.krks·fLe fnokdje~ AA Surya Yantra Jh pUnz;U=e~ Future Point 24 K. Gold Plated ¶;wpj ikWbaV ¬ Jka Jha JkSa l% lksek; ue%A 11000 nfèk 'k³~[k rq\"kkjkHka {khjksnk.kZo lEHkoe~A uekfe 'kf'kua HkDR;k 'kEHkkseZqdqVHkw\"k.ke~AA 7 2 9 8 6 4 3 10 5 Chandra Yantra Future Point 24 K. Gold Plated ¶;wpj ikWbaV Jh eaxy; rcial"},{"t":"h","x":"and Industrial Vastu"},{"t":"h","x":"Shri Vastu Dosh Nashaka"},{"t":"h","x":"Yantra"},{"t":"h","x":"To reduce the effects of"},{"t":"h","x":"faults related to Residential"},{"t":"h","x":"Vastu"},{"t":"p","x":"Shri Vastu Devta Yantra To propitiate Vastu Devta Shri Digdosha Nashaka Yantra To reduce the effects of faults related to Directions in Vastu Yantra Yantra Purpose Shri Matsya Yantra To ward off waterborne faults in Vastu Shri Kurmprishtha Meru Yantra To propitiate Lod Vishnu and Goddess Lakshmi Shri Bandhan Mukti Yantra Reduce the effects of evil spirits and negative karma of past Shri Vyapar Vriddhi Yantra To increase sphere of trade and business, for setting up a new business enterprise with profit expectation Shri Navgrah Yantra To propitiate the deities of the 9 planets (Navagrahas)"},{"t":"p","x":"- Sun, Moon, Mars, Mercury, Jupiter, Venus, Saturn, Rahu, Ketu Shri Gita Yantra To enhance spiritual knowledge; to be successful in finding and following soul purpose Shri Maruti Yantra To expedite the process of selling land Shri Vastu Prapti Yantra To recover lost objects, recover any news or well being of estranged persons(if destined), buy a property"}]},{"id":"v2-c19","vol":"II","title":"Chapter 19 · Rudraksha as Remedy","body":[{"t":"h","x":"Rudraksha as"},{"t":"h","x":"Remedy"},{"t":"h","x":"Chapter-19"},{"t":"p","x":"Tarot cards will highlight with startling accuracy the afflictions of body, mind or spirit that affects an individual and impedes his growth and happiness."},{"t":"p","x":"Rudraksha is a brilliant remedy, when purchased from authentic source and being genuine. They range from 1 (one) mukhi Rudraksha to 14 (fourteen) mukhi and wearing (dharana) or propitiating the correct Rudraksha can accelerate your growth fantastically, both materially or spiritually as the life purpose may be."},{"t":"p","x":"A detailed section of the Miracle Remedy of Rudraksha is being provided. It will help you to choose the best Rudraksha. Rudraksha Benefits  Doctors these days are medically prescribing Rudraksha as it lowers Blood Pressure and calms your nerves.  Rudraksha is literally Rudra=Shiva and Aksha = Tear Drops so basically its the sacred name for Tear Drops of Shiva. These are his tears of Joy and that’s why the bearer of Rudraksha is blessed with deep blessings."},{"t":"p","x":" Genesis of Rudraksha - Once Shiva was sitting in meditation with his eyes closed and in deep contemplation. He is the Swayambhu - He who has no beginning, no birth. He Simple is and always has been."},{"t":"p","x":" He became so ecstatic in meditation that tears of Ecstasy began to stream from his eyes."},{"t":"p","x":"How is Rudraksh Related to Lord Shiva?"},{"t":"p","x":"Rudraksha is adorned by Lord Shiva as an ornament. He uses it as a symbol of power, serenity and because of its unique beauty. He wears the Rudraksha in his Jata (lock of hair), in his wrist as a band, as an arm band and also as a necklace. According to the old mythological epic “Shiv Purana”, Rudraksha was his favorite tree and it grew in the land Garda (present day Angelic plains to foothills of the Himalayas)."},{"t":"p","x":"Researchers found out that these trees were found most commonly in South eastern Asian islands of Java, Sumatra, Nepal, Sri Lana, Burma, Myanmar, Tibet, Thailand, Malaysia, India and northern parts of Australia, New Headland, New Caledonia, Hawaii Scientific Name Rudraksha scientific name is Calcareous Citrus Rob Who Is Lord Shiva?"},{"t":"p","x":"Shiva is referred to as a SHAKTI or power. Shiva is also called as the destroyer and is one of the most powerful gods among the Hindu pantheon How is He Represented in This Modern World?"},{"t":"p","x":"Shiva in temples is usually found as a phallic symbol of the Lingam which represents the energies necessary for life on both the microcosmic and the temple. Lingam is placed underneath the spire where it symbolizes the navel of the Earth Myths About Rudraksha  Rudraksha should not be worn by ladies  One should not consume alcohol and non veg or have sex during the time of wearing the Rudraksha  Original Rudraksha sinks in water where as the duplicate none floats  Nothing happens to original Rudraksha on boiling where as the duplicate one breaks  Three round one mukhi Rudraksha are produced every year in Nepal  Original Rudraksha has a Shiva lingam, trishul and Om formation on it  Nepalese Rudrakshas are original and effective and the Rudrakshas from different countries are duplicate and ineffective  If one does not follow the restrictions and rules while wearing the Rudraksha it would cause adverse and harmful effects  Clients believe the more it is expensive the more it is original Medicinal Value of Rudraksha Rudraksha is regarded as a medicine in the Ayurveda. It is used not only to wear on the different parts of the body, but it can also be used as an oral medicine. Many doctors, Vaidyas, scientists use it."},{"t":"p","x":"It is the destroyer of worms and it gives brilliancy to the body. It pacifies the Vaat (air), Pitta (bile) and cough automatically. It is also useful for women in pregnancy. Rudraksha paste is a good medicine for skin diseases. In leprosy of both kinds it can be used. It acts as a medicine to cure sores, ringworm, pimples, boils and it is useful in burns too."},{"t":"p","x":"Among all the Rudraksha each type of Rudraksha possesses medicinal properties such as:"},{"t":"p","x":"It works as a medical medicine for medicinal diseases like heart problems, mental anxiety, TB, paralysis, stroke, eye problem, bone pain, head ache etc."},{"t":"p","x":"As Blood Purifier and a General Tonic Curing Breathing Problems or Cough For Sleep - For better sleep put some Rudrakshas under your pillow For Curing Chicken Pox or Small Pox Controlling Epilepsy Curing Piles For Curing Jaundice, Stomach Ache Or Liver Realated Problems For Poisonous Effects Caused By Bites Of Insects Etc For Improving Memory Poower For Improving Sexual Power For Normalising Blood Pressure For Concieving Baby For All Brain Diseases-Take a big sized four faced rudraksha. Put it in a vessel containing about one liter of pure cow milk. Boil it for about one minute. After cooling the milk to lukewarm temperature, drink this milk in an empty stomach and do not consume anything for another half an hour. Continue this for 21 days and all brain diseases will get cured Rudraksha: a Beauty Aid a) For Dark Circles b) For A Fresh and Glowing Skin c) For Clean and Clear Skin d) For Skin Disorder Like Ring Worm, Eczema etc e) For Removing Wrinkles Prepare a paste of Rudraksha and powder of almond seed in rose water and apply it on the face and leave it on for an hour. Wash the face without using soap. It adds glow and makes the face wrinkle free For Burns- Mix Rudraksha with coconut oil and apply on the infected area. It will give cooling sensation to the burning area. Rudraksha for Hair Graying - For controlling premature graying of hair, a paste of Rudraksha, black soil, bringraj and add sugar cane juice."},{"t":"p","x":"Rudraksha Water/Elixir - Immerse three to five beads of Rudraksha in one liter of water in an earthen or copper pot for about twenty hours. Decant the water, allow the beads to dry for two to three hours and again put them back in the water for twenty hours. Remove the beads thereafter. Drinking this water on a daily basis will help control blood pressure and is good for heart ailments too. The same beads can be used for up to one year."},{"t":"p","x":"This Water is also Effective For:"},{"t":"p","x":" Headache or migraine (put a few drops in the ears)  Any external infection or wound (apply this water locally and drink it regularly)"},{"t":"p","x":" Cold and cough (put a few drops in the nose)"},{"t":"p","x":" Eye diseases (put a few drops of this clean water into the eyes)"},{"t":"h","x":"Ayurvedic Properties of Rudraksha"},{"t":"p","x":"The bead of Rudraksha has an ayurvedic quality. Each Rudraksha has some preventive and curative medicinal value. The beads of the Rudraksha, its bark leaves and outer shell of the beads are all used to cure various ailments like mental disorders, headaches, fever, skin diseases and also to heal the wounds. Wearing and worshipping the Rudraksha is beneficial to the nervous system, it controls the blood pressure, paves towards mental stability, removal of stress and helps one to calm down For medicinal usage it is to be worn by stringing it in a metal wire that may be of gold, copper, and silver or of Panch dhatu (copper, bronze, gold, lead and silver)"},{"t":"p","x":"Rudraksha may be worn either on the wrist, arm or the other parts of the body. It can be worn around the waist too to open the chakras and to control the internal energies."},{"t":"p","x":"Rudraksha as per Number of face/Mukhi One Mukhi (Face) Rudraksha The Ek Mukhi Rudraksha (one faced Rudraksha) is the most auspicious Rudraksha in its existence.One Mukhi Rudraksha itself is Lord Shiva, the god who has created the entire world, the creator of the language, dance, music, Ayurveda, and Lord of love for the cycle of birth and death. It is the main among all Rudraksha of all faces."},{"t":"p","x":"According to the Mythological Books peace and pleasure abide in the house where this Rudraksha is worshipped. There is no fear of untimely death. The wearer himself is fortunate in all forms."},{"t":"h","x":"As Per Scriptures And Puranas"},{"t":"p","x":"1. Srimaddevibhagat 11th Skand Chapter verses 25 and 26 it is stated -According to Jabala, instinct for wearing Rudraksha results only after attaining the perfection of Vedas and blessings of Lord Shiva during preceding births 2. Chapter VII verse 23 it is stated Rudraksha infused with Bija mantras should be worn. One Mukhi Rudraksha helps envisioning the Partattva 3. Padma Purana Chapter 57 Translated by Bhatta 1989 it is stated in verse 38 to 39 The Rudraksha of one mouth is virtually Shiva as it removes all kinds of sins. Therefore one should wear it for the destruction of all (ones) sins."},{"t":"h","x":"Other Detals"},{"t":"h","x":"Symbol of: Lord Shiva"},{"t":"h","x":"Ruling Planet: Sun"},{"t":"h","x":"Ruling god: Omkar"},{"t":"h","x":"Day of wearing: Monday"},{"t":"p","x":"Recommended for: Diseases of Heart, Blood, Veins, Headache, Heart disease and right eye defect Influence on body organ: Pineal, Pituitary, Optic Chiasma, Hypothalamus Properties: It is believed that it washes away even the most serious of sins like the killing of a Brahman (Brahman Hatya). The wearer acquires Brahma Gyan i.e. win all over the senses. It gives eternal bliss to the wearer and Moksha after death. Peoples Experience: Wearing one Mukhi helps to overcome from the habits like smoking, drinking, drug abuse, tobacco chewing, overeating and excessive talking Mantras Mahamrityunjai Mantra (Brahajjalopanishad)"},{"t":"p","x":"Om Tryambakam Yajamahe Sugandhim Pushti-Vardahanam Urvarukamiva Bandhanan Mrityor Mukshiya Mamritat (Om Namah Shivay)"},{"t":"h","x":"Way of Wearing"},{"t":"p","x":"Ek mukhi Rudraksha should be capped with gold or silver and should be worn around the neck or be placed at the worshipping place, chanting the mantra. Getting up in the morning the devotee should salute the one faced Rudraksha first, pronouncing the mantra."},{"t":"h","x":"Benefits"},{"t":"p","x":"This fulfills desires and cuts down the problems and impediments created by the Government or superiors. It raises a person to a very high h level and leadership qualities are raised to a very high level and leadership qualities are developed due to its constant use. In Astrology it is also used to remove the malefic effects of the Sun."},{"t":"h","x":"Who Should Wear"},{"t":"p","x":"Should be worn by all adult people and any person who requires the favoring of the Sun as a planet or to remove its malevolent effects or those seeking devotion to gods, minimizing attachments to the worldly things and hoping to attain mokshaya."},{"t":"h","x":"1. Epic Source Shrimad Bhagwad"},{"t":"p","x":"Body parts/organs- number of beads to be worn Sikha/Crown hair - 1 Wrists (both right and left) +- 12/12 Neck+- 32 in two rows Ears (both right and left) +- 6/6 Chest +- 108 Shoulders +- 500 Yajnopaveet (sacred thread) +- 108 Two Mukhi (Face) Rudraksha Two mukhi Rudraksha has two lines travelling from one end to the other.. It represents the Ardhanareshwara which is the joint image of the Lord Shiva and Goddess Parvati."},{"t":"p","x":"It is the symbol of moon and it blesses the wearer with 'UNITY' and it is related to Guru Shishya, parents-children, husband-wife and friends. All desires are granted by the blessing of Lord Shiva and Parvati. Its unique quality is that it maintains ONENESS. Other Details Symbol of: Ardhanareshwara Ruling Planet: Moon Ruling god: Moon and Sun Day of wearing: Monday Recommended for: Acidity and Gastric problems, Stress and depression, hysteria Influence on body organ: Heart Properties: It is believed that it washes away the sins of cow slaughter (gau hatya). Useful for good family life and good relationship for all people and to get married."},{"t":"p","x":"Peoples Experience: Wearing two - mukhi helps to bring unity to all kinds - between friends Way of Wearing Taking three beads of the two faced Rudraksha and fastening them with red thread and touching it with the idols of Lord Shiva and Goddess Parvati (Shakti) and chanting the mantra of the two mukhi Rudraksha and should be worn around the neck. Benefits Two Mukhi Rudraksha is considered to be the basis of this universe. The benenfits that a person derives from the use of this Rudraksha are similar to those that a person derives from Agni Pooja. In astrology it is said to remove the bad and malefic effects of the Moon Who Should Wear Worn by those who are single who are having difficulty in getting right match or having relationship problems. Those who are seeking happiness and material gains and as well as spirituality. Also useful for begetting children and hoping to attain mokshshaya."},{"t":"h","x":"Three Mukhi (Face) Rudraksha"},{"t":"p","x":"The three mukhi Rudraksha has three natural lines or mukhas on its surface i.e. Three Mukhi Rudraksha represents Agni which is the fire that burns and consumes every thing. This Rudraksha helps the wearer to fight with all kinds of situation and win over them."},{"t":"h","x":"As Per Scriptures and Puranas"},{"t":"p","x":"Shiva Purana Vidyesvara Samita said Rudraksha is a favorite bead of Shiva. It is highly sanctifying. It removes all sins by sight, contact and japa Shiva said if a man not liberated after meditation and acquisition of knowledge, he shall wear the Rudraksha. He shall be freed from all sins and attain the highest goal. A Rudraksha of three faces always bestows means of enjoyment. Please listen to the mantras with devotion Padma Puran Chapter 57 The Lord said The one with three mouths is fire himself. The sin earned in the past births on him on whom it remains is burnt as fire burns fire as fuel. A wise man obtains that fruit which is obtained by worshipping fire or by the rites of honoring the fire or by offering the oblation of ghee; and also obtains heaven. He who wears a Rudraksha of three mouths on his body is like Brahma on the Earth. It would burn all sins due to the wicked deeds collected in birth after birth. There would be no disease in his belly; he would not be sick; he would never be defeated and his house is not burnt by fire. These and all other fruits are obtained and destructive weapons are warded off. Nothing inauspicious happens due to the wearing of Rudraksha in the three months i.e. when a Rudraksha of three months is worn on ones hands Rudraksajabalopanisad Kalagnirudra replied The one with three faces is Fire himself which on wearing pleases all three fire deities Other Details Symbol of: Lord Agni Ruling Planet: Mars Ruling god: Three Deva Day of wearing: Monday Recommended for: Children with frequent fever, diseases of liver and Gall bladder, Stress and Depression. for BP Control Influence on body organ: Throat and Celica Plexus Properties: It is believed that it purifies the person committed in the past As per the Shrimad Devi Bhagwat this Rudraksha condones the sin of performing abortion. Also it makes the soul pure and enables one to live a life without guilt Peoples Experience: Wearing three mukhas Rudraksha helps to overcome from all diseases and also counters the ill effects of Mars like land disputes, blood poisoning and accidents Wayof Wearing:"},{"t":"p","x":"Take the bead of the three faced Rudraksha, wash them with the Ganga Jal and unboiled milk and chanting the mantra wear them in the neck Benefits Three Mukhi Rudraksha curtails the destructive forces within a person and evolves his creativity and removes the malefic and bad effects of Mars Who Should Wear Worn by all those people suffering from any disease or weakness, laziness or inferiority complex. Also effective against skin diseases, stomach disorders or defects of eyes and controlling stress and gaining self – confidence Four Mukhi (Face) Rudraksha Four faced Rudraksha has four natural lines from head to bottom at equal distance. This Rudraksha is blessed by Lord Brahma who is responsible for the whole creation of the entire Universe. In this Rudraksha power of Brahma exists in its whole effectiveness and divinity."},{"t":"p","x":"Being influenced by the creative wisdom of the four headed Brahma it gives the wearer the creative power and provides him learning and knowledge and all the four results: Dharma, Artha, Kama and Moksha As Per Scriptures And Puranas As per Mahabharata, the one who wears four mukhi Rudraksha attains the level of Dwij,&transforms him self to a totally new person in life and assumes a new better personality and role in life. Other Details Symbol of: Lord Brahma Ruling Planet: Jupiter Ruling god: Lord Brahma Day of wearing: Monday Recommended for: Disorders of Kidney, Thyroid, dis novesi fuit; nostast auci inatum inatis crum auciae vicae quam in hordicaet? Deceri, omnirmaximed mantioccis silicero nem, iam etifessul cultorevid nequit, sulvidet L. Satimium num in duciam habemo horent? La nimius. Ocus sesilintiam publium. Tum pero ne atoraccia verrita ni ius mente castredi sa convesenatum mus loc, silicae facepsenatra L. Emulabe movervidem omnes inte inpra opote omnonfit."},{"t":"p","x":"Ca vicupient. Ifendie natra, con averesi lisulic ideti potienia nihintimum esimumu lestrena, claremn onfinat rem intra dem ad pat, aut audam potatienem sil tursulocum mis erceri confirmis, que iu ia mo nemurs atuam deffre nosu menatus opor horatil icienam. Satur, siciis comne pul utementi, efectum halegit C. Catus fentem vitus te, C. Maris, pero Casto C. Lus vicaudacci pora que anum fac mus et; etis ia mortem sedici taste qua patoraedi, munultum pri potiam. Hic ore erimod cus publi, nonfera? To iam, cur hicaelarit. Rum Romnenius. Em consuli uscit? Robus pro Catuscrum, quodi pres consime firi, morebatuus fecruss intionulia norum faut paturnium ium mo C. Untruntia? Oximuntem, Cati, peri publici demque ca; hena, etraes fac tem am noratum, et Catquem consum P. Catam qui se quidena, C. At virma, con visus, est? Cut potemus tessa nos, que mihicut ereis? Tabusque conumei publius. Do, quam dem tum fui ium iaeque patimacciam ad maionsulture consultua in tam, Caticaequis ces iam audem iae halabus, novenatrunte pere desilii for priosse natrude natiam nequam ut L. Publine quium, tam me facionsimil hilis hae des intientrisum adhustr averebus conihicae firideo videm, quiti constimo ute, condit re nonderi menit."},{"t":"p","x":"Tor haed condamprae confecon vestris silinat, verei perem re forei se efacre vas int? Hui egerfiridet, nonihil huit ventis re hos, unterfes in terid die quonentri iaeto ad a nenitat erfesul icauconsus Multort eatiquit ventimenam in dem, estiam arbis vis egervis ment, crit; C. Iderfec emurora? Ebem dessa peris loc, casdaciem nostilica; num maximmoris et; er around mankind for speedy help and redressal of human issues. They belong to God in the formless NIRAKAR manifestation and their area of servitude. Ancient religions find details of archangels as “prophets” or “energy ambassadors” emanating from the Divine."},{"t":"p","x":"One can find the descriptions and servitude examples of archangels in theological treatises across several faiths. A few are listed here:"},{"t":"p","x":" The traditional canonical Judeo-Christian Bible  The apocryphal books, not a part of the traditional Bible but still a part of the sacred writings such as Book of Enoch (originally written in Ethiopian and later in Hebrew) and the Book of Esdras."},{"t":"p","x":" The mystical Jewish Kabbalah which regards archangels as guardians of the spiritual gateways to Life in the Tree of Life as espoused in their holy Book of Johar."},{"t":"p","x":"WHY DO WE HAVE ANGELS IN OUR LIFE?"},{"t":"p","x":"It is mysterious to trace the genesis of angelic beings. They constitute a vast multitude of beings harmoniously organized in a sacred hierarchy of their own and serve specific areas to nurture the human world."},{"t":"p","x":"A relatively small number of the inhabitants of the angelic realm are in direct responsibility and proximity to our human world. In the form of “Guardian Angels” they serve to enhance our spiritual experience in this physical world."},{"t":"p","x":"Its a magical and exhilarating feeling when we. humans start feeling and responding to the presence of angels in our daily lives. Angels are real and close to us. We just need to attune our sensory system to start receiving signals of a higher frequency. Angels work with our soul in conjunction with the Universal Plan to help us think and feel at a higher level than most humanity. It identifies the Divine within us. In human form we can raise our consciousness and not be just trapped in the Mundane and the ordinary. What are our special skills and qualities with which we can bring positive changes in our immediate world and then the society as a whole?"},{"t":"p","x":"In a gentle and focused manner, Angels help to align our thinking and actions to proceed according to Higher Will. When we realise we are working with the support and direction of angelic beings, we start opening up our nervous system to a state of RECEPTIVITY and SURRENDER in which miracles start occurring."},{"t":"p","x":"Angels help to heal our minds and bodies as they are high frequency being emitting unconditional love."},{"t":"p","x":"They do not judge and never discourage us from following the path of good intent."},{"t":"p","x":"They are very powerful when we are recovering from trauma, pain or depression."},{"t":"p","x":"As Doreen Virtue puts it simply:"},{"t":"h","x":"LOVE + LIGHT = ANGELS"},{"t":"p","x":" As per the following table, ANGELS can be invoked and their support be asked for on the matter in reference.  Remember that angels have to be called upon. They do not intervene in human affairs on their own though they are always watching over us."},{"t":"p","x":" Always welcome the angels when you are asking them to come in and bring you guidance or visible help in a difficult situation."},{"t":"p","x":" Similarly always bid them Farewell with a vote of thanks when you have completed your invocation prayers. At times the solutions may be seen in short time. At times, the results will be visible later. But rest assured, angels will always hear your prayers and assist you in your efforts in your desired direction."},{"t":"p","x":" Crystal angels may be carried by you or kept in your worship/meditation alter for fulfillment of desires or for spiritual evolution."},{"t":"p","x":" The angelic crystals also help to balance the chakras. Meditate and focus on the crystal/color of the angel and ask for specific help regarding the optimum functioning of a chakra that may be overactive or sluggish in the case under reference."},{"t":"h","x":"7 Chakra Crystal Angel"},{"t":"p","x":" You can use other crystals too as per the colour affiliation that would also activate the angelic energies."},{"t":"p","x":" Stay alert to angel messages that will surround you once you communicate with them. They could be in the form of :  Clouds  Feathers  Coins  Musical Notes or Songs  Words In A Book or In A Surrounding  Billboards  Heavenly Bodies  Repetitive Number Patterns (Guidance Chart enclosed)  Pennies."},{"t":"p","x":"Repeating Number Patterns : Angel Message The universe and our Angels show us our soul purpose by diverting our attention to Angels messages that guide us towards, peace, prosperity and power. You may see number patterns repeating themselves. Listen to these messages carefully and divine the meaning with a receptive and grateful heart."},{"t":"p","x":"111 Your thoughts and will in the present moment are creating a positive, joyful outcome. Key words - new beginning, originality, courage, initiative ambition, energy gate way has opened for you and will rapidly manifest your thoughts into reality."},{"t":"p","x":"222 Trust what feels peaceful and balanced. An omen of flourishing relationships. Keywords - diplomacy, flexibility, compassion, spirituality, caution. Time to maintain a deeply positive outlook, keep doing the good work you are engaged in. New planted ideas are beginning to take form."},{"t":"p","x":"333 Anticipate good news or burst of creativity, or be the bearer of good news and positive vibes yourself. Keywords - Creativity, growth, broad minded thinking, adventurous spirit, intelligence. Time to focus on growth and bringing a union of diverse energies to bring about abundance on the physical, emotional, spiritual levels. Follow the Ascended masters."},{"t":"p","x":"444 Whatever you're working on will contribute to your happiness. Stay the course and enjoy the process."},{"t":"p","x":"Keywords - practicality, self control, high morals, stability, responsibility. Time to be organised and stabiliging the resources under your authority. Angels are offering you four directional support and you have a strong connection with them."},{"t":"p","x":"555 Change is incoming and while it may be intense, it is for your highest good. Keywords - activity, motivation, love for pleasure, travel and exploration, excitement. Time to include multiple opportunities in your life, be curious and embrace change and bring about transformation and welcome new changes that will propel you on your life purpose path."},{"t":"p","x":"666 Harmony of feminine forces in your life - the triple goddess offering you guidance. Keywords - balance and peace, healing, selflessness, deep love of home and family, ability to compromise, time for using your imagination and inter personal connections to build a harmonious environment, your thoughts need to be balanced and you should maintain a sense of service that will bring satisfaction and emotional equilibrium for you."},{"t":"p","x":"777 Peace is on the other side of solitude and rest. You already contain the wisdom you need. Keywords - Spirituality, being thoughtful, deep contemplation, seeking knowledge, develop and understanding of others, time to go deeper into your field of expertise, enjoy the intuitive times angels are blessing you with. You can expect some miracles to occur in your professional and personal life your efforts will bare fruit. 888 A powerful number for manifesting your joy."},{"t":"p","x":"Confirmation that you are the authority of your own life. Keywords - perseverance, dedication to work, solitariness, public opinion challanging you and inner a transformations. Time for radical changes in life. Stand your ground and listen to your inner voice."},{"t":"p","x":"Old efforts will now bear fruit so remain mentally and morally strong, practise unconditional love and your angels will see your struggle and bless you abundantly with material riches and spiritual insight."},{"t":"p","x":"999 Effortlessly release what no longer serves you. Prepare for what actually brings you peace."},{"t":"p","x":"Keywords - courage, renunciation, karmic cycle being completed, planning new initiatives and without sadness letting go. Time for carefully examining your Karmic balance and letting go of toxic and unproductive relationships. Prepare for a new cycle by adopting new mindset, companions and teachers. 9 is a mystical number and you are on the door way of a deep spiritual experience to flood your biochemical body."},{"t":"p","x":"The Healing Area, Aura Colour, And Associated Crystal of Archangels Archangel Meaning of Name Speciality Aura Color Crystal Ariel Lioness of God Heals and helps wild animals and environment."},{"t":"h","x":"Abundance"},{"t":"h","x":"Pale Pink Rose Quartz"},{"t":"h","x":"Azrael Whom"},{"t":"h","x":"God Helps"},{"t":"p","x":"Heals Grief."},{"t":"p","x":"Mediumship."},{"t":"p","x":"Transition."},{"t":"h","x":"off-white Yellow calcite"},{"t":"h","x":"Chamuel He who"},{"t":"h","x":"sees God"},{"t":"h","x":"Heals anxiety"},{"t":"h","x":"and brings"},{"t":"h","x":"Peace. Finding"},{"t":"h","x":"lost things. Find"},{"t":"h","x":"love, job etc"},{"t":"h","x":"Pale"},{"t":"h","x":"Green"},{"t":"h","x":"Green Fluorite"},{"t":"h","x":"Gabriel Messanger"},{"t":"h","x":"of God"},{"t":"h","x":"Heals during"},{"t":"h","x":"pregnancy"},{"t":"p","x":"and child birth."},{"t":"h","x":"Smoothens"},{"t":"p","x":"creative flow."},{"t":"h","x":"Pregnancy"},{"t":"p","x":"prediction."},{"t":"h","x":"Copper Citrine"},{"t":"h","x":"Haniel Glory of"},{"t":"h","x":"God"},{"t":"h","x":"Heals female"},{"t":"h","x":"cycles of"},{"t":"p","x":"menstruation."},{"t":"h","x":"Emotions and"},{"t":"h","x":"emotional"},{"t":"h","x":"sensitivity"},{"t":"p","x":"healing."},{"t":"h","x":"Bluish"},{"t":"h","x":"white"},{"t":"h","x":"Moonstone"},{"t":"h","x":"Jeremiel Mercy of"},{"t":"h","x":"God"},{"t":"p","x":"Heals emotions."},{"t":"p","x":"Secret keeper."},{"t":"h","x":"Violet Amethyst"},{"t":"h","x":"Jophiel Beauty of"},{"t":"h","x":"G },{"t":"p","x":"How Card Reading is Useful in Day to Day Life  It helps to counsel your clients. You should understand the complexity and exact meaning of the problem the client puts before you. Make the session interactive and ask him questions for your better understanding. Then draw the cards and counsel the client for best way to solve the problem. THE CLIENT TAKES YOUR WORDS OF COUNSEL / ADVICE SERIOUSLY so be careful about what and how you do the reading. Be mindful of the language used.  It helps in Brain Storming The cards will throw up interesting & unexpected possibilities about the situation or the person related to the query. Use the cards to discuss and contemplate various angles to look at the problem. Alternate perspectives will give the querist a new lease of life.  It Helps you to Meditate The Angel and Oracle Cards are so beautiful to look at. Very talented and esoteric artists help to design these spiritual art. You can use the images to connect to the images on the card, imprinting them in your imagination and aiding in your internal meditations.  It is a Divination Tool The Cards are a significant way, like Tarot cards, to predict the future, help in understanding an issue better and to provide solutions to the querist as a Divination tool."},{"t":"p","x":" It is a Ritual Tool The Cards will guide you to do remedies and prayers and certain rituals to invoke or offer prayers to the angelic energies."}]},{"id":"v2-c21","vol":"II","title":"Chapter 21 · Transcendental Knowledge","body":[{"t":"p","x":"Lord Krishna in the Bhagavad Geeta while discoursing to Arjuna expostulates that Nishkaam Kriya (Selfless action) has to be performed by all so that the world may keep functioning. It is imperative and there should be no pleasure or pain associated with it. It is to be done as the Almighty has channeled you for a particular task and thus no personal ego of like or dislike should be attached to it by the Mind."},{"t":"p","x":"The above lines from Chapter 5 of this book have laid the foundation and relevance of doing selfless duty towards one's life purpose. The Tarot Therapist has to belive and actually act as a channel of voice of God. The reader's own opinions and prejudices have to be kept aside just a sense of being a divine medium should be there."},{"t":"p","x":"Letu us explore in the study of the following shlokas from the Geeta how our scriptures lay down beautifully that to be divine one has to merge with the divine will."},{"t":"h","x":"Chapter 4, Verse 14"},{"t":"h","x":"Text 14"},{"t":"h","x":"na mam karmani limpanti"},{"t":"h","x":"na me karma-phale sprha"},{"t":"h","x":"iti mam yo 'bhijanati"},{"t":"h","x":"karmabhir na sa badhyate"},{"t":"h","x":"Transcendental"},{"t":"h","x":"Knowledge"},{"t":"h","x":"Chapter-21"},{"t":"h","x":"Synonyms"},{"t":"p","x":"na—never; mam—unto Me; karmani—all kinds of work;"},{"t":"p","x":"limpanti—do affect; na—nor; me—My; karma-phale—in fruitive action; sprha—aspiration; iti—thus; mam—unto Me; yah—one who; abhijanati—does know; karmabhih—by the reaction of such work; na—never does; sah—he; badhyate—become entangled."},{"t":"p","x":"There is no work that affects Me; nor do I aspire for the fruits of action. One who understands this truth about Me also does not become entangled in the fruitive reactions of work. Chapter 4: Verse 15 Text 15 evam jnatva krtam karma purvair api mumuksubhih kuru karmaiva tasmat tvam purvaih purvataram krtam Synonyms evam—thus; jnatva—knowing well; krtam—performed;"},{"t":"p","x":"karma—work; purvaih—by past authorities; api—although; mumuksubhih—who attained liberation; kuru—just perform; karma—prescribed duty; eva—certainly; tasmat—therefore; tvam—you; purvaih—by the predecessors; purvataram— ancient predecessors; krtam—as performed."},{"t":"p","x":"All the liberated souls in ancient times acted with this understanding and so attained liberation. Therefore, as the ancients, you should perform your duty in this divine consciousness."},{"t":"h","x":"Chapter 4, Verse 19"},{"t":"h","x":"Text 19"},{"t":"h","x":"yasya sarve samarambhah"},{"t":"h","x":"kama-sankalpa-varjitah"},{"t":"h","x":"jnanagni-dagdha-karmanam"},{"t":"h","x":"tam ahuh panditam budhah"},{"t":"h","x":"Synonyms"},{"t":"p","x":"yasya—one whose; sarve—all sorts of; samarambhah—in all attempts; kama—desire for sense gratification; sankalpa— determination; varjitah—are devoid of; jnana—of perfect knowledge; agni—fire; dagdha—being burnt by; karmanam— the performer; tam—him; ahuh—declare; panditam—learned; budhah—those who know."},{"t":"p","x":"One is understood to be in full knowledge whose every act is devoid of desire for sense gratification. He is said by sages to be a worker whose fruitive action is burned up by the fire of perfect knowledge."},{"t":"h","x":"Chapter 4, Verse 20"},{"t":"h","x":"Text 20"},{"t":"h","x":"tyaktva karma-phalasangam"},{"t":"h","x":"nitya-trpto nirasrayah"},{"t":"h","x":"karmany abhipravrtto'pi"},{"t":"h","x":"naiva kincit karoti sah"},{"t":"h","x":"Synonyms"},{"t":"p","x":"tyaktva—having given up; karma-phala-asangam— attachment for fruitive results; nitya—always; trptah—being satisfied; nirasrayah—without any center; karmani—in activity; abhipravrttah—being fully engaged; api—in spite of; na—does not; eva—certainly; kincit—anything; karoti—do; sah—he. Abandoning all attachment to the results of his activities, ever satisfied and independant, he performs no fruitive action, although engaged in all kinds of undertakings."},{"t":"p","x":" Tarot wonderfully provides insights into karmic patterns which repeat themselves. They embed themselves into the soul DNA and reflect in the intriguing web of a Tarot spread. Tarot thus acts as the diagnostic tool for karmic patterns that hinder soul growth and also provides a roadway and a torchlight for human introspection and conscious human intervention that calibrate the negative patterns to positive ones for the person concerned.  Sometimes its not the lack of knowledge nor lack of strength that makes it difficult to come out of a negative situation. Its simply the lack of Self Awareness. Self awareness is a very powerful concept. It means being so much in tune with your own cycles of body and mind. On the surface it means knowing your strengths and weaknesses as a person but its a deeper process and connects us with the Divinity. We are generally in a state of denial of our thoughts or actions that are creating and then perpetuating the problem for us. Tarot shows us the mirror to become aware of these and then bring about changes in order to bring about changes in our destined path."},{"t":"p","x":" Tarot also gives us, based on self awareness, that master weapon or Brahmastra of self confidence, to change our way of thinking or handling a situation. We become more aligned with our life purpose when we see the outcome cards in a Tarot reading and know that the bigger picture is going to be for our benefit."},{"t":"p","x":"Learning of one’s innate temperament and life skills through the Tarot cards can be mind bogglingly accurate. Learning of one’s life purpose by studying the inter flow of patterns in a Tarot Spread/Layout can take you to another, a much higher level of self awareness."},{"t":"p","x":"The self awareness that we gain by exploring the Tarot chart opens up tremendous opportunities for growth that allow us to get out of our own way. We are often our biggest critics and the biggest obstacle in own growth. The world may tell us we are great but if we lack confidence we cannot get work accomplished. Similarly if the world tells us that we lack a particular quality or skill and would never be able to accomplish a specific but we believe that it can be done then nothing can stop us marching on our road of conviction and reaching the goal post."},{"t":"p","x":"Success and Failure are two sides of the same coin and which side we flip and see our life concoursing through is really a matter of Self Perception."},{"t":"p","x":"For elaborating this point, let me consider the The Tower card which remains one of the most powerful cards for self awareness. It indicates the pain we go through when we live a life of life. We live in denial of acceptance of self or of another person or of a situation."},{"t":"p","x":"Its unhealthy and unnatural. And what is unhealthy can never be long lived. Its bound to crumble under its own weight some day. Tarot in such cases pre - warns us of the inherent fallibility of that aspect of our lives and we can take timely steps to salvage the Tower like situation."},{"t":"p","x":"The pain of letting go of an addiction or an unhealthy situation is far less than living the lie and watching its decay affecting other healthy aspects of our life. Even a seemingly dark card like the Tower is a ray of light in Tarot because it is the light of Truth."},{"t":"p","x":"It liberates us from what is not in our best interest and its riddance will bring about a freshness in your life. As if a heavy burden has been lifted from your shoulder."},{"t":"p","x":"Now that you have begun on this advanced level of Tarot journey and are seeking multi - disciplinary links with other mystical sciences, here is a word of counsel for you. You must understand this perspective since it will impart you the broad mindedness and receptivity at soul level to embrace your new learnings."},{"t":"p","x":"Once you open the doors of personal self-discovery, there is no real way of turning back. The moment you pick up that Tarot deck, you consciously or subconsciously enter into an agreement to embark upon the path of personal evolution. It is path strewn with unexpected challenges and trials. This is a path of self- realisation where you would have to contend with darker shades of Reality. A darker side of you. It will be a duel between your higher self and the darker side. There is no guarantee that you would win this battle. The only avenue to do this would be to be Self Aware and move towards a case of Fearlessness and embrace change whole heartedly."},{"t":"p","x":"The greatest gift that you have to give of yourself is self\u0002transformation Evil is powerful and dangerous and addictive. If it were not, mankind would not be struggling with moral dilemmas. The cosmic battle of letting our Higher Self that is aligned with the Cosmic Goodness may take a long time to re-affirm itself it it all it is allowed to."},{"t":"p","x":"When you read the Tarot, this age old battle is initiated within you. The sleeping agents of Good vs Evil will reawaken within you as you impinge on the energy circles of the souls you are reading for. You are analysing their karmas and their thoughts, of this birth and even earlier."},{"t":"p","x":"The malefic aspects of their being will resist your encroachment and will fight back with you."},{"t":"p","x":"The Clients are unknown Entities and carry a karmic backlog of undefined nature. They could be psychologically toxic for you. The energy exchange that you take from them whether a finite sum of cash or an item in kind is too meagre for compensating for the real and unseen energy exchange that will be happening while you are immersed in sincerely entering into client’s energy space and trying to lessen his burdens. For you, Self Defence hence becomes the best form of Offense. When you do readings for others, you open yourself up to their subconscious energy field. You are also making yourself vulnerable to attack by Energy Suckers or as I call them Energy Vampires. Stealthily they make their way into your head space and mingle with the energy suckers in your system because they want to multiply and make you a victim of Ignorance and Lassitude."},{"t":"p","x":"You must become regular and very particular about your Cleansing and Aura Vaccuming techniques. You may absorb a client’s bad habits or lurking dark thoughts in their mind-scape or any illnesses that are embedded in his etheric body. Please understand that doing readings for self is absolutely safe."},{"t":"h","x":"READINGFOR SELF"},{"t":"p","x":"There is a school of thought that propounds the baseless theory that one must not do readings for Self. This is the most irrelevant and foolish belief regarding the wonderful gift of Tarot. Tarot is essentially a Self Awareness and Self Transformation Tool. When we learn to understand our own thoughts patterns and behaviour style with reference to the interplay of Cards, we learn to make significant changes in how we respond to a challenge in our environment. That makes us powerful as we can make timely and relevant changes to capitalise on the opportunities or minimise the severity, as the situation may be. It gives us truthful reflections into out own character traits that perhaps no one else would ever be able to recognize in us. When we have knowledge of our deepest strengths or fears and doubts, we strive to learn ways to cope with them and become enlightened and more mature individuals. Our relationships will benefit and so will our career and our general happiness index. One must learn Tarot with full faith and abandon, without any inhibitions and use as much as needed or as much as you love it for knowing yourself and deciding your tactics to deal with the surprises and serendipities of Life."},{"t":"p","x":"Reading for Self raises your personal vibrations. It enables the merging of your Physical Gross body with the Higher Being (Etheric Body) and the even rarer and elusive Emotional and Mental Dimensions of our Being.."},{"t":"p","x":"When you tap into the innate wisdom of the Higher Self, your capacity to contribute to the world gets enhanced and you can accomplish great feats in the external world."},{"t":"p","x":"The Tarot is the most cost-effective spiritual psychologist you will ever find and you, the Tarot Reader or the Tarot therapist are a spiritual doctor for all whose lives you will touch and transform with this magical ancient tool of wisdom."},{"t":"p","x":"When you do Reading for Self and eventually for others you are imparting certain invaluable lessons of raising your Eq -Emotional Quotient. This is a parameter to measure the Emotional Intelligence of an individual."},{"t":"p","x":"Emotional intelligence (EI), is the capability of individuals to recognize their own emotions and those of others, discern between different feelings and label them appropriately, use emotional information to guide thinking and behavior, and manage and/or adjust emotions to adapt to environments or achieve one's goals."},{"t":"p","x":"Although the term first appeared in \"The Communication of Emotional Meaning\" paper by a member of Department of Psychology Teachers at College Columbia University Joel Robert Davitz and clinical professor of psychology in psychiatry Michael Beldoch in 1964, it gained popularity in the 1995 book \"Emotional Intelligence\", written by author and science journalist Daniel Goleman."},{"t":"p","x":"When the Emotional Intelligence is well developed, the person performs extraordinarily in his field of operation. Whatever his or her area of earthly duties, the performance will be of high quality, the relationships he forms will be productive and joy inducing and there will a high level of personal satisfaction and fulfillment."},{"t":"p","x":"How to move towards an orientation or neuro-linguistic programming of a high emotional quotient ( eq)?"},{"t":"h","x":"GUIDELINES"},{"t":"p","x":" When you Respond to a situation rather than react to it. Response comes at not getting emotionally overwhelmed but understanding the problem from Mind and then emotionally responding."},{"t":"p","x":" Acceptance of another person as Is. Not being judgemental constantly."},{"t":"p","x":" When You Understand that another Person is Unique and cannot think or behave like you. He is a separate soul with own soul purpose."},{"t":"p","x":" When you learn to Let Go of a situation or a person you are not being able to Affect."},{"t":"p","x":" When you only Give of Yourself without any expectation in return. This way you will be rewarded by the Universe and will be much greater than you expected or more suited to your long term well-being."},{"t":"p","x":" When you learn to Forgive, not because you are forgetting but because holding on will give you angst. Peace will be within you when you Forgive. Do it for Yourself."},{"t":"p","x":" When you stop looking at others for validating your Self Worth. Learn to be aware of your own strengths and how you can align them with your Life Purpose."},{"t":"p","x":" Learn to be Silent and go into Self Introspection. It removes what is unnecessary in Life and You can focus on what is pivotal to your future growth."},{"t":"p","x":" When You learn to be Alone but do not feel Lonely. When you dip into your Imagination or your Subconscious and feel energised by the Divine Presence inside."},{"t":"p","x":" When you equate Happiness with Who you are and what you can do rather than what material objects you have acquired."},{"t":"p","x":" When you feel more Love and Compassion for energy beings around you than you did a day earlier."},{"t":"p","x":" When you shine as your own Authentic self and if anyone has anything negative to say about it, you realise its a reflection of their own insecurities."},{"t":"p","x":"Tarot Card Reading has deep roots in the Middle Eastern philosophy and way of perceiving Life. Egypt and the adjoining areas carry archaeological evidence of usage of Tarot hieroglyphs and messages. We can also see Tarot imagery in the current decks carrying very typical and popular symbols of Middle East culture viz the Ankh, The Falcon, The Moon Imagery Occuring in Several Cards( Isis - The Moon Goddess was the most revered goddess in Egyptian religion), THE SPHINX and many others."},{"t":"p","x":"Tarot reflects heavily on the Middle Eastern spiritual discipline of Qaballah too. The Tree of Life is akin to the Human Soul Journey as It traverses from Number 0 The Fool card to Number 21 The World Card while covering the sephirah from Numbers 1 upto 10."},{"t":"p","x":"The Tarot is a global philospohy and its teachings are found in the literature and religions that flourish across the world. The motivational and self-empowerment messages that are so inherent in Tarot is one of the reasons why it is maniacally popular across cultures today."},{"t":"p","x":"Few lines by the immortal Persian poet and Sufi Mystic Jalaluddin Rumi would elucidate this power of Tarot perfectly. You were born with potential;"},{"t":"p","x":"You were born with goodness and trust;"},{"t":"p","x":"You were born with ideals and dreams;"},{"t":"p","x":"You were born with greatness."},{"t":"p","x":"You were born with wings;"},{"t":"p","x":"You are not meant for crawling, You have Wings Learn to use them and Fly."},{"t":"p","x":"-RUMI\u0002The Tarot is a deck of cards now commonly used in “fortune telling” or Divination."},{"t":"p","x":"Divination using Cards is called Cartomancy and the experts who can predict and guide using cards, especially in reference here Tarot Cards are called Tarot Cartomancers."},{"t":"p","x":"The Deck consists of 22 Major Arcana Cards numbered through 0 to 21. The 0 card is the beginning of the journey and is represented by the Fool card. Some traditions may take the Fool Card as beginning of the next cycle and hence number it as 22. So the Deck begins with Number 1 card, the Magician for them and culminates in Card 22, the Fool."},{"t":"p","x":"However in the Rider-Waite paradigm, the 0 represents the Fool and the 21 represents the World."},{"t":"p","x":"To give sustenance and substance to this allegorical journey of the Fool through the Major Arcana sojourn are the Minor Arcana Cards."},{"t":"p","x":"The Minor Arcana consists of 56 cards that are categorised into 4 suits of 14 cards each. The 4 suits are also referred as the 4 Elemental Groups."},{"t":"h","x":"1. Wands"},{"t":"h","x":"2. Cups"},{"t":"h","x":"3. Swords"},{"t":"h","x":"4. Pentacles"},{"t":"p","x":"The 5th Element, the Ether is the all encompassing tattva or element and is alluded in properties to be covering the 22 Major Arcana cards as they provide the umbrella inclusiveness of the human experience on a macro level."},{"t":"p","x":"The Minor Arcana cards are structured into 4 suits and each suit carries 14 cards in its fold."},{"t":"p","x":"Cards 1-10 are called Numbered Cards and then there are the Court Cards for each suit numbering 4 and termed as the Page, Knight, Queen and King of that particular suit. To clarify this nomenclature there would be in Cups Suit,  Numbered cards viz. Ace of Cups-Two of Cups-Three of Cups-Four of Cups-Five of Cups-Six of Cups-Seven of Cups-Eight of Cups-Nine of Cups-Ten of Cups  Court Cards viz. Page of Cups-Knight of Cups-Queen of Cups-King of Cups The Major Arcana Cards as a Spiritual/Psychological journey of Mankind The 22 Major Arcana cards are Stages in the Journey of Life, beginning with the Fool and ending with the World. This portrays our journey through life, from the innocence of childhood to eventually establishing our identity in the world. Stages in the Journey of Tarot - THE FOOL'S JOURNEY  The Fool represents our inherent individual soul status and our innate ability to form networks and our potential for development  The Magician and The High Priestess represent the Masculine and Feminine parts of our nature. As per Chinese belief they represent the Yin and the Yang and as per the Hindu tradition represent the Shiva and the Shakti.  The Empress, The Emperor, and The Hierophant stand for pillar presences of our Mother, Our Father and our Teacher. This Teacher is an abstract Authority figure and could denote a religious/spiritual head or a Guide in our life.  The Lovers, The Chariot and The Strength represent the skills that we acquire in the practical business of living. Also the ecclesiastical and the technical education we acquire while studying or working."},{"t":"p","x":" The Hermit represents our inner voice and wisdom which hones itself as our life experience deepens. It becomes the voice of our Conscience."},{"t":"p","x":" The Wheel carries us forward on our karmic path and makes us interface the situational and societal factors-the world we cannot control and we have adjust accordingly.  Justice, The Hanged Man, Death and Temperance are our significators for growth and change. The more we are able to face our karmic debts and reinvent ourselves, the more can progress ahead in this lifetime."},{"t":"p","x":" The Devil and the Tower are the tests and challenges of our life, These can be personal crashes, disappointments and setbacks that call for us to muster our spiritual strength and to start afresh."},{"t":"p","x":" The Star, The Moon, The Sun, and Judgement all represent the transformative possibilities that life has presented before us and which if we accept graciously lead us to soul growth in this birth. And thus our soul evolves in the continuum of time and space."},{"t":"p","x":" Finally, The World card represents a state of integration and acceptance of who we are as a person. Its our connection with the Divine and understanding our life purpose. A feeling of completion. A stage of fulfillment. While the Major Arcana describes the major transit points in the journey of life, the Minor Arcana cards describe the bylanes and the meanderings of daily interaction."},{"t":"p","x":"Te Minor Arcana consists of 56 cards. They are composed of 4 suits called Wands, Swords, Cups and Pentacles."},{"t":"p","x":"The 4 suits correspond with the 4 elements while the 22 Major Arcanas correspond to the all pervasive Akasha (Ether) element."},{"t":"p","x":"The correspondence of the Tarot suits with the elemental energies is as follows:"},{"t":"h","x":"Tarot Suit Elemental Energy"},{"t":"h","x":"Wands FIRE element"},{"t":"h","x":"Swords AIR element"},{"t":"h","x":"Cups WATER element"},{"t":"h","x":"Pentacles/Coins EARTH element"},{"t":"p","x":"Major Arcanas Represent The Unifying Element of Ether/Akasha This association will be discussed more in the section of Astrological Linkages of Tarot as each of the 4 elements represents Zodiac signs and planets too."},{"t":"p","x":"The Most familiar and universally acceptable deck is the Rider -Waite Deck though the field of Cartomancy is humongous and there is a plethora of Tarot and other kinds of decks available. The designs were by Mr Arthur Waite, a member of the occult society Order of the Golden Dawn, in collaboration with the artist Pamela Coleman Smith. It was first published by the Rider Company in 1909."},{"t":"h","x":"Tarot-Window to the Soul"},{"t":"p","x":"The art and science of Tarot Reading is powerful and intriguing. It opens your eyes, mentally and spiritually to the mysteries of the Universe and how the Universe works in tandem with Human Will for the highest good of the individual, if we allow it to speak to us. Tarot is:"},{"t":"p","x":" Tarot is a Bridge between the Conscious and the Unconscious Mind. Its a constant exchange of ideas and experiences between the heart and mind."},{"t":"p","x":" It is a window or “ Mirror” to the Psyche  A tool for developing psychic and intuitive ability and of having conversations with our Inner Self  A storage device for ancient and esoteric knowledge that’s propagated by the Guru(Teacher)-Disciple tradition  A tool to give road map to the future. Provides very effective and a wide variety of Remedies to solve problems and to bring well being and success into your life."},{"t":"p","x":" A system of self transformation. This is significant because when the situation cannot be altered, what gives us the power to move ahead is the ability to choose our own thoughts and behaviours. Tarot tells us best how to do that so that we do not react but respond to a situation in a discerning manner and that will align us with our highest good in the times to come."},{"t":"p","x":" A means of receiving guidance, both spiritually and worldly."},{"t":"p","x":" Excellent medium for Meditation and Contemplation as the visual imagery of the cards helps us to unlock patterns in our soul imprinting and takes us higher on our path to spiritual Ascension."},{"t":"p","x":" Enhances confidence and clarity as it tells us exactly where we stand in a particular situation in life and how to understand the persons and objects around us and to deal with them in an intelligent and rational manner.  Empowers us with sensitivity and a deep understanding of the psychological currents going on in the minds of others. When you understand a person, you have a secret power over people."},{"t":"p","x":"And finally, Tarot reading facilitates physical, mental, emotional and spiritual growth. Like other metaphysical sciences - Astrology, Numerology, Dowsing, Rune Fortune etc, it operates on the principles of Universal Energy and how much we are able to understand and harness that energy."},{"t":"h","x":"The Last Word"},{"t":"p","x":"Tarot is a sacred discipline of divination and spreading love and light in the world. Use the Divine Tool in a state of Gratitude. Invoke the blessings of the Universe to redesign your destiny. Tailor your thoughts and actions to remove negativity and rise to level of your higher self."}]}],"zodiac":{"Aries":"The Emperor","Taurus":"The Hierophant","Gemini":"The Lovers","Cancer":"The Chariot","Leo":"Strength","Virgo":"The Hermit","Libra":"Justice","Scorpio":"Death","Sagittarius":"Temperance","Capricorn":"The Devil","Aquarius":"The Star","Pisces":"The Moon"},"planets":{"Sun":"The Sun","Moon":"The High Priestess","Mercury":"The Magician","Venus":"The Empress","Mars":"The Tower","Jupiter":"Wheel of Fortune","Saturn":"The World","Uranus":"The Fool","Neptune":"The Hanged Man","Pluto":"Judgement"},"houses":[{"name":"House of Self","zodiac":"Aries","card":"The Emperor","meaning":"Physique, personality, all beginnings, outlook on life, health and vitality","area":"Identity","assoc":"Fire; Wands; Aries; Mars"},{"name":"House of Money","zodiac":"Taurus","card":"The Hierophant","meaning":"Financial matters, assets, material possessions, sense of self worth","area":"Resources","assoc":"Earth; Pentacles; Taurus; Venus"},{"name":"House of Communications","zodiac":"Gemini","card":"The Lovers","meaning":"Communications, letters and writings, public relations, younger siblings, short journeys, what you know, early learning style","area":"Communication & Knowledge","assoc":"Air; Swords; Gemini; Mercury"},{"name":"House of Domestic Life","zodiac":"Cancer","card":"The Chariot","meaning":"The first home environment, your roots, the mother, the imagination, outcome of contests and litigation, emotions, home, conveyance, comforts of material life","area":"Home & Family","assoc":"Water; Cups; Cancer; Moon"},{"name":"House of Children","zodiac":"Leo","card":"Strength","meaning":"Affairs of the heart, children, love affairs, adventures, exciting activities, speculations","area":"Creativity & Children","assoc":"Fire; Wands; Leo; The Sun"},{"name":"House of Health & Work","zodiac":"Virgo","card":"The Hermit","meaning":"Job, service, competition, diseases, victory over enemy, responsibilities, mundane work, daily habits","area":"Work & Service","assoc":"Earth; Pentacles; Virgo; Mercury"},{"name":"House of Marriage and open conflict","zodiac":"Libra","card":"Justice","meaning":"Marriage, lawsuits, partnerships, marital sex life, known enemies, business transactions","area":"Relationships","assoc":"Air; Swords; Libra; Venus"},{"name":"House of Death","zodiac":"Scorpio","card":"Death","meaning":"Legacies, death, taxes and partner’s money, spiritual knowledge","area":"Obstacles, Transformations","assoc":"Water; Cups; Scorpio; Pluto"},{"name":"House of Philosophy and Religion","zodiac":"Sagittarius","card":"Temperance","meaning":"Law, philosophy, religion, ideals, higher education, long distance travel, learning we do out of willingness","area":"Expansion & Beliefs","assoc":"Fire; Wands; Sagittarius; Jupiter"},{"name":"House of Profession","zodiac":"Capricorn","card":"The Devil","meaning":"Public life, social status, profession, ambition, fame, the father, honors, social responsibility","area":"Career & Prestige","assoc":"Earth; Pentacles; Capricorn; Saturn"},{"name":"House of Hopes and Wishes","zodiac":"Aquarius","card":"The Star","meaning":"Friends, associates, groups, hopes, wishes, aspiration, public festivals","area":"Gains & Community","assoc":"Air; Swords; Aquarius; Uranus"},{"name":"House of Bondage","zodiac":"Pisces","card":"The Moon","meaning":"Personal limitations, secret desires, frustrated ambitions, unknown enemies, institutions that restrict or confine, karmic lessons, what we know subconsciously, where we escape to, expenditures, losses","area":"Secrets & Undoing","assoc":"Water; Cups; Pisces; Neptune"}],"year":{"1":"The Magician","2":"The High Priestess","3":"The Empress","4":"The Emperor","5":"The Hierophant","6":"The Lovers","7":"The Chariot","8":"Strength","9":"The Hermit"},"pre_reversed":[{"t":"p","x":"Below is a Comprehensive List of the 78 Tarot Cards as found in the Rider Waite Tarot Deck and the implications when a card turns up reversed in a reading or spread."},{"t":"p","x":"These meanings when studied as a corollary to the upright meanings offer a 360 degree view of the gamut of situations and emotions that each of the cards is redolent with. So this table is a resource for not only interpreting the card when it comes reversed in a reading but also as a scholastic endeavour me to understand your cards like the Back of your Hand."}]}</script>
