":"minor","suit":"Wands","rank":"Queen","start":171,"end":174,"meta":{"Element":"Fire","Planets":"Mars, Sun, Jupiter","Astrological Significance":"Cusp of Pisces / Aries","Favourable Color":"Orange Yellow Red Brown Orange","Chakra Associated":"Solar Plexus"},"rating":"Very Positive card","body":[{"t":"p","x":"The queen of wands is a very remarkable court card in terms of its attributes and achievements. It epitomizes all the qualities of the fire element in the positive, creative and passionate ways. Imagery : This Queen sits proudly on her throne while facing forwards. This is a clear symbol of her confidence and receptivity to the challenges and experiences that lie ahead of her, She is holding a sunflower which is also represented on her throne symbolizing her optimistic outlook on life.In her right hand she holds a wand, starting to blossom and showing the fertility inherent in the situation. She is associated with fidelity, honour and fairness. The black cat represents her links with occultism (some schools says, even witchcraft), but in the modern context it denotes her deep connection with the Divine and the mystic sciences. When the Queen of Wands appears in a spread the situation facing you will require her unique attributes."},{"t":"p","x":"Its a time to claim your leadership. You must be as confident and ambitious of your work goals as you are of yourself nurturing a family. It will be a demanding time, calling for all your strengths and capabilities to prove your worth. If you are working or engaged in a vocation, its time to let the world know of your talents. You must plan events and opportunities to network professionally and establish your identity in the field you are contributing to. Its not a time to just take but also to give orders. So try voraciously for a higher level of responsibility especially if it entails leadership role and mentoring or maintaining a team for its performance. Your fire element is at an all time high and you can achieve whatever you set your mind. You are prepared to take on the extra challenge, the travel and the negotiations that are likely to face you in this time of Ascension. You were born to rule, you will realize with startling clarity and will lay down clear boundaries of acceptable behavior in all your relationships-whether personal or professional. It is time to connect to your Authentic self and recognize what are your deeper aspirations. Try to introspect and discover what makes your passion for life light up. Destiny will now present you unexpected opportunity to express yourself creatively and to have your spacial brand identity and you will be admired for your unique creative or physical or intellectual talents. You may also find excitement in exploring your Divine or Intuitive self. The mysteries of the occult will fascinate you and you will realize that becoming spiritual helps you connect better with the people you manage. It will make you more independent and balanced in your thinking. Leadership comes to you naturally and you will do it with a natural warmth that endears you to all who meet you. Expand yourself and shine in the limelight when this card comes up in your reading. As a person the Queen of WANDS is an inspiring and dynamic figure. She is supremely intelligent but warm-hearted at the same time. Her intelligence would never make her aloof or arrogant. She uses her mental acumen and compassionate heart to shine in her role of leading projects and people. Like a typical Leo woman that this card astrologically represents, she is high on energy and being a perfectionist she achieves an excellent balance between work and domestic life. She is a creative person and her surroundings reflect her eclectic and quirky tastes. She loves travelling and broadening her mental horizons and brings back items from across her travels to create an ambience that is uniquely Her."},{"t":"p","x":"With this queen around, all situations are beautifully managed. She is a high calibre organizer and also a lavish hostess. Irrespective of her financial means, her products and presentations will stand out. She is confident enough to follow the path of her convictions. Se is not aggressive but in her quiet way, her clarity of thought makes her move ahead with alacrity and determination. She shows deep compassion and understanding and possesses the maturity to analyse an issue from multifarious angles and offer her fair advice. She is known for her fairness and a high sense of justice. She takes her role of leadership and counselling people very seriously and practices it with ethics and morality. She may act as a confidante to many because of her combination of understanding nature and an analytical mind."},{"t":"p","x":"At times, she may have a fiery temper but it is short lived. Living true to her fire element, she may become passionate about an issue or an argument but she is also quick to forgive and move on from grudges. When this Queen appears, look forward to a creatively fulfilling and socially hectic time. The queen in you will be noticed and appreciated by many around you so be confident and clear in both your expectations an your boundaries. Success is assured. Move forward with poise and a sense of purpose aligned with your authenticity."}],"id":"queen-of-wands","reversed":[{"t":"p","x":"Well respected but not popular, quick to anger and swift decision maker, openly ambitious, restless desire for personal success, domineering and temperamental qualities"}],"tone":"positive"},{"name":"King of Wands","num":14,"arcana":"minor","suit":"Wands","rank":"King","start":174,"end":177,"meta":{"Element":"Fire","Planets":"Mars, Sun, Jupiter","Astrological Significance":"Cusp of Cancer / Leo","Favourable Color":"Orange Yellow Red Brown Green","Chakra Associated":"Solar Plexus"},"rating":"Very Positive Card","body":[{"t":"p","x":"The King of wands is a situation or person in your life with very high levels of ambition, confidence and power. Its a time of success and pure achievements and you may be called upon to explore these qualities in order to mark your leadership presence."},{"t":"p","x":"Imagery : The King sits with supreme authority on his throne and looks confidently ahead. There is no place for past recriminations with this king. Forward is the way to plan and move. The lions and salamanders on his throne represent his ability to regenerate from misfortune and his strength. The robe is bright and orange resembling a flame, while the crown is shaped like a tongue of fire. The wand he holds is blossoming representing his creativity and his passion. The King of wands describes a mature man who may be an important feature in your life at the time of reading. It could be metaphor of a situation you are facing or you yourself may need to bring in the energy of this card to handle your life at the moment of reading. This king epitomizes the use of the staff or the wand that is the traditional symbol of the FIRE SUIT. In medieval Europe the wand represented the power of the State(government) to achieve its goals. The independent city states of Europe had much freedom of action and movement ; the wand / staff of state had the power to bring things to pass."},{"t":"p","x":"When the King of wands comes in the reading you are in for a superb professional opportunity. You are being called upon to take over the mantle of the head of a company or a team or a project as the scale of your professional domain entitles you to be. It will be a strong leadership position where you will be endowed with great amount of discretion in decision making. Its a time to be surrounded by power and triumph. Your working environment will be marked by powerful and influential people who will leave their mark on your thinking and you may feel very invigorated and compelled to make plans for your own growth in life."},{"t":"p","x":"When such great opportunity to rise on the ladder of influence awaits you, you must be at your charming and witty best. Do the networking that will make you matter. Be persuasive in the way you do public dealing. Dame Fortune is smiling at your talent and wants to bless you with golden opportunity. As a person, the king of wands is a dynamic figure. He is so marinated in his own passions and dreams that his dynamism becomes infectious and others also get positively motivated to follow him or to bask in his indefatigable aura. His sense of humour is unmistakable and he is witty and smart with the usage of words and language. He is warm, lively, enthusiastic and all these personal qualities will make him attract a band of followers and admirers. He is also a social occasion’s delight and revels in entertaining and having a high vibration environment around of equally enthusiastic persons. Energy surrounds him like a second skin and he exudes a charisma that is hard to be resistant to. It may occasionally be accompanied by a nasty temper and an impulsive nature but that is a transitory aspect and which is generally overlooked considering his other add-ons. When the wands suit comes up in relationships, a common reassurance is of fidelity and loyalty. The court cards of the wand element are charismatic and may have an occasional roving eye but they are very clear on their personal boundary regarding love and passion. They love with a ferocity and the king is a proud spouse, father and homemaker. He highlights the achievements and qualities of his family members and is very devoted to his home life."},{"t":"p","x":"If this man proposes love, you should be careful.He is a sensuous lover and may come across as seductive at times but will not cross the boundary. He likes to control the pace of the relationship and may intermittently be warm and emotionally distant."},{"t":"p","x":"Legal bindings and marriage contracts are important for him as his sense of honour is well defined. He respects all his contractual relationships, whether in professional or personal domain. His heart will be enthused by the concept of monogamy. He may also be pursuing a spiritual practice and likes the sense of self control and peace it imparts to his racing metabolism."},{"t":"p","x":"This card is a true leader and a king in the true sense of the world. His dynamism and energy coupled with his sense of loyalty and people skills make him an unparalleled star of the Tarot deck."}],"id":"king-of-wands","reversed":[{"t":"p","x":"Over ambitious, demanding and only driven by need to conquer people and objects. He uses all resources at hand for controlling others to serve his own interests"}],"tone":"positive"},{"name":"Ace of Cups","num":1,"arcana":"minor","suit":"Cups","rank":"Ace","start":177,"end":180,"meta":{"Element":"Water","Planets":"Moon, Mars, Jupiter","Astrological Significance":"Root Power of Water (All Water Signs Combined) - Cancer, Scorpio, Pisces","Favourable Color":"Blue Yellow White","Chakra Associated":"Sacral/Swadishthana Chakra"},"rating":"Very Positive Card","body":[{"t":"p","x":"The Ace of cups is almost poetic in its beauty and the divine depths it carries. Its the hand of God upon your heart and all its emotional richness. The most powerful vibe card for new and divinely guided love and fruits of creativity. Imagery : In the Ace of Cups card, there is a hand emanating from the clouds holding out a cup, as if in a offer to the querent to take a drink. This cup is overflowing with sparkling Liquid which symbolizes pure and pristine emotion. The cup has five streams of water overflowing from the brim. These five streams represent the power of intuition and Inner voice and hint at the depth of new and innovative ideas that lie within us. The streams are flowing both ways indicating that while one draws from the Universal abundance as a spiritual blessing, one will become more in connection with Divine if the flow of emotions is kept flowing. The spiritual and emotional fulfillment shall be endless."},{"t":"p","x":"Ace of Cups is a glorious card, one of the most positive in the entire tarot. It denotes the start of an emotionally fulfilling love journey, or a new spiritual initiation, or a new creative enterprise or anything else that is closely connected to your heart and makes you feel emotionally satiated."},{"t":"p","x":"It can also indicate conception and a new birth in the family which will initiate a phase of joyful times for those connected to the event. The surrounding cards acquire importance when the question is about fertility. A supporting indicator like The Empress or The Sun will strengthen the possibility of the fertility blooming."},{"t":"p","x":"The illustration of this card shows that the cup is brimming over with overwhelming feelings of gratification and pure love. You might be feeling so suffused with the bounties of the Universe leading your life to higher levels that you will feel drawn to offer gratitude. Religious or spiritual travel and rituals are advised when this card is prevalent in your life. Professionally you could become involved in an activity where your inherent talents are utilized. These talents may have remain unearthed till date and the present opportunity to display them from the secret alcoves of your heart will being you immense goodwill and you will be delighted and pleased at your self worth. You might be rewarded for your creative approach to your work."},{"t":"p","x":"Alternatively if the situations have been difficult for you lately, the Ace of Cups will provide wonderful opportunity to reconcile and restore peace and harmony. A rift in any working or social relationship may now be healed when you take the initiative to say sorry or express how you wish the rift to be mended. The reciprocity from the opposite side will be earnest and quick."},{"t":"p","x":"Friendship also receives a fillip when the ace of cups is around. Old friendships which once filled you with happiness and laughter will surface again your life. An old love may be rekindled with fresh understanding and appreciation for each other. Relationships, old or new, now is the time when the love will flow freely. It will emanate from a deeper, unfathomable depth in your heart and will know no limits."},{"t":"p","x":"Ace of Cups is the feeling of being alive with every pore, being in a sentient space and in gratitude for all the sensations to the Almighty who you will sense within You, and not Outside."}],"id":"ace-of-cups","reversed":[{"t":"p","x":"Creative block; loss of what your heart holds dear to it. Time of emotional loss, instability or pain, need or desire to give up a pleasure like alcohol or gastronomia or an extravagant hobby, keenness to make new friends will be thwarted"}],"tone":"positive"},{"name":"Two of Cups","num":2,"arcana":"minor","suit":"Cups","rank":"Two","start":180,"end":183,"meta":{"Element":"Water","Planets":"Moon, Mars, Jupiter","Astrological Significance":"Venus in Cancer","Favourable Color":"Blue Red Green","Chakra Associated":"Sacral/Swadishthana Chakra"},"rating":"Positive Card","body":[{"t":"p","x":"The Two of cups epitomizes the philosophy of love. Love is a powerful creative for the world as well as for the individuals. Love gives us the inspiration to make something of our life. Imagery : In this card, a man and a woman are exchanging their cups in a ceremony. there is a symbol of Hermes’ Caduceus in between which relates to negotiation, protection and duality. The man and the woman are differently dressed showing that contrasting energies which are convinced that when they collaborate, will produce complementary results, decide to come together and share their unique resources, personality and talents."},{"t":"p","x":"The angel grants them blessings indicating that this collaboration will bring a third dimension of creativity. This is an emotional partnership. It can indicate a love relationship becoming very strong and committed. It can also indicate that a betrothal will now be ceremonially strengthened to become a lifelong commitment which will be prosperous and fruitful for both the parties. In a work collaboration, parties will show willingness to come together and forge new alliances. Besides the professional gains, they will become emotionally close and give of themselves freely to forge this union into permanence. There is a genuine, internal desire to bond when this card comes up in a reading."},{"t":"p","x":"The 2 of cups is a traditional interaction of a contract or agreement, of two hearts beating as one, two souls united for a common purpose. Two of cups is a very encouraging card when the relationship is going through a time of conflict or struggle. It indicates that the partners are mature enough to put individual ego and individual differences behind them and to concentrate on what brings them together."},{"t":"p","x":"Although this card traditionally links to emotional and spiritual matters, the contract indication could encompass a wide range of issues like a new home. A new travel plan, a new tenancy agreement, a financial arrangement.What is important is the level of emotion behind it. There is an awareness and willingness in everyone to make this happen harmoniously and in a cheerful environment."},{"t":"p","x":"Like any Number 2 card in the minor arcana, there is no guarantee that the union that has come abut with such good intentions will be long lasting. 2s still show the beginning of the energy of the suit and require sustained effort and stamina to complete the journey till the end. It advises against the attitude of being compalescent."},{"t":"p","x":"The beginnings have been optimistic. Its a partnership and all the parties will need to put in individual efforts. No one can take a back seat and allow others to do the work. When this clarity is present, then it can lead to productive and mutually satisfying results."},{"t":"p","x":"Do not expect the relationship to be without stumbling blocks. The intentions are pure but the ego clashes could put major roadblocks. Do not be idealistic or too trusting of the other person. When you accept the grayness of the human character that you are interacting with and collaborating with then the results will be realistic and long lasting."}],"id":"two-of-cups","reversed":[{"t":"p","x":"Emotional misunderstanding, rejection of proposal to love or marriage, rebuff in friendship or other relationships, being friend-zoned, imbalance in yin-yang balance within, emotional manipulation to connect with someone"}],"tone":"positive"},{"name":"Three of Cups","num":3,"arcana":"minor","suit":"Cups","rank":"Three","start":183,"end":185,"meta":{"Element":"Water","Planets":"Moon, Mars, Jupiter","Astrological Significance":"Mercury in Cancer","Favourable Color":"Red Orange Yellow","Chakra Associated":"Sacral/Swadishthana Chakra"},"rating":"Positive card","body":[{"t":"p","x":"The three of cups felicitates achievements and coming together of creative, beautiful people to celebrate and raise a toast to the bounty they are blessed with. The three of cups is a hugely happy card but with suggestions of danger lurking in the waters of feeling."},{"t":"p","x":"Imagery : This card caries the image of three women lifting their cups up into the air in a celebration of some sort. Good times are in the air, for the three ladies have wreaths made of flowers in their hair. Wreaths are often associated with success and victory, so their happiness is well deserved. The ladies are also seen standing on top of a field of flowers and fruit, further adding to the abundant feelings in this card. This is an intensely joyful card of the tarot spelling moments of unbridled joy and camaraderie. The fruits of the joint labour are adorning the grounds and there is an air of celebration, freedom and pure\"letting down of all guards” and being in the moment. Its called the Sunshine card of this suit as it denotes stepping into warm and caressing sunshine after a long period of solitariness or mundane hard work. You could be celebrating an achievement or just the joy of friendship and companionship. Idea is to be together with a certain set of people and feel free and without any grouses."},{"t":"p","x":"The 3 of cups can indicate any kind of get-together or party; housewarming, marriage, engagement ceremony, award ceremony, birth of a baby, welcoming a new family member home, launch of a new product or creative enterprise. It is not necessarily a lavish occasion, it can be a quiet celebration with good food, drinks and a lot of laughter."},{"t":"p","x":"This is also a time of having intense experiences. You might react very intensely to certain situation. It may be unlike your normally moderate behaviour. This card always carries the lurking undercurrents of emotions becoming so intense that they may become unmanageable."},{"t":"p","x":"You may be uncharacteristically joyous or you may burst into sudden tears. The balance of emotional content is an important lesson in the three of cups. Emotionally an unstable time, you need to check the swell of emotions inside you. Find well balanced, constructive ways to outlet your emotional chakra. At times the presence of a third party, often unwelcome is also indicated by this card. This person could be in physical and tangible form coming between union of two persons or it could even loom in the form of an intense memory. Additional meanings of this card are seeking out those friends who you have not met for a long time; making the first move if you feel the need to make a peace pact with someone, solace and tranquility, recovery after illness, networking required for success, socialising for advancing up the professional ladder, attending family gatherings for maintaining your goodwill."}],"id":"three-of-cups","reversed":[{"t":"p","x":"Feeling lonely as being alienated in friendship, creative collaborations falling apart, ego-games in professional field, excessive partying, alcohol dependence, friendship of just good times but no real base to it, extra marital affair"}],"tone":"positive"},{"name":"Four of Cups","num":4,"arcana":"minor","suit":"Cups","rank":"Four","start":185,"end":187,"meta":{"Element":"Water","Planets":"Moon, Mars, Jupiter","Astrological Significance":"Moon in Cancer","Favourable Color":"Blue Green Yellow","Chakra Associated":"Sacral/Swadishthana Chakra"},"rating":"Gray card","body":[{"t":"p","x":"The Four of cups is a gray card. Most often, this shows a sense of being jaded and emotionally in a cocoon. There has been lot of frenetic activity in the recent past and when that suddenly halts and a sense of calm prevails, the adrenaline in the system subsides and you are left with a feeling of weariness where the physical world does not mean or penetrate into the senses. This calls for a much needed and deliberate time out so that your senses become decluttered and you are once more in sound nervous health."},{"t":"p","x":"Imagery : shows a young man sitting against a tree trunk in a lush garden with three upturned cups in front of him and a hand extending another cup from the skies and he is ignoring the offer."},{"t":"p","x":"In this card is also a deliberate sense of boredom. The man in this image already has more than he has desired. The upturned cups indicate his affluent and abundant life. All his wishes and desires have already been met with. He really has not any goal or burning vacant spots in his heart left. There is thus a sense of thanklessness and just a discontent in his body language. He is seeking more meaning in life but does not know where to look. Life has ceased to hold any challenges and the feeling of\"been there, done that” envelopes you. In such an instance, a wise counsellor or a serendipitous moment needs to make him express his Gratitude for all he has been blessed with and look for different avenues to share his blessings with. A moment to acknowledge the less fortunate than him and to extend a helping hand."},{"t":"p","x":"This card can also describe the tedium that accompanies the uneventful period in your life when nothing fruitful is happening in your life in spite of efforts. There can also be disillusionment when someone lets you down or has betrayed you in some way. You may go into a shell and refuse to interact with people and situations because you are protecting yourself from further scars."},{"t":"p","x":"The advice inherent in 4 of cups is that though this is a period of apathy and sadness, it must not linger so long that the fresh opportunity knocking at your door slips away. Time and Tide wait for no man and so it essential that you remain aware of what is happening around you. Do not become so wrapped up in your feelings of disillusionment that you cannot see what novelty is present in your environment. It could be something that could refresh and rejuvenate you and make you fall in love with life again."}],"id":"four-of-cups","reversed":[{"t":"p","x":"Overburdening by stress or emotional demands, recovery from apathy or depression, getting over a negative period and socializing again, understanding importance of social connections, gratitude and thanksgiving for abundance in life, advise to take a break in nature or a retreat in silence"}],"tone":"mixed"},{"name":"Five of Cups","num":5,"arcana":"minor","suit":"Cups","rank":"Five","start":187,"end":189,"meta":{"Element":"Water","Planets":"Moon, Mars, Jupiter","Astrological Significance":"Mars in Scorpio","Favourable Color":"Black Gray Blue Green","Chakra Associated":"Sacral/Swadishthana Chakra"},"rating":"Dark card","body":[{"t":"p","x":"There are certain cards in the tarot that instantly conjure up a dark and negative feeling. The five of cups is one such dark card. It has its silver lining like any tarot card brinking on darkness does, but the overwhelming vibe is of gloom. Imagery : The card has the image of a man who is standing with his face concealed and is cloaked in all black from head to toe. The down-turned hidden face shows his resistance to be seen or be approached."},{"t":"p","x":"The three cups in front of him are overturned. Some decks show an iota of blood spilling out of the cups. Two upturned cups are behind him but out of his line of vision. There is also a fast flowing river in front of him, a bridge in the distance and a solid looking house(even a fortification) which awaits his return across the border. This card is an indication of great despair and sadness. The person has gone through a veritable loss of great magnitude and is weighed down by sorrow."},{"t":"p","x":"The loss has been devastating and he is in deep mourning. The loss could be recent or it could be regret of a past event which has only hit his present life with full force leading him to realise how meaningless his current life is. He wishes he could go back in time to make a choice differently, a choice that was so significant that it decided the entire course of his life. He feels very impoverished at the moment and this feeling of loneliness and anxiety is acutely emotional in nature. If you are trying to rationalise the end of a relationship you will feel better when you reflect on what you learned as a result. Its a time to introspect how you could have managed the situation in a better way. There are always lessons to be learned when the 5 of cups turns up in reading. If accompanied by a regenerative card like the Death or the Sun, you will soon re-enter the relationship with higher dimensions of understanding with each other. It can also signal of a new and more dynamic relationship for you, one that will sustain you towards more self love and brilliance."},{"t":"p","x":"The central message in this card is that although something has been lost, something else has been saved or retained. The situation is not as dark as it seems. Emotional equilibrium needs to be established. Time heals all wounds and the flowing river is indicative of the passage of time being a Universal Law of Nature. The earthing needed to get over the despair is shown by the bridge."},{"t":"p","x":"With the help of emotional supporters, you must try to get back to civilization and your responsibilities which still await for your attention. The upright standing cups are the areas of your life that seek your nurturing. It asks you to retain what is left of the loss and move on in life. Life is a constantly flowing river and one cannot remain stagnated emotionally for an infinite time. You must gather the golden memories of the loss or learn from the lesson imparted but move on you must."}],"id":"five-of-cups","reversed":[{"t":"p","x":"Ready to move on after a major loss, sorrowful period coming to an end, realizing power of self and making new plans, positive new developments in personal life, loneliness ending, new family, new property, new avenues of livelihood, turning to spirituality"}],"tone":"challenging"},{"name":"Six of Cups","num":6,"arcana":"minor","suit":"Cups","rank":"Six","start":189,"end":192,"meta":{"Element":"Water","Planets":"Moon, Mars, Jupiter","Astrological Significance":"Sun in Scorpio","Favourable Color":"Blue Yellow Red Blue","Chakra Associated":"Sacral/Swadishthana Chakra"},"rating":"Very Positive card","body":[{"t":"p","x":"The six of cups is a very positive and warm hearted card full of golden memories and authentic promises for the future. A card of bondings and companionship."},{"t":"p","x":"Imagery : there are 6 cups filled with white flowers. \\Four of them are beautifully lined up in the foreground. Two children are depicted in the background, one of them passing the cup of flowers to the other. The sixth cup blooming with flowers adorns a lovely stately looking house. A soldier like figure is walking away from the scene, carrying back the sword with him."},{"t":"p","x":"This card highlights the power of the past."},{"t":"p","x":"The 6 of cups is a card of memories. It revives those times when you were happy ; it shows that you can relearn happiness. It can appear in the reading when a strong memory from the past or a person from the past has made an important reentry in your life. This is a positive development as being with this presence or memory takes you back to times when you were happy and carefree. Something about that time or circumstances has brought out the best from you. That spark of excellence is really pleasant to relive as it will fill your present with new inspiration and a lightheartedness. The gloom or anxiety of the present times will just melt away."},{"t":"p","x":"It may also describe a very emotional natured person who prefers to live in the hazy past and imagined times of the times gone by rather than face the challenges of the present. There may be an eagerness to recreate the history in the present and escape the confines / limitations that the present offers. Its often a rose tinted way of looking at life and is divorced from reality."},{"t":"p","x":"As they say, its refreshing to travel down the memory lane at times but not to linger there. The past has a sneaky way of capturing you, unguarded, into a time warp and does not allow you to make healthy relationships in the present context."},{"t":"p","x":"This card’s appearance may indicate reunion with old family members, meeting an ancestor, ancestral house, visit to home, school or educational institution meet up, visiting the family shrine or even the places associated with your childhood or places where you spent spontaneous times. Is stressful times abound, its time to travel the time machine and open up an old photo album, watch an old holiday video or make an appointment with an old friend. Nostalgia and recollections of the past times are the key themes here and one must make deliberate efforts to go down that lane. When this card comes up, its a time to let your heart rule your head. Its a time to spread happiness and kindness all around. So be easy with people and situations around you and treat them with a soft attitude of understanding."},{"t":"p","x":"Sometimes an old relationship may be rekindled in order that you might gain from the experience in terms of personal growth. In case a surrounding card is the Star or Ace of Cups, then an old flame or good friend may return significantly in your life. By itself this card does not say whether the partnership will be revived or you will again go your separate ways. But when supported by cards as above, does indicate that the partners have grown on a soul level through the experiences on their individual life journeys. They now cross paths to teach each other some new lessons and perhaps initiate a beautiful relationship oriented towards higher goals."},{"t":"p","x":"This card can also describe something old, like an antique that turns out to be valuable. It can indicate you rediscovering an old hobby or talent and find an opportunity to hone it in present context. Ancestral property and gains may also be indicated by this card."},{"t":"p","x":"When this card appears, its time to connect with the past and be discerning enough to know what component of the past can help you deal with the present in a better way and in fact lay the foundation for a brighter future."}],"id":"six-of-cups","reversed":[{"t":"p","x":"Clinging to the past and ignoring the present, Learning and derive solace from past experiences but not lingering there, realizing the power to create the present moment, disrespect to elders, not learning from past mistakes"}],"tone":"positive"},{"name":"Seven of Cups","num":7,"arcana":"minor","suit":"Cups","rank":"Seven","start":192,"end":194,"meta":{"Element":"Water","Planets":"Moon, Mars, Jupiter","Astrological Significance":"Venus in Scorpio","Favourable Color":"Blue Yellow","Chakra Associated":"Sacral/Swadishthana Chakra"},"rating":"Gray card","body":[{"t":"p","x":"This is a Gray card of the Cups suit and indicates mental confusions, an attitude of non decisiveness, falling into the trap of temptations that detract you from progressing in life and at times to the vices of substance abuse."},{"t":"p","x":"Imagery : The card shows seven cups floating in the air while a man in darkness stands in front of them and seems to be in a situation of choosing one or several of the options available. From afar the cups look tempting and shiny and holding great promise but a closer inspection will yield forth the truth that they may contain unpleasant and even dangerous objects. This card majorly talks of being sidetracked by the glitter that life offers us. However all that glitters is not Gold and one must sue careful powers of discernment and patience to study the various options and select the one which will actually lead us to our well being. The others are just red herrings to test our mental powers and power of selectivity."},{"t":"p","x":"The seven of cups warns us against wishful thinking, indulging in whims or concentrating on daydreams that will never amount to anything."},{"t":"p","x":"You should be very tough headed when making an important decision of life. The seven of cups is a card of emotions being susceptible to pursue that which looks easy or attractive. However just as in the picture there might be lurking dangers as denoted by the snake."},{"t":"p","x":"As a card that appears for the future time, its a card full of potential and choice for you. Choice is a big power that the human mind is bestowed with. Its a blessing by the Universe to be able to exercise Free Will and use your aptitude, judgement and experience to be able to make a choice at an important juncture in life."},{"t":"p","x":"The only caution with this card is to use this gift of choice carefully. One of these opportunities will be very favourable for you and will lead to success and contentment."},{"t":"p","x":"This card can sometimes a person too spoilt for choice. He may be surrounded an excess of positive support, even pampering. In such a case or when his heart is very malleable to peer pressure, he may get attracted into bad d company and be prone to indulging in alcoholism, drug use, gambling or easy relations with the opposite sex."}],"id":"seven-of-cups","reversed":[{"t":"p","x":"Being too imaginative to the point of delusional, mental disorders, resisting pleasures of life, self sacrificing attitude, celibacy and abstinence, giving up planning and moving to action stage, taking help of an advisor to choose the best option available"}],"tone":"mixed"},{"name":"Eight of Cups","num":8,"arcana":"minor","suit":"Cups","rank":"Eight","start":194,"end":197,"meta":{"Element":"Water","Planets":"Moon, Mars, Jupiter","Astrological Significance":"Saturn in Pisces","Favourable Color":"Blue Red Yellow","Chakra Associated":"Sacral/Swadishthana Chakra"},"rating":"Gray card","body":[{"t":"p","x":"The eight of cups brings in the message for walking away from the excesses of the world; a time of retreat and solitude and search for peace of mind and a higher purpose in life. Imagery :A singular person, with his back to us is waling towards a mysterious cave. Eight cups all upright and apparently brimming with their resources line up the foreground but the person is in total disregard of them. His focus is elsewhere. The Moon is peculiar, as in its denoted both as Full Moon as well as New Moon. Full moons are a classic symbol of endings and New Moon of beginnings. This is indicating that one cycle has to end before a fresh beginning may be made. When the eight of cups comes in a reading, you are saturated with the material abundance and all the rigours that have gone into accumulating and then multiplying it."},{"t":"p","x":"Life has become a never ending conveyor belt of demand and supply, You feel burned out and at the mercy of the world asking for your emotional and mental inputs. You feel an innate desire to retreat to a place where the clocks ticks slower for you and you can be in solitude to replenish your creative energies."},{"t":"p","x":"This card literally points to taking time out for a retreat or a meditation camp or a time period communing with nature like a hiking trip or a nature sabbatical. It is time to clear your own system by filling it with Universal energy such that your original aura is restored, unmarred by the corruption of the needy persons and situations around you."},{"t":"p","x":"There is more hope embedded in this card than apparent initially. The soul is thirsting for more knowledge about the Universal Truth when this card and its tendency appears in a person’s life. You realize that the material manifestations are a mere myth."},{"t":"p","x":"The all pervading Consciousness that exists within each of us will need careful nurturing and a blankness to be felt and experienced. 8 of cups is a classic card for such deep level yearnings and the resultant Ecstasy. The New Moon is the empty but promising vessel of the heart while the Full Moon indicates the joy that will fill it once the alignment with the Divine is made."},{"t":"p","x":"In relationship and emotional issues, this card is not very positive. It generally indicates that the alliance has run out its course and one of the parties does not want to cling on and wants to retreat from the relationship. Its also heartening in a way because there is the maturity to realize when the relationship has become more of a burden than a blessing. It takes courage to enable able to walk away from a relationship yet its a choice that will give immense peace in the long run."},{"t":"p","x":"If the situation is that of a marriage and children or other family members’ responsibilities are involved, then the retreat may not always be so evident. The partners will develop an indifference between them and be mentally divorced from each other, even though they may be living under the same roof. Mental isolation is also an important attribute of this card. In general, this card carries bleak news. There may be failures and disappointments when this card comes for success or achievement related question. The eight of cups carries a sense of inevitability. There might be the end of cherished hopes and dreams. However instead of self guilt, one needs to detach from the negative situation and retreat into contemplation and analyse the causes of the disappointment and also realize how the unrequited desire could be part of God’s larger divine plan for your well-being."}],"id":"eight-of-cups","reversed":[{"t":"p","x":"Holding on to a rotting relationship or an idea, afraid to give up comfort zone, selfishness and possessiveness, avoiding a confrontation, denying your spiritual side, overindulgence in luxuries and power, escaping necessary commitments, pretentious spiritualism"}],"tone":"mixed"},{"name":"Nine of Cups","num":9,"arcana":"minor","suit":"Cups","rank":"Nine","start":197,"end":200,"meta":{"Element":"Water","Planets":"Moon, Mars, Jupiter","Astrological Significance":"Jupiter in Pisces","Favourable Color":"Yellow","Chakra Associated":"Sacral/Swadishthana Chakra"},"rating":"Very Positive card","body":[{"t":"h","x":"Chakra"},{"t":"p","x":"This is an incredibly positive card of the Tarot, Also termed the\"Wish Fulfillment” Card as it carries news of your dreams and desires coming true."},{"t":"p","x":"Imagery : A prosperous and middle-aged man is sitting on a wooden bench while his arms are crossed, and his face is showing quite a level of contentment. He is dressed elegantly and has the look of the true satisfaction. The head-dress on his head is red, and is a depiction of fertile mind capable of manifesting. Nine golden cups, in the background on a U shaped table are structured and arranged in an orderly manner. The Nine of Cups symbolizes a representation of fulfillment and success, both spiritually and materially. The man shows that expression of success after achieving his innermost desire. There is no negative undertone in this card. Its a card of triumph, of complete success, almost of satiety. Everything you have hoped for, planned for is about to come true. In fact this card is about MANIFESTATIONS of your visualization. The events will unfold almost exactly or in a better way than you have been visualizing. If there are unfavourable supporting cards in the spread, the positivity may be delayed but it can never dilute the brilliance of this card’s success. This is your hour. Much like the figure in the image, the Universe is favouring you. You are being showered with success and abundance from all around and your happiness will be ultimate. It talks of favourable results from professional, personal, financial and even spiritual life."},{"t":"p","x":"As its one of the higher cards in the cups suit, the wish fulfillment relates to the heart chakra in a substantial manner. What gives your heart the ultimate joy? What gives it surmounting satisfaction? These questions are an integral part of both the enjoyment as well as analysis of this Tarot card."},{"t":"p","x":"It tells us to clearly go into the process of knowing what gives us happiness and also\"take action on making your dreams coming true”. It talks not just of destined success but advises us encouragingly that the more karma we put into making our dreams our reality, the larger will be the returns and the more vibrant the satisfaction we will derive out of it. Its a card of constant action and never of inaction. It indicates that you should always be prepared to take full advantage of the favourable situation, much like the Wheel of Fortune Major Arcana. Time wheel is spinning in your favour and you should be on high energy mode to take suitable action to turn your wish into reality."},{"t":"p","x":"Its also a warning card to not let success get to your head. Do not be so immersed in the enjoyment phase that you become ignorant of the undercurrents of the environment. When this card appears in a reading, the person is generally enjoying the fruits of his labour. He is relaxed and in a generous mood. Socialising & partying, lassitude and simply being in emotional cocoon will be his general orientation. Such opportunity can be taken advantage of by an adversary who are waiting in tow for the guards to be down."},{"t":"p","x":"Thus its a warning to not be complacent about the success but also to safeguard it judiciously."},{"t":"p","x":"There is also a chance that you so smug in your prosperity that you might ignore the plight of those who come to you for help or succour. This card may imbue you with a sense of superiority and unlimited good luck. Beware ! It may not last forever so continue giving back to the society so that by the Law of Attraction more of abundance might keep getting attracted back to you."},{"t":"p","x":"All in all, this card indicates happy endings. If you have recently been struggling with low finances or a troublesome relationship or a general adverse fortune, now the times will turn dramatically for you. Provided your efforts have been going on in the direction of your dreams, Dame Fortune will soon bring a smile of contentment on your face."}],"id":"nine-of-cups","reversed":[{"t":"p","x":"Smugness and arrogance, superficiality and hypocrisy, being stingy with abundance, non\u0002helpful attitude, being so self satisfied that cannot notice feelings of others’, using money to get your ways unethically and illegally, feeling emotionally empty and still seeking more to acquire"}],"tone":"positive"},{"name":"Ten of Cups","num":10,"arcana":"minor","suit":"Cups","rank":"Ten","start":200,"end":203,"meta":{"Element":"Water","Planets":"Moon, Mars, Jupiter","Astrological Significance":"Mars in Pisces","Favourable Color":"Blue Green","Chakra Associated":"Sacral/Swadishthana Chakra"},"rating":"Very Positive card","body":[{"t":"p","x":"The Ten of Cups is perhaps the most joyful and optimistic cards of the Tarot deck. It ushers in a sense of contentment and of completion. Your life looks perfect at the moment, to you. All that you ever wanted, is within your reach. Imagery : A couple is looking out at the lush landscape while a pair of children play happily nearby. A rainbow envelopes their happiness providing a colorful and reassuring support of the Divine over their blessed life."},{"t":"p","x":"The Rainbow is like the proverbial. gold at the end of the rainbow. All the efforts have finally been paid off. You have achieved something that is giving you immense pleasure and a sense of completion. The family life is very peaceful and full of cooperation when this card makes an appearance. People are extremely satisfied with each other and offer their gratitude for the privileges they are receiving. This mutual respect for each other is contagious and makes the entire environment very positive and calming, even for outsiders. When this card comes for a relationship or an impending marriage issue, the prophecy is of extra compatibility where there will be negligible conflict."},{"t":"p","x":"You should rejoice and take stock of your success, and feel your confidence surging at your achievements over the long emotional journey. The tens of any suit represent the whole of the situation, the environment of the situation. The ten of cups shows that our emotional enjoyment is being extended out into the rest of our life. It now encompasses our work life, our friendships and perhaps even our finances are associated to our happiness. This is a good time to acknowledge just ow well respected and well loved we are."},{"t":"p","x":"Sometimes this card appears when you are trying to move out of a difficult phase into one that will much easier on your nerves and emotions. If this card appears as a card after a dark card like Ten of Swords or Three of Swords or The Tower, its a very welcome salve for the wounds on the psyche. You are in serious need of some respite from being battle weary and this card will bring soothing times to the battle weary. It can also indicate moving into a larger or grander home or buying luxuries that will upgrade you socially. This card can indicate expensive purchases like designer clothes or connoisseur jewellery or taking an expensive exotic trip. Unlike the Nine of cups which also spells contentment and achievement of what the person holds dear to his heart, this card is a notch more positive."},{"t":"p","x":"While the Nines bring in success, it may be short-lived and furthermore you will have to safeguard it zealously lest it be taken away from you. Ten of cups spells long lasting happiness and abundance, which you can enjoy with a relaxed heart and mind."},{"t":"p","x":"The card is a beacon of hope. It brings in knowledge that your life is progressing in a way that it is meant to. You are aligned with your higher goals. Your sense of self worth is high and you are in your Golden Period being extra productive at whatever you engage in. You are at home with yourself and have much to be grateful for"}],"id":"ten-of-cups","reversed":[{"t":"p","x":"Non fulfillment of wishes, feeling emotionally empty and cheated, loss of family life, childlessness, children ignoring parents/elders, no interest in material possessions, unrealistic ideas about a perfect world, marital troubles and divorce"}],"tone":"positive"},{"name":"Page of Cups","num":11,"arcana":"minor","suit":"Cups","rank":"Page","start":203,"end":205,"meta":{"Element":"Water","Planets":"Moon, Mars, Jupiter","Astrological Significance":"Personification Of Water (Element Only)","Favourable Color":"Blue Pink","Chakra Associated":"Sacral/Swadishthana Chakra"},"rating":"Positive card","body":[{"t":"p","x":"This is the beginning of a new phase in your life that involves your emotions in a major way. It could be the initiation of a new relationship or a partnership or a professional venture that is also close to your heart and not merely pursued for ambitious or monetary reasons."},{"t":"p","x":"Whats important to note here is that the status of this situation is very fragile at the moment. The Page indicates an early gestational period of a relationship or creative venture. It will require protection from harsh factors and a bit of protective nurturing. A budding romance with this card continues to develop well into a meaningful relationship. It will be enjoyable for you and though it may never become very intense or convert into a legal commitment, it will always remain a friendship you will cherish due to genuine affection for each other. Page of cups also refers to a creative or spiritual opportunity. For example you could initiate a course of study that tells you about the global patterns or various languages of the world or helps you gain multicultural knowledge about a particular subject like art appreciation course of art styles across countries of the world."},{"t":"p","x":"The Page is a message bearer and what kind of message it will bring to you depends on the nature of the suit. The Page of cups will bring to you some news about a new relationship or a message from someone you already know. It will be a gentle and encouraging energy the Page will carry, unless surrounded by a volatile card that can darken the message. As a person, the Imagery of the Page of Cups is a young fellow, possibly an adolescent or a young adult. This person will be creative and sensitive. He will be fickle in his interests and his attachments to persons and issues of interest may keep changing frequently. He is ruled by the waves of the heart and may be a poet, a painter or a composer."},{"t":"p","x":"The wave imbued river in the background indicates his fluctuating emotions. He is prone to rapid changes in moods. The fish he is looking at so intently springs from his subconscious so the appearance of this card indicates messages in dreams or during deep meditation or the angels trying to make contact with you through one of the Four Clair senses. He will be helpful and innocent at heart. He may also be a gentle spiritual presence in your life, a wee bit ethereal and wrapped up in his own world. When the page of cups appears, its not necessary the person is already in your life. He is a subtle presence and you may not have even recognised him till date.Sometimes this card describes a person who will never play a major or visible role in your life. He will simply support you at a time and help you reach your goal."}],"id":"page-of-cups","reversed":[{"t":"p","x":"Fear of entering relationships, naive and immature person, wishy washy in decision making, dreamy and impressionable person, no clear cut goals and passions, disconnected from Intuition, disappointing news in love and matters of interest, non-commital in heart related matters"}],"tone":"positive"},{"name":"Knight of Cups","num":12,"arcana":"minor","suit":"Cups","rank":"Knight","start":205,"end":207,"meta":{"Element":"Water","Planets":"Moon, Mars, Jupiter","Astrological Significance":"Cusp of Aquarius / Pisces","Favourable Color":"Blue Gray","Chakra Associated":"Sacral/Swadishthana Chakra"},"rating":"Very Positive card","body":[{"t":"p","x":"The Knight of Cups is a person who is active and dynamic. His heart rules over his head and all his thoughts and actions are emotionally driven. However as a person he is helpful with innate goodness and generosity of heart."},{"t":"p","x":"This card talks of being wary of letting emotions rule your decisions. It warns to be pragmatic and analytical before making emotional commitments. There may be risks in trusting wrong people and one should not be so gullible so as to be emotionally manipulated. The Knight however is emotionally vulnerable and at times gets caught in the emotional trap set by people not wanting his well being."},{"t":"p","x":"In the Imagery, the Knight is important because he gives us the message of taking action in the area where our love lies. The Knight is astride a horse and carrying the cup of love or creativity as the case may be. He has set out to make his dream a reality. Follow your dream, says the Knight of Cups. Your creativity is at an all time high and you could be really successful at making great contacts with people who can help you succeed and appreciate your talents. Its not a time to be coy or shy but rather be very transparent about your creative talents as well as aspirations. Its the perfect time to make a business out of your creative hobby."},{"t":"p","x":"When this card comes up, there could be a period of intense emotional growth for you. It could even be a powerful spiritual experience that will raise your vibration irrevocably. The Knight of cups could herald an enjoyable time for you where you will open yourself up emotionally and embrace new feelings and sensations. It will provide more meaning to your life and make you feel more self worthy."},{"t":"p","x":"Additional meanings of this card are relocation to a calmer place, travel across waters or to a peaceful retreat, a spiritual camp or meditative experience. The white horse in this image moves gently and pleasantly so the pace is languid and self exploratory. The whiteness of the horse indicates the flavour of the image to be full of light and love."}],"id":"knight-of-cups","reversed":[{"t":"p","x":"Creative energy has been blocked mostly due to emotional reasons and feeling of frustration;"},{"t":"p","x":"person caught in own world and disconnected from reality, fantasy or substance abuse, false promises of love"}],"tone":"positive"},{"name":"Queen of Cups","num":13,"arcana":"minor","suit":"Cups","rank":"Queen","start":207,"end":210,"meta":{"Element":"Water","Planets":"Moon, Mars, Jupiter","Astrological Significance":"Cusp of Gemini / Cancer","Favourable Color":"Blue Purple","Chakra Associated":"Sacral/Swadishthana Chakra"},"rating":"Very Positive card","body":[{"t":"p","x":"The mistress of the misty and elusive world of emotions, the Queen of cups is known for her idealistic and imaginative nature and her dexterity in understanding the complex world of feelings and creativity."},{"t":"p","x":"Imagery : The Queen of Cups is an extremely emotional figure who sits astride a white throne, draped in pristine white cloak and gazes wistfully and intently at the chalice of emotions she holds,. This chalice is bigger and more ornamental than all others in the suit of cups indicating her high stature and that she is a master of emotions.He imagery evokes a sense of other worldliness and her being self absorbed as she dips and surfaces in the enigmatic pools of the world of the subconscious."},{"t":"p","x":"As a situation card, the queen of cups denotes a period where you are on a creative high. You will be inspired to create beauty and aesthetics out of your wells of imagination. You will feel mellow and soft, receptive to the emotional vibes and conversations around you."},{"t":"p","x":"Its also a time of extreme patience. The emotional intensity of people around you may be high; there might be histrionics or there might be aggression in the air. The Queen simply waits patiently. Patience is the most difficult art to practise-it requires immense self control and the Queen of Cups has mastered this art. Of waiting. Of the natural rhythms taking over. Gradually all tumult dies down. Whether its in the environment or within your own mind."},{"t":"p","x":"So when the Queen comes, the solution can be of non-action. You cannot stop your mind from chasing thoughts; the Mind will not listen because it is genetically programmed to be active. When you stop the action, when you do Absolutely nothing, the Mind slows down. This eases the emotions and gradually the emotional balance is restored. The Queen wants emotional balance and teaches you how to achieve that."},{"t":"p","x":"Its a time also to be careful about the emotional health of the company you keep. You are like a sponge picking up on their emotional ebbs and flows. You must avoid spending long periods of time with those who are angry, negative or who drain your energy."},{"t":"p","x":"As a person she is the ruler of the emotional and imaginative realm. Her throne is at the border of the vast ocean. The vastness and infinite depth of the ocean are akin to the depths and mysteries of the human heart. The deepest part of the human emotion is the subconscious. The waves and wisdom of the subconscious are still an enigma for most. This queen has the intuitive gift of ploughing deep into the subconscious and providing guidance and support."},{"t":"p","x":"The advice this queen offers is startlingly perceptive in its level of insight. It carries a very uncanny level of Truth. Generally this queen is sensitive of others’ feelings but when she is articulating a channeled message based on her divine connection with the Almighty, she can be direct and piercing."},{"t":"p","x":"She needs to cushion her words in a less direct way to avoid offending those who seek her for her wise counsel. This queen has a direct connection with the angelic realm. It is symbolized by the handles of the cup she is holding which are shaped like angel wings. Images of cherubs and angelic figures also adorn her throne and envelop her as the Earth Mother. She is a gifted psychic and clairvoyant and maybe an experience expert at tarot and angel card readings. She is a wonderful maternal figure and the classic earth mother. She cares about her own home, her extended family, her circle of friends and emotional links and also the environment. She may be the pivot around which environmental campaigns are functioning and she teaches all the inter connectivity of the Five elements and how to restore balance in the eco-system."},{"t":"p","x":"She is a also an excellent cook and her favourite fields of excellence are hospitality, nursing, healing, medicine, psychotherapy, counselling, training and education related disciplines."},{"t":"p","x":"She manifests our Yin or the feminine element of the complete human energy system. Her qualities of femininity, receptivity, calmness, emotional understanding, nurturing and empathy are called upon to be harnessed when her presence comes up in your reading."}],"id":"queen-of-cups","reversed":[{"t":"p","x":"Oversensitive, no control of emotions and feeling of being emotionally overwhelmed, lives each emotion to excess, Self sacrificing, dreamy and escapist;"}],"tone":"positive"},{"name":"King of Cups","num":14,"arcana":"minor","suit":"Cups","rank":"King","start":210,"end":214,"meta":{"Element":"Water","Planets":"Moon, Mars, Jupiter","Astrological Significance":"Cusp of Libra / Scorpio","Favourable Color":"Blue Red Yellow","Chakra Associated":"Sacral/Swadishthana Chakra"},"rating":"Very Positive card","body":[{"t":"p","x":"The King of Cups is the most powerful card in the cups suit and depicts maturity, generosity, wisdom, and emotional balance."},{"t":"p","x":"Imagery : An aged king sits with a melancholy expression on his throne with an amulet around his neck in the shape of a fish which represents his emotional depths and the spirit of creativity. Behind the king is a fish jumping out of the ocean representing emotional impulses and on the right is a ship sailing on high tide representing emotional management in the material world. This king epitomizes control over emotions to charted the changing tides of the material, practical world. As a situation the King of Cups is a direct reference to you having to face an emotionally challenging situation. There could be a heartbreak or an issue of inter-personal conflict. A situation will arise where you will need to exercise your emotional maturity. This will call upon you to suppress your innate emotional impulse, analyse the situation objectively and take a calm and balanced decision. The king of cups is a very influential figure in the Tarot court as also the real life when his energies are called upon."},{"t":"p","x":"Self control over own emotional space is the biggest lesson that this card brings upon us. The human mind is frail and whimsical and falls continuous prey to the vagaries of the emotions that surge within. You must learn to be\"mindful” of own emotions. Begin by developing a greater self-awareness and a deeper knowledge of yourself."},{"t":"p","x":"When faced with a challenge that elicits a spontaneous reaction from you, pause and try to maneuver it to a moderate level. Avoid any extreme reaction. Respond to an emotional situation; do not react to it. So any sudden demonstration of anger or sadness or happiness must be moderated and then expressed. This makes you powerful and effective in dealing life situations. You are still sensitive but you use your mind to filter the excesses of the emotion."},{"t":"p","x":"Remember, says this card, excess of any emotion is toxic and will lead to emotional problems subsequently so learn to master your own emotions first. Try to understand the situation, the person before you in a state of awareness and then calibrate your emotional response to best flow with the situation at hand."},{"t":"p","x":"Tempering the intensity of your emotions will give you an astounding command over the challenges in your life, even the unexpected ones. So do not fly off the handle at an unpleasant scenario nor go happily overboard when events are in your favour. Maintain your emotional equilibrium and you will be more hi-functioning and successful in the material world. You may need to act in an advisory capacity and without being emotionally biased, act friendly and helpful. Having self awareness will help you to judge the problem objectively form various angles, without getting emotionally dragged into it. The counsel you can impart then, is fair and supportive."},{"t":"p","x":"Cups is also connected with spirituality and religion so the King of Cups may represent a situation where you go in for such studies or make advanced research into these subjects. You may even be offered a role of a religious or spiritual adviser or you may someone highly influential from these disciplines. You may also be asked to head a negotiation or arbitration problem. This could be in the outside world or even at the domestic level. You need to exercise your attributes of tact, diplomacy and being objective in such a demanding environment. Remain mature while dealing with negative energy. Shield yourself not to get affected by energy suckers and focus on the constructive role you need to play in the emotionally volatile situation."},{"t":"p","x":"As a person, the King of Cups is an emotionally mature person. He has one through multitude of sufferings in his own life, done his inner transformation work and emerged a richer, stronger person in terms of being able to manage his emotional impulses. Nothing takes hi by surprise and he links the emotionally needy humans as just another element of the cosmic cycle undergoing their karmic circus. He may decide to document his understanding of human emotional experiences and may be an effective management guru or a writer of life-issues or a mentor or a spiritual influencer. He will come across as an empathetic and wide person but noticeably he will also have an enigmatic air to him that may make him unapproachable. He shields himself from energy vibes and that gives him his strength of being able to analyse emotions in a dispassionate manner and offering constructive solutions to the world."},{"t":"p","x":"He is generally a successful person in his field with a strong love for Reading on intellectual and psychological issues and engaging in creative pursuits like art, music, theatre, writing or photography. He is insanely attracted to emotional issues but operates on a higher level of understanding of the emotional world and that imparts him his royal status."}],"id":"king-of-cups","reversed":[{"t":"p","x":"Shows immaturity, inexperience and insincerity."},{"t":"p","x":"Shallow & has not understood the depth of life, Untrustworthy & fickle minded"}],"tone":"positive"},{"name":"Ace of Swords","num":1,"arcana":"minor","suit":"Swords","rank":"Ace","start":214,"end":216,"meta":{"Element":"Air","Planets":"Mercury, Venus, Saturn","Astrological Significance":"Root Of Powers Of Air (All Air Signs Combined)- Gemini, Libra, Aquarius","Favourable Color":"White Blue Yellow","Chakra Associated":"Heart/Anahata Chakra"},"rating":"Very Positive card","body":[{"t":"p","x":"Ace of swords is a card of triumph. To an extreme degree the Triumph has come from a show of force. The Force can be a physical force, the force of willpower or force of position or circumstances. The crown with vines at the top shows unmitigated ambition and the intellectual acumen needed to hit the bull’s eye."},{"t":"p","x":"Imagery : An upright sword, held aloft by a strong hand. Its piercing through a crown laden with vines and foliage. When this card appears you have recently won a high position through your own efforts and calibre and you will be feeling both the Euphoria and the power of your conquest. This card can also show the birth of a child or an idea or a new endeavour. What is important to note when this card appears in the reading is that you have been invested with tremendous power from the universe to make a difference in any area that you choose to make it in. It is up to your individual discretion whether you want to love with passion or hate with intensity but extreme feelings will soar inside you. This intensity will also influence very noticeably other persons surrounding you. You are riding high on the crest of the power wave, The upright sword which is a part of the imagery of this card is sharp, unidirectional and very focused. Your intellect is razor sharp at the moment. There is a subject or an issue that you have been thinking about, almost obsessing over it and it has a powerful effect on you."},{"t":"p","x":"This is also a Karmic card because the changes that will come after executing this decisiveness will influence your destiny for times to come. When the Ace of swords appears in a reading it also time to take a tough decision about something. Your attitude must transform to being objective and dispassionate. There is no room for emotional weakness or emotional considerations when this card comes up. Surrounded by emotional cards could have an adverse meaning. It could show that you are being too ruthless about an issue and need to tone down your sharpness and your decision is going to affect other persons so a hint of consideration for others should be amalgamated."},{"t":"p","x":"If the situation is regarding falling in love or assessing a new attachment, this card is very prophetic because it indicates karmic connection and that you will be connected with each other across lifetime.You may not be in permanent relationship but will leave a mental impression so sharp that you will either influence their ideas for a lifetime or even meet at opportune times across the years. The Ace of swords carries tremendous latent power and it is up to the human intelligence to use it for the benefit of others and not to create any danger or losses for others. your thought process should be clear but constructive."}],"id":"ace-of-swords","reversed":[{"t":"p","x":"Evading the truth, acting out of emotion rather than harsh reality, mental ambiguity, missing the target due to lack of clarity, circumventing the truth and making up pretence talk"}],"tone":"positive"},{"name":"Two of Swords","num":2,"arcana":"minor","suit":"Swords","rank":"Two","start":216,"end":219,"meta":{"Element":"Air","Planets":"Mercury, Venus, Saturn","Astrological Significance":"Moon in Libra","Favourable Color":"Yellow Gray Blue","Chakra Associated":"Heart/Anahata Chakra"},"rating":"Medium Positive card","body":[{"t":"p","x":"The Two of swords epitomizes the image of tranquility and balance.It is however not really balance between two forces, rather it is a situation of stalemate where non decisiveness has frozen the moment in time."},{"t":"p","x":"Imagery : A blindfold woman is sitting on a bench and holding two swords in criss- cross fashion across his eyes. The vast water body at the back indicates the emotional attachments the person is still susceptible to. The swords are in perfect balance indicating the woman's dexterity in maintaining the position. This indicates a contest between two opposing forces where the battle lines are drawn but they are more ideological rather than physical. A difficult decision needs to be made and one of the swords will finally exert itself. When this card comes up, the decision maker is unable to reach a clear decision. He is delaying the inevitability of the decision and holding the cards close to his chest regarding the final outcome of the decision."},{"t":"p","x":"Emotional attachments and weakness may have a lot to do with this decision. The blindfolded woman is reluctant to analyse the facts of the choice in the light of reality. She is living in her own cocoon and is under the illusion that the harsh day of making a judgement will never arrive. She has the mental skills and austerity to be able to hold the contrasting ideologies in perfect balance for a considerable length of time."},{"t":"p","x":"She feels regret at letting one option go and may feel that if a decision is taken it may emotionally hurt one of the parties. She wants to be so fair that she is not taking a stand at all. This sitting on the fence position is really stagnating the situation. This card calls for standing strong for what you believe in and your ability to navigate difficult waters. The implied message is to open your eyes and not avoid the situation."},{"t":"p","x":"The person maintaining this state of non-decision is exerting a lot of energy in doing so. You are fearful of altering the balance not realizing that the so called balance is not natural and since the energies are in conflict with each other they can never blend or be in union."},{"t":"p","x":"Two of swords can also indicate excess worries in the mind. Since this person lacks objectivity of looking at facts in cold light, he might be prone to apprehensions and may be making up choice situations of What if Option A or what is Option B in the recesses of his mind."},{"t":"p","x":"If you are caught in the middle of a dispute, an unpleasant legal case or a corporate battle or a domestic conflict, this card indicates a ceasefire situation in which the parties may regroup to ponder on future possibilities."},{"t":"p","x":"This card appears when the person is going through a very difficult situation of decision making. His loyalty is a divided and he is carefully analysing the pros and cons of both the situations. This is that moment when the person sits in introspection, in Silence He is closed to external influences at the moment it is an internal moment of peace making him dive into the depths of emotional wealth and also the ocean of reason and trying to decide which option is going to serve him best for the coming time."},{"t":"p","x":"You face these mental conflicts in your daily life when you are compelled to make a choice between A and B. Both are dear to you as you have invested materially or emotionally in both of them."},{"t":"p","x":"The moment of decision has arrived when this card comes in the reading. It asks you to be responsible and accountable for your choice and to make a decision as that will enable the progress of the matter. On your decision several other destinities might rest and its time you acted with maturity and courage and being clarity to an ambiguous situation."}],"id":"two-of-swords","reversed":[{"t":"p","x":"Making a decision using emotion rather than logic, misplaced emotions, wrongly placed trust, going against own ethic of right vs wrong, taking sides and not being balanced in judgement"}],"tone":"mixed"},{"name":"Three of Swords","num":3,"arcana":"minor","suit":"Swords","rank":"Three","start":219,"end":222,"meta":{"Element":"Air","Planets":"Mercury, Venus, Saturn","Astrological Significance":"Saturn in Libra","Favourable Color":"Gray Red","Chakra Associated":"Heart/Anahata Chakra"},"rating":"Dark Card","body":[{"t":"p","x":"The three of swords is the card reflecting agony, inner turmoils and necessary painful choices. Its a card of emotional transformation that is churned by personal suffering and eventual realizations. The essence of 3 of swords is not heartbreak as such, but how we deal with it. Swords are about thought and intellect, not emotions. Perhaps you are meant to help others see their sorrows in a new light and truly understand what is causing the pain. That way they can let go of the pain and start healing."},{"t":"p","x":"Imagery : Three sharp swords are piercing the Heart. The penetration is very acute as the ends of the swords are visible on the reverse of the hearts. Gray clouds surround the bleeding heart and a general air of mourning surrounds this image."},{"t":"p","x":"The nature of the swords suit is very rampant here. It suggests worries and adversity that have hit you to the core of your emotional space."},{"t":"p","x":"When this card comes up in a reading, the situation will definitely bring painful losses and realisation. Your emotional illusions may be stabbed brutally as you are left shocked and almost lose your balance with the unexpected pain that might impact you."},{"t":"p","x":"There may be a form of treachery that is involved here. The three of swords indicates the eternal triangle where due to direct or concealed incursion of a their party, the balance of the binary union is lost. There are unethical practices and its a time of secrets coming to light, shocking revelations and sneaky behaviors."},{"t":"p","x":"The positive aspect of this card is that when the binary relationship is not strong then the cracks are becoming wider by the entry of the third party. The crack that was always there but which perhaps the two parties were overlooking or just turning a blind eye to. The fundamentals of the relationship were already fractured."},{"t":"p","x":"The 3 of cups will make the chasm more glaring. There will be pain and surprises but also an air of inevitability as the truth pours out of weak loyalties that swayed so easily. Sometimes this card refers to medical procedures like a heart surgery or an invasive surgery of another organ that may cause anxiety and fear."},{"t":"p","x":"When this card comes up there is also an excess of emotions displayed. There may be an outbreak of tears or hysteria. There may be a verbally colorful and violent spray of words as an emotional outburst. Emotions will be volatile and unstable. This card also indicates separations. A long lasting marriage may come to an end leaving you emotionally disoriented and in trauma. There might be an actual death of a close one, leaving you with a sense of acute loneliness.Even if you are still in a relationship you may be subject to emotional neglect and demeaning. No one is willing is listen to your side of the story and you feel an emptiness deep inside your heart. All such cases of deep sadness are coming up for counselling and healing when the three of swords makes an appearance. Its a powerful and potent card and must be given due importance in the spread. It may lead you to root of a existing problem that may lie in the past and encourage you to gently unravel the painful history of a problem."},{"t":"p","x":"Psychological excavations become important with this card coming up. You may be unable to open up and share past pains and this repression could be creating fresh psych\u0002somatic disorders inside you. This card when already experienced, creates fear inside a person regarding trust and letting go emotionally. This may be a challenge when forming new relationships, whether for work or personal satisfaction."},{"t":"p","x":"It will call for emotional readjustments to bring the emotional quotient to a balanced state. The advice is to accept the pain when it comes. Embracing the pain and riding it in all its severe glory will give you deep strength and the self belief that if you could cross this turbulent time, you are a strong, divinely guided person."}],"id":"three-of-swords","reversed":[{"t":"p","x":"A recent loss or a heartbreak and you are still not fully recovered, slow progress, time to let go of the past and embrace joy of the future, positive card for health situation, being surrounded by a strong support group, internal growth due to pain suffered"}],"tone":"challenging"},{"name":"Four of Swords","num":4,"arcana":"minor","suit":"Swords","rank":"Four","start":222,"end":225,"meta":{"Element":"Air","Planets":"Mercury, Venus, Saturn","Astrological Significance":"Jupiter in Libra","Favourable Color":"Gray Yellow","Chakra Associated":"Heart/Anahata Chakra"},"rating":"Positive card","body":[{"t":"p","x":"Four of swords is a message of rest and rejuvenation. It points to a time when the physical or mental fatigue is acute and one needs time out for solace and regeneration. Its a temporary phase for gearing up for future challenges."},{"t":"p","x":"Imagery : The figure on the Four of Swords is resting in peace on his tomb or an austere bed. His hands are in prayer, and his face is relaxed and tranquil. The Stained glass windows explicitly show this to be the Church, where the weary from the world affairs may rest in peace, either eternally or when alive for a while to restore their composure. Its a very peaceful image."},{"t":"p","x":"Three swords hang on the wall, and one lies under the figure, showing that it--or, what it represents--is more important or personal than the others. Like all fours, the Four of Swords represents foundation. The soldier even while at rest is alert, as the sword at his bedside shows. Rest but be alert. The number Four in Tarot represents stabilityand the beginning of structure in the development from the Ace. Even amidst difficult circumstances, you have now achieved a small cocoon where you can pause and regather your energies. Your conflicting ideas, your aggression, your alpha energy are held in check and in balance for a brief moment. Its a time of no-action and simply to be motionless."},{"
