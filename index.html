t":"p","x":"When this card comes in the reading, its a deliberate message to leave the battlefield of life and retire to a corner while you cater to your own physical and emotional needs. You might have reached the end of your resources for now and your body, mind and nerves are asking for respite and nourishment."},{"t":"p","x":"The image in the card is of the Church where no swords were allowed and the warriors upon entering had to blunt the edge of the sword before entering."},{"t":"p","x":"The illustration here on the card is very telling of this traditional practice. Swords indicate our Intellect, our mental activities such as thoughts, analysis, worries, plannings. It also rules strife and discord and problems. For the time being, all of these are at rest and in a suspension mode."},{"t":"p","x":"Instead of being charged up or active, you need tobe passive and at rest at the moment. If you have been engaged in a frenetic physical or mental activity of late, you need to pace down and let your natural impulses take over. The body cycles need to come back to equilibrium and a state of naturalness. This card often come up when a person is undergoing a burnout. You might have been engaged in exhausting mental work or negotiations or a personally stressful situation. Your mental abilities seem to have become blunted and even deciding on common mundane issues has become burdensome. This burning out requires immediate reprieve in the form of rest. Become emotionally and mentally isolated and keep the communication to a minimum. All communication requires energy which you really are not in a position to spare for the moment. So accept this and go into voluntary sabbatical for a while."},{"t":"p","x":"If a situation has been calling to you to make a difficult decision which might lead to ego flare ups, then too this card can be helpful. Step back from the minefield. Pause and reflect and contemplate. Pick your arguments and the approach that will be most effective and then take action after a while. You could become interested in meditation and enrol for a course in structured meditation practice or if more actively inspired to join a new fitness or yoga program. These are all earthing activities that bring into union the mind and body along with the 5 elements (Pancha-Mahabhoot) in your energy field."}],"id":"four-of-swords","reversed":[{"t":"p","x":"Aggressive attitude, highly competitive, argumentative, not willing to give up or concede defeat, workaholic, relentless search for truth at the cost of personal safety, fond of physical sports and valour games, need to retreat and perhaps meditate and reflect"}],"tone":"positive"},{"name":"Five of Swords","num":5,"arcana":"minor","suit":"Swords","rank":"Five","start":225,"end":228,"meta":{"Element":"Air","Planets":"Mercury, Venus, Saturn","Astrological Significance":"Venus in Aquarius","Favourable Color":"Blue Gray Red","Chakra Associated":"Heart/Anahata Chakra"},"rating":"Challenging card","body":[{"t":"p","x":"This is a reality check card of the tarot and actually epitomizes that life is gray. Victory and defeat both form the circle of life and one must accept with grace both the sides of the coin. Imagery : A victorious man with a smirk on his face, a defeated man walking away, figures in the distance mourning, a battlefield near a lake."},{"t":"p","x":"As a predictive card, from the loser’s point of view it denotes loss and misfortune. It foretells defeat of your plan or an unhappy situation. The defeat may not be absolute but will be more than what you had expected. If you had expected a victory, its a clear negation of your expectations. Surrounding cards may mitigate the loss but when this card comes up, you should be very careful of a pitfall or a major setback. Its a warning card in true sense of the term. Additional connotations could be possible hidden dangers, discouragement and defeat, tragic circumstances, mourning, destruction and dishonour."},{"t":"p","x":"This is not an easy card to decipher and its interpretation will depend whether the one asking the question is the winner or the loser. Even if the querist is putting his narrative as the loser, it would be pertinent to examine by the tarot reader if he ever has played the role of the deceitful winner in the past and what he is experiencing now may be merely a payback by the Universe."},{"t":"p","x":"In most interpretations you or the querist are at the receiving end by underhand means employed by your opponent."},{"t":"p","x":"This setback is unexpected because you trusted the ethics of your opponent, in some cases he may be a close friend, colleague or life partner."},{"t":"p","x":"The victory has come about by unethical and deceptive means. Victory means the world to the person who has gained an upper hand here and is rather smug and arrogant at the petty victory he has earned by using mental games and manipulative means."},{"t":"p","x":"He has won the game by disarming the opponent. When the opponent’s defences were down, he was caught by surprise and thus had to lay down his weapons. Its not a fair victory and the lesson inherent in this card is that deceitful people may be all around you. If you are in a relationship or a competitive situation where you feel you were pushed into a disadvantage and then defeated then do not be disheartened."},{"t":"p","x":"Its the way smart people function in this manipulative world and one must learn the ways of the world fast. Its a card of great learning and inner transformations."},{"t":"p","x":"The sneaky means were employed because the opponent feared you are smarter or more capable and given a fair chance would have definitely won. Its actually a medal of your calibre that the opponent had to use mental trickery to make you weaker. Take confidence from this fact, re group yourself, strategise and then strike back to even the game. You may even decide to leave this battlefield especially if this card pops up in a relationship or a friendship."},{"t":"p","x":"If an emotional partner subjects you to emotional abuse or to put you down in an embarrassing position, you must seriously consider whether you want to put in your efforts into this emotionally abusive setup. This person is clearly a bully and derives his one upmanship by demeaning the other. This would be an inherent trait in him, not likely to change easily. Decide if you want to stay and counter this passive\u0002aggression or simply choose to walk away and forge a new and fruitful relationship with someone who is comfortable with your excellence."},{"t":"p","x":"The five of swords is a card full of deep wisdom. It persuades us to reconcile ourselves with the disagreeable events that have taken place and to move on from there. The incidents that are analyzed during the 5 of swords may act as a catalyst to help you make healthier choices about where you want to mentally invest in the future."}],"id":"five-of-swords","reversed":[{"t":"p","x":"Power struggles, false ego, false sense of intellectual or physical superiority, creating conflict in work due to non harmonious behaviour, loss of love due to petty ego games with partner, cheating in marriage or business collaboration"}],"tone":"challenging"},{"name":"Six of Swords","num":6,"arcana":"minor","suit":"Swords","rank":"Six","start":228,"end":231,"meta":{"Element":"Air","Planets":"Mercury, Venus, Saturn","Astrological Significance":"Mercury in Aquarius","Favourable Color":"Blue Gray Yellow","Chakra Associated":"Heart/Anahata Chakra"},"rating":"Positive card","body":[{"t":"p","x":"After the upheaval of the five of swords, this card indicates the need to move away from mental stress. Its card of movement towards peace and tranquility and a time of mental restoration. Its a card of planting positive thoughts in our mind. What we plant in our subconscious mind and nourish with waters of emotion, will one day become a reality."},{"t":"p","x":"Imagery : The man is rowing a boat towards a distant island full of succour. The movement is from turbulent waters towards calmer ones. The swords are down-turned and he has fellow passengers who may be his supporters or his dependents. This card indicates movement away from an unpleasant experience into calmer waters. It may not be deliberate at that time since the emotional severity is still battering you and you are moving away from the stress as a reflex reaction. However sometimes a movement away is important to preserve your sanity and at times your safety. You may be physically moving away from a destructive episode, such as an abusive relationship or friends who enable abusive behaviour. As per the image, the water to the right of the boat looks choppy but to the left it is placid. The oarsman might be you/querist or it could even be a saviour who appears as an angel to fish you out of a crisis and take you to calmer shores. Six of swords can mean a physical movement involving change of locations. It can in modern times indicate a relocation of the place of work or even a relocation to another country if the progress opportunities are better there."},{"t":"p","x":"At times, the retreat may be psychological and not involve a physical movement. You may be retreating into an inner space to gain an objective perspective over a troublesome situation. The wide expanse of waters indicate your subconscious and at times when the troubles are within the mind and can only be dealt by self analysis, this is an excellent card of guidance."},{"t":"p","x":"This movement may not be voluntary as is evident from the figures huddles inside the cloak and sailing away in the relative anonymity of darkness. However in the longer run it will bring peace to the ones who were courageous enough to move to calmer environment. Change is always difficult but the feeling of relief that will overcome you once the waters have been traversed will be infinite."},{"t":"p","x":"6 of swords can also also point you out in the direction of taking a holiday.You might be deluding yourself that you cannot break away from the exhausting work surrounding you. This card strongly advises you to take a break where you are completely disconnected from your routine demanding life."},{"t":"p","x":"It will give you better perspective over your existing gifts in life as well as help to orient your future plans in a more balanced manner. Sometimes in the frenzy of mental work we may forget to keep balance in various aspects of our life. In our mad race, the emotional and health aspects may get neglected. This card will sound like a beagel to tell you that the imbalance so being created may lead to great problem in the future so it is best now to break away from the tedium and restore the fabric of your life."},{"t":"p","x":"Mental peace is the greatest treasure in the world, you will realize. Only when the Mind is free to think and analyse, can real happiness be born and in fact recreated."}],"id":"six-of-swords","reversed":[{"t":"p","x":"Making of new discoveries and decisions, being careful about what you speak as well as how you speak, taking strong back ups of information and documents, confronting some necessary issues so that relationship can move forward, staying in the field and fighting your battles, feeling alone"}],"tone":"positive"},{"name":"Seven of Swords","num":7,"arcana":"minor","suit":"Swords","rank":"Seven","start":231,"end":234,"meta":{"Element":"Air","Planets":"Mercury, Venus, Saturn","Astrological Significance":"Moon in Gemini","Favourable Color":"Yellow Red","Chakra Associated":"Heart/Anahata Chakra"},"rating":"Dark card with a smart lining","body":[{"t":"p","x":"The seven of swords is a dangerous card as it warns you of the deceptiveness around. It advises you to be cautious and avoid temptation, rash decision and over-trusting. Imagery : A sneaky looking person is stealthily running away from the circus tent where apparently he works with 5 of the 7 swords tightly clasped to his chest. He looks back over his left shoulder to check is anyone has spotted him in the act of the theft."},{"t":"p","x":"This is literally the card of theft and espionage. If the question is regarding duplicity or deception in any form, this card is a strong Yes. The degree of deception shall be decided by the surrounding cards. If they aggravate the act then there is physical theft or loss of intellectual property (mostly occurs as the swords rules over the mental faculty)."},{"t":"p","x":"If the supporting cards are relatively innocuous then the deception or the desire of deception may just be cooking in the mind and showing a manipulative mind at work."},{"t":"p","x":"Interestingly this card does not show duplicity but rather the act of evading the truth or telling the truth only partially. Seven of swords occurs when the person is dodging an emotional or verbal confrontation and is stealing time away. This could be due to lack of preparedness or just an aversion to being accountable during the confrontation/clarification exercise."},{"t":"p","x":"When this card appears in the reading, you should be cautious and really tread very carefully. There is a hint of subterfuge here and smart mind(s) may be playing tricks on you. Like the major arcana card of the Moon, the environment is murky and ambiguous and you must use your own intuition and heightened awareness to confide or not to confide. You might be dealing with a narcissistic person who only thinks of own ego gratification and self glory. He may take away from what is due to you and has been the result of your sustained hard work. Beware of work related discredits and non acknowledgement."},{"t":"p","x":"There are times when it is necessary to be evasive or partially omit the truth. Even though you may not believe personally in that ethic, however such an occasion has now arisen. You will have a situation where nothing will be gained by telling the entire truth; it would be better to give them an edited version of the truth.Sometimes you may decide to hold some cards close to your chest as telling the entire truth might bring dis-reputation or create more conflict or misunderstandings. In such instances where omission will help to salvage a situation or prevent it from worsening, the seven of swords approach may be adopted but remember that Truth does find its own way out and will do so sooner or later so handle the situation with maturity. Evading the truth is also sometimes a manner of self defence. If you know that is the reason try to form a cordial bond with the person concerned so he may become more comfortable with you and gradually open up about the other facts too."},{"t":"p","x":"In legal cases, this card can work against you as high level of dishonesty may be at play against you. The opponent could use dark methods to transfer the blame from oneself to you. All forms of theft are indicated by this card. Take extra care of your belongings. Be almost obsessively careful about the security of your documentation."},{"t":"p","x":"As a person the seven of swords is a genius person who is very high on ideas and may be a research or scientific genius. Its shows cleverness and the mental dexterity to over-smart the other party and to come out unscathed of a troublesome situation. He is a person who like a double edged sword will get to the root of the matter and makes an excellent detective, Intelligent agent and surgeon."}],"id":"seven-of-swords","reversed":[{"t":"p","x":"Choosing ethics over deception, choosing to do what feels right to your Conscience, Ready to face punishment or repercussions of a folly previously committed, apology and regret, turning over a new leaf, restoring the rights of someone you may have cheated, turning to moralistic way of living"}],"tone":"challenging"},{"name":"Eight of Swords","num":8,"arcana":"minor","suit":"Swords","rank":"Eight","start":234,"end":237,"meta":{"Element":"Air","Planets":"Mercury, Venus, Saturn","Astrological Significance":"Jupiter in Gemini","Favourable Color":"Gray Blue Red","Chakra Associated":"Heart/Anahata Chakra"},"rating":"Dark card that can Empower","body":[{"t":"p","x":"Eight of swords is about freedom from ideological imprisonments and the feeling of being trapped and unable to move in a constructive direction. Swords represent thoughts and one becomes a victim of thoughts-of others and more cripplingly of self limitation."},{"t":"p","x":"Imagery : The woman is standing helpless, blindfold on eyes, hands tied behind her. Her robe is red and 8 swords are piecing the ground on either side, as if cordoning her off. Eight of swords is a card of emotional turmoil. when the excesses of the material world have become very difficult to comprehend and the soul is screaming for some solitude and emptiness, this card becomes significant."},{"t":"p","x":"The external demands; the external sounds ; external noises has started barraging your brain to an extent that you cannot think Straight."},{"t":"p","x":"this is the time when the person needs active support and a helping hand to come out of the inner hell. This is the point when many suffering from the eight of swords syndrome for a prolonged period fall prey to depression or decide to end their life through suicide."},{"t":"p","x":"This is a very strongly negative card in the tarot and must be taken seriously. If needed, expert medical care must be provided to the person whose spread is being analyzed. Self survival is the most Primal Instinct of all human beings. The need to be alone in order to sort out the feelings and thoughts is strong when this card is impacting."},{"t":"p","x":"There are voices in the head that are weakening you. They could be the voices of years or even generations of mental conditioning which highlight your perceived weaknesses and why you should not be breaking away and making your own path. They lead to self defeating attitudes and behaviors and all this suppression creates tragic conditions, at times. Most of these sounds are only clamouring for your attention. They have no real meaning or relevance for your future life. This card can also be self defensive. In that case it should be only till the time the shock is over and you have rediscovered your latent courage. At times you may have been hurt so badly in the past that you may choose to cut yourself off emotionally so that there is no risk of history repeating itself. However this will make you many new joys that life may have lined up for you. Always remember if someone did not turn out as you expected, a greater good is meant for you. Its only a matter for divine timing to deliver it to you."},{"t":"p","x":"The eight swords surrounding you are nothing but attention demanding voices who are sucking on your mental energies. You are encouraged to take off the blindfold and look in front of you. The water in front is your gentle intuition and the paved road is the supporting path that will take you to your future. Pick up one of the swords and cut through the inhibitions of stereotypes and societal norms that hold you back from exercising your individuality."},{"t":"p","x":"You are stuck in a trap of your own making. When you stop heeding the voices, they will dwindle and go away. What we give energy to; simply grows. The moment your energy shifts to your own improvement, all the defeating factors will start losing their strength."},{"t":"p","x":"You will find you were blocking your own path once you start assessing your own strengths in bright light. This is the card of Self Empowerment and finding your true identity."}],"id":"eight-of-swords","reversed":[{"t":"p","x":"Voicing your opinion freely, release of unwanted fears and anxiety, being in a space of mental clarity and enthusiasm, finding a solution to a problem, high sense of self belief and the energy to carry plans forward, courage and personal power"}],"tone":"challenging"},{"name":"Nine of Swords","num":9,"arcana":"minor","suit":"Swords","rank":"Nine","start":237,"end":239,"meta":{"Element":"Air","Planets":"Mercury, Venus, Saturn","Astrological Significance":"Mars in Gemini","Favourable Color":"Black Blue","Chakra Associated":"Heart/Anahata Chakra"},"rating":"Dark card","body":[{"t":"p","x":"Nine of Swords is one of the darkest cards of the Tarot deck and signifies a phase of deep worry and anxiety. This mental darkness is symbolised by nine swords hanging above the figure’s head indicating the deep state of mental distress. Imagery : A man sits up in bed in darkness of night. The bed and quilt are ornate. He has his face covered with his hands and is fraught with tension."},{"t":"p","x":"Interestingly, The swords are equal in length pointing to the fact of an obsessive thought is repeating itself in the mind space and leading the person to keep awake even at nights. Some people call this the\" Nightmare Card” as it may indicate those worries or thoughts that do not allow us to have any rest and keep thrashing around in the head."},{"t":"p","x":"It can also indicate having excessive thoughts about a person or an event and going over in the mind about possible eventualities. When this card comes up, beware of extreme negative thinking. This could be generated by real events / situations, and at times by obsessing over a thought or a possibility to an excessive degree. The imagination has to be separated gently from the real problem and then the future course of action sought."},{"t":"p","x":"Nine of swords is a card for loud noises and arguments and voices in the head. This card also describes the abject grief and desolation that follows a bereavement or a major irrevocable loss of some kind. A cherished relationship might have ended, a loved one may have died, a bankruptcy may be about to occur, a serious illness could have been diagnosed."},{"t":"p","x":"Nine of swords can also at times be a result of an exaggerated imagination. You might believe that the worst will happen and you will be left without an anchor. Your imagination may be churning in over drive creating terrifying scenarios that have little or no roots in reality. Also indicates loneliness and a feeling of helplessness. The surrounding cards are important when coupled with nine of swords, as their elemental nature could direct to the cause of the worry. Coupled with Major Arcanas like the Tower or the Moon, could show mental disorders. As feelings, nine of swords also signifies guilt, fears and shame. This person needs support, wise counselling and analysing the cause of the stress. Shows person who is stagnating in own loop of negative thoughts and feeling of low self worth, under\u0002confidence and inability to handle life situations. When this card comes, we must learn the lesson that life will be suffused with struggles and opposing forces. With extreme patience and balance of composure, one must look at brighter lining in our life, seek professional or trusted counselling, and work diligently towards shedding the darkness surrounding us."}],"id":"nine-of-swords","reversed":[{"t":"p","x":"Very pessimistic thoughts, self destructive behaviour, need for professional therapy, mental disorders, health deterioration, phobias and fears, hallucinations, suicidal tendancies, time for spiritual solace"}],"tone":"challenging"},{"name":"Ten of Swords","num":10,"arcana":"minor","suit":"Swords","rank":"Ten","start":239,"end":242,"meta":{"Element":"Air","Planets":"Mercury, Venus, Saturn","Astrological Significance":"Sun in Gemini","Favourable Color":"Black Brown Red","Chakra Associated":"Heart/Anahata Chakra"},"rating":"Dark Card","body":[{"t":"p","x":"The Ten of swords is a prophetic card and portends sorrow, despair and deep trouble about to come soon. It signifies an end or a closure. With almost nil chance of recovery. Definite End of a cycle."},{"t":"p","x":"Imagery :A warrior like figure lies face down on the ground. Ten swords pierce his back. There is darkness in the background. This is a horrifying card visually. Here the image itself speaks a thousand words as the brave warrior lies absolutely still and prostate on the hard earth and ten swords protrude from his back. The wounds have been inflicted by someone else, as is evident by the positioning of the swords."},{"t":"p","x":"The failure will not be easily overcome. This is not a fortune to be avoided or changed, only to be endured.Its a card of tragic and darkly dramatic endings. The situations have left you completely vanquished and demoralized. As though you have been slain and the last drop of your blood has been drawn out. You are now nothing but a skeleton, a caricature of the living dead. If you ever had the feeling of walking like a zombie with no energy left within you, so difficult have been the circumstances, this card may well describe your condition."},{"t":"p","x":"Mostly this condition is due to acute betrayal where you feel you have been stabbed in the back, Sometimes fortune does not seem to be your companion even for a bit and you will meet failure after failure or rejection after rejection. This incremental loss leads to the stamina being depleted, the morale crumbling and you may have a nervous collapse. The 10 of swords is a card of endings; and it indicates that a particular chapter of a relationship is over. Its not always the end of the relationship but rather the dimension and form it had been currently in. Though this card is bleak, yet at times a sharp turning point is needed. This is that sharp point of re\u0002thinking, re-strategising and re-adjustments that you need to make with a sense of surrender and acceptance."},{"t":"p","x":"You have hit rock bottom, the nadir of the issue you are so in despair about. After hitting this point the wheel of life can only take you up towards better experiences."},{"t":"p","x":"The dark sky at the back of the sky heralds the dawn which is symbolic of a fresh morning always awaiting the darkest of dark night."},{"t":"p","x":"This blow in the back, metaphorically seems that the threat came from the other side and caught up with you without adequate preparation. However this is not always the case in the battle field of life. Very rarely do crisis come without a warning. There is always a warning gong but we may be too self absorbed to notice it."},{"t":"p","x":"When this card comes its also a time of self introspection and looking back at the flow of events that have brought you to this juncture. Have you been ignoring the warning signs that something is wrong in the hope that self corrective measures will themselves come into practice. Did you act out of fear of being alone and went along in a toxic relationship. Did you keep hoping for a windfall in the business and made indiscriminate investments."},{"t":"p","x":"You must remember every reaction you are facing has been created by action also perpetuated you at an earlier date. Look for the root cause of the crisis that now befalls you. It had to be a faulty thought or action on your part at some point in assessable past."},{"t":"p","x":"The ten of swords is a secretly hopeful card ; it reveals that the worst has befallen us already, there is an inherent relief that you have survived the final calamity related to the question and that you still have the power for new beginnings and radical changes in your life. The process may be arduous and slow but the sapling will surely become stronger with time, provided the lessons have been learned."}],"id":"ten-of-swords","reversed":[{"t":"p","x":"Positive message of hope and renewal after a distressing period, luck and opportunities smiling again, time of relaxation and enjoyment, a major project getting finished with great returns, recreation and leisure, need to let go of painful past experience"}],"tone":"challenging"},{"name":"Page of Swords","num":11,"arcana":"minor","suit":"Swords","rank":"Page","start":242,"end":244,"meta":{"Element":"Air","Planets":"Mercury, Venus, Saturn","Astrological Significance":"Personification of Air (Element Only)","Favourable Color":"Blue Gray","Chakra Associated":"Heart/Anahata Chakra"},"rating":"Gray and Volatile Card","body":[{"t":"p","x":"The Page of swords can describe a situation or personal attributes. It carries the seed of an intellectual thought or a person whose dynamic is life is based on thoughts, intellect and communication."},{"t":"p","x":"Imagery : The Image shows a young man who is cutting through some dark clouds and is standing in an action position of sword held aloft. The Page of Swords will bear some news or message for you. When this card comes, it will be a definite communication you will receive."},{"t":"p","x":"Swords in page form represent all forms of intellect and communication. Some news regarding your ideas or your mental acumen will soon reach you. You need to be alert to activities related to communication of all types, professional offers, self expression offers and any educational initiatives concerning you."},{"t":"p","x":"This card also denotes a legal battle, mostly a tussle where there may be a conflict of ideas. It could also be a contract or agreement that needs to be signed.If there are more swords in the spread, it would be wise to seek the counsel of an expert before committing to anything on paper. In any case, when the Page of Swords turns up, you must be meticulous in understanding the fine language of any document or legal paper."},{"t":"p","x":"As a person the page of swords is a fierce fighter with words. Carrying excellent repertoire of words in his armoury, he uses words to win arguments, cut through obstacles and meet all resistance to ideas with aplomb. He may also be a master of sarcasm and very direct talk. He is not a person you would want to get into a word tussle with."},{"t":"p","x":"He is energetic and bursting with ideas. Impulsiveness and being brash with communication style is also part of his temperament."},{"t":"p","x":"He loves to be in touch with persons he has interacted with at some stage in life. Communication is the key to keep his mind running and he may use the social media extensively to propagate his ideas and opinions. He also would like to be in touch with you via mails or calls even though distantly located, geographically. He believes that meeting of minds knows no boundaries and that thoughts are meant to be shared and developed upon."},{"t":"p","x":"The downside is that he can be brusque with his words as like any page, there is a quickness and immaturity in his demeanour. However his intentions are pure and he will leave a lasting impact on your life due to his sharp intelligence or command over ideas or language."}],"id":"page-of-swords","reversed":[{"t":"p","x":"Misunderstandings and wrongly expressed emotions, missed messages, nervous stuttering and stage fright, liar and deceptive person, impulsive speaking and hurtful words, gossiping to gain friends, mind is sharp and unpredictable, Master of words"}],"tone":"mixed"},{"name":"Knight of Swords","num":12,"arcana":"minor","suit":"Swords","rank":"Knight","start":244,"end":246,"meta":{"Element":"Air","Planets":"Mercury, Venus, Saturn","Astrological Significance":"Cusp of Taurus / Gemini","Favourable Color":"Blue Red Gray","Chakra Associated":"Heart/Anahata Chakra"},"rating":"Troublesome and Volatile Card","body":[{"t":"p","x":"The Knight of Swords is a man in a hurry. He rides a ferocious speeding horse, the sword cutting trough all obstacles in the path. He wears a full suit of armour and is unflinching his pursuit of goals."},{"t":"p","x":"As a situation something is about to happen very quickly when this knight appears. Much like the 8 of wands which shows speedy communication, this card indicates that plans will be put into action at a rather rapid pace and you will not have a moment’s chance to reconsider."},{"t":"p","x":"You will be surprised yourself at the frenzy all around you as you will have no chance to analyse what is happening around you. A situation will sweep you off your feet and it will most likely be linked to meeting someone influential or a strange melange of ideas with someone or having an experience that leaves you with pumped adrenaline."},{"t":"p","x":"Its also a card which will compel you into a direction where deep focus and fixity of purpose is required. This knight achieves targets single mindedly with little regard for permissions and protocol. Get prepared for a time of action, forceful decisions and asserting your individual opinions. It will also be a time when you make public speeches or project your talents and ideas to a larger audience with confidence and aplomb. You will get recognized for your originality. As a person this knight is akin to a warrior or a revolutionary soldier. This person is restless, impatient and has no time for dilemmas and delays. He rushes headlong into ventures without much judicious thought and may face setbacks and failures due to his hasty nature. Also can be a bully at times if the others are not thinking or acting at his ferocious pace. He may be mocking of the average or less than average performer."},{"t":"p","x":"He may be a student or practitioner of communication, advertising, Public relations, mass media, University lecturer, adventure sportsman among other interests."},{"t":"p","x":"You will feel strong when this person is siding with you but may become intimated when you have him as an opponent. With careful handling he is a definite asset. His high energy and obsessive target orientation should be constructively utilized for his strengths to be realized."}],"id":"knight-of-swords","reversed":[{"t":"p","x":"Patience is required as the situation will move more slowly than you wand. Hold your Horses!"},{"t":"p","x":"Feeling regret over spoken word or deed, engaging in worthless debates/arguments, internet trolls"}],"tone":"challenging"},{"name":"Queen of Swords","num":13,"arcana":"minor","suit":"Swords","rank":"Queen","start":246,"end":249,"meta":{"Element":"Air","Planets":"Mercury, Venus, Saturn","Astrological Significance":"Cusp of Virgo / Libra","Favourable Color":"Blue Red Gray","Chakra Associated":"Heart/Anahata Chakra"},"rating":"Intellectual Card","body":[{"t":"p","x":"The Queen of swords is an aristocratic and stern lady sitting on her plush throne. She has her back to the past and is looking into the future. Her place is among the clouds as she represents the air element; she has risen in intellect from the mundane. In one hand she holds a sword pointing to the sky and her left hand is extended as if offering something. The Queen of swords gives us the gift of judgement and discernment to manage our life better and also gives us the open mindedness to be receptive to ideas and knowledge from others. The butterflies on her throne symbolise transformation and the bird above her head speaks of her high ideals and superior intelligence level."},{"t":"p","x":"As a situation when the Queen of Swords makes an appearance in your spread, its time to let emotions be on the back burner and sharpen your analytical skills. An activity or responsibility of great weightage and scholarly aptitude is awaiting your expert touch. The situation may ask for an attitude of emotional detachment and where decisions have to be taken after much research and meticulous examination of facts. The Queen of swords indicates a time of loneliness and self-reliance. There will be a dearth of companionship and warm friendship in your life when this card comes up. You may have to keep yourself occupied with academic or mind oriented activities. Regular people may find you above their league and be intimidated by your clarity of thought and speech."},{"t":"p","x":"It could even indicate a need in your life for becoming less emotional and more rational. To use your intellectual capacity to reach your goals and expand your knowledge horizons. Emotional demands would only act as an unnecessary distraction. There are times in life when one needs to be focused on self."},{"t":"p","x":"You are on your way to greater heights but still have some goals to accomplish. You envision yourself as a provider of wisdom, strength, and knowledge to those around you, but you still have some inner work to complete first and the QOS urges you to continue."},{"t":"p","x":"You have already acquired many skills and talents that can help you assist others, but to truly flourish you will need to keep learning. Take a new course, experiment with a new passion, journal your ideas. The more you learn and expand, the better you will be able to expand others."},{"t":"p","x":"As a person this Queen can be enigmatic and self contained. She is often inscrutable who try to read the workings of her mind. She can be a fantasy figure in someone’s life who is desirable but unattainable. She is an aloof persona and avoids forming relationships in real life as that could make her vulnerable to emotional pain."},{"t":"p","x":"She is a woman with great fortitude and resilience, who can prune the unnecessary clutter and emotion in any situation and come to a decision that is fair and knowledgeable. She generally occupies a position of authority where many are affected by her mental skills."}],"id":"queen-of-swords","reversed":[{"t":"p","x":"Sharp tongue, love for gossip and grapevine. This person loves intrigue and hatching conspiracies."},{"t":"p","x":"Bears grudges and likes revenge. Broods on the past and is self-opinionated and small minded."}],"tone":"positive"},{"name":"King of Swords","num":14,"arcana":"minor","suit":"Swords","rank":"King","start":249,"end":252,"meta":{"Element":"Air","Planets":"Mercury, Venus, Saturn","Astrological Significance":"Cusp of Capricorn/Aquarius","Favourable Color":"Blue Purple Gray Red","Chakra Associated":"Heart/Anahata Chakra"},"rating":"Intellectual Card","body":[{"t":"p","x":"The King of Swords is a very powerful figure, materially as well as metaphorically. about to unfold. He is a mature, pragmatic and inscrutable person who would be the final deciding factor in a situation which requires solution. He wears a ring on his middle left finger symbolizing his judicious powers akin to planet Saturn. His blue tunic symbolizes knowledge and understanding and his purple cape proclaims his power and ambition to reach the top of his field. The clouds around indicate mental challenges The two birds flying above the clouds are representing Huggin and Munnin, a pair of celestial ravens who always accompany Odin, The king of Gods. Huggin represents the thought and Munin represents the memory. Thought and Memory compositely constitute the Human Mind and impart it its uniqueness and elevation among all living creatures. In the poetic Edda, Odin says: Hugin and Munin fly each day over the spacious earth. I fear for Hugin, that he come not back, yet more anxious am I for Munin."},{"t":"p","x":"The double edged sword symbolizes the ability of this king to analyse a situation from both sides, butterflies stand for transformation and the two crescent moons symbolise balance between male and female energies."},{"t":"p","x":"This king denotes success and ambition in the highest sense. You will reach the top position in your domain with your single minded dedication to work. When this card appears, there is a fixation for acquiring material assets as a means of security and using your extraordinary mathematical, scientific or technical skills to create an empire for yourself. Great fame and respectability follows and there will always be a group of dedicated persons reporting to you and making this empire function smoothly."},{"t":"p","x":"King of Swords in a situation calls for calmly analysing all the aspects of a problem. Emotional partiality and emotional desires should be kept aside and what is best for long term sustenance should be opted for. The intellect rules the world and any act that elevates the Mind should be pursued at all costs. Emotions merely detract from the goal and the entrappings of emotional relationships are best avoided. Friendships with like minded and pragmatic persons may be on the cards when this card arrives. Behind this alliance would also be strategic planning for a collaboration in the possible future. Success has to planned meticulously. It is no accident but a result of carefully calculated thoughts and actions, this card teaches."},{"t":"p","x":"As a person, this card highlights the attributes of this mega achiever. He is witty, articulate and a very smart person. Its difficult to defeat him in arguments as he has a tremendous command over facts and figures and a remarkable memory. He may be a great debater or a writer with multi disciplinary knowledge."},{"t":"p","x":"He needs continuous mental stimulation to keep him engaged and he finds it hard to spend time with people who are overly emotional or sensitive. The compatibility frequency is absolutely different."},{"t":"p","x":"This man is often argumentative. He will go to any lengths to win a verbal argument in the name of debate with the opponent. His words are sharp and penetrating. He bears no regard for the feelings of the other and his single focus is on winning the exchange. For this he can do great research to support his case. He makes excellent investigative journalist, detective, writer or a public speaker."},{"t":"p","x":"Due to the richness of his ideas and facts as also his holistic perspective, he is often valued as a consultant and a mentor. He could also be a lawyer, a chartered accountant, doctor or a psychiatrist. He will give you an honest and expert opinion although you may not want to listen to it since it makes for uncomfortable listening."},{"t":"p","x":"He loves to get into disagreements and demonstrate his intelligence at every opportunity."},{"t":"p","x":"The person carrying the qualities of this King will a good friend but a formidable enemy.If he supports you he is a fastidious companion as he is level headed and maintain an objective view of whatever is happening. If he decides to oppose you, be prepared for a persevering argument that he will try to win at all costs. This king teaches to keep a cool head in spite of all hostilities, have a sardonic sense of humour, speak the truth even if it bites and use your mental sharpness to cut out your unique path in this world."}],"id":"king-of-swords","reversed":[{"t":"p","x":"Confused thinking, prejudice and biases, manipulative energies who love combat and even unhealthy competition"}],"tone":"positive"},{"name":"Ace of Pentacles","num":1,"arcana":"minor","suit":"Pentacles","rank":"Ace","start":252,"end":255,"meta":{"Element":"Earth","Planets":"Venus, Mercury, Saturn","Astrological Significance":"Root Power of Earth (All Earth Signs Combined) - Taurus, Virgo, Capricorn","Favourable Color":"White Yellow Green","Chakra Associated":"Root/Muladhara Chakra"},"rating":"Very Positive Card","body":[{"t":"p","x":"Like all Aces, the Ace of Pentacles indicates potential. This ace in particular points to money and its uses. The Pentacle is a symbol of the earth element, and seen as a sign of wealth and all things material and earthy."},{"t":"p","x":"Imagery : The single mysterious hand of opportunity appears from the clouds, holding potential in the form of a gold coin with a pentacle engraved on it. The sky is blue with few clouds, indicating no immediate storms in your path. The ground below is fertile, and the archway beckons you to enter. The coin represents the element of earth, and physical, or tangible things."},{"t":"p","x":"The Ace of Pentacle refers to the healthy beginning of a material venture that will bring prosperity or a rise in status. The image shows a flowering garden full of flowers giving off an aura of fertility, growth and affluence."},{"t":"p","x":"The Ace of Pentacles reveals that you have a chance for something new, something pertaining to the physical side of your life. New opportunities are here. They bring with them a chance for you to get closer to your goals, particularly pertaining to your career and the comforts that life has to offer. Its a very exciting card full of potential simply because it brings with it an open ended opportunity to engage in any activity that you are seeking fructification in. Its as if the UNIVERSE is asking you to visualize how you want your abundance to be manifested."},{"t":"p","x":"The traditional meaning of this card is an engagement or marriage, since these were often accompanied by dowries or extravagant gifts. In the modern times, it still means long term bonds that will stand the test of time and remain stable. It could also indicate a union where both parties are hard working on being focused on their career, will work towards better earnings and rise in fortunes."},{"t":"p","x":"As a sign of collaboration, the Ace of pentacles promises a very fruitful business partnership. Th venture will proceed smoothly and flourish with time. Also note the surrounding cards when energies of other persons are connected to the spread. While a 3 of wands here promises expansion and profits, the Moon could give rise to deceit and distrust. So also connect the meaning of a card in context with the surrounding cards."},{"t":"p","x":"This Ace is also connected with not only the material but also the sensual side of our existence. It could be the beginning of an experience that gives any of our senses, satisfaction. Attending an opera concert, creating a painting or a pom, visit to a luxury spa, a yoga regimen or even a sensual love affair are all indicated when this card comes along in a reading."},{"t":"p","x":"What gives you sensual pleasure and satiates you through your sensory system is an individual preference and must be studied accordingly with reference to the person’s query. In all cases this card will satisfy your material and sensory needs. It is indicative of rise in life and enhancement in reputation. Buying a new home, starting a new business, redecorating your living premises are all realities when this card is appearing. With the Ace of pentacles, you may also receive a windfall gain or a financial gift. You might receive a promotion at work or a wonderful appreciatory feedback and reference if you are self employed. You may also come across an item of value or buy a a valuable that appreciates over time."},{"t":"p","x":"Prosperity is on its way and it will be long lasting as it is rooted in reality and sustained hard work."},{"t":"p","x":"Make sure that you are psychologically prepared for the opportunities that are appearing. Pentacles arrive as a gift of bounty and you must be energetically ready to receive when it arrives. Maintain a calm and receptive mindset and be flexible to make changes in the conservative methods. Inculcate your spiritual prosperity to enable you to harvest the material prosperity."}],"id":"ace-of-pentacles","reversed":[{"t":"p","x":"Financial blockages, Fear of investing or multiplying money, Lack of employment/ livelihood opportunities, Substance abuse and resultant bad health, Sedentary life style and lack of care of physical self, Eating processed foods rather than nourishing natural foods,Feeling high levels of anxiety and restlessness as grounding is lacking."}],"tone":"positive"},{"name":"Two of Pentacles","num":2,"arcana":"minor","suit":"Pentacles","rank":"Two","start":255,"end":258,"meta":{"Element":"Earth","Planets":"Venus, Mercury, Saturn","Astrological Significance":"Jupiter in Capricorn","Favourable Color":"Blue Red Brown","Chakra Associated":"Root/Muladhara Chakra"},"rating":"Positive card with caution","body":[{"t":"p","x":"This is card of taking ups and downs of life with grace and flexibility and finding the undercurrent of joy of living even as you juggle the challenges that come in the wake of daily living. Imagery : A young man is seen dancing holding 2 pentacles in his hands and the pentacle disks are attached by an elastic that is similar to the sign of infinity. He holds one coin higher than the other, suggesting the ascendancy of that part of his life over the other. The two ships behind him are riding over choppy waters suggesting clearly that the juggling efforts will be successful."},{"t":"p","x":"The image is very pertinent in this card. The infinity symbol shows that the person can handle all the issues that will come his way with grace and dexterity. He is in a state of wonderful balance which he manages to do with his quick witted mind and careful planning."},{"t":"p","x":"This card is about the multitude of small challenges, foreseen and unforeseen that pop up in your life everyday. They have to be handled and handled well. This card in the spread shows you will need to be on your feet attending to many different aspects of your material life, requiring your attention. You will do it with joy and without getting hassled. This is also a card of finding joy in the mundaneness of life. If you lead your life with a sense of constant wonderment, each moment can be enjoyed."},{"t":"p","x":"At times managing the various demands will be tough but you must try to take each moment as it comes and learn the fine art of multi-tasking."},{"t":"p","x":"Since pentacles is about all those things in our life that imbue it with a sense of security, the two of pentacles is essentially the point where we will need to strike a delicate balance between two of these aspects. There could be two relationships in your life that are demanding simultaneous attention. You would need to decide that with the limited resource of time available with you, which of these needs to gain precedence at the moment. This is a constant case of jugglery as your resources are limited and the demands of life are many."},{"t":"p","x":"Being pentacles, the most obvious dilemma you will face with this card is to decide how you want to allocate your finances in at least two different aspects of life. There could be two expenses coming up but your financial resources are constrained. How you budget your financial resources so that the most important needs are met is a result of this card’s thinking. If you have a large loan taken out, this card could appear a lot as you try to pay that off while cutting down on usual expenses. This will require constant adjustments from your end. The message here is that such juggling will be a part of your everyday life as long as you are alive."},{"t":"p","x":"There will always be a choice to be made, whatever age you are at. Sometimes the choice may be between health and work or leisure and work or work vs the home life, career vs family and so on. These are an intrinsic part of the material life while you live a fulfilling human life."},{"t":"p","x":"One must try to deal with these nitty gritties with a stoical mind and graceful persona. Do not allow such worries to hassle you and deal with them as flexibly as you can. The infinity sign is very positive as it talks also of karmic give and take. As long as you are managing with grace, the Almighty will keep the flows coming in."},{"t":"p","x":"The two of pentacles shows that the budgeting you are having to do at the moment will be temporary. If you manage it astutely, giving precedence to the demand which needs to be attended urgently, then your life will flow towards more abundance. This card tells you to make intelligent choices and rather than multi tasking irrationally and making life complicated, you should prioritise the most important aspects of your life. It also advises you to make yourself a priority and not just cater to others’s needs and requirements. If the choice is between your physical or mental health and the responsibilities you shoulder, its time to give yourself the attention you deserve."}],"id":"two-of-pentacles","reversed":[{"t":"p","x":"Inability to multi task right now, learning to prioritise and letting go of that which is not immediately rewarding, emotionally overwhelmed and unable to get work done, lack of choices in livelihood, unwilling to relocate or take transfer for work expansion, delays and glitches in business travel"}],"tone":"mixed"},{"name":"Three of Pentacles","num":3,"arcana":"minor","suit":"Pentacles","rank":"Three","start":258,"end":261,"meta":{"Element":"Earth","Planets":"Venus, Mercury, Saturn","Astrological Significance":"Mars in Capricorn","Favourable Color":"Gray Brown","Chakra Associated":"Root/Muladhara Chakra"},"rating":"Very Positive card","body":[{"t":"p","x":"When this card appears there are great advancements to be made. Its a hugely positive card for professional accomplishments. The lesson to be learned here is that the time for individual contribution needs to change for a broader perspective."},{"t":"p","x":"Imagery : The image shows a young apprentice standing on an elevated surface, working on the construction of a cathedral. Two men(apparently the priest and a patron) stand in front of him as he highlights his ideas on the plans which are laid out on a parchment paper. The two men are more experienced than him yet listen to him with rapt attention due to the value of the specific expertise he carries. He is valuable to the project in spite of his hierarchical stature. The three of pentacles is the initial manifestation of your creative venture, business, or a new earthy relationship. Its the time when you are not the owner of your creation or idea anymore. It is now spreading out to the outer world. It is on fast track to expansion and will require you to be more daring and open to meeting patrons and promoting your work. Three always signifies growth after the initial germination of ones and the executive ability of twos. Its a time where you should be aware of the strengths of your project and articulate it to the external agencies. It is time to develop and expand the initial idea."},{"t":"p","x":"Your relationship with with your co-workers and collaborators will reach a higher level of intuitive understanding. You will be in harmony with each other’s working styles and an element of mutual trust and appreciation will prevail. If your work is looking to find new markets or customers this card is the most positive of the pentacles suit. It denotes the quality of your work or talent impressing the right people and the opportunity to expand and exhibit may walk right up to your doorstep. This is also a time to upgrade your job or business if you feel challenged enough. There will be encouraging response from the market for your unique talents. Even if your experience is lacking somewhat, the unique perspective and originality you bring to your work will make you rise in your field. Your job may even arrive if you have been recommended by someone rather than because you applied for it. iF you are self employed, this is an auspicious opportunity for being offered an important contract that gives you sustained returns. Boosts for your career, hobby turned profession, reputation, income are all on the cards. You need to be mentally prepared to seize these chances at making your wheel of fortune turn in your favour. Be clear and explicit in what uniqueness you can bring to a project or a new relationship. In retrospect you will realize the important stepping stone this will become in your path to ascension."},{"t":"p","x":"Another connotation for the three of pentacles is the need for team-work. You will have to learn to collaborate with the skills and assets of those around you. The period will call for greater camaraderie and teamwork from your side. You will learn the value and unique usefulness of a fruitful team and the splendid results it can create."},{"t":"p","x":"Successful projects usually require different kinds of expertise, and at this moment, the Three of Pentacles means that all the skills required are coming together. Great success awaits you if you become a part of an energizing and productive team. You should learn to receive and offer help, consult others for their perspective, and enjoy this fast track period of pursuing your ambition as it promises success and popularity and meaningful relationships."}],"id":"three-of-pentacles","reversed":[{"t":"p","x":"Inter-personal conflict in team or department, team spirit is lacking, work getting criticized, appraisals getting delayed, promised promotion or pay hikes not being delivered, arrogant boss, lack of professional support, need for networking, need to promote your craft or product"}],"tone":"positive"},{"name":"Four of Pentacles","num":4,"arcana":"minor","suit":"Pentacles","rank":"Four","start":261,"end":264,"meta":{"Element":"Earth","Planets":"Venus, Mercury, Saturn","Astrological Significance":"Sun in Capricorn","Favourable Color":"Gray Red Black Yellow","Chakra Associated":"Root/Muladhara Chakra"},"rating":"Positive Card","body":[{"t":"p","x":"The four of pentacles depicts achievement of financial security but also warns of being wrapped up in material affairs or of adopting an over possessive or even miserly attitude towards your resources. It is a card which carries both positive and negative perceptions."},{"t":"p","x":"Imagery : This card depicts a man sitting on a stool holding onto two pentacles in a defensive manner. One pentacle is balanced precariously on his head, the other held close to his chest and two are beneath either foot. He can not move for fear of loss of his pentacles."},{"t":"p","x":"This is at once a humorous and also satirical representation of the person when he has amassed a certain amount of security in the material comforts he was seeking."},{"t":"p","x":"Four of pentacles is a card of reassurance and abundance. All the efforts and collaborations of the first three cards have borne rich fruits. Your plans have worked out well and been financially rewarding."},{"t":"p","x":"You are in a stable and secure position as indicated by the FOURS in the Tarot. The buildings in the background are also depicting a good lifestyle and status for you."},{"t":"p","x":"However with security can come the desire to have more and to become miserly with what you do have. When this card comes, the person has developed an insecurity for his assets. You fear the loss of your hard earned fruits and become so fixated about their safekeeping that you are keeping guard over them day and night."},{"t":"p","x":"Its like an obsession which is never a healthy attitude to develop since it is making you immobile. You are sitting so tightly on our resources that the flow of abundance will eventually cease for you. When you do not put in the capital(material or otherwise) to expand further, then the progress will eventually halt."},{"t":"p","x":"This insecurity could stem from a past where you suffered from Lack. Not having sufficient resources in the past makes you now want to zealously defend what you have earned in order that savings for future are ensured. While savings are always a positive step, this card warns you to not become so obsessed with savings that you cannot enjoy your bounty. This\"POVERTY CONSCIOUSNESS” or\"LACK CONSCIOUSNESS” is a self fulfilling prophecy. It implies that when you think you do not have enough, that thought becomes a vibration and attracts more lack/poverty to you keeping you in a stagnant pool of meagre returns."},{"t":"p","x":"This avarice or miserliness should be translated into balanced spending and also inculcating the healthy\"ABUNDANCE CONSCIOUSNESS” where when you visualize that what you have is surplus, you will start attracting more riches to yourself. This is the cosmic law of cause and effect that has been eulogized well in Indian and Western classical texts alike. What you give freely of, you shall receive freely of, goes the Universal Law of Attraction."},{"t":"p","x":"At times, this card can indicate a sensible approach of keeping financial information to yourself. This can also show when you want to keep your plans and ideas to yourself for a while before sharing them with the external world. This buffer period helps the idea or information to mature and when the timing is correct, it may be revealed. It may also be a useful approach to keep a tab on your financial affairs if surrounding cards are indicating extravagance and mindless expenditure."},{"t":"p","x":"Thus this card is dual in its meaning. It reassures of incoming prosperity yet it advises you to maintain a degree of balance in your perspective regarding itas also a sense of detachment."}],"id":"four-of-pentacles","reversed":[{"t":"p","x":"Greed and hoarding, black marketing and corruption, keeping secrets, nouveau riche and so now overspending, reckless investments, disrespect to money and other resources around you, renouncing worldly possessions in order to lead a simpler life, sharing of intellectual and material possessions with an open heart"}],"tone":"positive"},{"name":"Five of Pentacles","num":5,"arcana":"minor","suit":"Pentacles","rank":"Five","start":264,"end":267,"meta":{"Element":"Earth","Planets":"Venus, Mercury, Saturn","Astrological Significance":"Venus in Taurus","Favourable Color":"Black White Brown","Chakra Associated":"Root/Muladhara Chakra"},"rating":"Difficult card","body":[{"t":"p","x":"Five of pentacles is a card of misery and misfortune. It symbolizes adversity and a loss of what you consider to be of value to you. Tremendous inner courage is required to tide over the down period."},{"t":"p","x":"Imagery : This is a rather desolate looking card with two helpless, impoverished human figures wearily trudging along in heavy snow. They are cold, tired and hungry and seem to be lacking even the basic necessities of life. One of them is supported on crutches while the other’s feet are bare as she walks on the icy ground."},{"t":"p","x":"All the fives are difficult cards in the Tarot and this one is especially so. The Five of Pentacles is a bad omen whenever it appears in the spread. Its severity however will be influenced by the surrounding cards. When this card appears some form of loss is imminent. There may have a substantial financial downturn and your fortune cycle has really dipped. You might have speculated in a venture which has sunk and so there is a financial crisis. There would have been a sudden loss of material wealth and you are really feeling the pinch. There might be a damage or loss to a business property or premises."},{"t":"p","x":"Since this card is about impoverishment, it can also be perceived impoverishment. The returns you were expecting from a venture did not materialize as per your desire or business forecast; it leaves you confounded and feeling a loss strongly. You may have been eyeing an expensive property or bidding for a lucrative deal that could enhance your prestige in the fraternity. If you do not acquire that due to external reasons, you would again perceive it as a loss. Loss of face in such ways of projected extravagance is also an integral part of this card’s subliminal message. Wealth is a highly subjective term and how much wealth is enough wealth to make you feel wealthy is really a very personal take on the concept. Hence this\"felt poverty” should also be explored when this card comes up in a reading."},{"t":"p","x":"The thoughts and worries regarding money may be getting in your way. You may be too attached to money or worried about success and failure in an excessive manner to the extent that it is affecting your peace of mind and what kind of productivity:output ratio you start expecting at your workplace. This card can also denote a sense of loneliness and isolation. It could be voluntary in that you feel disconnected from your immediate environment, if you are perceiving they are financially or culturally superior to you. They may not be isolating you deliberately yet your complex kicks in and you start alienating yourself by not accepting invitations and turning anti-social."},{"t":"p","x":"This card can also indicate a real outcasting by your family or your social group if you are felt to be breaking the accepted norms by your unconventional behaviour. The impoverishment here can be real in terms of loss of emotional support and understanding.It could even translate you being detached from your family or ancestral property as a punitive measure. Whatever the form, the five of pentacles is a card of suffering and lack of support and succour. Its important to keep the inner reserves optimistic when this card is playing out in your life. In the image, the figures are at a disadvantage yet they are bravely moving and traversing the difficult terrain. Five is a number of change in the Tarot so the difficult situation you are facing will not last forever. It may even be a catalyst for positive change. You may receive enlightenment as to who are your real well wishes and who are superficial. It might even change your perspective towards the blessings you have and be in gratitude when your wealth is restored by your sheer determination and faith in a higher force."}],"id":"five-of-pentacles","reversed":[{"t":"p","x":"Positive card indicating end of unemployment or low finances, Financial breakthrough, community recognition, windfall gains, count your blessings, being practical about revenue sources and doggedly pursuing abundance goals, financial help coming in"}],"tone":"challenging"},{"name":"Six of Pentacles","num":6,"arcana":"minor","suit":"Pentacles","rank":"Six","start":267,"end":269,"meta":{"Element":"Earth","Planets":"Venus, Mercury, Saturn","Astrological Significance":"Moon in Taurus","Favourable Color":"Red Purple Yellow","Chakra Associated":"Root/Muladhara Chakra"},"rating":"Karmic card. Very Positive","body":[{"t":"p","x":"This is a card of having surplus resources. It teaches that Money is an Energy- The more it Flows; The More it Grows. It indicates charity, generosity and sharing and a fair flow of resources such that resource balance is maintained. Its a very positive card in all respects."},{"t":"p","x":"Imagery : A respectable and affluent looking man wearing purple robes denoting his high status stands distributing coins to beggars. He is secure with his own condition of resources and is generously sharing his bounty with those who are n need. In his hand, he holds scales and much like the Justice card, this indicates balance of karma and the cause and effect cycle of Life."},{"t":"p","x":"This is a situation where you are likely to give or receive money. Mostly its about receiving as the Universe is in your favour and your desires are being fulfilled.Although pentacles as a suit represent money and material possessions, your emotions are a valuable resource. Thus this card will also pertain to your emotions about the give and take money. When this card appears you are in a state of gratitude and subservience to the Universe. You may be feeling a large heartedness and will go in for a donation or a charity gesture. You might make small gestures to help those who are underprivileged. As pentacles also denote knowledge as a resource, you could even selflessly give of your knowledge or technical expertise without expecting any payback. Its a time to be free flowing with your resources, of any kind. It dies not always have to be about money or material possessions only. Anything that the person receiving from you holds in value pertaining to you is significant here. Your time and presence and an empathetic ear may be the resources he will appreciate from you. You may also be at the receiving end at times in your life. This card teaches that one must not be shy or even arrogant when you are in need of support. It could help you recover at that time so take the help. You will be able to repay the kindness in the future. This card carries the message that all flow of resources is linked to a larger cycle in the cosmos. What you give should be done so in a humble manner. You should be grateful that you are in a position to help someone. The universal abundance is flowing through you and you are merely the channel who is in a privileged status to be at the giving end."},{"t":"p","x":"Let that not become condescension or arrogance. When you help but with a doubtful heart, or with grudge in your heart that help is not counted as good karma. Similarly while receiving, be humble and do not cross your boundary and come across as desperate. The karmic scales are always being calculated so mind the emotion with which you give and receive both. When this card comes in a reading its a sure sign to balance the scales. You could be either giving more of yourself or less than required. Its time to analyse and balance your give and take in life-material or emotional."}],"id":"six-of-pentacles","reversed":[{"t":"p","x":"Problem card in financial flows, money blockage, payments being held up, profits not coming in, debts, expecting financial help from others, no balance as you may be expecting total help from outside or not accepting any help at all, financial stalemate, exploiting human resources by not rewarding for their service, being non\u0002charitable, non recovery of loans given out"}],"tone":"positive"},{"name":"Seven of Pentacles","num":7,"arcana":"minor","suit":"Pentacles","rank":"Seven","start":269,"end":272,"meta":{"Element":"Earth","Planets":"Venus, Mercury, Saturn","Astrological Significance":"Saturn in Taurus","Favourable Color":"Green Yellow Orange","Chakra Associated":"Root/Muladhara Chakra"},"rating":"Moderate Positive card","body":[{"t":"p","x":"Seven of pentacles in an assessment period of the dedicated labour put in so far in the pentacle journey. Its a time to pause and review the past accomplishments and make any calibrations if needed, to keep the progress going. Imagery : A young man is taking a break and leaning on his work tool is carefully analysing the fruit in his garden, the labour he has put in to obtain the produce. He admires the seven pentacles hanging from the lush vegetation. The way he is leaning suggests he is fatigued, He is focused on long term goals and thus only partakes for his pleasure one of the pentacles while he reinvests the others to expand his project. This is a period of assessment of past inputs and the resultant output. Time to take stock of your achievements and also plan the future course of action. This card may indicate that results are taking a longer than expected time to pour in and hence you may be dismayed where the lag is. This card indicates confusion and indecision if the planning has been worthwhile and where the changes can be introduced for the future performance to be of a higher level."},{"t":"p","x":"Its the time to take stock that though you may be working hard but are the efforts in the right direction? Are you working smart? Do not take your skills and expertise for granted, this card says. Think of fresh ways to use them. Do not change the ingredients but rather the techniques and processes you are using the resources in, to reach your objectives. Sevens also indicate a time to introspect keeping the long term life goals in perspective so take this time to align your responsibilities with your long term goals. Be clear where you want to take your life down the timeline and then plan backwards and check if present performance / efforts are synergising with long term achievements."},{"t":"p","x":"Seven of pentacles is also about making major changes in the way you have allocated your resources. The current allocation may not be bringing you peace or prosperity. Thus you may decide to end some part of your resource allocation and reinvest in avenues which make you happier or make you feel more secure."},{"t":"p","x":"You might decide to leave a stable corporate job and farm the land in the countryside that you inherited from your family. It could mean work that excites you and cost of living being lower could actually make you feel richer at the end of the day. The satisfaction of organic farming would only add value to your self worth."},{"t":"p","x":"Similarly a woman who took few years off to raise her family now finds that her efforts are not being needed so much at home front so there is an effort: output ratio imbalance. She decides to go back to part time consulting work and adjusts her working style to online consulting. She now has a good income apart from the sense of identity she now finds reestablished."},{"t":"p","x":"These kind of calibrations may occur at various junctures in your life. When you feel dissatisfied with the deliverables coming to you then its time to take some smart decisions and re invest your future time and efforts into avenues that bring you greater of what kind of wealth you desire."},{"t":"p","x":"Weigh up you physical and mental skills and make a list of what you can offer to a future employer or to your self employment venture. Its a time to revisit and refresh and maybe upgrade the skills that make you productive."},{"t":"p","x":"When the seven of pentacles comes up, there is definitely a tinge of regret that creeps into you. You are disappointed for some reason. Carefully analyse how you can astutely change your time and skill allocation so that physical or material or spiritual satisfaction may accrue to you in the coming times."}],"id":"seven-of-pentacles","reversed":[{"t":"p","x":"realizing that efforts are wasted and giving up on a project or a relationship, disillusionment and sadness, repeating same mistakes as in past and getting into a failure loop, repetitive negative emotional patterns, ignoring advice and pointers to improve the situation at hand"}],"tone":"mixed"},{"name":"Eight of Pentacles","num":8,"arcana":"minor","suit":"Pentacles","rank":"Eight","start":272,"end":275,"meta":{"Element":"Earth","Planets":"Venus, Mercury, Saturn","Astrological Significance":"Sun in Virgo","Favourable Color":"Brown Yellow","Chakra Associated":"Root/Muladhara Chakra"},"rating":"Positive Card","body":[{"t":"p","x":"This card carries the energy of Patience,Concentration and the Pursuit of Perfection with Passion. Focus on performance and not get swayed by emotional waves."},{"t":"p","x":"Imagery : A hard working young man is working laboriously on a single pentacle. He is chiseling out the design on the circular base and creating the pentagram on it with total focus/ One pentacle awaits at his feet while 6 others are hanging on what looks like a tree trunk, bearing testimony to his sustained efforts in the past."},{"t":"p","x":"The eight of pentacles refers to those situations in your life when you need to remove yourself from all distractions and temptations of the outside world (as symbolised by the town in the distance) and be fully engrossed in the responsibility that has been allocated to you. Astrologically this is a position of Sun in Virgo which shows that individual excellence and craftsmanship can be achieved only by meticulous and careful attention to detail towards the work at hand. He is focusing on what he Needs to do rather than what he wants to do. By not listening to the inner voices that can distract him, this young man remains busy in his work. By being mindful of each small gesture and thought he is moving towards perfecting his learning and moving up the ladder of progress. When this card comes in a reading, its time to work hard and diligently. This is not a card of immediate gratification but when your diligence is noticed by those in power, your rise will be inevitable. You should be confident of your unique skill set and if you feel that you need further learning then make tangible efforts to upgrade your knowledge."},{"t":"p","x":"You could be joining a new course or join an apprenticeship program or join an organization for the main purpose of gaining work experience. Even if your subject of choice is unconventional or pioneering, have the courage to pursue it with sincerity. It will turn out to be a very fruitful venture. In your career there may come a time when a new project has to be initiated. This will require your complete attention. For a while, you might need to become a workaholic who thinks about his work all the time. This kind of attention will yield excellent fruits later. Do not be discouraged if it calls for excessive detail oriented activities as its the micro achievements that will lead to achievement of major goal. Exercise restraint and resilience."},{"t":"p","x":"This card in the relationship is also prophetic. It signals that this is a stable and solid alliance and with time will become more perfect and harmonious for the parties involved. There will be many moments of mutual happiness and perfect balance and they will help to develop each other’s talents and skills. This relationship will make your fortunes rise."},{"t":"p","x":"The eight of pentacles may also come up when you are going back to a productive activity after a gap. This is a strong and positive indicator of success. It says that work comes naturally to you and that you wish to be a useful contributor to society. This sense of service and practical skills will be applauded and make you happy and energized."},{"t":"p","x":"This card calls conclusively for success in any venture, including money gains when the work ethic is of sincerity, systematic approach to work and a genuine joy in the work you are doing even if it is mundane and repetitive in nature."}],"id":"eight-of-pentacles","reversed":[{"t":"p","x":"Delay or denial of promotion and advancement opportunities at work, hard work not getting rewarded, lack of interest in perfecting the task at hand, impatience to get results, attention deficit, ADHD disorder, poor quality of work, disappointing card in relationships as calls for putting in more effort"}],"tone":"positive"},{"name":"Nine of Pentacles","num":9,"arcana":"minor","suit":"Pentacles","rank":"Nine","start":275,"end":277,"meta":{"Element":"Earth","Planets":"Venus, Mercury, Saturn","Astrological Significance":"Venus in Virgo","Favourable Color":"Green","Chakra Associated":"Root/Muladhara Chakra"},"rating":"Very Positive Card","body":[{"t":"p","x":"Nine of Pentacles in a card of joyfulness and enjoyment of abundance in life. The arduous work is behind her and a period of achievement and happiness awaits."},{"t":"p","x":"Imagery : A beautiful and affluent woman is standing in the middle of the vineyard surrounded by lush fruits of her hard work and astute management of resources."},{"t":"p","x":"This is astrologically symbolised by Venus in Virgo and denotes luxuries and financial rewards gained by astute business or professional judgement. When this card comes up, you can be assured of unexpectedly good financial and material gains."},{"t":"p","x":"A promotion, pay hike, high paying job, win in lottery, appreciation in property, buying a new luxurious house are all the blessings of the Venus energy inherent in nine of pentacles. You have reached a point in your life where everything is going in your favour. You have reached a very secure and comfortable place of security. Material benefits are the most prominent amongst these security factors. You now have a great deal to show for all your past efforts and struggles. It shows the feeling of self - assurance and a calm confidence that what you have built around you is tangible and real. This confidence is so authentic because it is not a gift or an inheritance. It has been built, brick by brick by your own hard work, resource management and sheer dedication towards your work."},{"t":"p","x":"You may have overcome negative feedback, discouragement and deception along your way till here and you feel validated and at complete peace with the world because of the karmic payback being so positive. This card may also indicate you going in for a lifestyle product or an expensive object such as a new car, branded clothes or accessory, costly furniture or taking an exotic trip. These are outer manifestations of your inner sense of having arrived in the society. A gray undercurrent here is that you may be tempted to give in to extravagances but generally the nine o
