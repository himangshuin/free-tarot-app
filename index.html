al Connotations of the 22 Major Arcana Cards 45 The Twelve Zodiac Signs & Tarot Cards - Inter relationship with (Aries, Taurus, Gemini, Cancer, Leo, Virgo, Libra, Scorpio, Sagittarius, Aquarius, Pisces)"},{"t":"h","x":"45"},{"t":"p","x":"The Ten Planets & Tarot Cards - Inter relationship with (Sun, Moon, Mars, Mercury, Jupiter, Venus, Saturn, Neptune, Uranus, Pluto)"},{"t":"h","x":"50"},{"t":"p","x":"Chap. 7 Kaal Purush Kundali :"},{"t":"p","x":"12 Houses & Divinatory Meaning of Cards 54 The Astrological Spread- Relevence/Karakatva of 12th Houses, prediction & guidance of Life Aspects using Card placement 57 The Yearly Forecast Tarot Spread - Annual Prediction & Guidance Using Card placement 59 Chap. 8 Numerology Associations of Tarot 61 Role of Zero ; Master Numbers 62 Projected Year Number Calculation 63 Year Number connection with Major Arcana Cards (1-9)"},{"t":"h","x":"64"},{"t":"p","x":"Projected Year Number & Annual Trend Guidance & Forecast 68 Chap. 9 The Magic of Quintessential Number & Quintessential Card in a Tarot Reading 74 Benefits & Calculation Method of Quintessential Number 74 Meaning of Each Quintessential Number from 1-9 76 Two Case Studies Using Quintessential Number & Analysis of Extra richness to the reading 77 Role & Calculation of Quintessential Card in a Reading 79 Case Study using Quintessential Card - Analysis of Traditional Spread vs Quintessential Card Spread 80 Chap. 10 Muhurta Fixation by Numerological Tarot 83 Case Study 83 Using Life Path Number to find best Date/ Muhurta (Major Arcana Approach)"},{"t":"h","x":"85"},{"t":"p","x":"How will this day be for me - Calculation & Guidance Chap. 11 Remedies in Tarot Gems & Crystals 90 Precious Stones/Planetary Gemstones are an effective remedy in Tarot Recommendation of Healing Gems Using Planetary Tarot Spread 91 Why Are Crystals an Effective Remedy in Tarot?"},{"t":"h","x":"96"},{"t":"h","x":"Forms of Available Crystals 97"},{"t":"p","x":"Case Study of Chakra Healing Via Tarot Spread & Ass ge from an ever changing Mind Silences are Solid; Silences are powerful; Silences are long lasting;"},{"t":"p","x":"Silences drip with suppressed emotions-raw and authentic, sodden and slimy Silences spring from our truthful core Believe the Silence. Its the Truth."},{"t":"p","x":"When the Silence Breaks, Truth has spoken."},{"t":"p","x":"Tarot is the Language of this Truth."},{"t":"h","x":"Tarot is a Ray of Light"},{"t":"h","x":"-Rrachita Gupta"},{"t":"p","x":"'Ravera'"},{"t":"h","x":"Tarot as a"},{"t":"p","x":"Psychological GPS :"},{"t":"h","x":"To Make your Life Precious"},{"t":"h","x":"Chapter-1"},{"t":"p","x":"When Tarot developed in the Middle Ages 14th - 16th centuries in Europe, it was the time of the Intellectual Renaissance or the reawakening of human intellect and talents."},{"t":"p","x":"In this period the philosophical trend was shifting from Religion to “Power of Self”. For long the Church and other well established institutions of the society had been guiding man to follow a rigid set of rules and regulations. The human spirit which is always in need for answers and for improving its understanding of the world resented this rigidity and orthodoxy."},{"t":"p","x":"The Tarot is a sparkling spiritual and philosophical tool to be aware of the outside world and more importantly guide our attention to the inner world of each of us."},{"t":"p","x":"In our inner world live Feelings. Feelings are clever and elusive things, changing from moment to moment and shackled by the vices of lust, desire, attachment and greed. Feelings are also mouldable. Which in practical terms gives us the freedom to choose How We Want to Feel Now and at this Moment. Tarot was developed over centuries by minds that carried very high spiritual frequencies."},{"t":"p","x":"Tarot is a divinatory tool that is a fascinating and universally accessible avenue to open the portal of Self-healing and also healing others. Tarot is a profound and deeply philosophical modality of perceiving life and the purpose of life. Its origins are ancient and obscure. The word Tarot has been associated with the Egyptian “Royal Road of Life” and the anagram ROTA which is Latin for wheel, suggests the means of progressing along that road."},{"t":"p","x":"The Tarot is a spiritual deck of 78 cards that consists of 22 Major Arcana Cards and 56 Minor Arcana cards. The 22 Majors are Archetypes of the Human experience as an individual moves through the cycle of birth, socialisation, identity formation, community contribution and ultimately the state of fulfillment that marks a sense of completion for him."},{"t":"p","x":"Carl Jung calls the journey through the Major Arcana the “Journey of human spirit (effort) towards summit of Individuation”."},{"t":"p","x":"Abraham Maslow, who has erstwhile been regarded as the father of cognitive theory and Human Behaviour may like to allude this journey to “human needs striving towards the utopian goal of self actualisation”"},{"t":"p","x":"In Hindusism we aspire for the highest goal of Transcedence which is beyond the earthly Self Actualisation."},{"t":"p","x":"Transcedence is that stage in the journey of Soul Evolution when the human soul is aware of its inextricable ties with the Universal Consciousness. God Almighty and the human soul are essentially One and there is no Duality. Thus all guidance to perform earthly duties must flow from the Almighty. That is Grace. That is the Surrender of the Human Ego."},{"t":"p","x":"Once the Ego is surrendered, the Will of the Universe which is for your Highest Good takes over the direction of your Life. Krishna has propounded this explanation in Chapter 4 of the Bhagavat Gita, an excerpt from which is given below :"},{"t":"h","x":"Bhagavat Gita - Chapter 4"},{"t":"p","x":"Transcendental knowledge--the spiritual knowledge of the soul, God, and of their relationship--is both purifying and liberating. Such knowledge is the fruit of selfless devotional action (karma yoga)."},{"t":"p","x":"Details of Tarot as a tool of transformation and soul growth discussed in chapter 20."}]},{"id":"v2-c2","vol":"II","title":"Chapter 2 · Tarot Reversal: Reversed Cards in a Spread","body":[{"t":"p","x":"Note : A complete list of all the 78 Cards and their several reversal meanings are enclosed in this book for your reference and study."},{"t":"p","x":"There is a long standing debate within tarot circles about the meaning and the relevance or otherwise of Reversed cards. There are several ways of interpreting the reversed cards and in this section we shall be looking at the ways of reading at reversed cards if they come up in a spread."},{"t":"p","x":"Please remember there is no randomness when one does a Tarot spread. Each card has a specific relevance whether it is upright or reversed."},{"t":"p","x":"Why is a Reversed Card important to study? What should you know when a Reversed Card turns up in a regular reading?  If during shuffling the tarot reader is confident that the cards are in upright position and yet when one lays out the Spread and a Reversed Card(or more) features in the spread, be Aware."},{"t":"p","x":" Its a definite signal from the Universe that your attention is being drawn to that reversed card."},{"t":"p","x":" Do not ignore its meaning and consider it seriously.  Infact personally I take the appearance of a reversed card in a spread as a direct message to me by the Divine. I am being held by the hand and taken gently to see Tarot Reversal :"},{"t":"h","x":"Tarot & Reversed"},{"t":"h","x":"Cards in a Spread"},{"t":"h","x":"Chapter-2"},{"t":"p","x":"which energy is overwhelming or lacking in that situation and which needs to be balanced."},{"t":"p","x":" There are codes, secrets, messages and signs placed within our Cards which at times reveal themselves to us.  Reversed cards are a coded way of showing us the deeper picture of the situation at hand that is not being evidently shown to us by the biases/subjectiveness of the querist."},{"t":"p","x":" The Reversed card is the Secret Tool available with the experienced Tarot Reader. Thus embrace it, understand it for mostly it will be the Key to the solution/remedy to the problem being discussed."},{"t":"p","x":" The Reversed card should be meditated upon and analysed by asking pertinent questions to the querist so that the missing pieces of the jigsaw are able to be pieced together."},{"t":"p","x":" The Reversed card is the clue to deepen your investigation of the Tarot case and find out what lies beneath the Tip of the Iceberg."},{"t":"p","x":"Possible Interpretations of Reversed Cards 1. One school of tarot thought believes that there is no need to use reversals since the entire spectrum of emotion and action is already covered in the 78 cards."},{"t":"p","x":"As a Tarot practitioner with considerable experience, I have already answered that in the opening section. Tarot reversals are inevitable and cannot be ignored. They show the fluctuations in the energy distribution of the spread."},{"t":"p","x":"They sometimes point to what is not being honestly projected by the querists."},{"t":"p","x":"Reversals must be taken hands on and analyzed with logic and sincerity."},{"t":"p","x":"2. Reversal many a times indicates an opposing energy of the Card as it means Upright. For example if the upright card is denoting action and fire element, its reversal may indicate an opposing energy I.e. situation is passive and quiet. - Knight of Wands reversed, The Magician reversed, The Chariot reversed etc."},{"t":"p","x":"reversed. all 3 cards also show upright."},{"t":"p","x":"Similarly if the upright energy is of contemplation and pause, its reversal indicates that the situation is very active and teeming with excess of emotion or activity. Example High Priestess reversed, 4 of Wands reversed, 4 of Pentacles reversed and others."},{"t":"p","x":"reversed as also upright. Total 6 pics 3. Card Reversals show an Imbalance in Energy. There is either an Energy Blockage or an Energy Surplus in the position that the Reversed card comes up."},{"t":"p","x":"Tarot Card Reading aims to balance out our life and give us a glimpse of the Evident and Underlying factors influencing a situation."},{"t":"p","x":"We must Balance out the Energy which is blocked. It signifies that the particular attribute is needed but is lacking naturally."},{"t":"p","x":"By counselling and guidance as per the cards of the reading, or by using remedies one must increase that blocked energy so it starts flowing and more balance is introduced in the situation. Solution becomes dynamic and attainable."},{"t":"p","x":"Example1 : In a financial prosperity query, if the spread shows a Pentacle reversed or a Wands reversed, it needs to be studied as a case of Blocked energy. The passion for the job/work may be lacking, original ideas regarding work may be lacking or financial knowledge about the field may be insufficient. Example 2 : Similarly a case of Surplus Energy is evident when in a spread of Emotional Incompatibility between a married couple the spread shows Sword reversed or Cup reversed. The reversed sword shows an excess of critical attitude and no tolerance of each other. The reversed cup shows one partner is extra sensitive and cannot absorb the analytical nature of the other."},{"t":"p","x":"4. Each Tarot Card is an Energy Template and carries vibrations and messages of the Elemental suit it represents, signification of dominant colors on the card, the power of the Number value it carries, the iconography, the ancient tales and legends and most importantly the Wisdom behind the Archetype of that Card."},{"t":"p","x":"The Reversed card comes up strategically to show which Energy Template needs intervention in the entire spread. The Reversed card, in my experience is a strong indicator of how the sensitive and psychologically attuned Tarot reader can give remedies for the “Energy Template” needed in right proportions to fix the problem."}]},{"id":"v2-c3","vol":"II","title":"Chapter 3 · The 78 Cards (Reversed) – introduction","body":[{"t":"p","x":"Below is a Comprehensive List of the 78 Tarot Cards as found in the Rider Waite Tarot Deck and the implications when a card turns up reversed in a reading or spread."},{"t":"p","x":"These meanings when studied as a corollary to the upright meanings offer a 360 degree view of the gamut of situations and emotions that each of the cards is redolent with. So this table is a resource for not only interpreting the card when it comes reversed in a reading but also as a scholastic endeavour me to understand your cards like the Back of your Hand. Major Arcana Card Name Reversed Meanings The Fool Impractical and naive behaviour. Too much trust in the goodness of people."},{"t":"p","x":"Not listening to wise counsel. Indifferent to Intuition. Impulsive and rash decisions."},{"t":"p","x":"Poor leadership and overconfidence in own vision. Not having individual confidence and being bound by social conventions excessively."},{"t":"h","x":"The"},{"t":"h","x":"Magician"},{"t":"p","x":"Blockage in Self expression."},{"t":"p","x":"Carrying emotional pain and fears from past and not going with the flow Trapped energy manifesting as physical troubles or depression."},{"t":"p","x":"Poor communication skills and poor negotiation skills. Arrogance and misuse of personal power to dominate others or a situation."},{"t":"h","x":"Comprehensive"},{"t":"h","x":"List of the 78 Tarot"},{"t":"p","x":"Cards (Reversed)"},{"t":"h","x":"Chapter-3"}]},{"id":"v2-c4","vol":"II","title":"Chapter 4 · Directionality in the Cards","body":[{"t":"p","x":"Interestingly when we study the interplay of the various cards in a Tarot spread, we can also look at how the Human and animal figures are positioned in reference to each other. It should be noted that while deciding any relationship between two cards in a spread, do observe the surrounding cards and the quality of the question before making a reading final. 1. Facing Each Other-Collaborative When two Tarot card figures are facing each other they show a collaborative movement and its a positive sign in the reading. For example in a spread the Page of Wands and the Fool are facing each other, then it signifies the beginning of a new adventure where ideas are passion are intense."},{"t":"p","x":"Denotes new and fresh beginnings."},{"t":"h","x":"Directionality in"},{"t":"h","x":"the Cards"},{"t":"h","x":"Chapter-4"},{"t":"h","x":"Card 1- Page of Wands"},{"t":"h","x":"Card 2 - The Fool"},{"t":"h","x":"2. Facing Each Other-Confrontation"},{"t":"p","x":"Sometimes 2 figures facing each other may indicate a type of confrontation or opposing energies too. The meaning of the suit is very important to study here."},{"t":"h","x":"Illustration 1"},{"t":"h","x":"if Death Card on Left is"},{"t":"h","x":"followed by Strength Card"},{"t":"h","x":"on right, it could indicate"},{"t":"h","x":"that a loss is coming up"},{"t":"h","x":"in the future which will"},{"t":"h","x":"have to be met with an"},{"t":"h","x":"uncharacteristic sense"},{"t":"h","x":"of acceptance. While"},{"t":"h","x":"Death is a movement"},{"t":"h","x":"card, the Strength card is"},{"t":"p","x":"withholding of emotions."},{"t":"p","x":"This combination will create STRESS in the individual facing this condition as the twin forces will pull him in opposite directions. Card 1 - Death (on Left)"},{"t":"p","x":"Card 2- Strength (on Right)"},{"t":"h","x":"Illustration 2 : With Suit Cards"},{"t":"p","x":"10 of Wands on Left is followed by 5 of Cups on the Right. This can indicate conflicting energies as the high level of perseverance and labour as indicated in the 10 of wands will lead on to some personal loss and resultant sorrow."},{"t":"h","x":"The person is putting in"},{"t":"h","x":"unmitigated effort but will"},{"t":"h","x":"meet not with success or"},{"t":"h","x":"happiness but rather an"},{"t":"h","x":"emotional strengthening"},{"t":"h","x":"caused by bearing some"},{"t":"p","x":"deep loss or regret."},{"t":"p","x":"Card 1 -10 of Wands (on Left)"},{"t":"p","x":"Card 2 - 5 of Cups (on Right)"},{"t":"h","x":"3. Facing Away from Each other"},{"t":"h","x":"When consecutive cards"},{"t":"h","x":"have figures facing or"},{"t":"h","x":"turning away from each"},{"t":"h","x":"other then in certain cases"},{"t":"h","x":"it can be related with the"},{"t":"p","x":"Time Factor."},{"t":"h","x":"As in the figure turning"},{"t":"h","x":"towards left is looking at"},{"t":"h","x":"or deriving its energy from"},{"t":"h","x":"the past. The figure turning"},{"t":"h","x":"towards Right is looking at"},{"t":"h","x":"the futuristic time &portends"},{"t":"h","x":"of events/moods to emerge"},{"t":"p","x":"in the coming times."},{"t":"p","x":"Card 1 - King of Wands (on Left)"},{"t":"p","x":"Card 2- Knight of Pentacles (on Right)"},{"t":"h","x":"4. Figure Facing Straight"},{"t":"p","x":"When a figure is facing straight then it may indicate that the inherent energy or the mood of the card is rooted in the Present(in terms of Time reference)"},{"t":"p","x":"Illustration 1 :"},{"t":"p","x":"The Page of cups derives its origin in the Past of the situation, the Hierophant displays the situation at Present and the Moon signifies the Mood of the Future."},{"t":"h","x":"Card 1 - Page of Cups"},{"t":"h","x":"Card 2 - Hierophant"},{"t":"h","x":"Card 3 - The Moon"},{"t":"p","x":"Illustration 2 :"},{"t":"p","x":"It can also indicate that it carries the message of being stationary or acting as an obstacle in the given situation. This is especially pertinent when the figures on its left and right (in a typical 3 card spread) are dynamic and displaying movement. Card 1 - Knight of Swords Card 2 - The Emperor Card 3 - Knight of Cups Note : Looking at the direction in which a person faces on the Tarot card can add an extra layer of depth to your Tarot readings, particularly when it is a relationship reading or a decision-making reading."},{"t":"p","x":"You can choose to interpret the individual figure using the Past / Present / Future method, or you can start to look at how the different figures across multiple cards are interacting with one another."},{"t":"p","x":"Remember the Directionality of the Figures must be studied at least at a supplementary level by the reader because it does carry an additional meaning."},{"t":"p","x":"Noting the interplay of directionality is applicable to not only the 16 Court Cards but to all the cards in the Tarot Deck that feature a person. Another point to keep in mind is that is that the figures may be facing different directions depending on which deck you use. Some decks may have slight variations in illustrations from the Rider Waite deck."}]},{"id":"v2-c5","vol":"II","title":"Chapter 5 · Astrological Association of Tarot","body":[{"t":"p","x":"Astrology or Jyotish literally translates to Jyoti + Ish = Light of the Divine. It is the mother of all divination and occult sciences and deals with the primordial movement of planets and constellations in the sky and its corollary impact on affairs of men on Earth."},{"t":"p","x":"For thousands of years, Astrology has been the backbone of Indian social ethos and has governed the mundane and day to day decisions of Mankind with startling accuracy. Astrology is Ancient; it is embedded deep into our culture and value system and its been so relevant over the centuries that even in modern times of scepticism and individual thinking, it continues to remain contemporary."},{"t":"p","x":"As the complexity of living is increasing, the human soul is turning with more keenness to spirituality and finding ways to attain supreme happiness and peace."},{"t":"p","x":"The Human Mind is realizing that the human soul is not separate from the Universal Consciousness. It is One with the Divine. The soul by regular meditation and spiritual remedies can expand itself till it merges with the Infinite. And that is the secret of finding peace in this crazily competitive world."},{"t":"p","x":"This realization that the soul has to merge with the Infinite and that spirituality is not exclusive of human affairs is very reassuring fact for the thinking person."},{"t":"h","x":"Astrological"},{"t":"h","x":"Association of Tarot"},{"t":"p","x":"Linkage, with Zodiac Signs, Planets , Houses of Horoscope)"},{"t":"h","x":"Chapter-5"},{"t":"p","x":"By using the salient principles of Astrology, depending on the position of the planets ascertained astronomically, one can forecast events for the benefit for all, and hence the all pervading usefulness of Astrology (when interpreted by a trained and knowledgeable mind) is unparalleled."},{"t":"p","x":"Astrology is such a Universal and ancient science. The western world believes in it as much as the Eastern, more specifically the Indian world."},{"t":"p","x":"There are however many differences in both the Vedic and Western Astrology systems. It would be fascinating at this juncture, when we are going to study Tarot in relation to Astrology, to delve a bit deeper into the origins of Astrology and see how the western and Indian system differs from each other."},{"t":"p","x":" Astrology is a noble science and is as old as Creation itself. As per Sage Garga, the science of Jyotish / Astrology was propounded by the Creator himself and handed over to him for safe-keeping and propagation."},{"t":"p","x":"In western countries there is a belief that Seth(3,769B.C) was the world’s first astrologer. He was the first person to study the planets, their motions and their orbits. He divided the Zodiac into 12 equal parts after charting out the annual movement of the Sun. He discovered that each full cycle of the Sun corresponded with 12 full moons and therefore each spacing of the part was called Mazzoroth and equalled 12 in number."},{"t":"p","x":" 2600 years ago, the Chaldeans developed it and that period was called the Golden Age of Astrology because they attributed their galloping success in all human affairs to astrological guidance."},{"t":"p","x":" The Greeks were avid Astrologers and are credited with erecting the first horoscope of their world with time of birth and forecasting fate and fortune of individuals. One of the Greek horoscopes written in Papyrus about 2000 years ago is kept in the British Museum."},{"t":"p","x":" Another nation that was crazily in love and awe of Astrology was the ancient civilisation of Egypt. Pharaohs gave this science a royal status and for a nation so obsessed with longevity and world power, Astrology was a divine tool that gave the rulers secret knowledge on how to remain in public eye and do the deeds that would take them peacefully in to the next birth."},{"t":"p","x":"Egyptians also used astrological tools for dream interpretation and for decoding Oracle messages from the Divine Power transmitted to Pharaohs (Monarchs of Egypt who consider themselves as Demi-Gods) who exercised unilateral rule in the name of the Divine.  China since 2500 B.C elected its kings based on their deep knowledge of Astrology viz King Fohi, King Cheuni etc.  In India besides Sage Garga, the Yavanas were the sacred keepers of the esoteric secrets of Astrology. Many archaeological finds verify this."},{"t":"p","x":"Over the years, Astrology continued to sometimes be in limelight and sometimes become obscure depending on the patronage and sanctity it received in the social system prevalent."},{"t":"p","x":"But a core science like Astrology can never be truly relegated to the side. It is such a brilliant tool to provide guidance to the people surrounded by problems and uncertainty."},{"t":"p","x":"At this point in our astrological journey, we should pause and also look at few differences that charting a horoscope will contain via western or Indian method chosen."},{"t":"p","x":" In the western system the commencement of the zodiac I.e. 0° Aries retrogrades at the rate of roughly 50.2388 seconds every year whereas for the Vedic, the Zodiac commences at a fixed point about 180° from the constellation of Chitra. Zodiac of the westerners is called Sayana while for Vedic its called Nirayana."},{"t":"p","x":" Western astrology divides the Zodiac belt into 12 Solar Mansions while the Vedic divides it into 12 Rashis. Commencement of the signs being different, the area of the zodiac belt covered by western and Vedic astrology is different leading to different interpretations of the chart for the native."},{"t":"p","x":" Moreover the Vedic system is very detailed and anchors the readings in the 27 nakshatras or Constellations or Lunar Mansions. Each nakshatra has distinct attributes and a Nakshatra lord and deity."},{"t":"p","x":" The Western Astrology system has no concept of Divisional charts whereas the Vedic system has an entire system designed of divisional charts based on the D1 chart or the Lagan Kundali."},{"t":"p","x":" The D-9 or the Navamansa chart is especially powerful in making predictions about the soul purpose of an individual and the dignity of each planet in the primary horoscope.  Western astrology has no concept of Dasha or planetary period. Dasha is the very foundation of any horoscope prediction because though the Yog or possibility of an event might be in horoscope, but the event will happen only when the right “bhavas” or houses are activated at the time calculated as per the Dasha table."},{"t":"p","x":"What Makes Tarot Cards Reading A Popular System of Prediction and Life Guidance ?"},{"t":"p","x":"1. As explained above, Why we delved into understanding the difference in the various systems of Astrology is because in the context of this book on Detailed Tarot studies, we must understand that Astrology may be interpreted differently in various parts of the world, Tarot is a unifier science that is read almost the same by Tarot readers all across the globe. The variations occur due to intuitive understanding of the Tarot reader but the technical base of interpreting the cards and interlinking them in a Spread remains almost same."},{"t":"p","x":"2. Hence, In Astrology, the horoscope may be charted in various forms and frameworks (In India itself there are many forms such as South style, North style, Eastern style etc apart from the globally common Western chart, Vedic chart, KP chart, Chinese chart and more)."},{"t":"p","x":"The Tarot is Universal in its similarity patterns and a famous spread like the Celtic Cross Spread will carry same intonations of Card positions whether it is read by a Tarot Reader in the USA, India or China. Its a great unifier among readers of Divination Sciences."},{"t":"p","x":"3. Astrology in its pure form demands of the querist the accurate date and time of birth. Many are unaware of this detail in accuracy. Tarot functions effectively and guides with in great detail without the compulsion of time of birth. In some societies the time of birth has never been considered of any significance and is not even remembered orally, not to say it is ever documented. In such cases, the complexities and the urge to find answers in the humans is still strong. We then find Tarot as a close cousin of Astrology that when done with comprehensiveness and a series of intelligent spreads finds predictions and remedies in detail much like Astrology. 4. Some cultures like Islam, Christianity, Sikhism, Parsis etc do not have a tradition of horoscope charting and reading. For them divination may mean exposure to palmistry or runes at the best, that too the liberal and occult-inquisitive ones may know about it. These are cultures which are not conversant with the ancient Hindu treatise of Astrology but still seek answers of Divine Intervention to steer their complicated lives. But they have faith in the Indian predictive science."},{"t":"p","x":"5. Querists are attracted to Tarot for its visual beauty and symbolic language. They find it easier to relate to compare to. 6. Tarot is a powerful Psychological Assessment And Modifying Tool. Its uncanny and takes the reader deep inside the situation and what is going on in the minds and intentions of the players / actors in the situation that is being studied through the Spread."},{"t":"p","x":"7. Tarot is a “Mirror to our soul”."},{"t":"p","x":"Through the pictures we can break through into a region of being which draws one into itself and nourishes and charges us with its forces. The cards help us to awaken our Unconscious to the Conscious (this advantage will be explained in greater detail in subsequent section of how much destiny can be modified by Conscious Karma/ thought)"},{"t":"p","x":"The tarot cards are like a Spiritual Mirror in which we can not only recognize but also thoroughly examine and study ourselves."},{"t":"p","x":"It gives us specific advice on how the thoughts and behaviour can be changed or modified so that the coming future is in line with our dreams."},{"t":"p","x":"8. Its a means of receiving guidance, both worldly and spiritually. It guides on which path to take spiritually as also what changes to make in dealing with our materialistic surroundings in order to best solve a problem or come out of a difficult situation."},{"t":"p","x":"9. Its an interesting tool to do Energy/Temperament matching that helps tremendously in checking compatibility between persons. Its also a valuable tool for Marriage Compatibility Matching."},{"t":"p","x":"10. Tarot has an entire range of REMEDIES that provide effective relief in problems and enhance happiness and prosperity. A detailed description of Remedies Under Tarot are an invaluable part of this book and will help you immeasurably in improving your own life problems."},{"t":"p","x":"Destiny vs Free Will - Tarot as a Tool to control Emotions and Action  Tarot is practised as a method of changing our thoughts and hence behaviour and hence we bring about a change in the possible outcome."},{"t":"p","x":" Tarot is a strong tool for modifying the future outcome which lies within the purview of Free Will. The Divine has defined certain boundaries for us as humans based on our previous karma and this is defined as Destiny. However how we play our game within this playground called Destiny in the role that has been devised for us, what choices we make and how we interact with our environment constitutes our Free Will and depends on our intelligence, awareness and adaptability to change as per demands of the situation."},{"t":"p","x":" This freedom of action is our soul’s opportunity to grow and evolve to its highest level. The Divine guides us through mediums like Tarot to follow our predestined path keeping the bigger picture in mind."},{"t":"p","x":" Tarot is the Road Map which shows us the crossroads and the pitfalls and the speed-breakers in our karmic path towards our ultimate goal Types of Karma - Learning our Life Lession According to the Vedas, there are 3 kinds of karma that we carry with us at any time."},{"t":"p","x":"1. The 1st kind of Karma, is bearing fruit at the present moment, Now- Prarabdha ( already Ripe fruit)."},{"t":"p","x":"It includes who your parents are, your siblings, your country of birth, your marriage/conjugal partner, your children, your body type, your blood type, genetics, blood type et al."},{"t":"p","x":"These are already decided at birth and its near impossible to change them because they are already the ripe fruit of your past actions. Amongst this group itself, there are other karmas coming at predestined time to you, unstoppable to determine your present moment."},{"t":"p","x":"Such karma can be seen, in some cases by astrologers/tarot readers and be modified, to an extent through knowledge but within very narrow pre-decided boundaries."},{"t":"p","x":"2. The 2nd kind of Karma is in the Seedling Stage. Its called Sanchitta (accumulated)."},{"t":"p","x":"These are karmic seeds sown and stored in our mind as tendancies accumulated from past experiences. Wise thinkers call these tendancies (patterns of repetitive thought or action) as Samskaras."},{"t":"p","x":"If they are not altered, they grow into repetitive actions in this birth too and create resultant reactions."},{"t":"p","x":"If we imagine our Mind as a mirror covered with dust, we can understand that the dust is the perception webs we have covered our soul with over the various births. The dust is created by the self-sabotaging karmic seeds planted from past actions."},{"t":"p","x":"This karma is Alterable. By being aware of the pattern of cause and effect and being aware of the deep truth that what is being faced is a result of own karmas in the past. Now at this moment, if we are able to Recognize that by changing our Thought we can change our Behaviour(Karma) and thus our Destiny, we become powerful and burn off the past karmic obligations. Through certain processes of purification, the supply of past karma can be exhausted."},{"t":"p","x":"That liberated state where no Karma remains is one of the goals of an emancipated soul."},{"t":"p","x":"3. Thus the 3rd kind of Karma comes into focus here. This is called Kriyamana (action without generating reaction). Lord Krishna in the Bhagavad Geeta while discoursing to Arjuna expostulates that Nishkaam Kriya (Selfless action) has to be performed by all so that the world may keep functioning. It is imperative and there should be no pleasure or pain associated with it. It is to be done as the Almighty has channeled you for a particular task and thus no personal ego of like or dislike should be attached to it by the Mind."},{"t":"p","x":"The soldier gets awarded for killings in battlefield because he does it with simply the sense of duty. There is no personal gratification attached to it. Contrarily a normal man may get a life sentence for killing another if the motive is established to be of revenge (Sakama kriya- action with desire of result). A soul acting for their own selfish purpose are caught in the web of cause and effect and will face result of their own karma - good or bad."},{"t":"p","x":"However is a soul, becomes sufficiently evolved to act completely in the service of God, he will no longer generate karma nor be controlled by it."},{"t":"p","x":"By continuous choosing to be in service to the Almighty/Divine Force we escape the cycle of cause and effect and create no more karma for future births. This is the ultimate state of awareness and not impossible to achieve."},{"t":"p","x":"Tarot and Astrology are strongly linked together Your Zodiac sign & the Tarot: Finding Your Soul Purpose The Planet Sun is the Atmakaraka or the soul of your existence. Finding your Zodiac sun sign and aligning it with the Major Arcana card provides you the direction in which to focus your soul energy, your passions and your ideas. Your Sun positioning as per the Card will guide you on spheres where you can leave a mark in society and in this world."},{"t":"p","x":"The Zodiac Sign dates given below follow the Western Astrology System. The Vedic Sun Sign table is also provided for your reference."},{"t":"p","x":"Zodiac Sign Major Arcana Card & Number & Key lessons to focus on Aries March 21-April 20 The Emperor (4)"},{"t":"p","x":"Learn to follow rules, be less dogmatic, exercise power for greater good Taurus April 21-May 20 The Hierophant (5)"},{"t":"h","x":"Knowledge dissemination, balance"},{"t":"p","x":"emotions and logic, teach discipline and learn flexibility of thought Gemini May 21- June 20 The Lovers (6)"},{"t":"p","x":"Learn to focus and prioritize, teach the importance of joy to people, balance their multi talented nature Cancer June 21- July 21 The Chariot(7)"},{"t":"p","x":"Will power + knowledge, full confidence in victory, conqueror attitude fuelled by fire and the sword Leo July 22-Aug 22 Strength(8)"},{"t":"p","x":"Sacrifice for greater good, taming of self & ego, welfare of society, protective attitude Virgo Aug 23-Sep 22 The Hermit (9)"},{"t":"p","x":"Zodiac Sign Major Arcana Card & Number & Key lessons to focus on Research and investigation in mysteries of life, power of solitude, action rather than criticism, teach task-orientation to people around Libra Sep 23- Oct 22 Justice(11)"},{"t":"h","x":"Restore harmony in environment and"},{"t":"p","x":"society, teach lesson of being non\u0002judgemental, revive the aesthetic and the creative, peace & tolerance Scorpio Oct 23-Nov 22 Death (13)"},{"t":"p","x":"Regeneration after near perishing, spiritual power, belief in self, connection with Divine Sagitarrius Nov 23-Dec 21 Temperance(14)"},{"t":"p","x":"Alchemy and blending of energies, multi-tasking, creative thoughts, entrepreneurship Capricorn Dec 22- Jan 19 Devil (15)"},{"t":"h","x":"Not being victimized by personal"},{"t":"h","x":"ambition, balancing work with"},{"t":"p","x":"enjoyment, teach resource planning, learning to Let Go Aquarius Jan 20 - Feb 18 The Star (17)"},{"t":"h","x":"Create a new world view and work"},{"t":"h","x":"for humanity, possess a visionary"},{"t":"h","x":"approach, not get discouraged by"},{"t":"p","x":"what will people say?, teach kindness and learn practicality Pisces Feb 19- Mar 20 The Moon(18)"},{"t":"p","x":"Fight the emotional doubts & fears, use sensitivity to heal the world, learn to be decisive, teach the importance of flexibility Vedic Zodiac Sign Dates (Vedic Sun Signs)"},{"t":"h","x":"S. No. Zodiac Signs Dates"},{"t":"h","x":"1 Aries April 14 - May 15"},{"t":"h","x":"2 Taurus May 15 - June 15"},{"t":"h","x":"3 Gemini June 15 - July 16"},{"t":"h","x":"4 Cancer July 16 - August 17"},{"t":"h","x":"5 Leo August 17 - September 17"},{"t":"h","x":"6 Virgo September 17 - October 17"},{"t":"h","x":"7 Libra October 17 - November 16"},{"t":"h","x":"8 Scorpio November 16 - December 16"},{"t":"p","x":"9 Sagittarius December 16 - January 14 10 Capricorn January 14 - February 13 11 Aquarius February 13 - March 14 12 Pisces March 14 - April 14 Using Gems to Strengthen and Follow Your Soul Purpose After determining your Sun Sign and your soul purpose, you may choose to wear the Gem Stone that pertains to your Sun Sign. *Do consult for your horoscope to check that wearing this stone will be enhancing your Sun power and the Sun is associated with your growth houses in the natal chart. Alternatively a Tarot reading with a dedicated question of “ What benefits shall I get on wearing a stone bring for my highest good?” will also yield an insightful reply."},{"t":"p","x":"Incomplete information is more dangerous than knowing nothing at all. With the given data above, you may easily analyze your Sun sign from both the sides and work on your soul purpose as per your Major Arcana card attributes as also wear the gem stone to enhance your personal power."},{"t":"p","x":"Sun Sign Gem Stone To Make Sun Sign Stronger Aries Coral, Taurus Diamond Gemini Emerald Cancer Pearl Leo Ruby Virgo Emareld Libra Diamond Scorpio Coral Sagittarius Topaz, Yellow Sapphire Capricorn Blue Saphhire Aquarius Blue Saphhire Pisces Topaz, Yellow Saphhire Gemstone Guidelines and Optimum Weight, Metal Casting and in Which Finger For Best Results Gems Weight(Min.) Metal Finger Ruby 3 1/4 Rattis Gold Ring Finger Pearl 3 1/4 Rattis Silver Little Finger Coral 6 1/4 Rattis Silver Ring Finger Emerald 4 1/4 Rattis Gold Little Finger Topaz 4 1/4 Rattis Gold Index Finger Diamond 1/4 Rattis Silver/Platinum Little Finger Sapphire 4 1/4 Rattis Panchdhatu/ Silver Middle Finger Gomedh 5 1/4 Rattis Ashtadhatu/Silver Middle Finger Cat’s Eye 6 1/4 Rattis Silver Ring Finger Gemstone Guidelines on Which Day to Wear, Which Time to Wear How Long to Wear, for best Results Gemstone Which Day To Wear What Time To Wear How Many Years Effective Ruby Sunday Morning 4 Years Pearl Monday Morning 2 1/4 Years Coral Tuesday Morning 3 Years Emerald Wednesday Morning 4 Years Topaz Thursday Morning 4 Years Diamond Friday Morning 7 Years Sapphire Saturday Evening 5 Years Gomedh Saturday Sunset 3 Years Cat’s Eye Tuesday Sunset 3 Years The 22 Major Arcana Cards represent the 12 Zodiac Signs and the 10 planets. In this section we will highlight the energy corresponding for each of the Majors to its Astrological counterpart. The 12 Zodiac Signs are divided into 4 elemental groups of Fire, Water, Earth and Air & represent a Major Arcana Card each. Fire Aries Leo Sagittarius The Emperor Strength Temperance Water Cancer Scorpio Pisces The Chariot Death The Moon Air Gemini Libra Aquarius Lovers Justice The Star Earth Taurus Virgo Capricorn Hierophant Hermit The Devil Triplicity of Zodiac Signs Fire Triplicity Aries, Leo and Sagitarrius are bearers of the Fire Torch. These signs are significators of authority, action, dedication and passion. They are the Initiators and creators of the Universe. Prone to Dominating attitude, they are the Leaders of the Zodiac and with their maturity and knowledge motivate others and create institutions and concepts for the society. (This section also pertains to deeper understanding of Wands Suit which co-relates to Fire Element Attributes)"},{"t":"h","x":"Water Triplicity"},{"t":"p","x":"Cancer, Scorpio and Pisces constitute the water signs. They indicate the Power of the Emotions and the Creative Subconscious. The energy is of adaptability and absorption. These signs also have the psychic power of recreating themselves and attaining victory if they stay focused on their strengths and not get dissipated by emotional weaknesses. (This section also pertains to deeper understanding of Cups Suit which co-relates to Water Element Attributes)"},{"t":"h","x":"Air Triplicity"},{"t":"p","x":"Gemini, Libra and Aquarius, the movement loving Airy Signs are intellectual and enterprising. Thriving on ideas and mental stimulation, they like changes and challenges. Fair and balanced in perspective, they think big and are idealistic and perfectionists. Have a way with words that hit the mark. (This section also pertains to deeper understanding of Swords Suit which co-relates to Air Element Attributes)"},{"t":"h","x":"Earth Triplicity"},{"t":"p","x":"Taurus, Virgo and Capricorn are down to earth & the doers of the Zodiac. Blessed with acute concentration and perceptive powers, they forge ahead with ambition and self centred single-mindedness. Relationships are not their forte and may be temporary and need driven. Excellent achievers and researchers of their generation."},{"t":"p","x":"(This section also pertains to deeper understanding of Pentacles Suit which co-relates to Earth Element Attributes)"}]},{"id":"v2-c6","vol":"II","title":"Chapter 6 · Astrological Connotations of the 22 Major Arcana","body":[{"t":"p","x":"A more comprehensive look at the Astrological Connotations of The 22 Major Arcana Cards and how they co-relate. Ten of the Major Arcana Cards correspond to ten Planetary powers and twelve of the Major Arcana Cards correspond to twelve Zodiac Signs."},{"t":"p","x":"The Twelve Zodiac Signs & Tarot Cards 1. Aries and the Emperor Aries is about asserting yourself and taking control of your life. Showing who the boss is."},{"t":"p","x":"High on dogmatism and discipline and self initiated action. The Emperor carries attributes of conservatism and being high handed, not taking in opinions of others. Being single minded and protective and possessive will get you ahead for now, but take care that you do not push others too far."},{"t":"h","x":"Astrological"},{"t":"h","x":"Connotations of the"},{"t":"h","x":"22 Major Arcana Cards"},{"t":"h","x":"Chapter-6"},{"t":"h","x":"2. Taurus and the Hierophant"},{"t":"p","x":"Taurus needs to feel secure and safe and plans far ahead. Bestowed with prudent mind and a strategic intent, he is a careful planner. The Hierophant likewise who upholds traditions and rules in a situation or institution and will remind you constantly of keeping with the norms. But security sometimes can be suffocating and this energy too needs to be mellowed and stop being so fanatical about your goal."},{"t":"h","x":"3. Gemini and the Lovers"},{"t":"p","x":"Gemini ruled by the versatile Mercury seeks variety and constant stimulation. Gemini can make one illusional and always searching for multiple options rather than a focus."},{"t":"p","x":"When the Lovers card appears, its time to make a choice. Are you using your wit and intelligence and banking on your Mind or will you listen to your heart and disregarding the tempting options, narrow your attentions to a single point of focus. The choice is yours and its necessary."},{"t":"h","x":"4. Cancer and the Chariot"},{"t":"p","x":"Cancer years for belongingness and wants to acquire a safe haven for itself at all times. Its a watery emotional sign. When the Cancer attribute is overwhelming, the Chariot card reminds to be single-minded on the goal and forge ahead with ambition and clarity. It needs toughness to acquire and belong."},{"t":"h","x":"5. Leo and Strength"},{"t":"p","x":"Leo wants to be special. When you draw Strength are you under the spotlight, do you like being the center of attention. Or do you feel left out in the cold or immune to praise?"},{"t":"p","x":"If this quality is lacking in you then its time to gently reveal your qualities that make you the ruler. If this quality is overflowing, then restraint is necessary so that spotlight may be shared by the deserving others too."},{"t":"h","x":"6. Virgo and Hermit"},{"t":"p","x":"Virgo is reclusive and critical and often goes deep into analysis when confronted by a situation or an issue. It is also discriminating and detail oriented. When you draw the Hermit ask yourself if you are being too self-critical or critical of others. Are you making too many demands on yourself or others? Its time to turn inwards 7. Libra and Justice Libra seeks balance and diplomacy. If this energy is strong for you now, too much compromise means you are giving up on your own beliefs or opinions just to make others happy. If you believe it is lacking, learn diplomacy to resolve a dilemma and be more civilized about life. Justice seeks to find balance between contrasting aspects of life."},{"t":"p","x":"Use patience, tact and analytical mind to get to root of the problem and then work upon the Truth so found, to bring fairness to the situation. 8.Scorpio and Death Scorpio is about passion and power. When you draw Death, the astrological aspect of this card is the power to Transform your life. To end one cycle that is not working for you and begin again. Life moves in cyclical pattern and the Death card guides on not being fixated in or wallowing in the past; not to hold grudges and to have the power to reinvent and move on. If this energy, you feel, is lacking, check that you are not wielding power just for the sake of it."},{"t":"h","x":"9. Sagittarius and Temperance"},{"t":"p","x":"Sagittarius is optimistic and explorative."},{"t":"p","x":"When you draw Temperance, you have the opportunity to work on your desires and take the road towards achieving your goals. The flexibility of the Temperance card to be open to various avenues to get to the goal is its strength. So is the constant quest for perfection just like a Sagittarius native."},{"t":"p","x":"If you identify too easily with this energy, then its time to slow down and moderate your plans. Rethink and re-formulate before rushing headlong into something new."},{"t":"h","x":"10. Capricorn and The Devil"},{"t":"p","x":"Capricorn is self-reliant and conventional."},{"t":"p","x":"The Devil card is deeply connected with the Capricorn tendancies to be obsessed about its self interest and ambitious goals. It makes them too conventional and narrow minded about own modus-operandi and way of perceiving the world. Its unhealthy and myopic at times."},{"t":"p","x":"If you draw the Devil card this attribute may be surplus in your life and you need to let go of an obsessive habit or way of doing things. If you feel this energy is lacking then maybe its time to adhere to certain conventions and discipline yourself to achieve your goals without harming those around you. 11. Aquarius and The Star Aquarius is idealistic and independent. When you draw the Star and you feel this energy is lacking in your life, its time to believe in yourself. Trust your inner voice and be resilient to doing things your way. The destination may seem far fetched but your self-reliance and the blessings of the heavens that the Star card manifests will give you resounding success. If you identify too readily with this independent energy, then take care that you are not trying to influence others without a thought for their personal needs."},{"t":"h","x":"12. Pisces and The Moon"},{"t":"h","x":"Pisces is impressionable and deeply"},{"t":"p","x":"emotional, If you draw the Moon card feel this energy is surplus then you are living in an illusory world of feelings and mental fluctuations. You are being misled by what people around you are saying or making you believe, Do not be so gullible, You could even be beset by doubts and uncertainties to a very large extent. See beyond the empty promises."},{"t":"p","x":"If you believe this energy is lacking in your life then its time to be more in touch with your Intuition and feelings."},{"t":"h","x":"The Ten Planets & Tarot Cards"},{"t":"p","x":"1. The Sun (Rules Leo)"},{"t":"h","x":"Tarot Card : The Sun"},{"t":"p","x":"The astrological Sun card advises you to act positively and with complete confidence in your abilities. Leadership comes naturally to you so perform your administrative and welfare duties with compassion and fareness."},{"t":"p","x":"Refrain from acting egoistic and acting out of dictatorship or selfishness."},{"t":"p","x":"2. The Moon (Rules Cancer)"},{"t":"h","x":"Tarot Card : The High Priestess"},{"t":"p","x":"The astrological High Priestess tells you to listen to your Intuition. Be silent and observe rather than being vocal or active."},{"t":"p","x":"Refrain: Do not be eager to perform action."},{"t":"p","x":"Think deeply about the situation and wait for divine guidance towards the right moment."},{"t":"p","x":"Listen to the Inner Voice & not be swayed by others’ opinions. 3. Mercury (Rules Gemini and Virgo)"},{"t":"h","x":"Tarot Card : The Magician"},{"t":"p","x":"The astrological Magician tells you to be wise and assess your surroundings wisely & then take your decisions. Use communication skills to build your rapport & manage your responsibilities."},{"t":"p","x":"Refrain: Watch out for dishonesty and trickery from others. Be careful about paper work and documentation that you are involved in."},{"t":"p","x":"4. Venus (Rules Taurus and Libra)"},{"t":"h","x":"Tarot Card : The Empress"},{"t":"p","x":"The astrological Empress tells you to think about your true values. Do nurture your generous and productive side that provides love and nourishment to many."},{"t":"h","x":"Refrain : Go easy on flaunting your"},{"t":"h","x":"abundance and propagate the message"},{"t":"p","x":"not only of material assets but of life ethics like hard work, patience and saving resources."},{"t":"p","x":"Control your sensual impulses."},{"t":"p","x":"5. Mars (Rules Aries and Scorpio)"},{"t":"h","x":"Tarot Card : The Tower"},{"t":"p","x":"The astrological Tower tells you that it is the time to shake up the status quo. Get rid of old perceptions, or toxic relationships or wasteful habits. Bring a new lease of freshness into your life and do not be afraid of Change."},{"t":"p","x":"Refrain: Do not act explosive or impulsive."},{"t":"p","x":"Assess the situation before making a breakthrough. Use your judicious mind, and not just volatile feelings."},{"t":"p","x":"6. Jupiter (Rules Sagittarius and Pisces)"},{"t":"h","x":"Tarot Card : The Wheel of Fortune"},{"t":"p","x":"The astrological Wheel of Fortune tells you take advantage of unexpected or new opportunities. Be aware and vigilant and constantly upgrade yourself to stay relevant."},{"t":"p","x":"Refrain: Let go of that which pulls you down, Refrain from hanging onto lower forces and develop yourself intellectually. Do not be pessimistic and wait for your time to change for the better."},{"t":"p","x":"7. Saturn (Rules Capricorn and Aquarius)"},{"t":"h","x":"Tarot Card : The World"},{"t":"p","x":"The astrological World tells you to face reality, to put your feet on the ground and to accept what is possible and what is not."},{"t":"p","x":"Refrain: Do not limit yourself by perceived limitations. Karma should dictate your freedom from this bondage by sheer grit and clarity of thought and simplicity of behaviour."},{"t":"p","x":"Accept what what you cannot do but go full force ahead on the aspects you can change in this lifetime. Understand your karmic footprint."},{"t":"p","x":"8. Uranus ( Rules Aquarius)"},{"t":"h","x":"Tarot Card : The Fool"},{"t":"p","x":"The astrological Fool tells you to move forward and try a new direction, even if it seems risky. This is your chance to do your own thing, guided by inner confidence / latent talent so take the Leap of Faith ahead."},{"t":"p","x":"Refrain : Do not listen to others who try to discourage you from taking a chance to try something new."},{"t":"p","x":"Beware of jealousy and possessiveness of those who try to hold you back. Also beware of being arrogant or overconfident. Take the leap only if inner belief is very strong. 9. Neptune (Rules Pisces)"},{"t":"h","x":"Tarot Card : The Hanged Man"},{"t":"p","x":"The astrological Hanged Man resonates to the Uranus planet and tells you that it is time to relinquish your attachment to things or people, which serve no purpose to you."},{"t":"p","x":"Change is inevitable and the only constant of life so accept the moving wheel of change and learn to let go and move on."},{"t":"p","x":"Life is filled with other beautiful colors so live your life and enjoy the Divinity in each particle of creation."},{"t":"p","x":"Refrain: Do not get so deeply involved with people or things that even when it no longer serves your growth, yo continue to cling on due to insecurity. Take action to let go. The Neptunian element of fatalism that brings stagnation, must be avoided. 10. Pluto (Rules Scorpio)"},{"t":"h","x":"Tarot Card : Judgement"},{"t":"p","x":"The astrological Judgement card says it is time to let go of the past, to forget your petty resentments and embrace the future. Make the change now while you can and feel liberated. Pluto is the planet of the past and this card brings up issues, unresolved, from the Past. Embrace them, forgive and forget and bring dynamism towards future march."},{"t":"p","x":"Refrain: Do not be tied to habits and regrets from the past. Do not be scared to face the past skeletons and injuries and try to resolve them."}]},{"id":"v2-c7","vol":"II","title":"Chapter 7 · Kaal Purush Kundali: 12 Houses & Cards","body":[{"t":"p","x":"We can also make a connection between the 12 houses of the Kaal Purush Kundali, the Astrological ruler for each house, the corresponding card from the Major Arcana and the assigned meaning in terms of divination."},{"t":"p","x":"On the Basis of this information, we will draw up the Astrological Spread of 12 cards and be able to do two very popular spreads :"},{"t":"p","x":" The complete Tarot-Horoscope study of an individual  The Yearly / Annual Forecast of the individual with respect to various houses and the life-aspects they represent. To be able to understand and be adept at doing these 2 spreads lets first understand how in Astrology the Horoscope is divided into 12 houses and what life aspects each houses represents. Kaal Purush Kundali :"},{"t":"h","x":"12 Houses & Divinatory Meaning of"},{"t":"h","x":"Cards"},{"t":"h","x":"Chapter-7"},{"t":"h","x":"House in"},{"t":"h","x":"Horoscope"},{"t":"h","x":"Zodiac"},{"t":"h","x":"Association"},{"t":"h","x":"Tarot Card"},{"t":"h","x":"Association"},{"t":"p","x":"Divinatory Meaning/Karkartva/Signification of House House of Self Aries The Emperor Physique, personality, all beginnings, outlook on life, health and vitality, House of Money Taurus The Hierophant Financial matters, assets, Material possessions, sense of self worth, House of Communications Gemini The Lovers Communications, Letters and writings, public relations, younger siblings, short journeys, what you know, early learning style House of Domestic Life Cancer The Chariot The first home environment, your roots, the mother, the imagination, outcome of contests and litigation, emotions, home, conveyance, comforts of material life House of Children Leo Strength Affairs of the heart, children, love affairs, adventures, exciting activities, speculations House of Health & Work Virgo The Hermit Job, Service, competition, Diseases, victory over enemy, responsibilities, mundane work, daily habits House of Marriage and open conflict Libra Justice Marriage, lawsuits, partnerships, marital sex life, known enemies, business transactions Tarot Secrets Unveiled-Vol.- II(Healing & Remedy) :: 56 House in Horoscope Zodiac Association Tarot Card Association Divinatory Meaning/Karkartva/Signification of House House of Death Scorpio Death Legacies, death, taxes and partner’s money, spiritual knowledge House of Philosophy and Religion Sagittarius The Temperance Law, Philosophy, religion, ideals, higher education, long distance travel, learning we do out of willingness House of profession Capricorn The Devil Public life, social status, profession, ambition,fame, the father, honors, social responsibility House of Hopes and Wishes Aquarius The Star Friends, associates, groups, hopes, wishes, aspiration, public festivals House of Bondage Pisces The Moon Personal limitations, secret desires, frustrated ambitions, unknown enemies, institutions that restrict or confine, karmic lessons, what we know subconsciously, where we escape to, expenditures, losses The Astrological Spread By contemplating the images on the Tarot cards, we engage in symbolic or metaphorical thinking. This gives us access to a part of our mind that we ordinarily tend to ignore. Various authors have referred to this aspect of the human mind as “the collective unconscious,” the “inner self,” or the “inner guide.” Business minded persons often refer to this process as “brainstorming” and spiritually minded authors talk about “visualization” or “creative imagination.” Whatever we call it, the Tarot is a tool that allows us to enter a contemplative, meditative state in which we can gain fresh insights into reality. 4 Career, Ambitions Knowledge, Spirituality Changes to Come Love, Romance Job, Occupation Physical Health Creativity, Progeny Home Family Mental Internal Communication Resources, Money Matters Present Self Challenges, Losses Community, Allies Astrological Spread 1. The cards are energised and shuffled thoroughly. 2. Thereafter the cards, while ruminating on the person’s name / visual/aura are laid out in a semi circle. Focus is to keep total concentration of the Tarot reader at this moment on his dialogue with the Universe as this Layout/ Spread is comprehensive and deep and covers all the aspects of the native concerned. It is the Horoscope prototype carried out through Tarot Cards."},{"t":"p","x":"3. This is very useful when we do not have the complete or correct date of birth, time of birth or place of birth for whom the spread is being carried out."},{"t":"p","x":"4. The cards are laid out in the format/shape as given in the diagram(suggestive, not mandatory sequence) or as you are divinely guided."},{"t":"p","x":"5. In a typical spread of this kind as universally accepted, select the first cards and pace at the 9 o’clock position. This represents the First House."},{"t":"p","x":"6. Lay the next card at the 8 o’clock position. This is the representation of the Second House."},{"t":"p","x":"7. Continue to lay another 10 cards anti-clockwise until you have a round spread that looks like a clock."},{"t":"p","x":"8. The cards are then opened one by one and the attributes correlated with each house are then interpreted and articulated by the Reader to the querent."},{"t":"p","x":"Example: the Tarot card that is opened at House No 1 / First position will throw light on the Tarot Ascendant of the native. It will reveal about his temperament, his physical self, his/her outlook on life."},{"t":"p","x":" Similarly Card no 5 will throw light on query regarding romantic life of querist, first child, sense of thrill and adventure and the other significators."},{"t":"p","x":" Since each house represents several different areas of life, one may take out a Supporting/Supplementary Card of the primary card for that house, if a querist wants to know specifically about a particular aspect related to the house."},{"t":"p","x":" A great insight is discovered by this 12 card Astrological Layout for the individual under study."},{"t":"p","x":"The 12 Houses and their Additional Astrological Keywords with Special Reference to Tarot Cards:"},{"t":"h","x":"House Key Significations/"},{"t":"h","x":"Life Areas"},{"t":"h","x":"Associations"},{"t":"p","x":"First Identity Fire; Wands; Aries; Mars Second Resources Earth; Pentacles, Taurus;"},{"t":"h","x":"Venus"},{"t":"h","x":"Third Communication &"},{"t":"h","x":"Knowledge"},{"t":"h","x":"Air; Swords; Gemini; Mercury"},{"t":"p","x":"Fourth Home & Family Water; Cups; Cancer; Moon Fifth Creaticity & Children Fire; Wands; Leo; The Sun Sixth Work & Service Earth; Pentacles; Virgo;"},{"t":"h","x":"Mercury"},{"t":"p","x":"Seventh Relationships Air; Swords; Libra; Venus Eighth Obstacles, Transformations Water; Cups; Scorpio; Pluto Ninth Expansion & Beliefs Fire; Wands; Sagittarius; Jupiter Tenth Career & Prestige Earth; Pentacles; Capricorn; Saturn Eleventh Gains & Community Air; Swords; Aquarius;"},{"t":"h","x":"Uranus"},{"t":"p","x":"Twelfth Secrets & Undoing Water; Cups; Pisces;"},{"t":"h","x":"Neptune"},{"t":"p","x":"This deck is only a foundation level introduction to Vedic astrological principles; it is not conclusive and is not a substitute for consulting a well- trained Vedic Astrological professional. The Yearly Forecast Tarot Spread An interesting & useful method of using the 12 Card House Spread is to take out the 12 month predictions (Annual Forecast) for each life aspect of the native and to study the general trend the native will experience in a particular year. This will guide on challenges to face & the opportunities to harvest that each life aspect can bring."},{"t":"p","x":"1 Card is drawn for each house with reference to the year under consideration and its Tarot Card meaning and message is studied to make decisions."},{"t":"h","x":"Monthly Forecast Tarot Spread"},{"t":"p","x":"The 13 Card Spread is also innovatively used to see how each month of a particular year will fare for the native. To illustrate, Card 1 is taken out to elicit the monthly message for January, Card 2 for February and so on till Card 12 for December. Supplimentary Card may be taken out to provide additional information about a particular month that the native wants to study more in depth."},{"t":"p","x":"13th Card is drawn towards the end of the session and signifies the over all trend of the year under consideration. It is called the Significator Card."},{"t":"h","x":"1"},{"t":"h","x":"January"},{"t":"h","x":"5"},{"t":"h","x":"May"},{"t":"h","x":"2"},{"t":"h","x":"February"},{"t":"h","x":"3"},{"t":"h","x":"March"},{"t":"h","x":"4"},{"t":"h","x":"April"},{"t":"h","x":"5"},{"t":"h","x":"May"},{"t":"h","x":"6"},{"t":"h","x":"June"},{"t":"h","x":"7"},{"t":"h","x":"July"},{"t":"h","x":"8"},{"t":"h","x":"August"},{"t":"h","x":"8"},{"t":"h","x":"August"},{"t":"h","x":"9"},{"t":"h","x":"September"},{"t":"h","x":"9"},{"t":"h","x":"September"},{"t":"h","x":"10"},{"t":"h","x":"October"},{"t":"h","x":"11"},{"t":"h","x":"November"},{"t":"h","x":"12"},{"t":"h","x":"December"},{"t":"h","x":"13"},{"t":"h","x":"Year"},{"t":"h","x":"Overall"},{"t":"h","x":"13 Card Monthly Tarot Spread"}]},{"id":"v2-c8","vol":"II","title":"Chapter 8 · Numerology Associations of Tarot","body":[{"t":"p","x":"Many ancient cultures believed in the significance and power of numbers, particularly the Greeks and Hebrews who developed the systems used in modern day Numerology. The Greek mathematician and philosopher, Pythagoras wrote in the 6th century B.C. that “Numbers are the first things of all of Nature”. His theory was that everything was symbolized or brought back down to a single number. Numbers were not just of mathematical significance, but were central to everything that went on in the Universe."},{"t":"p","x":"They were the key to all wisdom."},{"t":"p","x":"The primary numbers One to Nine (1-9) each vibrate to a different frequency. These vibrations echo throughout the Universe. This music of the “spheres” was an expression of the heavenly bodies, which had their own numerical value and harmonic vibration."},{"t":"p","x":"For a numerologist there are only 9 numbers from which all calculations of the material world are made. All numbers beyond 9 are repetitions. By a simple method of adding the digits of a number higher than 9, it is reduced to a single digit too. The number 10, for example is not a whole number, it is simply a 1 with a zero."},{"t":"h","x":"Numerology"},{"t":"h","x":"Associations of Tarot"},{"t":"h","x":"Chapter-8"},{"t":"h","x":"The Power and Role of Zero"},{"t":"p","x":" Zero is not a number and has no numerological value.  In the western occult system, zero is regarded as the symbol of eternity as it is metaphysically regarded as having no beginning and no end."},{"t":"p","x":" In the Eastern tradition, it is known as shunya or the Void, which is the foundation stone of Buddhism."},{"t":"p","x":" In the Tarot tradition, zero is regarded as a sacred number. Its the Beginning and the Culmination."},{"t":"p","x":" The Fool Card in the traditional Tarot deck symbolizes the number Zero. Its the card which begins the Major Arcana journey of the Human soul and is pregnant with possibilities, much like the number Zero which has no numerological significance but when combined with another number takes on a all new higher dimension."},{"t":"p","x":" Since the Zero also symbolizes Completitions and the fulfillment of a cycle, it also represents Card No 22 in the Tarot deck (here the Magician begins the journey ). One cycle comes to closure & a new one begins with the Magician as the Subsequent Card."},{"t":"h","x":"Numerology and the Tarot"},{"t":"p","x":"The Tarot is rich with numerical significance and value. The Major Arcana consists of 22 cards. Its not a coincidence that Number22 features so prominently in the Tarot Numerology. Power of Numbers 11 & 22 11 & 22 are known as Master Numbers in Numerology and their sacred inherent power is revered by the followers of the occult. They are powerful Karmic numbers and connote a more intensified version of their root numbers 2 and 4 respectively. The Master Number 22 is a double representation of the Master Number 11 and is very powerful & symbolic of the 22 stages of soul evolution that the Tarot Card Deck entails through the Major Arcana Royal Path."},{"t":"p","x":"Yearly Forecast by Numerology Calculation using Tarot Card Calculating the Projected Year Number Numerology successfully combines with Tarot to project your required mood and thought pattern for a particular year. Although the horoscope through the science of Astrology has a better method of projecting into the future with its finite planetary periods and sub-periods, a very insightful analysis can be done into a particular year when we combine Numerology with the ancient knowledge of Tarot."},{"t":"p","x":"This is unique to you as it is based on the calculation by using your Date of Birth."},{"t":"p","x":"The Projection Number of a Particular Year is calculated and using the help of “what to expect in a Year Number” you can make optimal utilization of the year’s opportunities by imbibing the energy of the corresponding Major Arcana Tarot Card Number."},{"t":"p","x":"How to Calculate Projected Year Number ?"},{"t":"p","x":"1. Add the Birth Month Number & Date (in digits) of your Date of Birth 2. Add it to the last 2 digits of the year in Projection 3. Add the Number of the day on which your birth date falls in the year of Projection * For example, I want to calculate the Yearly calculation for an individual born on 28-08-1973. The year I want to examine is 2021. The calculation would be done as follows:"},{"t":"h","x":"Month of birth 8"},{"t":"h","x":"Date of birth 28"},{"t":"h","x":"Year in projection 21"},{"t":"p","x":"In 2021, August 28 falls on a Saturday, (which is a 8*) 8 + 28 + 21 + 8 = 65 = 11 = 2 The number that results from this addition, 2, becomes the number of the projected year. The significance of having 2 as a year number, is given in the below section. This is a general guideline and with this information, one may have a framework to examine the potential of an year."},{"t":"p","x":"The example year no. is 2 and thus the strengths of The High Priestess will be bestowed to the native. Also advised to adopt the characteristics of The High Priestess during the year to best deal with situations that occur in that year to remain in power and peace."},{"t":"p","x":"* The numbers assigned to the days of the week are the numbers of the ruling planets of that day :"},{"t":"p","x":"Sunday = 1 (Sun)"},{"t":"p","x":"Monday = 2 (Moon)"},{"t":"p","x":"Tuesday = 9(Mars)"},{"t":"p","x":"Wednesday = 5(Mercury)"},{"t":"p","x":"Thursday = 3 (Jupiter)"},{"t":"p","x":"Friday = 6 (Venus)"},{"t":"p","x":"Saturday = 8 (Saturn)"},{"t":"p","x":"The Year Number Connection With Tarot Once the Year Number has been calculated, The Major Arcana Card of the corresponding number must be taken as Guiding Energy to meet the challenges and opportunities of the year in consideration."},{"t":"p","x":"This is a powerful exercise and helps the person navigate on the mental patterns and the behavioral systems that would best suit during the year being analyzed. Some of the patterns as suggested by the Major Arcana Archetype may be inborn while others may need to be developed or honed during the progress of the year."},{"t":"p","x":"Once the Major Arcana Archetype has been imbibed into the mental map, it helps to lead the person to evolution opportunities that are in the larger life picture for that year. Its wise to align the qualities and attributes of the Major Arcana card that the Year Number carries as then the year would be utilized for full advantage towards productivity and prosperity. 1 If you are in Year Number 1 you are being governed by the attributes and potential of The Magician."},{"t":"p","x":"2 If you are in Year Number 2 you are being governed by the attributes and the potential of The High Priestess."},{"t":"p","x":"3 If you are in Year Number 3 you are being governed by the attributes and potential of The Empress."},{"t":"p","x":"4 If you are in Year Number 4 you are being governed by the attributes and potential of The Emperor."},{"t":"p","x":"5 If you are in Year Number 5 you are being governed by the attributes and potential of The Hierophant."},{"t":"p","x":"6 If you are in Year Number 6 you are being governed by the attributes and potential of The Lovers."},{"t":"p","x":"7 If you are in Year Number 7 you are being governed by the attributes and potential of The Chariot."},{"t":"p","x":"8 If you are in Year Number 8 you are being governed by the attributes and potential of Strength."},{"t":"p","x":"9 If you are in Year Number 9 you are being governed by the attributes and potential of The Hermit."},{"t":"p","x":"Year Number and the Potential Areas. Combine the Energy of the Major Arcana Archetype and utilize it to harness the potential of the Year Number."},{"t":"p","x":"Example : If year Number is 2, then use the qualities and strengths of the High Priestess Card to live through the year. This will guide you on the building blocks you need to consolidate in that year and the areas of pitfall you may avoid. Now also examine what this year may project for you in terms of gains & challenganges."},{"t":"p","x":"Projection by Calculating The YEAR NUMBER Year Number 1 - Sun Year Supporting Gem Stone Ruby  This year will be a very important year for you.  During this year, the difficulties that have been with you for many years will dissipate/find a solution."},{"t":"p","x":" You will receive help and patronage from people in authority especially government officials  You will have better health, physically and mentally and feel the vital energy to move ahead for progress."},{"t":"p","x":" If you are organized and proactive, will achieve special success in job and business."},{"t":"p","x":" You will network and meet new people who will be useful allies in future."},{"t":"p","x":" You will attain better name and fame so work towards this aim during this year."},{"t":"p","x":" You will remain free from worry and fear and higher self confidence and clarity in thinking."},{"t":"h","x":"Year Number 2 - Moon Year"},{"t":"p","x":"Supporting Gem Stone Pearl And Moonstone  Your personal magnetism will increase and so will your popularity  You will be emotionally balanced and take some good long term stabilising decisions."},{"t":"p","x":" You will make new friends with whom you will collaborate and benefit in future."},{"t":"p","x":" You may buy a new house or property that will bring you happiness."},{"t":"p","x":" You will enjoy improved living situations, through patience and good planning."},{"t":"h","x":"Year Number 3 - Jupiter Year"},{"t":"p","x":"Supporting Gem Stone Yellow Topaz & Yellow Saphhire  This year will be a memorable year for you as you gain unprecedented name, fame and prestige."},{"t":"p","x":" Its a lovely year for persons in creative or expressive fields like writers, speakers and orators. Jupiter can make them reckless so be cautious in public dealings and communication."},{"t":"p","x":" Great year for job promotions and new investments  Year dedicated to spiritual growth or finding a higher meaning to mundane life."},{"t":"p","x":" Time to complete old projects and begin fresh planning for new ventures  Time to test old friendships and partnerships."},{"t":"h","x":"Year Number 4 - Rahu Year"},{"t":"p","x":"Supporting Gem Gomedh(Hessonite)"},{"t":"p","x":" A successful year riddles with challenges that will need stamina to surmount."},{"t":"p","x":" Inner Strength will develop and you will feel yourself becoming stronger to cope with continuous adversity.  Year of hard work, calm temperament and careful planning in the Mind  New Ventures, such as new house or apartment or investment in real asset  Financial gains, increased sources of income and financial stability  A year of serious work and less daydreaming  Enhancement in family structure like your marriage or engagement. May also indicate child birth  Not a successful year for love affairs  Auspicious year for religious activities and spiritual pursuits Year Number 5 - Mercury Year Supporting Gem Panna( Emerald )"},{"t":"p","x":" Successful year bringing in major gains through social networking  Starting of a new business or venture. Overall good year for business and entrepreneurship  Circle of friends increases. Public popularity and influence greatly enhanced."},{"t":"p","x":" Opportunity to work on social welfare related projects  Not a good year for marriage as it may remain unstable.  Unquenchable interest in creative activities. Excellent year for writers, novelists, authors and public speakers, journalists, actors, businessmen  You may address more public gatherings(scale as per your lifestyle) and will be in limelight  Good year for appearing in competitions and taking risks  Travel plans will materialise and will be memorable Year Number 6 - Venus Year Supporting Gem - Opal  Excellent year for family harmony; many pending household problems will get solved."},{"t":"p","x":" Romance will flourish and long awaited conception may occur  Financial gains are promised. May start a new job with escalated prospects  Those who had been unemployed, will gain desirable employment  Good year for spending on interior decor, entertainment and enjoyment."},{"t":"p","x":" Excellent year for professionals in fields of acting, theatre, advertising, hospitality and banqueting, music, poetry, film making, show-business, event management. Also profitable for people in jewellery business or perfume business."},{"t":"p","x":" A time to deal with items of beauty, sensual enjoyment, material pleasures and gifts  Unexpected financial gains will accrue. Status will be raised and wealth can be enjoyed for visible effect. Year Number 7 - Ketu Year Supporting Gem Lahsuniya (Chrysoberyl ) / Cat’s Eye  Energies will remain scattered. Not a good year to begin new ventures or relationships  Professional life will be unstable. Focus on consolidation rather than changes."},{"t":"p","x":" An year of mental struggles and confusions. You will remain restless and an unknown anxiety may assail you."},{"t":"p","x":" Excellent year for exploring spiritual path of choice to maintain your composure and stay in emotional control.  A year of misunderstandings and difficulties."},{"t":"p","x":" Success in litigation related matters."},{"t":"p","x":" Devote time and attention to healing practices, astrology, tarot, magic, hypnosis and if planets permit in horoscope to Tantra and Siddhi Prapti."},{"t":"p","x":" Disreputation in romantic affairs. Be careful."},{"t":"p","x":" Attitude must consciously be maintained to upkeep patience and positivity and turning inwards."},{"t":"h","x":"Year Number 8 - Saturn Year"},{"t":"p","x":"Supporting Gem Neelam (Blue Saphhire)"},{"t":"p","x":" A positive year of long lasting growth and foundations  Inter personal relations may remain moderate. Focus on necessary people interaction and more on consolidating inner values and professional/business life."},{"t":"p","x":" Good year for entrepreneurs or who wish to start own venture. Will get meaningful help."},{"t":"p","x":" Health will remain a concern. Avoid stress, excitement and anxiety. Protect against warning symptoms  Guard against inflammation or injuries of the joints. If they happen in a year 8, they tend to linger on for remaining life."},{"t":"p","x":" Good year for victory over enemies and competition  Progressive year for people engaged in iron and steel industry, construction, politics, oil and natural resources  Do not rely on friends or professional contacts. Develop your self reliance and keep your plans and ideas to oneself.  Develop a spiritual or religious routine and follow it diligently. Devotion on Almighty will keep mind focused and keep hard work getting rewarded."},{"t":"p","x":" Engage in charity and philanthropic deeds Year Number 9 - Mars Year Supporting Gem Moonga ( Coral )"},{"t":"p","x":" A year of completions when the 9 year cycle completes itself. You may see old efforts getting rewarded or old experiences being revisited."},{"t":"p","x":" Year to organize yourself for coming years materially and spiritually  Good fortune, success and accomplishments filled time  Personal relationships will gain clarity. The authentic ones will get solidified and the unnecessary / toxic ones will need to be let go of."},{"t":"p","x":" Time of spiritual realisations. You may discover latent talents and pursue activities that bring you sense of personal fulfillment."},{"t":"p","x":" Do not mess with authority figures as your passion for truth may lead to disagreements and harm."},{"t":"p","x":" Honour and public appreciation will be gained. Engage in social welfare and community development projects.  Time to rise and shine in job environment. Competition will surrender to your will power and force of ideas."},{"t":"p","x":" Unexpected financial gains like lottery, bonus, ancestral money etc."}]},{"id":"v2-c9","vol":"II","title":"Chapter 9 · Quintessential Number & Quintessential Card","body":[{"t":"p","x":"Quintessential means embodying or possessing the essence of something. This is the class
